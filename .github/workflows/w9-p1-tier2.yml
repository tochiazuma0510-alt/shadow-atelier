name: w9-p1-tier2

# [P1] Tier 2 (remaining 4 layers (2,7)/(4,5)/(6,3)/(8,1), disc-product route), 裁定1002.
# K^(9) window, W9 plane-model ansatz work (docs/notes/w9_laneB_elimination_v1.md §4).
#
# Layer (0,9) already found EMPTY by lane B (run 31578468586). This job handles the 4 remaining
# layers via branch I (disc_w(R1)=0, deg R1<=8, tried first -- smaller Sylvester matrix) then
# branch II (disc_w(R2)=0, deg R2=9), each via a resultant with gamma(a,b)=0 (step1's curve) to
# eliminate to a univariate polynomial in a, then exact root enumeration + genus-4 sieve
# (odd-multiplicity root count of Delta=R1*R2, NOT squarefree-part degree).
#
# Same job design as w9-p1-1b-groebner.yml / w9-p1-b-laneb.yml: sympy==1.14.0, internal 55min
# SIGALRM time-box, partial-result artifact preserved (branch I's results are kept even if branch
# II runs out of budget).
#
# DISPATCH GATE: workflow_dispatch ONLY.

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'job timeout (minutes) -- script has its own internal 55min alarm; this is an outer safety cap'
        required: true
        type: number
        default: 65

permissions:
  contents: read

jobs:
  tier2:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install sympy (pinned to the version validated locally)
        shell: bash
        run: pip install "sympy==1.14.0"

      - name: Report runner memory (informational)
        shell: bash
        run: free -h || true

      - name: Run Tier 2 (time-boxed internally)
        id: run
        shell: bash
        run: |
          set +e
          mkdir -p ci/out
          python search/r13_p1_tier2_gha.py 2>&1 | tee ci/out/tier2.log
          echo "py_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check result (informational -- INCOMPLETE is a valid, reported outcome)
        shell: bash
        run: |
          echo "py_exit=${{ steps.run.outputs.py_exit }}"
          if grep -q "R13_P1_TIER2_INCOMPLETE" ci/out/tier2.log; then
            echo "::warning::Tier2 computation did not finish within the internal time budget -- partial result artifact written (first-class outcome, not a CI failure)"
          elif ! grep -q "R13_P1_TIER2_DONE" ci/out/tier2.log; then
            echo "::error::neither R13_P1_TIER2_DONE nor _INCOMPLETE marker found -- unexpected script exit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-p1-tier2-log
          path: ci/out/tier2.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-p1-tier2-result
          path: ci/out/r13_p1_tier2_result.json
          if-no-files-found: warn
