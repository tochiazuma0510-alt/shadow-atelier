name: w9-p1-b-laneb

# [P1-B] lane B (U_+/U_- decomposition, degree-9 elimination), 裁定1001.
# K^(9) window, W9 plane-model ansatz work (docs/notes/w9_laneB_elimination_v1.md §3).
#
# Same job design as w9-p1-1b-groebner.yml (lane A): sympy==1.14.0, internal 55min SIGALRM
# time-box, partial-result artifact if not finished. Equations here are all degree<=3 (vs lane A's
# degree ~18 coefficient matching), expected to finish much faster -- both lanes run concurrently,
# first to arrive is used (裁定1000/1001: "先着採用", lane A left running regardless).
#
# DISPATCH GATE: workflow_dispatch ONLY.

on:
  workflow_dispatch:
    inputs:
      timeout_minutes:
        description: 'job timeout (minutes) -- script has its own internal 55min alarm; this is an outer safety cap'
        required: true
        type: number
        default: 65

permissions:
  contents: read

jobs:
  laneb:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install sympy (pinned to the version validated locally)
        shell: bash
        run: pip install "sympy==1.14.0"

      - name: Report runner memory (informational)
        shell: bash
        run: free -h || true

      - name: Run lane B elimination (time-boxed internally)
        id: run
        shell: bash
        run: |
          set +e
          mkdir -p ci/out
          python search/r13_p1_b_laneB_gha.py 2>&1 | tee ci/out/laneb.log
          echo "py_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Check result (informational -- INCOMPLETE is a valid, reported outcome)
        shell: bash
        run: |
          echo "py_exit=${{ steps.run.outputs.py_exit }}"
          if grep -q "R13_P1_B_LANEB_INCOMPLETE" ci/out/laneb.log; then
            echo "::warning::lane B computation did not finish within the internal time budget -- partial result artifact written (first-class outcome, not a CI failure)"
          elif ! grep -q "R13_P1_B_LANEB_DONE" ci/out/laneb.log; then
            echo "::error::neither R13_P1_B_LANEB_DONE nor _INCOMPLETE marker found -- unexpected script exit"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-p1-b-laneb-log
          path: ci/out/laneb.log
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-p1-b-laneb-result
          path: ci/out/r13_p1_b_laneB_result.json
          if-no-files-found: warn
