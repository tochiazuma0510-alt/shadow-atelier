name: d972-r07-actual-seed30-materializer-v1

on:
  workflow_dispatch: {}
  push:
    branches:
      - sol/r07-explicit-lift-20260825

permissions:
  contents: read
  actions: read

env:
  REPOSITORY_ID: "1312092366"
  P1_RUN: "33851744070"
  P1_ATTEMPT: "1"
  P1_HEAD: "6673eb2ea15ca6022acc2ddc5a8a204a0380172f"
  P1_WORKFLOW: ".github/workflows/d972-r07-canonical-p1-dag-degree2-lift-v9.yml"
  P1_ARTIFACT_ID: "9931437113"
  P1_ARTIFACT_NAME: "task809-canonical-p1-degree2-lift-v9-33851744070-1"
  P1_ARCHIVE_BYTES: "641518300"
  P1_ARCHIVE_DIGEST: "sha256:6d6f2ec6eb7f1245b8e7d52645c710ecd519ae0cc442340237d1098c7fa63d5c"
  TASK554_RUN: "33677346616"
  TASK554_ATTEMPT: "1"
  TASK554_HEAD: "22c6dddb43d107c05e65f53ad898823ae8ebe276"
  TASK554_WORKFLOW: ".github/workflows/d972-r07-a0-first-rung-grade1-v3.yml"
  TASK554_PREP_ID: "9865061266"
  TASK554_PREP_NAME: "task554-grade1-v3-prepare-33677346616-1"
  TASK554_PREP_BYTES: "204360988"
  TASK554_PREP_DIGEST: "sha256:da8bfec6a03cac65de40ba8c4f79cde687fd2629edb3c3965fd972ecf96cc2f4"
  TASK554_B0_ID: "9865238399"
  TASK554_B0_NAME: "task554-grade1-v3-state-block-0-33677346616-1"
  TASK554_B0_BYTES: "81729645"
  TASK554_B0_DIGEST: "sha256:2a8e63a4270bf4052c7fd8763d7828fc17dd6b94c88854bacde1e94082cd5838"
  TASK554_B1_ID: "9865242284"
  TASK554_B1_NAME: "task554-grade1-v3-state-block-1-33677346616-1"
  TASK554_B1_BYTES: "82259824"
  TASK554_B1_DIGEST: "sha256:849321b79f0e3ea3c9a3f9c9dad43de2b3aaa571163456abc702476e322714fb"
  TASK554_B2_ID: "9865193269"
  TASK554_B2_NAME: "task554-grade1-v3-state-block-2-33677346616-1"
  TASK554_B2_BYTES: "82200189"
  TASK554_B2_DIGEST: "sha256:d2cdf8245d58a384bebfd516135e07930fe26c21c2c1cab130dfa6c3c7f2854d"
  TASK554_B3_ID: "9865239848"
  TASK554_B3_NAME: "task554-grade1-v3-state-block-3-33677346616-1"
  TASK554_B3_BYTES: "82266526"
  TASK554_B3_DIGEST: "sha256:87547101ede2fb48619a069de958c08cbb3cb0ee6c0990090234005aacd05b92"
  TASK712_RUN: "33814194630"
  TASK712_ATTEMPT: "1"
  TASK712_HEAD: "5ff2c5a30b604536df12acba8801828a5a7e5fe0"
  TASK712_WORKFLOW: ".github/workflows/d972-r07-grade2-maps-v4.yml"
  TASK712_ARTIFACT_ID: "9915928157"
  TASK712_ARTIFACT_NAME: "d972-r07-grade2-maps-v4-33814194630-1"
  TASK712_ARCHIVE_BYTES: "22404961"
  TASK712_ARCHIVE_DIGEST: "sha256:abedff074117bb779675021e9436c3a9973c577e247fe76a8314a2d4312ea858"
  SEPARATOR_RUN: "33891714539"
  SEPARATOR_ATTEMPT: "1"
  SEPARATOR_HEAD: "7b7b9de20faaa3b8f26e331bb738b374f6f5708c"
  SEPARATOR_WORKFLOW: ".github/workflows/d972-r07-grade2-physical-state-separator-v2.yml"
  SEPARATOR_ARTIFACT_ID: "9944214057"
  SEPARATOR_ARTIFACT_NAME: "d972-r07-grade2-physical-state-separator-v2-candidate-33891714539-1"
  SEPARATOR_ARCHIVE_BYTES: "107195261"
  SEPARATOR_ARCHIVE_DIGEST: "sha256:2d91e2e94ab7eb235805eb0f7c04ff87edef3954460d686f047d8abcfa99c017"
  SCALAR_RUN: "33941591417"
  SCALAR_ATTEMPT: "1"
  SCALAR_HEAD: "2caaf1f33b6f36f8aa754f759ef0e5dccfaf5a74"
  SCALAR_WORKFLOW: ".github/workflows/d972-r07-actual-grade2-root-scalar-batch-v2.yml"
  SCALAR_ARTIFACT_ID: "9962060495"
  SCALAR_ARTIFACT_NAME: "d972-r07-actual-root-scalar-batch-v2-candidate-33941591417-1"
  SCALAR_ARCHIVE_BYTES: "253544"
  SCALAR_ARCHIVE_DIGEST: "sha256:1091f9946108ef6bf122143da58d32006eba54166ee995996efa177aa89a2ed2"
  SCALAR_DIAG_ID: "9962060193"
  SCALAR_DIAG_NAME: "d972-r07-actual-root-scalar-batch-v2-diagnostics-33941591417-1"
  SCALAR_DIAG_BYTES: "266309"
  SCALAR_DIAG_DIGEST: "sha256:78f087944047f170162587c413fcb1202bb5796b8d4fdff19da73e6e2fd321cf"
  RHO2_RUN: "33839962829"
  RHO2_ATTEMPT: "1"
  RHO2_HEAD: "17a8439c766d92719d7ae7d35846ea444da598fa"
  RHO2_WORKFLOW: ".github/workflows/d972-r07-a0-fresh-precision2-endpoint-v17.yml"
  RHO2_ARTIFACT_ID: "9925190479"
  RHO2_ARTIFACT_NAME: "task640-fresh-rho2-v17-33839962829-1"
  RHO2_ARCHIVE_BYTES: "6049643"
  RHO2_ARCHIVE_DIGEST: "sha256:01722bfda081e577195aa6ca9c0bba3425a50dcfd829eca6ac23e33cb5d79ca4"
  PRODUCER_SHA256: "3ce9293e05f06bf343bd2a54af0ab84ae67f4b922a428cd3c73e38944d6de55c"
  PRODUCER_BYTES: "79651"
  CHECKER_SHA256: "f4f8ba2d342cb60e2c70b708b8847768a78ebde40dd0a52879f460cb558eab36"
  CHECKER_BYTES: "62048"
  PRODUCER_CAP_MINUTES: "40"
  CHECKER_CAP_MINUTES: "40"

jobs:
  actual-seed30:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[r07-actual-seed30-materializer-v1-run]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout frozen task sources
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned numerical runtime
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.1"

      - name: Query and authenticate exact live parents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$repo" = "tochiazuma0510-alt/shadow-atelier"
          gh api "repos/$repo/actions/runs/$P1_RUN" > "$RUNNER_TEMP/p1-run.json"
          gh api "repos/$repo/actions/runs/$TASK554_RUN" > "$RUNNER_TEMP/task554-run.json"
          gh api "repos/$repo/actions/runs/$TASK712_RUN" > "$RUNNER_TEMP/task712-run.json"
          gh api "repos/$repo/actions/runs/$SEPARATOR_RUN" > "$RUNNER_TEMP/separator-run.json"
          gh api "repos/$repo/actions/runs/$SCALAR_RUN" > "$RUNNER_TEMP/scalar-run.json"
          gh api "repos/$repo/actions/runs/$RHO2_RUN" > "$RUNNER_TEMP/rho2-run.json"
          for spec in \
            "$P1_ARTIFACT_ID|$P1_ARTIFACT_NAME|$P1_ARCHIVE_BYTES|$P1_ARCHIVE_DIGEST|$P1_RUN|$P1_HEAD" \
            "$TASK554_PREP_ID|$TASK554_PREP_NAME|$TASK554_PREP_BYTES|$TASK554_PREP_DIGEST|$TASK554_RUN|$TASK554_HEAD" \
            "$TASK554_B0_ID|$TASK554_B0_NAME|$TASK554_B0_BYTES|$TASK554_B0_DIGEST|$TASK554_RUN|$TASK554_HEAD" \
            "$TASK554_B1_ID|$TASK554_B1_NAME|$TASK554_B1_BYTES|$TASK554_B1_DIGEST|$TASK554_RUN|$TASK554_HEAD" \
            "$TASK554_B2_ID|$TASK554_B2_NAME|$TASK554_B2_BYTES|$TASK554_B2_DIGEST|$TASK554_RUN|$TASK554_HEAD" \
            "$TASK554_B3_ID|$TASK554_B3_NAME|$TASK554_B3_BYTES|$TASK554_B3_DIGEST|$TASK554_RUN|$TASK554_HEAD" \
            "$TASK712_ARTIFACT_ID|$TASK712_ARTIFACT_NAME|$TASK712_ARCHIVE_BYTES|$TASK712_ARCHIVE_DIGEST|$TASK712_RUN|$TASK712_HEAD" \
            "$SEPARATOR_ARTIFACT_ID|$SEPARATOR_ARTIFACT_NAME|$SEPARATOR_ARCHIVE_BYTES|$SEPARATOR_ARCHIVE_DIGEST|$SEPARATOR_RUN|$SEPARATOR_HEAD" \
            "$SCALAR_ARTIFACT_ID|$SCALAR_ARTIFACT_NAME|$SCALAR_ARCHIVE_BYTES|$SCALAR_ARCHIVE_DIGEST|$SCALAR_RUN|$SCALAR_HEAD" \
            "$SCALAR_DIAG_ID|$SCALAR_DIAG_NAME|$SCALAR_DIAG_BYTES|$SCALAR_DIAG_DIGEST|$SCALAR_RUN|$SCALAR_HEAD" \
            "$RHO2_ARTIFACT_ID|$RHO2_ARTIFACT_NAME|$RHO2_ARCHIVE_BYTES|$RHO2_ARCHIVE_DIGEST|$RHO2_RUN|$RHO2_HEAD"; do
            IFS='|' read -r id name bytes digest run head <<< "$spec"
            gh api "repos/$repo/actions/artifacts/$id" > "$RUNNER_TEMP/artifact-$id.json"
            jq -e --argjson id "$id" --arg name "$name" --argjson bytes "$bytes" \
              --arg digest "$digest" --argjson run "$run" --arg head "$head" \
              --argjson repo_id "$REPOSITORY_ID" \
              '(.id == $id and .name == $name and .size_in_bytes == $bytes and
                .digest == $digest and .expired == false and
                (.expires_at|type) == "string" and .expires_at != "" and
                .workflow_run.id == $run and .workflow_run.head_sha == $head and
                .workflow_run.repository_id == $repo_id and
                .workflow_run.head_repository_id == $repo_id)' \
              "$RUNNER_TEMP/artifact-$id.json" > /dev/null
          done
          jq -e --arg repo "$repo" --argjson id "$P1_RUN" --argjson attempt "$P1_ATTEMPT" \
            --arg head "$P1_HEAD" --arg path "$P1_WORKFLOW" --argjson repo_id "$REPOSITORY_ID" \
            '(.id == $id and .repository.full_name == $repo and .repository.id == $repo_id and
              .run_attempt == $attempt and .head_sha == $head and .path == $path and
              .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/p1-run.json" > /dev/null
          jq -e --arg repo "$repo" --argjson id "$TASK554_RUN" --argjson attempt "$TASK554_ATTEMPT" \
            --arg head "$TASK554_HEAD" --arg path "$TASK554_WORKFLOW" --argjson repo_id "$REPOSITORY_ID" \
            '(.id == $id and .repository.full_name == $repo and .repository.id == $repo_id and
              .run_attempt == $attempt and .head_sha == $head and .path == $path and
              .status == "completed" and .conclusion == "failure")' "$RUNNER_TEMP/task554-run.json" > /dev/null
          jq -e --arg repo "$repo" --argjson id "$TASK712_RUN" --argjson attempt "$TASK712_ATTEMPT" \
            --arg head "$TASK712_HEAD" --arg path "$TASK712_WORKFLOW" --argjson repo_id "$REPOSITORY_ID" \
            '(.id == $id and .repository.full_name == $repo and .repository.id == $repo_id and
              .run_attempt == $attempt and .head_sha == $head and .path == $path and
              .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/task712-run.json" > /dev/null
          jq -e --arg repo "$repo" --argjson id "$SEPARATOR_RUN" --argjson attempt "$SEPARATOR_ATTEMPT" \
            --arg head "$SEPARATOR_HEAD" --arg path "$SEPARATOR_WORKFLOW" --argjson repo_id "$REPOSITORY_ID" \
            '(.id == $id and .repository.full_name == $repo and .repository.id == $repo_id and
              .run_attempt == $attempt and .head_sha == $head and .path == $path and
              .status == "completed" and .conclusion == "success")' "$RUNNER_TEMP/separator-run.json" > /dev/null

          for spec in "$SCALAR_RUN|$SCALAR_ATTEMPT|$SCALAR_HEAD|$SCALAR_WORKFLOW|scalar" \
                      "$RHO2_RUN|$RHO2_ATTEMPT|$RHO2_HEAD|$RHO2_WORKFLOW|rho2"; do
            IFS='|' read -r id attempt head workflow prefix <<< "$spec"
            jq -e --arg repo "$repo" --argjson id "$id" --argjson attempt "$attempt" \
              --arg head "$head" --arg path "$workflow" --argjson repo_id "$REPOSITORY_ID" \
              '(.id == $id and .repository.full_name == $repo and .repository.id == $repo_id and
                .run_attempt == $attempt and .head_sha == $head and .path == $path and
                .status == "completed" and .conclusion == "success")' \
              "$RUNNER_TEMP/$prefix-run.json" > /dev/null
          done
          jq -e '(.workflow_id == 349904905 and .event == "push")' "$RUNNER_TEMP/rho2-run.json" > /dev/null

      - name: Download exact P1 cache and instruction roots
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.P1_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/p1
          github-token: ${{ github.token }}
          run-id: ${{ env.P1_RUN }}

      - name: Download exact Task554 prepare body
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TASK554_PREP_NAME }}
          path: ${{ runner.temp }}/task554-prepare
          github-token: ${{ github.token }}
          run-id: ${{ env.TASK554_RUN }}

      - name: Download exact Task554 block 0 body
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TASK554_B0_NAME }}
          path: ${{ runner.temp }}/task554-block-0
          github-token: ${{ github.token }}
          run-id: ${{ env.TASK554_RUN }}

      - name: Download exact Task554 block 1 body
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TASK554_B1_NAME }}
          path: ${{ runner.temp }}/task554-block-1
          github-token: ${{ github.token }}
          run-id: ${{ env.TASK554_RUN }}

      - name: Download exact Task554 block 2 body
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TASK554_B2_NAME }}
          path: ${{ runner.temp }}/task554-block-2
          github-token: ${{ github.token }}
          run-id: ${{ env.TASK554_RUN }}

      - name: Download exact Task554 block 3 body
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TASK554_B3_NAME }}
          path: ${{ runner.temp }}/task554-block-3
          github-token: ${{ github.token }}
          run-id: ${{ env.TASK554_RUN }}

      - name: Download exact Task712 maps
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TASK712_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/task712
          github-token: ${{ github.token }}
          run-id: ${{ env.TASK712_RUN }}

      - name: Download exact physical separator
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SEPARATOR_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/separator
          github-token: ${{ github.token }}
          run-id: ${{ env.SEPARATOR_RUN }}

      - name: Download corrected scalar final parent
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SCALAR_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/scalar-final
          github-token: ${{ github.token }}
          run-id: ${{ env.SCALAR_RUN }}

      - name: Download corrected scalar diagnostic receipts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.SCALAR_DIAG_NAME }}
          path: ${{ runner.temp }}/scalar-diagnostics
          github-token: ${{ github.token }}
          run-id: ${{ env.SCALAR_RUN }}

      - name: Download accepted rho2 parent
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.RHO2_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/rho2-download
          github-token: ${{ github.token }}
          run-id: ${{ env.RHO2_RUN }}

      - name: Authenticate executable sources and retain source receipt
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          expected = {
              "search/d972_r07_actual_seed30_materializer_v1.py": (int(os.environ["PRODUCER_BYTES"]), os.environ["PRODUCER_SHA256"]),
              "search/check_d972_r07_actual_seed30_materializer_v1.py": (int(os.environ["CHECKER_BYTES"]), os.environ["CHECKER_SHA256"]),
              "search/stage_d972_r07_targeted_grade2_rho2_v9_flat_v4.py": (29738, "ce84baea0bc18380af8a20e32eb8862f9adc20ad596c2012e127f8b7b8341a4b"),
              "search/d972_r07_actual_grade2_root_scalar_batch_v2.py": (118315, "3c93c50c43020472d616b5c253ea3c6fac6fa34d9d0e41b5a10686da30b7a856"),
              "search/check_d972_r07_actual_grade2_root_scalar_batch_v2.py": (119619, "e0237d100c7fd3e8826ce6ab8896fa8aecf6c7e04da23a603a3d9305ea9eebb6"),
              "search/d972_r07_targeted_grade2_owner_generated_join_v15.py": (126565, "76546bef263ad260f24632c0da46cfb913ee48759e0533d591c507d072037632"),
              "search/check_d972_r07_targeted_grade2_owner_generated_join_v15.py": (141770, "8f718811c518f8d3e1d09de497b955d18c221e983391721068cc35be0000a662"),
              "search/d972_r07_grade2_physical_state_separator_v2.py": (79122, "b068c9f3be153c5381f583b4a82448d5680777ce71ccb5250c2bbb972c8cff2e"),
              "search/check_d972_r07_grade2_physical_state_separator_v2.py": (60997, "bb5d0c0a51408a65c3200b552e6a1eac2f832abeeca8e19fcce64d570f0967f6"),
          }
          receipts = []
          for name, (size, wanted) in expected.items():
              data = Path(name).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == wanted, name
              assert b"\r" not in data and not data.startswith(b"\xef\xbb\xbf") and data.endswith(b"\n"), name
              ast.parse(data, filename=name)
              receipts.append({"file": name, "bytes": size, "sha256": wanted, "lf": data.count(b"\n")})
          work = Path(os.environ["RUNNER_TEMP"])
          (work / "source-receipt.json").write_bytes(canonical({
              "schema": "d972.r07.actual-seed30-materializer.v1.source-receipt",
              "files": receipts, "verified": False, "cross_checked": False}))
          run = json.loads((work / "rho2-run.json").read_text("ascii"))
          artifact = json.loads((work / ("artifact-" + os.environ["RHO2_ARTIFACT_ID"] + ".json")).read_text("ascii"))
          acquisition = {
              "schema": "d972.r07.targeted-grade2.rho2-v9.acquisition.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "run_id": run["id"], "run_attempt": run["run_attempt"], "head_sha": run["head_sha"],
              "workflow_path": run["path"], "workflow_id": run["workflow_id"],
              "event": run["event"], "conclusion": run["conclusion"],
              "artifact_id": artifact["id"], "artifact_name": artifact["name"],
              "artifact_archive_bytes": artifact["size_in_bytes"], "artifact_digest": artifact["digest"]}
          (work / "rho2-acquisition.json").write_bytes(canonical(acquisition))
          PY

      - name: Stage rho2 with the accepted flat adapter
        shell: bash
        run: |
          set -euo pipefail
          python -B -u search/stage_d972_r07_targeted_grade2_rho2_v9_flat_v4.py \
            --input "$RUNNER_TEMP/rho2-download" --output "$RUNNER_TEMP/rho2-flat" \
            --acquisition "$RUNNER_TEMP/rho2-acquisition.json" \
            2>&1 | tee "$RUNNER_TEMP/rho2-stager.log"

      - name: Resolve exact parent roots without copying parent files
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          def find(base_name, required):
              base = work / base_name
              matches = []
              for root in [base, *sorted(p for p in base.rglob("*") if p.is_dir())]:
                  if root.is_symlink() or (base != root and base not in root.resolve().parents):
                      raise SystemExit("unsafe parent root")
                  if all((root / name).is_file() for name in required):
                      for name in required:
                          cursor = root
                          for part in Path(name).parts:
                              cursor = cursor / part
                              assert not cursor.is_symlink()
                      matches.append(root.resolve())
              assert len(matches) == 1, (base_name, matches)
              return str(matches[0])
          paths = {
              "SCALAR_ROOT": find("scalar-final", ["output/result.json", "checker-result.json"]),
              "SCALAR_DIAGNOSTICS_ROOT": find("scalar-diagnostics", ["launch.json", "receipts/source-receipt.json"]),
              "PREPARE_ROOT": find("task554-prepare", ["prepare.HEAD"]),
              "P1_ROOT": find("p1", ["manifest.json", "instructions.jsonl", "degree2.cache.bin"]),
              "TASK712_ROOT": find("task712", ["r07-grade2-maps-v4-receipt.json", "r07-grade2-maps-v4-checker.json"]),
              "STATE_ROOT": find("separator", ["state/HEAD", "output/result.json", "checker-result.json"]),
              "RHO2_ROOT": str(work / "rho2-flat")}
          for index in range(4):
              paths["BLOCK_" + str(index) + "_ROOT"] = find("task554-block-" + str(index), ["block-" + str(index) + ".HEAD"])
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in paths.items():
                  assert "\n" not in value and "\r" not in value
                  stream.write(key + "=" + value + "\n")
          (work / "parent-paths.json").write_text(json.dumps(paths, sort_keys=True) + "\n", encoding="ascii")
          PY

      - name: Run serial bounded synthetic tests
        shell: bash
        run: |
          set -euo pipefail
          python -B -u search/d972_r07_actual_seed30_materializer_v1.py --selftest \
            > "$RUNNER_TEMP/producer-selftest.json" 2> "$RUNNER_TEMP/producer-selftest.log"
          python -B -u search/check_d972_r07_actual_seed30_materializer_v1.py --selftest \
            > "$RUNNER_TEMP/checker-selftest.json" 2> "$RUNNER_TEMP/checker-selftest.log"
          jq -e '.status == "PASS"' "$RUNNER_TEMP/producer-selftest.json" > /dev/null
          jq -e '.status == "PASS"' "$RUNNER_TEMP/checker-selftest.json" > /dev/null

      - name: Materialize the fixed seed30 and one pivot
        timeout-minutes: ${{ fromJSON(env.PRODUCER_CAP_MINUTES) }}
        shell: bash
        run: |
          set -euo pipefail
          python -B -u search/d972_r07_actual_seed30_materializer_v1.py \
            --scalar-root "$SCALAR_ROOT" --scalar-diagnostics-root "$SCALAR_DIAGNOSTICS_ROOT" \
            --prepare-root "$PREPARE_ROOT" \
            --block-root "$BLOCK_0_ROOT" --block-root "$BLOCK_1_ROOT" \
            --block-root "$BLOCK_2_ROOT" --block-root "$BLOCK_3_ROOT" \
            --p1-root "$P1_ROOT" --task712-root "$TASK712_ROOT" \
            --state-root "$STATE_ROOT" --rho2-root "$RHO2_ROOT" \
            --output-root "$RUNNER_TEMP/output" \
            2> >(tee "$RUNNER_TEMP/producer.log" >&2) | tee "$RUNNER_TEMP/producer-result.json"
          jq -e '.status == "PASS" and .verified == false' "$RUNNER_TEMP/producer-result.json" > /dev/null

      - name: Independently check the actual delta
        timeout-minutes: ${{ fromJSON(env.CHECKER_CAP_MINUTES) }}
        shell: bash
        run: |
          set -euo pipefail
          python -B -u search/check_d972_r07_actual_seed30_materializer_v1.py \
            --scalar-root "$SCALAR_ROOT" --scalar-diagnostics-root "$SCALAR_DIAGNOSTICS_ROOT" \
            --prepare-root "$PREPARE_ROOT" \
            --block-root "$BLOCK_0_ROOT" --block-root "$BLOCK_1_ROOT" \
            --block-root "$BLOCK_2_ROOT" --block-root "$BLOCK_3_ROOT" \
            --p1-root "$P1_ROOT" --task712-root "$TASK712_ROOT" \
            --state-root "$STATE_ROOT" --rho2-root "$RHO2_ROOT" \
            --candidate-root "$RUNNER_TEMP/output" \
            2> >(tee "$RUNNER_TEMP/checker.log" >&2) | tee "$RUNNER_TEMP/checker-result.json"
          jq -e '.status == "PASS" and .verified == false and .cross_checked == false' "$RUNNER_TEMP/checker-result.json" > /dev/null

      - name: Upload final parent-plus-one-pivot candidate only after checker PASS
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-actual-seed30-materializer-v1-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 90
          path: |
            ${{ runner.temp }}/output
            ${{ runner.temp }}/checker-result.json
            ${{ runner.temp }}/source-receipt.json

      - name: Upload diagnostic receipts and bounded outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-actual-seed30-materializer-v1-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/*-run.json
            ${{ runner.temp }}/artifact-*.json
            ${{ runner.temp }}/source-receipt.json
            ${{ runner.temp }}/rho2-acquisition.json
            ${{ runner.temp }}/parent-paths.json
            ${{ runner.temp }}/*-selftest.json
            ${{ runner.temp }}/*-selftest.log
            ${{ runner.temp }}/rho2-stager.log
            ${{ runner.temp }}/producer-result.json
            ${{ runner.temp }}/checker-result.json
            ${{ runner.temp }}/producer.log
            ${{ runner.temp }}/checker.log
            ${{ runner.temp }}/output
