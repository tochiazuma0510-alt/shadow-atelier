jobs:
  fixed-lambda-batch:
    if: ${{ github.ref == 'refs/heads/sol/r07-explicit-lift-20260825' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[r07-fixed-lambda-cycle-batch-v4-envelope-v2-run]')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - name: Authenticate the frozen driver and archive before raw placement
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/fixed-lambda-batch-v4"
          inputs="$RUNNER_TEMP/fixed-lambda-batch-v4-inputs"
          test ! -e "$report"
          test ! -L "$report"
          test ! -e "$inputs"
          test ! -L "$inputs"
          mkdir "$report" "$inputs"
          exec > "$report/driver-bootstrap-stdout.log" 2> "$report/driver-bootstrap-stderr.log"
          trap 'code=$?; printf "%s\n" "$code" > "$report/driver-bootstrap-exit-code.txt"; exit "$code"' EXIT
          workflow="$GITHUB_WORKSPACE/$WF_FILE"
          source="$GITHUB_WORKSPACE/$WORKFLOW_DRIVER_FILE"
          history="$GITHUB_WORKSPACE/$WORKFLOW_HISTORY_FILE"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WF_FILE@$GITHUB_REF"
          for directory in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/search" "$GITHUB_WORKSPACE/.github" "$GITHUB_WORKSPACE/.github/workflows" "$GITHUB_WORKSPACE/ops" "$GITHUB_WORKSPACE/ops/workflow_versions"; do
            test -d "$directory"
            test ! -L "$directory"
          done
          for file in "$workflow" "$source" "$history"; do
            test -f "$file"
            test ! -L "$file"
          done
          workflow_bytes="$(stat -c '%s' -- "$workflow")"
          test "$workflow_bytes" -lt 500000
          test "$(stat -c '%s' -- "$source")" = "$WORKFLOW_DRIVER_BYTES"
          test "$(stat -c '%s' -- "$history")" = "$WORKFLOW_HISTORY_BYTES"
          printf '%s  %s\n' "$WORKFLOW_DRIVER_SHA256" "$source" | sha256sum --check --strict -
          printf '%s  %s\n' "$WORKFLOW_HISTORY_SHA256" "$history" | sha256sum --check --strict -
          set -o noclobber
          cat -- "$source" > "$report/driver.py"
          cat -- "$history" > "$report/workflow-envelope-v1.yml"
          set +o noclobber
          for file in "$report/driver.py" "$report/workflow-envelope-v1.yml"; do
            test -f "$file"
            test ! -L "$file"
          done
          test "$(stat -c '%s' -- "$report/driver.py")" = "$WORKFLOW_DRIVER_BYTES"
          test "$(stat -c '%s' -- "$report/workflow-envelope-v1.yml")" = "$WORKFLOW_HISTORY_BYTES"
          printf '%s  %s\n' "$WORKFLOW_DRIVER_SHA256" "$report/driver.py" | sha256sum --check --strict -
          printf '%s  %s\n' "$WORKFLOW_HISTORY_SHA256" "$report/workflow-envelope-v1.yml" | sha256sum --check --strict -
          cmp -- "$source" "$report/driver.py"
          cmp -- "$history" "$report/workflow-envelope-v1.yml"
          sha256sum -- "$source" "$report/driver.py" "$history" "$report/workflow-envelope-v1.yml" "$workflow" > "$report/driver-placement-before.sha256"
          {
            printf 'schema=task1059.driver-placement.v2\nstatus=PASS\n'
            printf 'checkout_commit=%s\nworkflow_ref=%s\nworkflow_file=%s\nworkflow_bytes=%s\nworkflow_limit_exclusive=500000\n' "$GITHUB_SHA" "$GITHUB_WORKFLOW_REF" "$WF_FILE" "$workflow_bytes"
            printf 'driver_repo_file=%s\ndriver_report_file=driver.py\ndriver_bytes=%s\ndriver_sha256=%s\n' "$WORKFLOW_DRIVER_FILE" "$WORKFLOW_DRIVER_BYTES" "$WORKFLOW_DRIVER_SHA256"
            printf 'history_repo_file=%s\nhistory_report_file=workflow-envelope-v1.yml\nhistory_bytes=%s\nhistory_sha256=%s\n' "$WORKFLOW_HISTORY_FILE" "$WORKFLOW_HISTORY_BYTES" "$WORKFLOW_HISTORY_SHA256"
            printf 'driver_raw_copy_equal=true\nhistory_raw_copy_equal=true\nmathematical_source_closure_unchanged=true\nmathematical_execution_performed=false\n'
          } > "$report/driver-placement-before.txt"
      - name: Preserve all source and raw bytes before runtime or parent admission
        id: capture
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" capture
      - name: Install the exact accepted numerical runtime
        shell: bash
        run: python -m pip install --disable-pip-version-check 'numpy==2.5.1'
      - name: Save all 21 executable and 3 raw sources and authenticate their exact runtime
        id: source
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" source
      - name: Authenticate registered raw source regions and record arithmetic inheritance and shared TCB
        id: audit
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" audit
      - name: Authenticate all 16 live parent tuples and preserve every ZIP entry
        id: live
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" live
      - name: Bind the original 64-step anchor and accepted batch1578 in the exact seven-key acceptance
        id: intake
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" intake
      - name: Rerun the 16 metadata admission cases for the changed registration and REPORT
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" execute metadata
          python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" test-gate metadata
      - name: Run the new producer two literal groups and parent metadata group once
        id: ptest
        shell: bash
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" execute producer-selftest
          python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" test-gate producer-selftest
      - name: Run the new independent checker two literal groups and parent metadata group once
        id: ctest
        shell: bash
        run: |
          set -euo pipefail
          python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" execute checker-selftest
          python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" test-gate checker-selftest
      - name: Run one fresh fixed-lambda batch with 128 selected candidates at most
        id: producer
        continue-on-error: true
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" execute producer
      - name: Freeze every producer output byte before any checker invocation
        id: baseline
        if: ${{ always() && steps.bootstrap.outcome == 'success' && steps.producer.outcome != 'skipped' }}
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" post-producer
      - name: Independently compare the entire saved new selection and candidate prefix once
        id: checker
        if: ${{ always() && steps.bootstrap.outcome == 'success' && steps.baseline.outcome == 'success' && steps.baseline.outputs.checker == 'true' && steps.metadata.outcome == 'success' && steps.ptest.outcome == 'success' && steps.ctest.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" execute checker
      - name: Always archive and reread every fixture file and explicit directory entry
        id: fixtures
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: timeout --signal=TERM --kill-after=30s 360s python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" fixtures
      - name: Always preserve and compare all parents, source, intake and producer output
        id: preserve
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" preserve
      - name: Always recheck checkout driver archive and copied raw bytes
        id: envelope
        if: ${{ always() && steps.bootstrap.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/fixed-lambda-batch-v4"
          test -d "$report"
          test ! -L "$report"
          exec > "$report/driver-placement-after-stdout.log" 2> "$report/driver-placement-after-stderr.log"
          trap 'code=$?; printf "schema=task1059.driver-placement-after.v2\nexit_code=%s\nmathematical_execution_performed=false\n" "$code" > "$report/driver-placement-after.txt"; exit "$code"' EXIT
          workflow="$GITHUB_WORKSPACE/$WF_FILE"
          source="$GITHUB_WORKSPACE/$WORKFLOW_DRIVER_FILE"
          history="$GITHUB_WORKSPACE/$WORKFLOW_HISTORY_FILE"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/$WF_FILE@$GITHUB_REF"
          for directory in "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/search" "$GITHUB_WORKSPACE/.github" "$GITHUB_WORKSPACE/.github/workflows" "$GITHUB_WORKSPACE/ops" "$GITHUB_WORKSPACE/ops/workflow_versions"; do
            test -d "$directory"
            test ! -L "$directory"
          done
          for file in "$workflow" "$source" "$history" "$report/driver.py" "$report/workflow-envelope-v1.yml" "$report/driver-bootstrap-exit-code.txt" "$report/driver-placement-before.sha256" "$report/driver-placement-before.txt"; do
            test -f "$file"
            test ! -L "$file"
          done
          test "$(cat -- "$report/driver-bootstrap-exit-code.txt")" = '0'
          test "$(stat -c '%s' -- "$workflow")" -lt 500000
          test "$(stat -c '%s' -- "$source")" = "$WORKFLOW_DRIVER_BYTES"
          test "$(stat -c '%s' -- "$report/driver.py")" = "$WORKFLOW_DRIVER_BYTES"
          test "$(stat -c '%s' -- "$history")" = "$WORKFLOW_HISTORY_BYTES"
          test "$(stat -c '%s' -- "$report/workflow-envelope-v1.yml")" = "$WORKFLOW_HISTORY_BYTES"
          printf '%s  %s\n' "$WORKFLOW_DRIVER_SHA256" "$source" | sha256sum --check --strict -
          printf '%s  %s\n' "$WORKFLOW_DRIVER_SHA256" "$report/driver.py" | sha256sum --check --strict -
          printf '%s  %s\n' "$WORKFLOW_HISTORY_SHA256" "$history" | sha256sum --check --strict -
          printf '%s  %s\n' "$WORKFLOW_HISTORY_SHA256" "$report/workflow-envelope-v1.yml" | sha256sum --check --strict -
          cmp -- "$source" "$report/driver.py"
          cmp -- "$history" "$report/workflow-envelope-v1.yml"
          sha256sum -- "$source" "$report/driver.py" "$history" "$report/workflow-envelope-v1.yml" "$workflow" > "$report/driver-placement-after.sha256"
          cmp -- "$report/driver-placement-before.sha256" "$report/driver-placement-after.sha256"
      - name: Join actual execution, complete comparison, final HEAD and all preservation gates
        id: final
        if: ${{ always() && steps.bootstrap.outcome == 'success' && steps.envelope.outcome == 'success' }}
        shell: bash
        run: python -B "$RUNNER_TEMP/fixed-lambda-batch-v4/driver.py" final
      - name: Upload only a completely compared candidate
        if: ${{ success() && steps.bootstrap.outcome == 'success' && steps.envelope.outcome == 'success' && steps.final.outputs.candidate == 'true' && steps.producer.outcome == 'success' && steps.checker.outcome == 'success' && steps.fixtures.outcome == 'success' && steps.preserve.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-fixed-lambda-cycle-batch-v4-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fixed-lambda-batch-v4/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Always upload the same complete envelope including partial and hidden diagnostics
        if: ${{ always() }}
