name: w691-gen23-witness

# [S2-3-PRE] SL^pm(2,691) の (2,3)-生成 witness 探索(裁定1055/1056)。
#
# 方法: docs/notes/w691_scan_gen23_spec_v1.md §3 の目撃者法。1384点表現
# (F_691^2\{0} を平方部分群で割った商、-I を直接検出)で Size(Group(a,b)) を計算、
# 陽性1対で即COMPLETE終了。2000対到達ならUNKNOWN。seed固定で再現可能。
#
# ローカルsmoke(3対・方式検証)は既に完了・trial 1で陽性witness確認済み(seed=20260812)。
# 本jobはGHA上での再現確認+provenance記録(研究者指示裁定1056)。
#
# DISPATCH GATE: workflow_dispatch ONLY.

on:
  workflow_dispatch:
    inputs:
      hard_timeout_minutes:
        description: 'hard timeout for the GAP process'
        required: true
        type: number
        default: 20

permissions:
  contents: read

jobs:
  gen23-witness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup GAP 4.16.0
        uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'

      - name: Run witness search under process hard timeout
        id: producer
        shell: bash
        run: |
          set +e
          mkdir -p ci/out
          python3 ci/hard_timeout.py \
            --timeout-seconds "$(( ${{ inputs.hard_timeout_minutes }} * 60 ))" \
            --heartbeat-seconds 15 \
            --kill-grace-seconds 5 \
            --checkpoint ci/out/gen23_hard_timeout.json \
            --log ci/out/gen23_witness.log \
            -- \
            gap -q -o 2g search/s2_3_pre_gen23_v1.g
          rc=$?
          echo "wrapper_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gate result
        shell: bash
        run: |
          set -euo pipefail
          test -s search/certs/s2_3_pre_gen23_v1_20260812.json
          cp search/certs/s2_3_pre_gen23_v1_20260812.json ci/out/
          python3 - <<'PY'
          import json
          p = json.load(open('search/certs/s2_3_pre_gen23_v1_20260812.json', encoding='utf8'))
          print('status:', p['status'])
          print('witness:', p.get('witness'))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w691-gen23-witness-${{ github.run_id }}
          path: ci/out/
          if-no-files-found: error
          retention-days: 30
