name: d972-r07-a0-fresh-precision2-endpoint-v17
on:
  workflow_dispatch:
  push:
    branches: [sol/r07-explicit-lift-20260825]
    paths:
      - .github/workflows/d972-r07-a0-fresh-precision2-endpoint-v17.yml
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TASK640_SECONDS: "5400"
  TASK640_MAX_RSS: "7516192768"
  TASK640_DURABLE_CAP: "1073741824"
  TASK640_PATH_CAP: "2000000"
  TASK640_TRIE_CAP: "2000000"
  TASK640_STATE_CAP: "50000000"
  TASK640_RECORD_CAP: "100000"
  TASK625_ACCUMULATED_CAP: "50000000"
  TASK625_RUN: "33734643746"
  TASK625_ATTEMPT: "1"
  TASK625_JOB: "100582244001"
  TASK625_HEAD: "b401d724bbdbef8cf67e96def22fc51c014ab546"
  TASK625_WORKFLOW: "d972-r07-a0-grade1-selected-slp-staged-v3"
  SOURCE_RUN: "33677346616"
  PRODUCER_SHA256: "1422bec44e1367c0ea22043cb7b5e844ba8e7df69e3da763bd08e372d5dc8046"
  CHECKER_SHA256: "7b2beb39dbdc65494f85fa4451ed69d99a22685d11f1d4fef6e671322d24098d"
  PRODUCER_MARKER: "R07_FRESH_PRECISION2_ENDPOINT_SIGNATURE_V9_CANDIDATE"
  CHECKER_MARKER: "R07_FRESH_PRECISION2_ENDPOINT_SIGNATURE_V9_CHECKER_PASS"
  V512_BYTES: "6151"
  V512_SHA256: "33997289c63c66392849ebdc81f4668172272f72057d54e383e50523059b2011"
  TASK789_AUDIT_BYTES: "16116"
  TASK789_AUDIT_SHA256: "a862524927f04547390114f7fa2425e9760d184a30c2c236c2ecf01fe5d71d61"
  V500_BYTES: "4777"
  V500_SHA256: "f0efc3d4292e512bfc8ff920c1c54ce31257310566c5e89b2981d287372a3318"
  REPLY_SHA256: "1e0d117a6fb7accc6b568e92bf6e74f9d1c34e8c133ab9e9ca30ff2912295cfd"
  PREBUILD_SHA256: "acffa38731a28d85539f765537010e6bf20f55c7f7feae0099d56c58c808ffc8"
  V484_SHA256: "25e292c8d996000c5dd442619f9afa269d83193ce5f58e4f3536c55b61f77492"
  TASK723_REPLY_SHA256: "d6dfa91766e2d2eb52dd5fd1bfb5267a89d2277395aff401c3dfdcb60a55b6b4"
  V488_BYTES: "2232"
  V488_SHA256: "e07d52e7864042d1a3fe22538b4ba408d7cc56721135b07c34b4111e726cf763"
  TASK735_REPLY_BYTES: "4067"
  TASK735_REPLY_SHA256: "a547638073b64bced8e9e0893786d8bd9fc437b3ada85b47515d5d9dfde34184"
  TASK737_AUDIT_BYTES: "7999"
  TASK737_AUDIT_SHA256: "13e6d021c197cec3ca0213ab0f57fe711b982ecc11a4e9d3ca54984d3bd8cb49"
jobs:
  fresh-endpoint:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[fire-fresh-precision2-endpoint-v17]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.13"
      - name: Authenticate v17 and pinned arithmetic source
        shell: bash
        run: |
          set -euo pipefail
          test "$(stat -c '%s' search/d972_r07_a0_fresh_precision2_endpoint_signature_v9.py)" = "70945"
          test "$(sha256sum search/d972_r07_a0_fresh_precision2_endpoint_signature_v9.py | awk '{print $1}')" = "$PRODUCER_SHA256"
          test "$(stat -c '%s' search/check_d972_r07_a0_fresh_precision2_endpoint_signature_v9.py)" = "113012"
          test "$(sha256sum search/check_d972_r07_a0_fresh_precision2_endpoint_signature_v9.py | awk '{print $1}')" = "$CHECKER_SHA256"
          test "$(stat -c '%s' sol/proof_r07_all_path_direct_canary_induction_repair_v512.md)" = "$V512_BYTES"
          test "$(sha256sum sol/proof_r07_all_path_direct_canary_induction_repair_v512.md | awk '{print $1}')" = "$V512_SHA256"
          test "$(stat -c '%s' sol/sol_reply_789_audit_r07_all_path_direct_canary_induction_v509.md)" = "$TASK789_AUDIT_BYTES"
          test "$(sha256sum sol/sol_reply_789_audit_r07_all_path_direct_canary_induction_v509.md | awk '{print $1}')" = "$TASK789_AUDIT_SHA256"
          test "$(stat -c '%s' sol/proof_r07_direct_all_seven_signature_bucket_replay_v500.md)" = "$V500_BYTES"
          test "$(sha256sum sol/proof_r07_direct_all_seven_signature_bucket_replay_v500.md | awk '{print $1}')" = "$V500_SHA256"
          test "$(sha256sum sol/luna_reply_717_r07_task640_endpoint_minimal_runtime_v4.md | awk '{print $1}')" = "$REPLY_SHA256"
          test "$(sha256sum search/d972_r07_a0_first_rung_grade2_prebuild_v1.py | awk '{print $1}')" = "$PREBUILD_SHA256"
          test "$(sha256sum search/d972_r07_a0_grade1_selected_slp_v2.py | awk '{print $1}')" = "ce036c4a1a92d16a78cb8da8c16dee282a6a981889f821e6df82eaecdd8fba0a"
          test "$(sha256sum search/check_d972_r07_a0_grade1_selected_slp_v2.py | awk '{print $1}')" = "8c3dd039368f63d62ef79694a196f73d0b626134df39673c5e48c98c7c8787f9"
          test "$(sha256sum sol/proof_r07_selected_slp_leaf_gated_precision2_join_v470.md | awk '{print $1}')" = "b56aa15ee87b4831cc999525233cfadbe8e62cd25c0503c0c98fce3106fb2b7a"
          test "$(sha256sum sol/sol_reply_611_audit_r07_selected_slp_leaf_gated_precision2_join_v1.md | awk '{print $1}')" = "4212afae131eda13c8d1199bd2a41ad2b232957fd8de2d565fbfe24e34fccd92"
          test "$(sha256sum sol/proof_r07_endpoint_signature_precision2_consumer_v471.md | awk '{print $1}')" = "38d271514baf838953b6003f954be60c689771f0fd1c9fec14de1dfc55daf99f"
          test "$(sha256sum sol/sol_reply_613_audit_r07_endpoint_signature_precision2_consumer_v1.md | awk '{print $1}')" = "04acf864fd2fd95c13880510feb5087588f3f3970418f47ed44614f5bc74f75b"
          test "$(sha256sum sol/sol_reply_622_reaudit_r07_task601_packed_memory_release_v3.md | awk '{print $1}')" = "4eaf1f92f4ef1fdd0a7f3289175d7c8b97c5ac85714b0b368d4aa66a20f151e0"
          test "$(sha256sum sol/proof_r07_task640_endpoint_minimal_runtime_v484.md | awk '{print $1}')" = "$V484_SHA256"
          test "$(sha256sum sol/sol_reply_723_audit_r07_task717_endpoint_minimal_v4.md | awk '{print $1}')" = "$TASK723_REPLY_SHA256"
          test "$(stat -c '%s' sol/proof_r07_task640_v10_missing_owner_binding_v488.md)" = "$V488_BYTES"
          test "$(sha256sum sol/proof_r07_task640_v10_missing_owner_binding_v488.md | awk '{print $1}')" = "$V488_SHA256"
          test "$(stat -c '%s' sol/luna_reply_735_r07_task640_owner_binding_v5.md)" = "$TASK735_REPLY_BYTES"
          test "$(sha256sum sol/luna_reply_735_r07_task640_owner_binding_v5.md | awk '{print $1}')" = "$TASK735_REPLY_SHA256"
          test "$(stat -c '%s' sol/sol_reply_737_audit_r07_task640_owner_binding_v5.md)" = "$TASK737_AUDIT_BYTES"
          test "$(sha256sum sol/sol_reply_737_audit_r07_task640_owner_binding_v5.md | awk '{print $1}')" = "$TASK737_AUDIT_SHA256"
          grep -Fqx '`PASS_WITH_FINITE_TEXT_REPAIR`' sol/sol_reply_737_audit_r07_task640_owner_binding_v5.md
          grep -Fqx '`OWNER_BINDING_V5_SAFE_FOR_GHA=yes`' sol/sol_reply_737_audit_r07_task640_owner_binding_v5.md
      - name: Run bounded serial fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.1"
          python -B -m py_compile search/d972_r07_a0_fresh_precision2_endpoint_signature_v9.py search/check_d972_r07_a0_fresh_precision2_endpoint_signature_v9.py
          python -B search/d972_r07_a0_fresh_precision2_endpoint_signature_v9.py --selftest
          python -B search/check_d972_r07_a0_fresh_precision2_endpoint_signature_v9.py --selftest
      - name: Authenticate exact accepted Task625 run
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK625_RUN" --jq '.run_attempt')" = "$TASK625_ATTEMPT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK625_RUN" --jq '.head_sha')" = "$TASK625_HEAD"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK625_RUN" --jq '.conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK625_RUN" --jq '.name')" = "$TASK625_WORKFLOW"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK625_RUN/jobs?filter=all" --jq '.jobs[] | select(.id == 100582244001) | .name')" = "selected-slp"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$TASK625_RUN/jobs?filter=all" --jq '.jobs[] | select(.id == 100582244001) | .conclusion')" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.id')" = "9885925239"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.name')" = "task625-grade1-selected-slp-staged-v3-33734643746-1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.size_in_bytes')" = "50793121"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.digest')" = "sha256:ac3121f3bc1a7e2a6c267f20352e953b7343f9085015dd74e4a67e4b90129a75"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.expired')" = "false"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.workflow_run.id')" = "$TASK625_RUN"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9885925239" --jq '.workflow_run.head_sha')" = "$TASK625_HEAD"
      - name: Download exact accepted Task625 parent
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: task625-grade1-selected-slp-staged-v3-${{ env.TASK625_RUN }}-${{ env.TASK625_ATTEMPT }}
          path: ${{ runner.temp }}/task625
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.TASK625_RUN }}
      - name: Download exact Task554 source state
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: task554-grade1-v3-*-${{ env.SOURCE_RUN }}-1
          path: ${{ runner.temp }}/task554-state
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: "33677346616"
      - name: Download exact Task595 MEMBER candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: task595-grade1-decision-v2-candidate-33707397894-1
          path: ${{ runner.temp }}/task595-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: "33707397894"
      - name: Stage authenticated Task625 verdict into payload
        shell: bash
        run: |
          set -euo pipefail
          verdict="$RUNNER_TEMP/task625/task625-verdict.json"
          payload="$RUNNER_TEMP/task625/task625-payload"
          test -s "$verdict"
          test "$(stat -c '%s' "$verdict")" = "1120"
          test "$(sha256sum "$verdict" | awk '{print $1}')" = "a650aa8d5d78f52145fff5ba7769ad2036cfd16e90e3caaf367b4517e07d2740"
          grep -Fq 'R07_GRADE1_SELECTED_SLP_V2_CHECKER_PASS' "$verdict"
          cp "$verdict" "$payload/task625-verdict.json"
          cp "$verdict" "$payload/task625-replayed-verdict.json"
          cmp "$verdict" "$payload/task625-verdict.json"
          cmp "$verdict" "$payload/task625-replayed-verdict.json"
          cmp "$payload/task625-verdict.json" "$payload/task625-replayed-verdict.json"
      - name: Produce fresh rho2 candidate
        env:
          TASK640_SECONDS: "9600"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task640-logs"
          ulimit -v 8388608
          timeout --signal=TERM --kill-after=60s 45m python -B -u search/d972_r07_a0_fresh_precision2_endpoint_signature_v9.py \
            --state "$RUNNER_TEMP/task554-state" --candidate "$RUNNER_TEMP/task595-candidate" \
            --task601 "$RUNNER_TEMP/task625/task625-payload" --out "$RUNNER_TEMP/task640-payload" \
            2>&1 | tee "$RUNNER_TEMP/task640-logs/producer.log"
          grep -Fq "$PRODUCER_MARKER" "$RUNNER_TEMP/task640-payload/manifest.json"
      - name: Upload unchecked rho2 candidate
        if: ${{ success() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: task640-fresh-rho2-v17-unchecked-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task640-payload/
          if-no-files-found: error
          retention-days: 90
      - name: Independently check fresh rho2 candidate
        env:
          TASK640_SECONDS: "9600"
        shell: bash
        run: |
          set -euo pipefail
          ulimit -v 8388608
          timeout --signal=TERM --kill-after=60s 45m python -B -u search/check_d972_r07_a0_fresh_precision2_endpoint_signature_v9.py \
            --state "$RUNNER_TEMP/task554-state" --candidate "$RUNNER_TEMP/task595-candidate" \
            --task601 "$RUNNER_TEMP/task625/task625-payload" --payload "$RUNNER_TEMP/task640-payload" \
            --out "$RUNNER_TEMP/task640-verdict.json" 2>&1 | tee "$RUNNER_TEMP/task640-logs/checker.log"
          grep -Fq "$CHECKER_MARKER" "$RUNNER_TEMP/task640-verdict.json"
      - name: Upload residual only after checker marker
        if: ${{ success() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: task640-fresh-rho2-v17-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task640-payload/
            ${{ runner.temp }}/task640-verdict.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: task640-fresh-rho2-v17-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task640-logs/
          if-no-files-found: warn
          retention-days: 90
