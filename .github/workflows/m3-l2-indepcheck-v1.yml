name: m3-l2-indepcheck-v1

# M3(E[4] レーン)独立照合の GHA venue(段2)。
# 【メモリ枯渇説は正式に棄却・裁定済み(2026-08-23)】ローカルでもGHAでも10分/12分capに達した
# 真因は、CKPT ログによる局所化(run 32617461891)で W1SemanticGate 内部と確定: そこが生の
# 有限表示群 fp-B3(=BF3/[brelD]、無限群)の要素同士に `=`/`<>` を適用しており、GAPの語の問題
# 解法が座標(=一般手法)で発散していた。修理: W1 gate の4等式を window 1 の置換群(既に
# 高速と確認済み)側で評価するよう変更(数学的妥当性は司令塔裁定に記載・コード内コメント参照)。
# 続報(errata v1.1・2026-08-23): fp-B3 根治後、自己検証3例目が fail →数学者の errata で
# 真因判明: 仕様 v1 の ad_convention の向きが逆(W-1 は反同型 ⟹ paper Ad(g) = GAP v^g)。
# v2 := Image(q, s^x) に修正+GATE-ORIENT 2本を必須gate化(errata E-3)。定理PUSH自体は不変。
#
# DISPATCH GATE: push to this branch (paths below) + workflow_dispatch.
# workflow_dispatch alone could not be used for the FIRST run because GitHub only registers a
# brand-new workflow_dispatch workflow in its Actions registry once the file has landed on the
# default branch at least once (measured: gh workflow run -> 404 "not found on the default
# branch" even though the push itself succeeded). Commander ruling (2026-08-23): use push-trigger
# instead of merging this one-off measurement yml onto master. workflow_dispatch is kept for any
# later re-run once GitHub has indexed the workflow.

on:
  push:
    branches:
      - koubou158/m2-msweep-v5-gha
    paths:
      - 'search/koubou83_m3_l2_*'
      - '.github/workflows/m3-l2-indepcheck-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  M3L2_SCRIPT_SHA256: "65f2244ece652656bbb565342a61b7f3ecc16aa5010ee5a7cbcca9b7c8a21a98"
  M3L2_SPEC_SHA256: "5013eafa1d138712cb815514e098db4183aaefd43be72d94ee74662c5c1fbefd"
  M3L2_ERRATA_SHA256: "7b0673292a01de67ebc47407ddfe5ce30b8d2020640222b7d82bb45e2e95c2b7"

jobs:
  m3-l2-indepcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup GAP 4.16.0
        uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: "4.16.0"

      - name: Pin input hashes (fail-closed)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$M3L2_SCRIPT_SHA256" search/koubou83_m3_l2_check_v2.g | sha256sum --check --status
          printf '%s  %s\n' "$M3L2_SPEC_SHA256" scratchpad/koubou83_m3_l2_linear_spec_v1.md | sha256sum --check --status
          printf '%s  %s\n' "$M3L2_ERRATA_SHA256" scratchpad/koubou83_m3_l2_linear_spec_v1_1_errata.md | sha256sum --check --status

      - name: Run M3(E[4]) independent checker (v2, linear evaluation)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/out
          gap -q --quitonbreak -o 8g search/koubou83_m3_l2_check_v2.g 2>&1 | tee ci/out/gap-m3-l2-indepcheck.log
          gap_status=${PIPESTATUS[0]}
          test "$gap_status" -eq 0
          ! grep -Eq '(^|[[:space:]])(Syntax error:|Error,|break loop)' ci/out/gap-m3-l2-indepcheck.log
          grep -Fxc 'KOUBOU83_M3_L2_INDEPCHECK_V2_DONE' ci/out/gap-m3-l2-indepcheck.log | grep -Fx 1
          test -s search/certs/koubou83_m3_l2_indepcheck_v1_20260823.json
          cp search/certs/koubou83_m3_l2_indepcheck_v1_20260823.json ci/out/
          sha256sum search/certs/koubou83_m3_l2_indepcheck_v1_20260823.json | tee ci/out/cert-sha256.txt

      - name: Upload M3-L2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-l2-indepcheck-v1-${{ github.run_id }}-attempt${{ github.run_attempt }}
          if-no-files-found: warn
          path: ci/out/
          retention-days: 30
