name: lean

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: lake build
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
        # lake build re-elaborates and kernel-checks every .lean file (Marking + K3).
        # Each theorem carries a `#print axioms` that prints its axiom dependencies
        # to the build log -- a successful build IS the proof.

      - name: assert proof hygiene (no sorry, no native_decide)
        run: |
          ! grep -E "uses 'sorry'|sorryAx|ofReduceBool|ofReduceNat" build.log
