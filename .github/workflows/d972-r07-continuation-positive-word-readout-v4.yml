              parent_entries = [{"role":role,"artifact":ARTIFACTS[role],"manifest":pin(paths[role] / PRIMARY[role],PRIMARY[role]),
                  **inventories[role]} for role in ROLES]
              selected_paths = {"head":"output/HEAD","result":"output/result.json","checker":"checker-result.json",
                  "owner":"output/owner.json","source":"output/source.json","start":"output/start.json","fixed":"output/fixed/manifest.json"}
              selected = {key:pin(paths["continuation"] / name,name) for key,name in selected_paths.items()}
              selected.update({key:head[key] for key in ("completed_steps","rank","generation","kind","state_head",
                  "target_remainder_sha256","lambda_sha256")})
              selected["terminal"] = result["terminal"]
              acceptance = seal(WORD_SCHEMA,"acceptance",{"status":"PASS","parents":parent_entries,"selected":selected,
                  "consumer_sources":{"producer":pin(REPO / P_SOURCE,P_SOURCE),"checker":pin(REPO / D_SOURCE,D_SOURCE)},
                  "runtime":runtime(),**ASSURANCE})
              save("acceptance.json",acceptance)
              before_sources = [pin(REPO / name,name) for name in [*SOURCES,*RAW,WORKFLOW]]
              save("all-source-files-before.json",seal(SCHEMA,"source-files",{
                  "files":before_sources,"acceptance":pin(REPORT / "acceptance.json","acceptance.json"),
                  "driver":pin(REPORT / "driver.py","driver.py"),**FALSE_ASSURANCE}))
              for root in paths.values():
                  for path in root.rglob("*"):
                      path.chmod(0o555 if path.is_dir() else 0o444)
                  root.chmod(0o555)
              for name in [*SOURCES,*RAW,WORKFLOW]:
                  (REPO / name).chmod(0o444)
              for name in ("acceptance.json","parent-paths.json","driver.py","all-parent-files-before.json","all-source-files-before.json"):
                  (REPORT / name).chmod(0o444)
              save("admission-result.json",seal(SCHEMA,"admission-result",{
                  "status":"PASS","parents":16,"old_success_suites_rerun":0,"readonly_before_consumers":True,
                  "acceptance":pin(REPORT / "acceptance.json","acceptance.json"),
                  "source_receipt":pin(REPORT / "source-receipt.json","source-receipt.json"),
                  "continuation_intake":pin(REPORT / "continuation-intake.json","continuation-intake.json"),**FALSE_ASSURANCE}))

          SELFTEST_NAMES = {
              "P_SELFTEST":["ordered-word-same-root-mod54","target-history-positioned-readonly","raw-cycle-auxiliary-four-B",
                  "actual-start-header-count-type","actual-refinement-head-last-target"],
              "D_SELFTEST":["actual_nonunit_Act_inverse_typed_codec_endpoint_and_printed_order",
                  "same_root_EOF_mod54_and_resealed_Ref_word_key_mutations",
                  "actual_eleven_adapter_binary_JSONL_and_Linear_null_contracts"]}
          WORD_FILES = sorted(["source.json","owner.json","parent-roster.json","fresh-rho2.json","context.json",
              "literal-dictionary.json","target-history.json","ancestor-index.json","ordered-word.jsonl",
              "word-manifest.json","normalized-pair.json","manifest.json","result.json"])

          def execute(label):
              require(label in ("P_SELFTEST","D_SELFTEST","P","D"),"registered-invocation")
              require(sealed(REPORT / "admission-result.json")["status"] == "PASS","admitted-readonly-inputs")
              producer = label.startswith("P")
              source = P_SOURCE if producer else D_SOURCE
              argv = [sys.executable,"-B",str(REPO / source)]
              if label.endswith("SELFTEST"):
                  argv.append("--selftest")
              else:
                  require(sealed(REPORT / "new-canary-result.json")["status"] == "PASS","only-new-canaries-PASS")
                  paths = read(REPORT / "parent-paths.json")
                  for role in ROLES:
                      argv += ["--block-root" if role.startswith("block-") else "--" + role + "-root",paths[role]]
                  argv += ["--acceptance",str(REPORT / "acceptance.json")]
                  if producer:
                      argv += ["--output",str(REPORT / "word")]
                  else:
                      require(sealed(REPORT / "word-before-D.json")["status"] == "PASS","complete-word-before-D")
                      argv += ["--word-root",str(REPORT / "word"),"--output",str(REPORT / "D"),
                          "--producer-max-seconds",str(LIMITS["P"]["seconds"]),
                          "--producer-max-memory-mib",str(LIMITS["memory_mib"])]
              argv += ["--max-seconds",str(LIMITS[label]["seconds"]),"--max-memory-mib",str(LIMITS["memory_mib"])]
              save("executions/" + label + "-command.json",seal(SCHEMA,"execution-command",{
                  "label":label,"argv":argv,"source":pin(REPO / source,source),"launch":launch(),
                  "started_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "started_monotonic":time.monotonic(),"registered_limits":LIMITS[label],
                  "max_memory_mib":LIMITS["memory_mib"],**FALSE_ASSURANCE}))
              # Replace this process so the outer timeout reaches the consumer's own cooperative signal handler.
              os.execv(sys.executable,argv)

          def record_exit(label,code):
              require(label in LIMITS and label in ("P_SELFTEST","D_SELFTEST","P","D"),"registered-exit")
              command = sealed(REPORT / "executions" / (label + "-command.json"))
              save("executions/" + label + "-receipt.json",seal(SCHEMA,"execution-receipt",{
                  "label":label,"exit_code":code,"command_sha256":digest(REPORT / "executions" / (label + "-command.json")),
                  "started_utc":command["started_utc"],"finished_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "wall_seconds":round(time.monotonic() - command["started_monotonic"],6),
                  "stdout":pin(REPORT / (label + "-stdout.json"),label + "-stdout.json"),
                  "stderr":pin(REPORT / (label + ".log"),label + ".log"),**FALSE_ASSURANCE}))

          def check_canaries():
              rows = []
              for label in ("P_SELFTEST","D_SELFTEST"):
                  execution = sealed(REPORT / "executions" / (label + "-receipt.json"))
                  require(execution["exit_code"] == 0,"new-canary-exit-zero")
                  expected_schema = WORD_SCHEMA if label.startswith("P") else D_SCHEMA
                  value = sealed(REPORT / (label + "-stdout.json"),expected_schema + ".selftest")
                  require(value["status"] == "PASS" and [x["name"] for x in value["tests"]] == SELFTEST_NAMES[label] and
                      all(x["status"] == "PASS" for x in value["tests"]),"exact-new-canary-group-roster")
                  require(value["cross_checked"] is False and value["verified"] is False,"new-canary-assurance")
                  if label.startswith("P"):
                      require(value["old_success_suites_rerun"] == 0 and value["candidate"] is False and
                          all(x["rejected_cases"] for x in value["tests"]),"P-new-interface-fixtures-only")

                      refinement = value["tests"][4]
                      require(refinement["source_header_file"] == {"file":"output/HEAD","bytes":921,
                          "sha256":"6bf3b4fce6a3f159563c13a9aa50f6478827fbad1af13d820b70359b3b2f5cba"} and
                          refinement["source_last_manifest_sha256"] == "1bfd33af5054a11b8210781146a872e914acb1bd7214b0b945f7e3520b31200c" and
                          refinement["actual_target_remainder_sha256"] == "111d12e064b96a6bf579f39a9c9d5e35181560c0403bf0d237bffc924230c0ad" and
                          type(refinement["head_fields"]) is int and refinement["head_fields"] == 15 and
                          refinement["target_field_in_HEAD"] is False and
                          refinement["actual_parent_numerically_replayed"] is False and
                          refinement["same_production_helper"] == "validate_refinement_terminal",
                          "actual-refinement-metadata-production-contract")
                      require(refinement["rejected_cases"] == [
                          "HEAD-wrong-schema","HEAD-count-bool","HEAD-count-float","HEAD-wrong-count","HEAD-wrong-rank",
                          "HEAD-generation-float","HEAD-wrong-generation","HEAD-wrong-state","HEAD-wrong-last-manifest",
                          "HEAD-wrong-kind","HEAD-unexpected-current-scan","HEAD-forbidden-new-target-field",
                          "HEAD-other-owner_sha256","HEAD-other-producer_sha256","HEAD-other-source_sha256",
                          "HEAD-other-start_sha256","HEAD-other-canonical_index_sha256","HEAD-other-packet_manifest_sha256",
                          "HEAD-bad-inner-seal","replay-target-hash","replay-parent-target-hash","last-instruction-target-hash",
                          "last-result-target-hash","last-target-scalar-bool","last-instruction-scalar-bool",
                          "last-target-payload-hash","last-target-payload-size","last-instruction-file-hash",
                          "last-rolling-state","last-result-rank-float","last-step-count-bool"],
                          "actual-refinement-metadata-31-rejections")
                  else:
                      require(value["old_success_suites"] == 0 and value["actual_parent_artifact_replayed"] is False and
                          value["candidate"] is True,"D-new-interface-fixtures-only")
                  rows.append({"label":label,"result":pin(REPORT / (label + "-stdout.json"),label + "-stdout.json"),
                      "execution":pin(REPORT / "executions" / (label + "-receipt.json"),"executions/" + label + "-receipt.json"),
                      "tests":SELFTEST_NAMES[label]})
              save("new-canary-result.json",seal(SCHEMA,"new-canary-result",{
                  "status":"PASS","groups":rows,"old_success_suites_rerun":0,"limits":LIMITS,**FALSE_ASSURANCE}))

          def compare_manifest(root,manifest_name,extra,known=None):
              manifest = sealed(root / manifest_name)
              observed = known if known is not None else scan(root)
              records = manifest["files"]
              require(isinstance(records,list) and [x["file"] for x in records] == sorted(set(x["file"] for x in records)),
                  "unique-ordered-manifest-files")
              index = {row["file"]:row for row in observed["files"]}
              require(set(index) == {x["file"] for x in records} | set(extra) and
                  not ({x["file"] for x in records} & set(extra)),"exact-manifest-output-roster")
              for entry in records:
                  safe_name(entry["file"])
                  require(type(entry["bytes"]) is int and entry["bytes"] >= 0 and
                      index[entry["file"]] == {key:entry[key] for key in ("file","bytes","sha256")},"manifest-full-file-bytes")
              if "directories" in manifest:
                  require(manifest["directories"] == observed["directories"],"manifest-complete-directories")
              return manifest,observed

          def check_word():
              require(sealed(REPORT / "executions/P-receipt.json")["exit_code"] == 0,"P-single-successful-exit")
              root = REPORT / "word"
              require((REPORT / "P-stdout.json").read_bytes() == (root / "result.json").read_bytes(),"P-stdout-result-bytes")
              result = sealed(root / "result.json",WORD_SCHEMA + ".result")
              manifest,observed = compare_manifest(root,"manifest.json",["manifest.json","result.json"])
              require([x["file"] for x in observed["files"]] == WORD_FILES and observed["directories"] == [] and
                  manifest["file_roster"] == WORD_FILES and len(manifest["files"]) == 11,"complete-thirteen-word-files")
              word = sealed(root / "word-manifest.json",WORD_SCHEMA + ".word-manifest")
              target = sealed(root / "target-history.json",WORD_SCHEMA + ".target-history")
              pair = sealed(root / "normalized-pair.json",WORD_SCHEMA + ".normalized-pair")
              accepted = sealed(REPORT / "acceptance.json",WORD_SCHEMA + ".acceptance")
              require(result["status"] == "PASS" and result["terminal"] in ("NOT_APPLICABLE","POSITIVE_WORD_CANDIDATE") and
                  result["same_word_B_C"] is True and result["same_word_D"] is False and result["eleven_slot_replay"] is False,
                  "P-scope-without-premature-D")
              require(manifest["schema"] == WORD_SCHEMA + ".manifest" and manifest["all_inputs_unchanged"] is True and
                  result["manifest_sha256"] == digest(root / "manifest.json"),"P-top-manifest")
              for field,name in (("word_manifest_sha256","word-manifest.json"),("target_history_sha256","target-history.json"),
                      ("ancestor_index_sha256","ancestor-index.json"),("normalized_pair_sha256","normalized-pair.json"),
                      ("owner_sha256","owner.json"),("source_sha256","source.json"),("parent_roster_sha256","parent-roster.json"),
                      ("context_manifest_sha256","context.json")):
                  require(result[field] == digest(root / name),"P-output-receipt:" + field)
              require(result["accepted_head_sha256"] == accepted["selected"]["head"]["sha256"] and
                  result["accepted_checker_sha256"] == accepted["selected"]["checker"]["sha256"],"P-selected-HEAD")
              for key in ("completed_steps","rank","generation","state_head","target_remainder_sha256"):
                  require(result[key] == accepted["selected"][key],"P-current-snapshot:" + key)
              require(result["root_id"] == word["root_id"] == pair["same_root_id"] == manifest["root_id"] and
                  result["root_sha256"] == word["root_sha256"] == pair["same_root_sha256"] == manifest["root_sha256"],
                  "P-one-root-B-C-and-top")
              require(word["nodes_file"]["nodes"] == result["nodes"] and pair["word_manifest_sha256"] == digest(root / "word-manifest.json") and
                  pair["normalized_pair"] == result["normalized_pair"],"P-node-EOF-and-normalized-pair")
              require(result["resource_limits"] == {"max_seconds":5400,"max_memory_mib":7168} and
                  result["parent_inputs_unchanged"] is True and result["old_numerical_replays"] == 0 and result["eof"] is True,
                  "P-declared-ceilings-and-readonly-scope")
              for value in (result,word,target,manifest):
                  require(value["candidate"] is True and value["cross_checked"] is False and value["verified"] is False,"P-assurance")
              require(result["grade2_member"] == result["grade2_nonmember"] == "NOT_DECIDED" and result["full_A0"] is False and
                  result["side_conditions"] == "PENDING","P-no-grade2-verdict")
              save("word-before-D.json",seal(SCHEMA,"word-before-D",{
                  "status":"PASS",**observed,"result":pin(root / "result.json","result.json"),
                  "word_manifest_sha256":digest(root / "word-manifest.json"),"root_id":word["root_id"],
                  "root_sha256":word["root_sha256"],**FALSE_ASSURANCE}))

          def always_preserve():
              errors, parent_rows, acquired_rows, code_rows = [], [], [], []
              def attempt(name,action):
                  try:
                      return action()
                  except Exception as error:
                      errors.append({"check":name,"reason":type(error).__name__ + ":" + str(error)})
                      return None

              # Gather each existing extraction before reading a possibly missing before receipt.
              # These extraction inventories remain diagnostics; they cannot replace accepted roots.
              for role in ROLES:
                  base = PARENT_BASE / role
                  observed = attempt("acquired-after:" + role,lambda base=base: scan(base))
                  if observed is None:
                      continue
                  row = {"role":role,"artifact":ARTIFACTS[role],"extraction_root":str(base),**observed}
                  acquired_rows.append(row)
                  before = attempt("acquired-before:" + role,lambda role=role:
                      sealed(REPORT / "acquired-parents" / (role + ".json"),SCHEMA + ".acquired-parent-before"))
                  def acquired_match(role=role,base=base,observed=observed,before=before):
                      require(before is not None and before["role"] == role and before["artifact"] == ARTIFACTS[role] and
                          before["extraction_root"] == str(base) and
                          before["live_intake"] == pin(REPORT / "live-parents" / (role + "-intake.json"),
                              "live-parents/" + role + "-intake.json") and
                          before["files"] == observed["files"] and before["directories"] == observed["directories"],
                          "acquired-extraction-unchanged:" + role)
                      return True
                  row["unchanged_from_acquisition"] = attempt("acquired-compare:" + role,acquired_match) is True
              save("acquired-parent-files-after.json",seal(SCHEMA,"acquired-parent-after",{
                  "parents":acquired_rows,"count":len(acquired_rows),"expected_count":16,**FALSE_ASSURANCE}))

              paths = attempt("parent-paths",lambda: read(REPORT / "parent-paths.json"))
              if not isinstance(paths,dict):
                  paths = {}
              for role in ROLES:
                  def parent_scan(role=role):
                      path = Path(paths[role])
                      base = PARENT_BASE / role
                      require(not path.is_symlink() and
                          (path.resolve() == base.resolve() or base.resolve() in path.resolve().parents),
                          "recorded-parent-contained:" + role)
                      parent_rows.append({"role":role,**scan(path)})
                  attempt("parent-after:" + role,parent_scan)
              before = attempt("parent-before",lambda:
                  sealed(REPORT / "all-parent-files-before.json",SCHEMA + ".all-parent-files"))
              def parents_match():
                  require(set(paths) == set(ROLES) and before is not None and
                      before["count"] == len(parent_rows) == 16 and before["parents"] == parent_rows,
                      "sixteen-parents-unchanged")
                  return True
              parents_ok = attempt("parents",parents_match) is True
              save("all-parent-files-after.json",seal(SCHEMA,"all-parent-files",{
                  "parents":parent_rows,"count":len(parent_rows),**FALSE_ASSURANCE}))

              # Actual after pins survive absence of the final acceptance/before baseline.
              for name in [*SOURCES,*RAW,WORKFLOW]:
                  row = attempt("source-after:" + name,lambda name=name: pin(REPO / name,name))
                  if row is not None:
                      code_rows.append(row)
              driver_after = attempt("driver-after",lambda: pin(REPORT / "driver.py","driver.py"))
              acceptance_after = attempt("acceptance-after",lambda: pin(REPORT / "acceptance.json","acceptance.json"))
              early = attempt("source-before-admission",lambda:
                  sealed(REPORT / "source-files-before-admission.json",SCHEMA + ".source-files-before-admission"))
              def early_sources_match():
                  require(early is not None and code_rows == early["files"] and driver_after == early["driver"] and
                      early["source_receipt"] == pin(REPORT / "source-receipt.json","source-receipt.json"),
                      "acquired-source-raw-workflow-driver-unchanged")
                  return True
              acquired_sources_ok = attempt("acquired-sources",early_sources_match) is True
              before_source = attempt("source-before",lambda:
                  sealed(REPORT / "all-source-files-before.json",SCHEMA + ".source-files"))
              def sources_match():
                  require(before_source is not None and code_rows == before_source["files"] and
                      acceptance_after == before_source["acceptance"] and driver_after == before_source["driver"],
                      "all-source-raw-acceptance-driver-bytes-unchanged")
                  return True
              sources_ok = attempt("source-raw-acceptance-driver",sources_match) is True
              save("all-source-files-after.json",seal(SCHEMA,"source-files",{
                  "files":code_rows,"acceptance":acceptance_after,"driver":driver_after,
                  "acquired_sources_unchanged":acquired_sources_ok,**FALSE_ASSURANCE}))

              outputs, output_status = {}, {}
              word_ok = False
              for label in ("word","D"):
                  observed = attempt("output-" + label,lambda label=label: scan(REPORT / label))
                  output_status[label] = "OBSERVED" if observed is not None else "INCOMPLETE_OR_NOT_CREATED"
                  if observed is not None:
                      outputs[label] = observed
                  if label == "word" and observed is not None:
                      before_word = attempt("word-before-D",lambda: sealed(REPORT / "word-before-D.json"))
                      def word_match():
                          require(before_word is not None and observed["files"] == before_word["files"] and
                              observed["directories"] == before_word["directories"],"word-byte-roster-unchanged-by-D")
                          return True
                      word_ok = attempt("word-unchanged-by-D",word_match) is True
              save("output-inventories.json",seal(SCHEMA,"output-inventories",{
                  "outputs":outputs,"status_by_output":output_status,**FALSE_ASSURANCE}))
              original_errors = []
              for path in sorted(REPORT.glob("driver-*-failure.json")):
                  item = attempt("preserved-original-error:" + path.name,lambda path=path: pin(path,path.name))
                  if item is not None:
                      original_errors.append(item)
              save("preservation-result.json",seal(SCHEMA,"preservation-result",{
                  "status":"PASS" if not errors else "INCOMPLETE","errors":errors,"parent_count":len(parent_rows),
                  "acquired_parent_count":len(acquired_rows),"acquired_parent_inventory":
                      pin(REPORT / "acquired-parent-files-after.json","acquired-parent-files-after.json"),
                  "all_sixteen_parents_unchanged":parents_ok,
                  "source_raw_acceptance_driver_unchanged":sources_ok,"acquired_sources_unchanged":acquired_sources_ok,
                  "word_unchanged_by_D":word_ok,"original_driver_failures":original_errors,
                  "outputs":outputs,"status_by_output":output_status,**FALSE_ASSURANCE}))
              require(not errors,"always-preservation-incomplete")

          def descriptor(root,item,wanted_name):
              require(isinstance(item,dict) and item.get("file") == wanted_name and
                  pin(root / wanted_name,wanted_name) == {key:item[key] for key in ("file","bytes","sha256")},"D-exact-descriptor")
              return sealed(root / wanted_name)

          def finish():
              inventory_test = sealed(REPORT / "inventory-canary.json",SCHEMA + ".inventory-canary")
              require(inventory_test["status"] == "PASS" and inventory_test["group"] == "full-relative-POSIX-inventory-order" and
                  inventory_test["production_interfaces"] == ["scan","validate_inventory","retained_inventory"] and
                  inventory_test["retained_component_order_accepted"] is True and
                  inventory_test["retained_original_bytes_unchanged"] is True and
                  inventory_test["driver_sha256"] == digest(REPORT / "driver.py") and
                  inventory_test["max_seconds"] == 300 and type(inventory_test["elapsed_seconds"]) in (int,float) and
                  0 <= inventory_test["elapsed_seconds"] < 300 and inventory_test["rejected_cases"] ==
                      ["component-order-files","component-order-directories","reversed-directory-order","duplicate-file",
                       "duplicate-directory","wrong-file-size","wrong-file-hash","bool-file-size","extra-file-descriptor-key",
                       "non-POSIX-file-name","missing-observed-file","missing-observed-empty-directory",
                       "retained-duplicate-file","retained-duplicate-directory","retained-wrong-size","retained-wrong-hash",
                       "retained-missing-file","retained-missing-directory","retained-extra-field","retained-wrong-role"] and
                  inventory_test["mathematical_parent_artifact_replayed"] is False and
                  inventory_test["old_success_suites_rerun"] == 0 and inventory_test["candidate"] is False and
                  inventory_test["cross_checked"] is False and inventory_test["verified"] is False,
                  "production-inventory-metadata-canary-complete")
              require((REPORT / "inventory-canary-stdout.json").read_bytes() == (REPORT / "inventory-canary.json").read_bytes() and
                  (REPORT / "inventory-canary-exit-code.txt").read_text(encoding="ascii").strip() == "0",
                  "inventory-canary-output-and-exit")
              preserved = sealed(REPORT / "preservation-result.json")
              require(preserved["status"] == "PASS" and preserved["parent_count"] == 16 and
                  preserved["all_sixteen_parents_unchanged"] is True and preserved["source_raw_acceptance_driver_unchanged"] is True and
                  preserved["word_unchanged_by_D"] is True,"all-inputs-and-word-preserved")
              require(sealed(REPORT / "new-canary-result.json")["status"] == "PASS" and
                  all(sealed(REPORT / "executions" / (label + "-receipt.json"))["exit_code"] == 0 for label in ("P","D")),
                  "one-P-one-D-successful-exits")
              p_root,d_root = REPORT / "word",REPORT / "D"
              p = sealed(p_root / "result.json",WORD_SCHEMA + ".result")
              d = sealed(d_root / "checker-result.json",D_SCHEMA + ".checker-result")
              require((REPORT / "D-stdout.json").read_bytes() == (d_root / "checker-result.json").read_bytes(),"D-stdout-result-bytes")
              require(d["status"] == "PASS" and d["terminal"] == "SAME_WORD_CURRENT_GRADE_COMPARED","complete-D-current-grade-only")
              true_flags = ("complete_receipt","eof","all_thirteen_word_files_compared","all_ordered_node_bytes_and_EOF_compared",
                  "all_Ref_ordered_recipes_compared","same_root_normalized_pair_compared","all_eleven_endpoints_one",
                  "all_three_printed_direct_prefix_equalities","original_rho2_directly_read","all_inputs_unchanged")
              require(all(d[key] is True for key in true_flags),"D-whole-readout-flags")
              require(d["typed_slots"] == 11 and d["typed_E3_bytes"] == 40 and d["typed_E4_bytes"] == 154 and
                  d["full_filtered_coordinates_compared"] == 80644,"D-full-typed-and-filtered-universe")
              require(d["checker_sha256"] == SOURCES[D_SOURCE][1] and
                  d["word_manifest_sha256"] == p["word_manifest_sha256"] == digest(p_root / "word-manifest.json") and
                  d["producer_result_sha256"] == digest(p_root / "result.json") and
                  d["accepted_HEAD_sha256"] == p["accepted_head_sha256"],"D-sources-and-actual-P-bundle")
              require(d["same_root_id"] == p["root_id"] and d["same_root_sha256"] == p["root_sha256"] and
                  d["nodes"] == p["nodes"] and d["normalized_pair"] == p["normalized_pair"],"single-ordered-root-and-pair")
              accepted = sealed(REPORT / "acceptance.json")
              for key in ("completed_steps","rank","generation","kind","state_head","target_remainder_sha256"):
                  require(d[key] == accepted["selected"][key],"D-selected-current-state:" + key)
              require(d["residual_zero"] == p["residual_zero"],"P-D-positive-applicability")
              inputs = descriptor(d_root,d["inputs"],"input-comparison.json")
              require(inputs["word_files"] == preserved["outputs"]["word"]["files"],"D-all-thirteen-P-file-receipts")
              normalized = descriptor(d_root,d["normalized_receipt"],"normalized-pair.json")
              require(normalized["compared_producer_receipt_sha256"] == digest(p_root / "normalized-pair.json"),
                  "D-normalized-producer-file")
              recipe = d["recipe_bindings"]
              safe_name(recipe["file"])
              require(pin(d_root / recipe["file"],recipe["file"]) == {key:recipe[key] for key in ("file","bytes","sha256")},
                  "D-recipe-binding-file")
              manifest = descriptor(d_root,d["manifest"],"manifest.json")
              require(manifest["schema"] == D_SCHEMA + ".manifest" and manifest["eof"] is True and manifest["all_compared"] is True,
                  "D-complete-success-manifest")
              compare_manifest(d_root,"manifest.json",["manifest.json","checker-result.json"],preserved["outputs"]["D"])
              current = d["current_grade"]
              require(current["status"] == "PASS" and current["physical_lower_zero"] is True and
                  current["physical_lower_width"] == 32260 and current["physical_top_width"] == 48384 and
                  current["top_plus_current_target_equals_actual_original_rho2"] is True and
                  current["original_rho2_directly_read"] is True and current["all_eleven_typed_receipts_retained"] is True and
                  current["PB4_Fox_zero_required"] is False and current["full_P_zero_claimed"] is False,"D-registered-current-grade")
              for value in (d,manifest,current):
                  require(value["candidate"] is True and value["cross_checked"] is False and value["verified"] is False,"D-assurance")
              if not p["residual_zero"]:
                  require(p["positive_applicability"] == p["positive_readout"] == d["positive_readout"] == "NOT_APPLICABLE",
                      "nonzero-residual-keeps-positive-not-applicable")
              prior = sealed(REPORT / "continuation-intake.json")
              save("run-receipt.json",seal(SCHEMA,"run-receipt",{
                  "status":"PASS","current_launch":launch(),"original_producer_launch":prior["original_launch"],
                  "completion_launch":prior["completion_launch"],"saved_resume_launch":prior["resume_launch"],
                  "accepted_continuation_artifact":ARTIFACTS["continuation"],"all_parent_artifacts":ARTIFACTS,
                  "source_receipt":pin(REPORT / "source-receipt.json","source-receipt.json"),
                  "acceptance":pin(REPORT / "acceptance.json","acceptance.json"),
                  "admission":pin(REPORT / "admission-result.json","admission-result.json"),
                  "new_canaries":pin(REPORT / "new-canary-result.json","new-canary-result.json"),
                  "inventory_canary":pin(REPORT / "inventory-canary.json","inventory-canary.json"),
                  "repair_intake":pin(REPORT / "repair-intake.json","repair-intake.json"),
                  "original_start_header":pin(REPORT / "original-start-header.json","original-start-header.json"),
                  "source_before_admission":pin(REPORT / "source-files-before-admission.json","source-files-before-admission.json"),
                  "repair_provenance":REPAIR_PROVENANCE,
                  "preservation":pin(REPORT / "preservation-result.json","preservation-result.json"),
                  "producer_result":pin(p_root / "result.json","word/result.json"),
                  "checker_result":pin(d_root / "checker-result.json","D/checker-result.json"),
                  "word_manifest_sha256":p["word_manifest_sha256"],"ancestor_index_sha256":p["ancestor_index_sha256"],
                  "target_history_sha256":p["target_history_sha256"],"normalized_pair_sha256":p["normalized_pair_sha256"],
                  "root_id":p["root_id"],"root_sha256":p["root_sha256"],"nodes":p["nodes"],
                  "completed_steps":p["completed_steps"],"rank":p["rank"],"generation":p["generation"],"state_head":p["state_head"],
                  "target_remainder_sha256":p["target_remainder_sha256"],"residual_zero":p["residual_zero"],
                  "normalized_pair":p["normalized_pair"],"positive_applicability":p["positive_applicability"],
                  "D_terminal":d["terminal"],"positive_readout":d["positive_readout"],"current_grade":current,
                  "full_filtered_coordinates_compared":80644,"typed_slots":11,"same_root_P_D":True,
                  "original_rho2_manifest_sha256":RHO2_FILES["task640-payload/manifest.json"][1],
                  "producer_invocations":1,"checker_invocations":1,"old_numerical_replays":0,"old_success_suites_rerun":0,
                  "runtime":runtime(),"limits":LIMITS,"new_independence_of_retained_TCB_claimed":False,
                  "side_localization":"PENDING","workshop_cv9":"PENDING","grade2_member":"NOT_DECIDED",
                  "grade2_nonmember":"NOT_DECIDED","full_A0":False,"COMMON":False,"cofinal":False,"fake":False,"Ihara":False,
                  **ASSURANCE}))

          def main():
              REPORT.mkdir(parents=True,exist_ok=True)
              mode = sys.argv[1]
              try:
                  import resource
                  _,hard = resource.getrlimit(resource.RLIMIT_AS)
                  limit = LIMITS["memory_mib"] * (1 << 20)
                  require(hard == resource.RLIM_INFINITY or limit <= hard,"registered-memory-ceiling")
                  resource.setrlimit(resource.RLIMIT_AS,(limit,hard))
                  if mode == "sources":
                      sources()
                  elif mode == "inventory-canary":
                      inventory_canary()
                  elif mode == "live":
                      admit_live()
                  elif mode == "accept":
                      accept()
                  elif mode == "execute":
                      execute(sys.argv[2])
                  elif mode == "record":
                      record_exit(sys.argv[2],int(sys.argv[3]))
                  elif mode == "canaries":
                      check_canaries()
                  elif mode == "word":
                      check_word()
                  elif mode == "always":
                      always_preserve()
                  elif mode == "finish":
                      finish()
                  else:
                      raise ValueError("unknown-driver-mode")
              except Exception as error:
                  save("driver-" + mode + "-failure.json",seal(SCHEMA,"driver-failure",{
                      "status":"FAIL","phase":mode,"reason":type(error).__name__ + ":" + str(error),
                      "launch":launch(),"limits":LIMITS,**FALSE_ASSURANCE}))
                  raise

          if __name__ == "__main__":
              main()
          PY

      - name: Authenticate the frozen source closure and runtime
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word/driver.py" sources

      - name: Exercise the production relative path inventory boundary
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word"
          set +e
          timeout --signal=TERM --kill-after=10s 290s python -B "$report/driver.py" inventory-canary \
            > "$report/inventory-canary-stdout.json" 2> "$report/inventory-canary.log"
          result_code=$?
          set -e
          printf '%s\n' "$result_code" > "$report/inventory-canary-exit-code.txt"
          test "$result_code" = 0

      - name: Authenticate all sixteen live artifacts and exact ZIP bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B "$RUNNER_TEMP/positive-word/driver.py" live


      - name: Bind the actual saved64 lineage and readonly exact acceptance
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word/driver.py" accept

      - name: Run the five producer and three checker interface canary groups
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word"
          for label in P_SELFTEST D_SELFTEST; do
            set +e
            timeout --signal=TERM --kill-after=10s 350s python -B "$report/driver.py" execute "$label" \
              > "$report/$label-stdout.json" 2> "$report/$label.log"
            result_code=$?
            set -e
            printf '%s\n' "$result_code" > "$report/$label-exit-code.txt"
            python -B "$report/driver.py" record "$label" "$result_code"
            test "$result_code" = 0
          done
          python -B "$report/driver.py" canaries

      - name: Read one ordered target word and its same-root normalized pair
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word"
          set +e
          timeout --signal=TERM --kill-after=30s 5970s python -B "$report/driver.py" execute P \
            > "$report/P-stdout.json" 2> "$report/P.log"
          result_code=$?
          set -e
          printf '%s\n' "$result_code" > "$report/P-exit-code.txt"
          python -B "$report/driver.py" record P "$result_code"
          test "$result_code" = 0
          python -B "$report/driver.py" word

      - name: Replay the same word in all eleven typed slots and the full current grade
        timeout-minutes: 190
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word"
          set +e
          timeout --signal=TERM --kill-after=30s 11370s python -B "$report/driver.py" execute D \
            > "$report/D-stdout.json" 2> "$report/D.log"
          result_code=$?
          set -e
          printf '%s\n' "$result_code" > "$report/D-exit-code.txt"
          python -B "$report/driver.py" record D "$result_code"
          test "$result_code" = 0

      - name: Always record acquired inputs and require complete before and after preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word"
          if [ -f "$report/driver.py" ]; then
            python -B "$report/driver.py" always
          else
            printf '%s\n' 'INCOMPLETE: driver was not created' > "$report/preservation-incomplete.txt"
            exit 1
          fi

      - name: Join the complete same-root readout and preservation receipts
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word/driver.py" finish

      - name: Upload a candidate only after the full same-word current-grade comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-continuation-positive-word-readout-v4-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/positive-word/

      - name: Always preserve all word D output hidden tails receipts source and workflow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-continuation-positive-word-readout-v4-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/positive-word/
