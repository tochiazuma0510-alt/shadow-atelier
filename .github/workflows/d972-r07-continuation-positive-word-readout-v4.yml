                  current["head_sha"] == launch()["head"] and current["path"] == WORKFLOW and
                  current["repository"]["id"] == current["head_repository"]["id"] == REPOSITORY_ID, "current-firing-HEAD")
              rows, runs = [], {}
              for role,spec in ARTIFACTS.items():
                  run_id = spec["run"]
                  if run_id not in runs:
                      runs[run_id] = api("actions/runs/" + str(run_id),live / ("run-" + str(run_id) + ".json"))
                  run = runs[run_id]
                  require(run["id"] == run_id and run["run_attempt"] == spec["attempt"] and run["head_sha"] == spec["head"] and
                      run["path"] == spec["workflow"] and run["status"] == "completed" and run["conclusion"] == spec["conclusion"] and
                      run["repository"]["id"] == run["head_repository"]["id"] == REPOSITORY_ID,"live-parent-run:" + role)
