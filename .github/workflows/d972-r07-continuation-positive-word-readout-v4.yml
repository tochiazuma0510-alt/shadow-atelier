                      "all_ZIP_entries_checked":True})
                  save("live-parents/" + role + "-intake.json",seal(SCHEMA,"live-one",{
                      "status":"PASS",**rows[-1],**FALSE_ASSURANCE}))
                  save("acquired-parents/" + role + ".json",seal(SCHEMA,"acquired-parent-before",{
                      "role":role,"artifact":spec,"extraction_root":str(destination),
                      "live_intake":pin(REPORT / "live-parents" / (role + "-intake.json"),"live-parents/" + role + "-intake.json"),
                      **scan(destination),**FALSE_ASSURANCE}))
              save("live-parent-intake.json",seal(SCHEMA,"live-parent-intake",{
                  "status":"PASS","launch":launch(),"parents":rows,"count":16,"task554_accepted_failure":True,**FALSE_ASSURANCE}))


          def root_paths():
              intake = sealed(REPORT / "live-parent-intake.json",SCHEMA + ".live-parent-intake")
              require(intake["status"] == "PASS" and intake["count"] == 16,"complete-live-admission")
              extras = {
                  "state":["state/physical.bin","state/instructions.jsonl","output/result.json"],
                  "p1":["instructions.jsonl","degree2.cache.bin"],
                  "task712":["r07-grade2-maps-v4-receipt.json","r07-grade2-maps-v4-checker.json"],
                  "prepare":["prepare.HEAD"],
                  "continuation":["run-receipt.json","accepted-completion/completion-run-receipt.json","checker-result.json"],
                  "rho2":list(RHO2_FILES)}
              for index in range(4):
                  extras["block-" + str(index)] = ["block-" + str(index) + ".HEAD"]
              for role in ("delta","seed34","packet","refinement","oracle","e"):
                  extras[role] = ["checker-result.json","source-receipt.json"]
              paths = {}
              for entry in intake["parents"]:
                  role = entry["role"]
                  base = Path(entry["extraction_root"]).resolve()
                  needed = [PRIMARY[role], *extras.get(role,[])]
                  candidates = [root for root in [base,*sorted(p for p in base.rglob("*") if p.is_dir())]
                      if all((root / name).is_file() and not (root / name).is_symlink() for name in needed)]
                  require(len(candidates) == 1,"one-exact-payload-root:" + role)
                  paths[role] = candidates[0].resolve()
              require(set(paths) == set(ROLES),"all-sixteen-roots")
              for i,left in enumerate(paths.values()):
                  require(not left.is_symlink(),"root-not-symlink")
                  for right in list(paths.values())[i+1:]:
                      require(left != right and left not in right.parents and right not in left.parents,"disjoint-parent-roots")
                  for output in (REPORT / "word",REPORT / "D"):
                      require(left != output and left not in output.parents and output not in left.parents,"disjoint-consumer-outputs")
              return paths

