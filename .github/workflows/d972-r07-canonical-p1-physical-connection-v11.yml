jobs:
  connection:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[task895-physical-connection-v11]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - name: Install pinned numerical runtime
        run: python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.1"
      - name: Query and authenticate every artifact authority
        id: authorities
        env:
          GH_TOKEN: "${{ github.token }}"
          P1_RUN_ID: "${{ env.P1_RUN_ID_RESOLVED }}"
          P1_RUN_ATTEMPT: "${{ env.P1_RUN_ATTEMPT_RESOLVED }}"
          P1_HEAD: "${{ env.P1_HEAD_RESOLVED }}"
          P1_ARTIFACT_ID: "${{ env.P1_ARTIFACT_ID_RESOLVED }}"
          P1_ARTIFACT_NAME: "${{ env.P1_ARTIFACT_NAME_RESOLVED }}"
          P1_ARTIFACT_BYTES: "${{ env.P1_ARTIFACT_BYTES_RESOLVED }}"
          P1_ARTIFACT_DIGEST: "${{ env.P1_ARTIFACT_DIGEST_RESOLVED }}"
          RESUME_RUN_ID: "${{ env.RESUME_RUN_ID_RESOLVED }}"
          RESUME_RUN_ATTEMPT: "${{ env.RESUME_RUN_ATTEMPT_RESOLVED }}"
          RESUME_HEAD: "${{ env.RESUME_HEAD_RESOLVED }}"
          RESUME_ARTIFACT_ID: "${{ env.RESUME_ARTIFACT_ID_RESOLVED }}"
          RESUME_ARTIFACT_NAME: "${{ env.RESUME_ARTIFACT_NAME_RESOLVED }}"
          RESUME_ARTIFACT_BYTES: "${{ env.RESUME_ARTIFACT_BYTES_RESOLVED }}"
          RESUME_ARTIFACT_DIGEST: "${{ env.RESUME_ARTIFACT_DIGEST_RESOLVED }}"
        shell: bash
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          test "$P1_RUN_ID" = "$P1_FIXED_RUN_ID"; test "$P1_RUN_ATTEMPT" = "$P1_FIXED_RUN_ATTEMPT"; test "$P1_HEAD" = "$P1_FIXED_HEAD"
          test "$P1_ARTIFACT_ID" = "$P1_FIXED_ARTIFACT_ID"; test "$P1_ARTIFACT_NAME" = "$P1_FIXED_ARTIFACT_NAME"
          test "$P1_ARTIFACT_BYTES" = "$P1_FIXED_ARTIFACT_BYTES"; test "$P1_ARTIFACT_DIGEST" = "$P1_FIXED_ARTIFACT_DIGEST"
          digits() { [[ "$1" =~ ^[0-9]+$ ]] && [[ "$1" != 0* || "$1" == 0 ]]; }
          run_query() {
            local id="$1" attempt="$2" head="$3" expected_conclusion="$4" out="$5"
            digits "$id"; digits "$attempt"; [[ "$head" =~ ^[0-9a-f]{40}$ ]]
            gh api "repos/$repo/actions/runs/$id" > "$out"
            case "$expected_conclusion" in
              success|failure)
                jq -e --arg repo "$repo" --argjson id "$id" --argjson attempt "$attempt" --arg head "$head" --arg conclusion "$expected_conclusion" '(.id==$id and .repository.full_name==$repo and .run_attempt==$attempt and .head_sha==$head and .status=="completed" and .conclusion==$conclusion)' "$out" >/dev/null
                ;;
              ANY_COMPLETED)
                jq -e --arg repo "$repo" --argjson id "$id" --argjson attempt "$attempt" --arg head "$head" '(.id==$id and .repository.full_name==$repo and .run_attempt==$attempt and .head_sha==$head and .status=="completed")' "$out" >/dev/null
                ;;
              *)
                return 1
                ;;
            esac
          }
          artifact_query() {
            local id="$1" name="$2" bytes="$3" digest="$4" run="$5" head="$6" expires="$7" out="$8"
            digits "$id"; digits "$bytes"; [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            gh api "repos/$repo/actions/artifacts/$id" > "$out"
            if [[ -n "$expires" ]]; then
              jq -e --arg repo "$repo" --argjson id "$id" --arg name "$name" --argjson bytes "$bytes" --arg digest "$digest" --argjson run "$run" --arg head "$head" --arg expires "$expires" '(.id==$id and .name==$name and .size_in_bytes==$bytes and .digest==$digest and .expired==false and .expires_at==$expires and .workflow_run.id==$run and .workflow_run.head_sha==$head and .workflow_run.repository_id==1312092366 and .workflow_run.head_repository_id==1312092366)' "$out" >/dev/null
            else
              jq -e --arg repo "$repo" --argjson id "$id" --arg name "$name" --argjson bytes "$bytes" --arg digest "$digest" --argjson run "$run" --arg head "$head" '(.id==$id and .name==$name and .size_in_bytes==$bytes and .digest==$digest and .expired==false and (.expires_at|type)=="string" and (.expires_at|length)>0 and .workflow_run.id==$run and .workflow_run.head_sha==$head and .workflow_run.repository_id==1312092366 and .workflow_run.head_repository_id==1312092366)' "$out" >/dev/null
            fi
          }
          run_query "$SOURCE_RUN" "$SOURCE_ATTEMPT" "$SOURCE_HEAD" "failure" "$RUNNER_TEMP/task554-run.json"
          run_query "$CHECKER_RUN" "$CHECKER_ATTEMPT" "$CHECKER_HEAD" "success" "$RUNNER_TEMP/semantic-run.json"
          run_query "$TASK712_RUN" "$TASK712_ATTEMPT" "$TASK712_HEAD" "success" "$RUNNER_TEMP/task712-run.json"
          artifact_query "$PREP_ID" "$PREP_NAME" "$PREP_BYTES" "$PREP_DIGEST" "$SOURCE_RUN" "$SOURCE_HEAD" "$TASK554_EXPIRES" "$RUNNER_TEMP/task554-prepare.json"
          artifact_query "$B0_ID" "$B0_NAME" "$B0_BYTES" "$B0_DIGEST" "$SOURCE_RUN" "$SOURCE_HEAD" "$TASK554_EXPIRES" "$RUNNER_TEMP/task554-block-0.json"
          artifact_query "$B1_ID" "$B1_NAME" "$B1_BYTES" "$B1_DIGEST" "$SOURCE_RUN" "$SOURCE_HEAD" "$TASK554_EXPIRES" "$RUNNER_TEMP/task554-block-1.json"
          artifact_query "$B2_ID" "$B2_NAME" "$B2_BYTES" "$B2_DIGEST" "$SOURCE_RUN" "$SOURCE_HEAD" "$TASK554_EXPIRES" "$RUNNER_TEMP/task554-block-2.json"
          artifact_query "$B3_ID" "$B3_NAME" "$B3_BYTES" "$B3_DIGEST" "$SOURCE_RUN" "$SOURCE_HEAD" "$TASK554_EXPIRES" "$RUNNER_TEMP/task554-block-3.json"
          artifact_query "$CHECKER_ID" "$CHECKER_NAME" "$SEMANTIC_ARTIFACT_BYTES" "$CHECKER_DIGEST" "$CHECKER_RUN" "$CHECKER_HEAD" "$CHECKER_EXPIRES" "$RUNNER_TEMP/semantic-artifact.json"
          artifact_query "$TASK712_ID" "$TASK712_NAME" "$TASK712_BYTES" "$TASK712_DIGEST" "$TASK712_RUN" "$TASK712_HEAD" "$TASK712_EXPIRES" "$RUNNER_TEMP/task712-artifact.json"
          run_query "$P1_RUN_ID" "$P1_RUN_ATTEMPT" "$P1_HEAD" "success" "$RUNNER_TEMP/p1-run.json"
          artifact_query "$P1_ARTIFACT_ID" "$P1_ARTIFACT_NAME" "$P1_ARTIFACT_BYTES" "$P1_ARTIFACT_DIGEST" "$P1_RUN_ID" "$P1_HEAD" "" "$RUNNER_TEMP/p1-artifact.json"
          resume_fields=("$RESUME_RUN_ID" "$RESUME_RUN_ATTEMPT" "$RESUME_HEAD" "$RESUME_ARTIFACT_ID" "$RESUME_ARTIFACT_NAME" "$RESUME_ARTIFACT_BYTES" "$RESUME_ARTIFACT_DIGEST")
          if [[ -n "$RESUME_RUN_ID" ]]; then
            for field in "${resume_fields[@]}"; do test -n "$field"; done
            run_query "$RESUME_RUN_ID" "$RESUME_RUN_ATTEMPT" "$RESUME_HEAD" "ANY_COMPLETED" "$RUNNER_TEMP/resume-run.json"
            artifact_query "$RESUME_ARTIFACT_ID" "$RESUME_ARTIFACT_NAME" "$RESUME_ARTIFACT_BYTES" "$RESUME_ARTIFACT_DIGEST" "$RESUME_RUN_ID" "$RESUME_HEAD" "" "$RUNNER_TEMP/resume-artifact.json"
          else
            for field in "${resume_fields[@]}"; do test -z "$field"; done
          fi
      - name: Download authenticated P1, parents, semantic receipts, and Task712 tables
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.P1_ARTIFACT_NAME_RESOLVED }}
          path: ${{ runner.temp }}/p1
          github-token: ${{ github.token }}
          run-id: ${{ env.P1_RUN_ID_RESOLVED }}
      - uses: actions/download-artifact@v4
        with:
          name: task554-grade1-v3-prepare-33677346616-1
          path: ${{ runner.temp }}/prepare
          github-token: ${{ github.token }}
          run-id: "33677346616"
      - uses: actions/download-artifact@v4
        with:
          name: task554-grade1-v3-state-block-0-33677346616-1
          path: ${{ runner.temp }}/block-0
          github-token: ${{ github.token }}
          run-id: "33677346616"
      - uses: actions/download-artifact@v4
        with:
          name: task554-grade1-v3-state-block-1-33677346616-1
          path: ${{ runner.temp }}/block-1
          github-token: ${{ github.token }}
          run-id: "33677346616"
      - uses: actions/download-artifact@v4
        with:
          name: task554-grade1-v3-state-block-2-33677346616-1
          path: ${{ runner.temp }}/block-2
          github-token: ${{ github.token }}
          run-id: "33677346616"
      - uses: actions/download-artifact@v4
        with:
          name: task554-grade1-v3-state-block-3-33677346616-1
          path: ${{ runner.temp }}/block-3
          github-token: ${{ github.token }}
          run-id: "33677346616"
      - uses: actions/download-artifact@v4
        with:
          name: task757-p1-semantic-checker-only-v3-success-33819301663-1
          path: ${{ runner.temp }}/semantic
          github-token: ${{ github.token }}
          run-id: "33819301663"
      - uses: actions/download-artifact@v4
        with:
          name: d972-r07-grade2-maps-v4-33814194630-1
          path: ${{ runner.temp }}/task712
          github-token: ${{ github.token }}
          run-id: "33814194630"
      - name: Authenticate immutable source bytes and line endings
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          expected = {
              "search/d972_r07_canonical_p1_dag_degree2_lift_v10.py": (os.environ["P1_V10_SHA"], int(os.environ["P1_V10_BYTES"]), int(os.environ["P1_V10_LF"])),
              "search/d972_r07_a0_first_rung_grade1_v4.py": (os.environ["G1_SHA"], int(os.environ["G1_BYTES"]), int(os.environ["G1_LF"])),
              "search/d972_r07_a0_first_rung_grade2_prebuild_v1.py": (os.environ["P2_SHA"], int(os.environ["P2_BYTES"]), int(os.environ["P2_LF"])),
              "search/d972_r07_grade2_p1_componentwise_semantic_replay_v5.py": (os.environ["SEM_SHA"], int(os.environ["SEM_BYTES"]), int(os.environ["SEM_LF"])),
              "search/d972_r07_grade2_specific_owner_prejoin_v1.py": (os.environ["STRUCT_SHA"], int(os.environ["STRUCT_BYTES"]), int(os.environ["STRUCT_LF"])),
              "search/d972_r07_a0_c2fourier_joint_floor_v1.py": (os.environ["FLOOR_SHA"], int(os.environ["FLOOR_BYTES"]), int(os.environ["FLOOR_LF"])),
              "scratchpad/a0_paper_words_v1.json": (os.environ["WORDS_SHA"], int(os.environ["WORDS_BYTES"]), int(os.environ["WORDS_LF"])),
              "search/d972_r07_grade2_forward_adjoint_maps_v3.py": (os.environ["TASK712_V3_SHA"], int(os.environ["TASK712_V3_BYTES"]), int(os.environ["TASK712_V3_LF"])),
              "search/d972_r07_canonical_p1_physical_connection_v6.py": (os.environ["PRODUCER_SHA"], int(os.environ["PRODUCER_BYTES"]), int(os.environ["PRODUCER_LF"])),
              "search/check_d972_r07_canonical_p1_physical_connection_v7.py": (os.environ["CHECKER_SHA"], int(os.environ["CHECKER_BYTES"]), int(os.environ["CHECKER_LF"])),
          }
          for relative, (wanted, size, lines) in expected.items():
              data = Path(relative).read_bytes()
              assert len(data) == size and hashlib.sha256(data).hexdigest() == wanted
              assert data.count(b"\n") == lines and b"\r" not in data and not data.startswith(b"\xef\xbb\xbf")
          PY
      - name: Prepare canonical launch and fresh/resume boundary
        shell: bash
        env:
          P1_RUN_ID: "${{ env.P1_RUN_ID_RESOLVED }}"
          P1_ARTIFACT_ID: "${{ env.P1_ARTIFACT_ID_RESOLVED }}"
          P1_ARTIFACT_NAME: "${{ env.P1_ARTIFACT_NAME_RESOLVED }}"
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/launch.json" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          repo = os.environ["GITHUB_REPOSITORY"]
          def load(name): return json.loads(Path(os.environ["RUNNER_TEMP"], name).read_text("ascii"))
          def fixed(role, run, attempt, head, artifact):
