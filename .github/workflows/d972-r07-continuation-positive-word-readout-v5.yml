          def safe_extract(archive,destination):
              destination.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  seen = set()
                  require(bundle.infolist(), "nonempty-parent-archive")
                  for entry in bundle.infolist():
                      raw_name = entry.filename
                      name = raw_name[:-1] if entry.is_dir() else raw_name
                      safe_name(name)
                      require(name not in seen and raw_name == name + ("/" if entry.is_dir() else ""), "duplicate-or-noncanonical-ZIP")
                      seen.add(name)
                      mode = (entry.external_attr >> 16) & 0xffff
                      kind = stat.S_IFMT(mode)
                      require(kind in (0,stat.S_IFDIR,stat.S_IFREG) and not stat.S_ISLNK(mode) and not entry.flag_bits & 1,
                          "ZIP-type-or-encryption")
                      require((not entry.is_dir() or kind in (0,stat.S_IFDIR)) and
                          not (kind == stat.S_IFDIR and not entry.is_dir()), "ZIP-directory-type")
                      target = destination.joinpath(*PurePosixPath(name).parts)
                      require(destination.resolve() in target.resolve().parents, "ZIP-contained-path")
                      if entry.is_dir():
                          target.mkdir(parents=True,exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True,exist_ok=True)
                          with bundle.open(entry) as source, target.open("xb") as output:
                              shutil.copyfileobj(source,output,1 << 20)
                          require(target.stat().st_size == entry.file_size,"ZIP-entry-EOF")

