                  require(middle["status"] == "PASS" and middle["boundary"] == boundary,"source-all-middle-boundaries")
              p_root,d_root = REPORT / "word",REPORT / "D"
              p = sealed(p_root / "result.json",WORD_SCHEMA + ".result")
