                  "completion_launch":prior["completion_launch"],"saved_resume_launch":prior["resume_launch"],
                  "accepted_continuation_artifact":ARTIFACTS["continuation"],"all_parent_artifacts":ARTIFACTS,
                  "source_receipt":pin(REPORT / "source-receipt.json","source-receipt.json"),
                  "acceptance":pin(REPORT / "acceptance.json","acceptance.json"),
                  "admission":pin(REPORT / "admission-result.json","admission-result.json"),
                  "new_canaries":pin(REPORT / "new-canary-result.json","new-canary-result.json"),
                  "resource_layout_canary":pin(REPORT / "resource-layout-canary.json","resource-layout-canary.json"),
                  "resource_public_type_canary":pin(REPORT / "resource-public-type-canary.json","resource-public-type-canary.json"),
                  "resource_layout":pin(REPORT / "resource-layout.json","resource-layout.json"),
                  "P_resource_receipt":pin(REPORT / "P-resource-receipt.json","P-resource-receipt.json"),
                  "D_resource_receipt":pin(REPORT / "D-resource-receipt.json","D-resource-receipt.json"),
                  "resource_output_inventory":pin(REPORT / "resource-output-inventories.json","resource-output-inventories.json"),
                  "whole_report_after":pin(REPORT / "report-after-inventory.json","report-after-inventory.json"),
                  "resource_limits":RESOURCE_LIMITS,"source_python_files":6,"raw_input_files":4,
                  "new_resource_selftest_groups":6,"new_metadata_inventory_rejections":20,
                  "inventory_cases_rerun_from_v4":20,"old_mathematical_success_suites_rerun":0,
                  "new_resource_path_rejections":12,"new_resource_public_type_rejections":8,
                  "selftest_results_are_not_actual_word_candidates":True,"scratch_resume":False,
                  "inventory_canary":pin(REPORT / "inventory-canary.json","inventory-canary.json"),
                  "repair_intake":pin(REPORT / "repair-intake.json","repair-intake.json"),
                  "original_start_header":pin(REPORT / "original-start-header.json","original-start-header.json"),
                  "source_before_admission":pin(REPORT / "source-files-before-admission.json","source-files-before-admission.json"),
                  "repair_provenance":REPAIR_PROVENANCE,
                  "preservation":pin(REPORT / "preservation-result.json","preservation-result.json"),
                  "producer_result":pin(p_root / "result.json","word/result.json"),
                  "checker_result":pin(d_root / "checker-result.json","D/checker-result.json"),
                  "word_manifest_sha256":p["word_manifest_sha256"],"ancestor_index_sha256":p["ancestor_index_sha256"],
                  "target_history_sha256":p["target_history_sha256"],"normalized_pair_sha256":p["normalized_pair_sha256"],
                  "root_id":p["root_id"],"root_sha256":p["root_sha256"],"nodes":p["nodes"],
                  "completed_steps":p["completed_steps"],"rank":p["rank"],"generation":p["generation"],"state_head":p["state_head"],
                  "target_remainder_sha256":p["target_remainder_sha256"],"residual_zero":p["residual_zero"],
                  "normalized_pair":p["normalized_pair"],"positive_applicability":p["positive_applicability"],
                  "D_terminal":d["terminal"],"positive_readout":d["positive_readout"],"current_grade":current,
                  "full_filtered_coordinates_compared":80644,"typed_slots":11,"same_root_P_D":True,
                  "original_rho2_manifest_sha256":RHO2_FILES["task640-payload/manifest.json"][1],
                  "producer_invocations":1,"checker_invocations":1,"old_numerical_replays":0,"old_success_suites_rerun":0,
                  "runtime":runtime(),"limits":LIMITS,"new_independence_of_retained_TCB_claimed":False,
                  "side_localization":"PENDING","workshop_cv9":"PENDING","grade2_member":"NOT_DECIDED",
                  "grade2_nonmember":"NOT_DECIDED","full_A0":False,"COMMON":False,"cofinal":False,"fake":False,"Ihara":False,
                  **ASSURANCE}))
              save("report-final-inventory.json",seal(SCHEMA,"report-inventory",{
                  "boundary":"after-successful-run-receipt-before-artifact-upload","inventory":scan(REPORT),
                  "only_this_inventory_file_is_added_after_its_scan":True,**FALSE_ASSURANCE}))

          def main():
              REPORT.mkdir(parents=True,exist_ok=True)
              mode = sys.argv[1]
              try:
                  import resource
                  _,hard = resource.getrlimit(resource.RLIMIT_AS)
                  limit = LIMITS["memory_mib"] * (1 << 20)
                  require(hard == resource.RLIM_INFINITY or limit <= hard,"registered-memory-ceiling")
                  resource.setrlimit(resource.RLIMIT_AS,(limit,hard))
                  if mode == "sources":
                      sources()
                  elif mode == "inventory-canary":
                      inventory_canary()
                  elif mode == "live":
                      admit_live()
                  elif mode == "accept":
                      accept()
                  elif mode == "resources":
                      prepare_resources()
                  elif mode == "execute":
                      execute(sys.argv[2])
                  elif mode == "record":
                      record_exit(sys.argv[2],int(sys.argv[3]))
                  elif mode == "canaries":
                      check_canaries()
                  elif mode == "word":
                      check_word()
                  elif mode == "resource-D":
                      resource_D()
                  elif mode == "always":
                      always_preserve()
                  elif mode == "finish":
                      finish()
                  else:
                      raise ValueError("unknown-driver-mode")
              except Exception as error:
                  save("driver-" + mode + "-failure.json",seal(SCHEMA,"driver-failure",{
                      "status":"FAIL","phase":mode,"reason":type(error).__name__ + ":" + str(error),
                      "launch":launch(),"limits":LIMITS,**FALSE_ASSURANCE}))
                  raise

          if __name__ == "__main__":
              main()
          PY

      - name: Authenticate the frozen source closure and runtime
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word-resource-v5/driver.py" sources

      - name: Exercise the production relative path inventory boundary
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word-resource-v5"
          set +e
          timeout --signal=TERM --kill-after=10s 290s python -B "$report/driver.py" inventory-canary \
            > "$report/inventory-canary-stdout.json" 2> "$report/inventory-canary.log"
          result_code=$?
          set -e
          printf '%s\n' "$result_code" > "$report/inventory-canary-exit-code.txt"
          test "$result_code" = 0

      - name: Authenticate all sixteen live artifacts and exact ZIP bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B "$RUNNER_TEMP/positive-word-resource-v5/driver.py" live


      - name: Bind the actual saved64 lineage and readonly exact acceptance
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word-resource-v5/driver.py" accept

      - name: Admit four fresh scratch paths and exercise the resource envelope boundary
        timeout-minutes: 5
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word-resource-v5/driver.py" resources

      - name: Run three new resource groups per side with separate small old anchors
        timeout-minutes: 14
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word-resource-v5"
          for label in P_SELFTEST D_SELFTEST; do
            set +e
            timeout --signal=TERM --kill-after=10s 350s python -B "$report/driver.py" execute "$label" \
              > "$report/$label-stdout.json" 2> "$report/$label.log"
            result_code=$?
            set -e
            printf '%s\n' "$result_code" > "$report/$label-exit-code.txt"
            python -B "$report/driver.py" record "$label" "$result_code"
            test "$result_code" = 0
          done
          python -B "$report/driver.py" canaries

      - name: Read one ordered target word and its same-root normalized pair
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word-resource-v5"
          set +e
          timeout --signal=TERM --kill-after=30s 5970s python -B "$report/driver.py" execute P \
            > "$report/P-stdout.json" 2> "$report/P.log"
          result_code=$?
          set -e
          printf '%s\n' "$result_code" > "$report/P-exit-code.txt"
          python -B "$report/driver.py" record P "$result_code"
          test "$result_code" = 0
          python -B "$report/driver.py" word

      - name: Replay the same word in all eleven typed slots and the full current grade
        timeout-minutes: 190
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word-resource-v5"
          set +e
          timeout --signal=TERM --kill-after=30s 11370s python -B "$report/driver.py" execute D \
            > "$report/D-stdout.json" 2> "$report/D.log"
          result_code=$?
          set -e
          printf '%s\n' "$result_code" > "$report/D-exit-code.txt"
          python -B "$report/driver.py" record D "$result_code"
          test "$result_code" = 0
          python -B "$report/driver.py" resource-D

      - name: Always record acquired inputs and require complete before and after preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/positive-word-resource-v5"
          if [ -f "$report/driver.py" ]; then
            python -B "$report/driver.py" always
          else
            printf '%s\n' 'INCOMPLETE: driver was not created' > "$report/preservation-incomplete.txt"
            exit 1
          fi

      - name: Join the complete same-root readout and preservation receipts
        shell: bash
        run: python -B "$RUNNER_TEMP/positive-word-resource-v5/driver.py" finish

      - name: Upload a candidate only after the full same-word current-grade comparison
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-continuation-positive-word-readout-v5-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/positive-word-resource-v5/

      - name: Always preserve all partial word D output scratch fixtures telemetry hidden tails and source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-continuation-positive-word-readout-v5-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ runner.temp }}/positive-word-resource-v5/
