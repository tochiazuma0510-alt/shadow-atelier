                  require(d[key] == accepted["selected"][key],"D-selected-current-state:" + key)
              require(d["residual_zero"] == p["residual_zero"],"P-D-positive-applicability")
              inputs = descriptor(d_root,d["inputs"],"input-comparison.json")
              require(inputs["word_files"] == preserved["outputs"]["word"]["files"],"D-all-thirteen-P-file-receipts")
              normalized = descriptor(d_root,d["normalized_receipt"],"normalized-pair.json")
              require(normalized["compared_producer_receipt_sha256"] == digest(p_root / "normalized-pair.json"),
                  "D-normalized-producer-file")
              recipe = d["recipe_bindings"]
              safe_name(recipe["file"])
              require(pin(d_root / recipe["file"],recipe["file"]) == {key:recipe[key] for key in ("file","bytes","sha256")},
