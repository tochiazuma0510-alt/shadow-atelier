              bad = mutated()
              bad["directories"] = sorted(bad["directories"],key=Path)
              require(bad["directories"] != observed["directories"],"fixture-distinguishes-directory-component-order")
              reject("component-order-directories",bad)
              bad = mutated()
              bad["directories"].reverse()
              reject("reversed-directory-order",bad)
              bad = mutated()
              bad["files"].insert(1,dict(bad["files"][0]))
              reject("duplicate-file",bad)
              bad = mutated()
              bad["directories"].insert(1,bad["directories"][0])
              reject("duplicate-directory",bad)
              bad = mutated()
              bad["files"][0]["bytes"] += 1
              reject("wrong-file-size",bad)
              bad = mutated()
              bad["files"][0]["sha256"] = "0" * 64
              reject("wrong-file-hash",bad)
              bad = mutated()
              bad["files"][0]["bytes"] = True
              reject("bool-file-size",bad)
              bad = mutated()
              bad["files"][0]["extra"] = 0
              reject("extra-file-descriptor-key",bad)
              bad = mutated()
