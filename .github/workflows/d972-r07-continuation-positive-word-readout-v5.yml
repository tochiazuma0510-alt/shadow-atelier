              for key,name in (("owner_sha256","output/owner.json"),("source_sha256","output/source.json"),
                              ("start_sha256","output/start.json"),("fixed_manifest_sha256","output/fixed/manifest.json")):
                  require(head[key] == result[key] == checked[key] == digest(root / name),"saved-current-parent:" + key)
              require(checked["head_sha256"] == result["head_sha256"] == run["head_sha256"] == digest(root / "output/HEAD") and
                  checked["result_sha256"] == run["producer_result_sha256"] == digest(root / "output/result.json") and
                  run["checker_result_sha256"] == digest(root / "checker-result.json"),"saved-HEAD-result-checker-files")
              validate_original_start_header(start)
              for key in ("all_new_committed_arrays_and_json_compared","current_checkpoint_fully_compared",
                          "full_four_character_scope","ordinary27_actual_source","all_four_B_summed_each_E"):
                  require(checked[key] is True,"whole-prefix-arithmetic-scope:" + key)
              for key,wanted in (("section_equalities_each",8059),("chords_each",54433),("auxiliary_tests_each",2),
                      ("source_lower_trits_each_E",96776),("literal_modulus",54),("external_e_attached",1),
                      ("old_scans_numerically_replayed",0),("old_inserts_numerically_replayed",0),("old_success_suites",0)):
                  require(type(checked[key]) is int and checked[key] == wanted,"whole-prefix-scope:" + key)
              for key in ("actual_resume","all_past32_step_and_snapshot_receipts_match","old_prefix_unchanged",
                          "all_readonly_parents_unchanged","all_sources_unchanged","output_unchanged_by_checker"):
                  require(run[key] is True,"accepted-resume-preservation:" + key)
              require(run["before_completed_steps"] == run["new_appends_this_run"] == 32 and
                  run["producer_invocations_this_run"] == run["checker_invocations_this_run"] == 1 and
                  run["old_success_suites_rerun"] == 0,"one-real-saved-resume")
              for value in (checked,result,run,completion):
                  require(value["cross_checked"] is False and value["verified"] is False and
                      value["grade2_member"] == value["grade2_nonmember"] == "NOT_DECIDED" and value["full_A0"] is False,
                      "retained-assurance-boundary")
              for field,name in (("accepted_completion_run_receipt_sha256","accepted-completion/completion-run-receipt.json"),
                      ("accepted_completion_checker_result_sha256","accepted-completion/checker-result.json"),
                      ("original_source_receipt_sha256","source-receipt.json"),
                      ("repair_source_receipt_sha256","accepted-completion/repair-source-receipt.json"),
                      ("resume_source_receipt_sha256","resume-source-receipt.json"),
                      ("completion_intake_receipt_sha256","completion-intake-receipt.json"),
                      ("copy_before_resume_sha256","copy-before-resume.json"),
                      ("producer_output_before_checker_sha256","producer-output-before-checker.json"),
                      ("preservation_result_sha256","preservation-result.json"),
                      ("all_parent_files_before_sha256","all-parent-files-before.json"),
                      ("all_parent_files_after_sha256","all-parent-files-after.json")):
                  require(run[field] == digest(root / name),"resume-provenance-file:" + field)
              preserved = read(root / "preservation-result.json",True)
              before_checker = read(root / "producer-output-before-checker.json",True)
              output = scan(root / "output")
              require(preserved["status"] == before_checker["status"] == "PASS" and preserved["errors"] == [] and
                  output["files"] == preserved["files"] == before_checker["files"] and
                  output["directories"] == preserved["directories"] == before_checker["directories"],
                  "entire-saved-output-preserved-after-C")
              require(len(output["files"]) == run["output_files"] and len(output["directories"]) == run["output_directories"] and
                  sum(row["bytes"] for row in output["files"]) == run["output_bytes"] == preserved["output_bytes"],"saved-output-EOF")
              require(len(checked["steps"]) == len(checked["snapshots"]) == 64,"saved-C-receipt-cardinality")
              phases = ("section","cochain","tree","raw","source","primal","p1","B","physical")
              for index,(snapshot,step) in enumerate(zip(checked["snapshots"],checked["steps"],strict=True)):
                  base = root / "output/snapshots" / f"{index:06d}"
                  require(snapshot["step"] == index and step["step"] == index + 1 and
                      snapshot["snapshot_sha256"] == digest(base / "start.json") and
                      snapshot["oracle_manifest_sha256"] == digest(base / "oracle-manifest.json") and
                      step["manifest_sha256"] == digest(root / "output/steps" / f"{index + 1:06d}" / "manifest.json"),
                      "saved-C-complete-snapshot-files")
                  require(set(snapshot["phase_manifests"]) == set(phases),"all-nine-saved-phases")
                  for phase in phases:
                      folder = base / phase if phase in phases[:3] else base / "e" / phase
                      require(snapshot["phase_manifests"][phase] == digest(folder / "manifest.json"),"saved-phase-file-hash")
              old_parents = read(root / "all-parent-files-before.json",True)
              require(old_parents == read(root / "all-parent-files-after.json",True) and old_parents["count"] == 15,
                  "accepted-resume-all-parents-unchanged")
              aliases = {role:("BLOCK_" + role[-1] + "_ROOT" if role.startswith("block-") else
                  {"state":"STATE_ROOT","delta":"DELTA_ROOT","seed34":"SEED34_ROOT","packet":"PACKET_ROOT",
                   "refinement":"REFINEMENT_ROOT","oracle":"ORACLE_ROOT","e":"E_ROOT","prepare":"PREPARE_ROOT",
                   "p1":"P1_ROOT","task712":"TASK712_ROOT"}[role]) for role in ROLES[:14]}
              expected_old_roles = {*aliases.values(),"COMPLETION_ROOT"}
              require(isinstance(old_parents["parents"],list) and len(old_parents["parents"]) == 15 and
                  all(isinstance(item,dict) and isinstance(item.get("role"),str) for item in old_parents["parents"]) and
                  len({item["role"] for item in old_parents["parents"]}) == 15 and
                  {item["role"] for item in old_parents["parents"]} == expected_old_roles,"retained-exact-unique-fifteen-roles")
              previous_by_role = {item["role"]:item for item in old_parents["parents"]}
              for role,alias in aliases.items():
                  require(retained_inventory(previous_by_role[alias],alias,inventories[role]) == inventories[role],
                      "same-fourteen-retained-parent-bodies")
              prior_inventory = scan(prior)
              require(retained_inventory(previous_by_role["COMPLETION_ROOT"],"COMPLETION_ROOT",prior_inventory) ==
                  prior_inventory,"saved-completion-root-unchanged")
              prior_tests = []
              for entry in run["prior_tests_authenticated_without_rerun"]:
                  path = prior / safe_name(entry["file"])
                  require(digest(path) == entry["sha256"] and read(path)["status"] == "PASS" and entry["rerun"] is False,
                      "retained-old-test-receipt-only")
                  prior_tests.append(entry)
              # Archive provenance, not another copy of all old numerical payloads.
              for folder,label in ((root,"resume64"),(prior,"completion32")):
                  for path in sorted(folder.iterdir()):
                      if path.is_file() and path.suffix in (".json",".py",".yml",".txt",".log"):
                          target = REPORT / "retained-parent-receipts" / label / path.name
                          target.parent.mkdir(parents=True,exist_ok=True)
                          shutil.copyfile(path,target)
              save("continuation-intake.json",seal(SCHEMA,"continuation-intake",{
                  "status":"PASS","artifact":ARTIFACTS["continuation"],"original_launch":run["original_launch"],
                  "completion_launch":run["completion_launch"],"resume_launch":run["current_launch"],"new_launch":launch(),
                  "producer_sha256":LOOP_PRODUCER,"checker_sha256":LOOP_CHECKER,
                  "completion_entry_files":[{"file":name,**value} for name,value in sorted(COMPLETION_ENTRIES.items())],
                  "continuation_entry_files":[{"file":name,**value} for name,value in sorted(CONTINUATION_ENTRIES.items())],
                  "observed_head":head,"terminal":result["terminal"],"output":output,
                  "old_success_suites_rerun":0,"prior_tests_authenticated_without_rerun":prior_tests,**FALSE_ASSURANCE}))
              return head,result,checked

          def accept():
              paths = root_paths()
              inventories = {role:scan(paths[role]) for role in ROLES}
              save("parent-paths.json",{role:str(path) for role,path in paths.items()})
              save("all-parent-files-before.json",seal(SCHEMA,"all-parent-files",{
                  "parents":[{"role":role,**inventories[role]} for role in ROLES],"count":16,**FALSE_ASSURANCE}))
              head,result,checked = authenticate_continuation(paths,inventories)
              rho = paths["rho2"]
              for name,(size,sha256) in RHO2_FILES.items():
                  exact_pin(rho,name,{"bytes":size,"sha256":sha256})
              for role in ("delta","seed34","packet","refinement","oracle","e"):
                  receipt = read(paths[role] / "checker-result.json")
                  require(receipt["status"] == "PASS" and receipt["cross_checked"] is False and receipt["verified"] is False,
                      "accepted-legacy-checker:" + role)
              p1_manifest = read(paths["p1"] / "manifest.json")
              require(digest(paths["p1"] / "manifest.json") == "86e8b14cb0a60c86468ffb54a7bf14980366406a1e5bea17018fc6961f331feb",
                  "accepted-P1-manifest")
              require(p1_manifest["instruction"]["rows"] == 8059 and p1_manifest["instruction"]["eof"] is True,"P1-whole-literal-source-EOF")
              parent_entries = [{"role":role,"artifact":ARTIFACTS[role],"manifest":pin(paths[role] / PRIMARY[role],PRIMARY[role]),
                  **inventories[role]} for role in ROLES]
              selected_paths = {"head":"output/HEAD","result":"output/result.json","checker":"checker-result.json",
                  "owner":"output/owner.json","source":"output/source.json","start":"output/start.json","fixed":"output/fixed/manifest.json"}
              selected = {key:pin(paths["continuation"] / name,name) for key,name in selected_paths.items()}
              selected.update({key:head[key] for key in ("completed_steps","rank","generation","kind","state_head",
                  "target_remainder_sha256","lambda_sha256")})
              selected["terminal"] = result["terminal"]
              acceptance = seal(WORD_SCHEMA,"acceptance",{"status":"PASS","parents":parent_entries,"selected":selected,
                  "consumer_sources":{"producer":pin(REPO / P_SOURCE,P_SOURCE),"checker":pin(REPO / D_SOURCE,D_SOURCE)},
                  "runtime":runtime(),**ASSURANCE})
              save("acceptance.json",acceptance)
              before_sources = [pin(REPO / name,name) for name in [*SOURCES,*RAW,WORKFLOW]]
              save("all-source-files-before.json",seal(SCHEMA,"source-files",{
                  "files":before_sources,"acceptance":pin(REPORT / "acceptance.json","acceptance.json"),
                  "driver":pin(REPORT / "driver.py","driver.py"),**FALSE_ASSURANCE}))
              for root in paths.values():
                  for path in root.rglob("*"):
                      path.chmod(0o555 if path.is_dir() else 0o444)
                  root.chmod(0o555)
              for name in [*SOURCES,*RAW,WORKFLOW]:
                  (REPO / name).chmod(0o444)
              for name in ("acceptance.json","parent-paths.json","driver.py","all-parent-files-before.json","all-source-files-before.json"):
                  (REPORT / name).chmod(0o444)
              save("admission-result.json",seal(SCHEMA,"admission-result",{
                  "status":"PASS","parents":16,"old_success_suites_rerun":0,"readonly_before_consumers":True,
                  "acceptance":pin(REPORT / "acceptance.json","acceptance.json"),
                  "source_receipt":pin(REPORT / "source-receipt.json","source-receipt.json"),
                  "continuation_intake":pin(REPORT / "continuation-intake.json","continuation-intake.json"),**FALSE_ASSURANCE}))

          SELFTEST_NAMES = {
              "P_SELFTEST":["disk-index-cache-and-integrity","old-word-bytes-and-new-reread",
                  "scratch-line-and-resource-boundaries"],
              "D_SELFTEST":["disk-catalog-pages-canonical-and-refcounts","same-D3-eight-op-eleven-slot-and-physical",
                  "scratch-capacity-and-authentication-negatives"]}
          WORD_FILES = sorted(["source.json","owner.json","parent-roster.json","fresh-rho2.json","context.json",
              "literal-dictionary.json","target-history.json","ancestor-index.json","ordered-word.jsonl",
              "word-manifest.json","normalized-pair.json","manifest.json","result.json"])

          def execute(label):
              require(label in ("P_SELFTEST","D_SELFTEST","P","D"),"registered-invocation")
              require(sealed(REPORT / "admission-result.json")["status"] == "PASS","admitted-readonly-inputs")
              layout = sealed(REPORT / "resource-layout.json",SCHEMA + ".resource-layout")
              require(layout["status"] == "PASS" and layout["settings"] == RESOURCE_LIMITS and
                  layout["scratch"] == {name:str(item) for name,item in RESOURCE_PATHS.items()},"registered-resource-layout")
              scratch = new_resource_path(RESOURCE_PATHS[label],resource_protected(),
                  [path for name,path in RESOURCE_PATHS.items() if name != label])
              producer = label.startswith("P")
              source = P_SOURCE if producer else D_SOURCE
              argv = [sys.executable,"-B",str(REPO / source)]
              if label.endswith("SELFTEST"):
                  argv.append("--resource-selftest")
              else:
                  require(sealed(REPORT / "new-canary-result.json")["status"] == "PASS","only-new-canaries-PASS")
                  paths = read(REPORT / "parent-paths.json")
                  for role in ROLES:
                      argv += ["--block-root" if role.startswith("block-") else "--" + role + "-root",paths[role]]
                  argv += ["--acceptance",str(REPORT / "acceptance.json")]
                  if producer:
                      argv += ["--output",str(REPORT / "word")]
                  else:
                      require(sealed(REPORT / "word-before-D.json")["status"] == "PASS","complete-word-before-D")
                      argv += ["--word-root",str(REPORT / "word"),"--output",str(REPORT / "D"),
                          "--producer-max-seconds",str(LIMITS["P"]["seconds"]),
                          "--producer-max-memory-mib",str(LIMITS["memory_mib"])]
              argv += ["--max-seconds",str(LIMITS[label]["seconds"]),"--max-memory-mib",str(LIMITS["memory_mib"])]
              argv += ["--scratch",str(scratch)]
              save("executions/" + label + "-command.json",seal(SCHEMA,"execution-command",{
                  "label":label,"argv":argv,"source":pin(REPO / source,source),"launch":launch(),
                  "started_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "started_monotonic":time.monotonic(),"registered_limits":LIMITS[label],
                  "max_memory_mib":LIMITS["memory_mib"],"scratch":str(scratch),"resource_limits":RESOURCE_LIMITS,
                  "resource_layout_sha256":digest(REPORT / "resource-layout.json"),
                  "fresh_no_scratch_resume":True,**FALSE_ASSURANCE}))
              # Replace this process so the outer timeout reaches the consumer's own cooperative signal handler.
              os.execv(sys.executable,argv)

          def record_exit(label,code):
              require(label in LIMITS and label in ("P_SELFTEST","D_SELFTEST","P","D"),"registered-exit")
              command = sealed(REPORT / "executions" / (label + "-command.json"))
              save("executions/" + label + "-receipt.json",seal(SCHEMA,"execution-receipt",{
                  "label":label,"exit_code":code,"command_sha256":digest(REPORT / "executions" / (label + "-command.json")),
                  "started_utc":command["started_utc"],"finished_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
                  "wall_seconds":round(time.monotonic() - command["started_monotonic"],6),
                  "stdout":pin(REPORT / (label + "-stdout.json"),label + "-stdout.json"),
                  "stderr":pin(REPORT / (label + ".log"),label + ".log"),
                  "exit_code_file":pin(REPORT / (label + "-exit-code.txt"),label + "-exit-code.txt"),**FALSE_ASSURANCE}))

          def exact_fields(value,fields,label):
              require(isinstance(value,dict) and set(value) == set(fields.split()),"exact-public-fields:" + label)
              return value

          def string_list(value,label,nonempty=False):
              require(isinstance(value,list) and (not nonempty or bool(value)) and
                  all(isinstance(item,str) and item for item in value),"public-string-list:" + label)

          def finite_metadata(value):
              if isinstance(value,dict):
                  require(all(isinstance(key,str) for key in value),"metadata-string-keys")
                  for item in value.values():
                      finite_metadata(item)
              elif isinstance(value,list):
                  for item in value:
                      finite_metadata(item)
              else:
                  require(value is None or type(value) in (str,bool,int) or
                      (type(value) is float and math.isfinite(value)),"finite-json-metadata")

          def source_rows(names):
              return [pin(REPO / name,name) for name in sorted(names)]

          def raw_rows(names):
              return [pin(REPO / name,name) for name in names]

          def nonnegative_counts(value,label):
              require(isinstance(value,dict) and all(isinstance(key,str) and key and
                  type(item) is int and item >= 0 for key,item in value.items()),"actual-counts:" + label)

          def ordinary_int_fields(value,fields,minimum=0):
              return isinstance(value,dict) and all(type(value.get(key)) is int and value[key] >= minimum
                  for key in fields.split())

          def public_file_rows(value,label):
              require(isinstance(value,list),"public-file-list:" + label)
              for item in value:
                  exact_fields(item,"file bytes sha256",label)
                  require(ordinary_int_fields(item,"bytes") and isinstance(item["sha256"],str) and
                      re.fullmatch("[0-9a-f]{64}",item["sha256"]),"ordinary-file-descriptor:" + label)
                  safe_name(item["file"])

          def D_settings(value,fixture):
              expected = {"page_cache_limit":16384 if fixture else 67108864,"page_bytes":128 if fixture else 65536,
                  "line_limit":67108864,"scratch_limit":67108864 if fixture else 17179869184,"free_floor":1073741824,
                  "max_rss_bytes":LIMITS["memory_mib"] * (1 << 20),"deadline_seconds":300.0 if fixture else 10800.0}
              require(isinstance(value,dict) and set(value) == set(expected) and
                  ordinary_int_fields(value,"page_cache_limit page_bytes line_limit scratch_limit free_floor max_rss_bytes",1) and
                  value == expected and type(value["deadline_seconds"]) is float,
                  "D-fixture-and-production-resource-settings-separated")

          def output_execution(label):
              execution = sealed(REPORT / "executions" / (label + "-receipt.json"),SCHEMA + ".execution-receipt")
              command_path = REPORT / "executions" / (label + "-command.json")
              command = sealed(command_path,SCHEMA + ".execution-command")
              require(type(execution["exit_code"]) is int and execution["exit_code"] == 0 and
                  (REPORT / (label + "-exit-code.txt")).read_bytes() == b"0\n","real-process-successful-exit")
              require(execution["command_sha256"] == digest(command_path) and
                  execution["exit_code_file"] == pin(REPORT / (label + "-exit-code.txt"),label + "-exit-code.txt") and
                  execution["stdout"] == pin(REPORT / (label + "-stdout.json"),label + "-stdout.json") and
                  execution["stderr"] == pin(REPORT / (label + ".log"),label + ".log"),"real-execution-all-bytes")
              require(command["label"] == label and command["launch"] == launch() and
                  command["source"] == pin(REPO / (P_SOURCE if label.startswith("P") else D_SOURCE),
                      P_SOURCE if label.startswith("P") else D_SOURCE) and
                  canonical(command["registered_limits"]) == canonical(LIMITS[label]) and
                  canonical(command["resource_limits"]) == canonical(RESOURCE_LIMITS) and
                  ordinary_int_fields(command,"max_memory_mib",1) and command["max_memory_mib"] == LIMITS["memory_mib"] and
                  command["scratch"] == str(RESOURCE_PATHS[label]) and command["fresh_no_scratch_resume"] is True and
                  command["resource_layout_sha256"] == digest(REPORT / "resource-layout.json"),"execution-source-resource-binding")
              return execution,command

          def D_measurement(value):
              exact_fields(value,"ru_maxrss ru_maxrss_unit ru_maxrss_bytes VmRSS_bytes VmHWM_bytes VmSize_bytes RLIMIT_AS proc_io ru_inblock ru_oublock","D-measurement")
              finite_metadata(value)
              for key in ("ru_maxrss","ru_maxrss_bytes","VmRSS_bytes","VmHWM_bytes","VmSize_bytes","ru_inblock","ru_oublock"):
                  require(value[key] is None or (type(value[key]) in (int,float) and value[key] >= 0),"D-measured-value-or-null")
              if value["ru_maxrss"] is not None:
                  require(value["ru_maxrss_unit"] == "KiB" and value["ru_maxrss_bytes"] == value["ru_maxrss"] * 1024,
                      "Linux-ru-maxrss-KiB-to-bytes")
              limits = value["RLIMIT_AS"]
              require(isinstance(limits,list) and len(limits) == 2 and all(type(item) is int for item in limits) and
                  limits[0] == LIMITS["memory_mib"] * (1 << 20),"D-actual-RLIMIT-AS-soft")
              if value["proc_io"] is not None:
                  nonnegative_counts(value["proc_io"],"D-proc-IO")

          def D_binding(scratch,fixture):
              value = sealed(scratch / "binding.json",D_SCHEMA + ".resource-scratch-binding")
              exact_fields(value,"schema sha256 format invocation binding fixture settings","D-scratch-binding")
              require(value["format"] == "independent-D4-node112-edge8-v1" and
                  isinstance(value["invocation"],str) and re.fullmatch("[0-9a-f]{32}",value["invocation"]) and
                  value["fixture"] is fixture,"D-private-format-and-invocation")
              binding = value["binding"]
              common = "loaded_source_files raw_pins runtime source_path fixture_only original_producer_index_read"
              exact_fields(binding,common + ("" if fixture else " acceptance parents block_roots word_root output"),"D-input-binding")
              code = [D_SOURCE,"search/check_d972_r07_a0_fresh_precision2_endpoint_signature_v9.py",
                  "search/check_d972_r07_grade2_forward_adjoint_maps_v4.py"]
              if fixture:
                  code.append(ANCHOR_D)
              public_file_rows(binding["loaded_source_files"],"D-loaded-sources")
              public_file_rows(binding["raw_pins"],"D-raw-inputs")
              require(binding["loaded_source_files"] == source_rows(code) and binding["raw_pins"] == raw_rows([
                  "ci/b345_157ee_artifacts_32359956713/d972_b345_q3_chief_v1.json","scratchpad/fuda1_a0_rmax_data.g",
                  "scratchpad/a0_paper_words_v1.json","scratchpad/a0_v2_words.json"]) and
                  binding["runtime"] == runtime() and binding["source_path"] == D_SOURCE and
                  binding["fixture_only"] is fixture and binding["original_producer_index_read"] is False,"D-independent-source-raw-runtime")
              if not fixture:
                  parents = read(REPORT / "parent-paths.json")
                  require(binding["parents"] == {role:parents[role] for role in ROLES if not role.startswith("block-")} and
                      binding["block_roots"] == [parents["block-" + str(i)] for i in range(4)] and
                      binding["acceptance"] == {"path":str(REPORT / "acceptance.json"),**pin(REPORT / "acceptance.json")} and
                      binding["word_root"] == str(REPORT / "word") and binding["output"] == str(REPORT / "D"),
                      "D-complete-actual-CLI-inputs")
              D_settings(value["settings"],fixture)
              return value

          def D_samples(scratch,binding,expected_phase):
              count,last,previous,phases = 0,None,-1.0,{}
              with (scratch / "samples.jsonl").open("rb") as stream:
                  while True:
                      raw = stream.readline(67108865)
                      if not raw:
                          break
                      require(len(raw) <= 67108864 and raw.endswith(b"\n"),"D-resource-sample-complete-bounded-line")
                      row = json.loads(raw)
                      finite_metadata(row)
                      require(canonical(row) == raw and row["schema"] == D_SCHEMA + ".resource-sample" and
                          row["scratch_binding_sha256"] == digest(scratch / "binding.json") and
                          row["sampling_is_not_exact_stop_or_phase_peak"] is True,"D-sample-actual-binding")
                      elapsed = row["elapsed_seconds"]
                      require(type(elapsed) is float and math.isfinite(elapsed) and elapsed >= 0 and elapsed >= previous and
                          isinstance(row["phase"],str),"D-monotonic-sample-time")
                      previous = elapsed
                      nonnegative_counts(row["counters"],"D-sample")
                      D_measurement(row["measurement"])
                      require(type(row["page_cache_resident_bytes"]) is int and type(row["page_cache_limit"]) is int and
                          0 <= row["page_cache_resident_bytes"] <= row["page_cache_limit"] == binding["settings"]["page_cache_limit"] and
                          type(row["logical_scratch_bytes"]) is int and
                          0 <= row["logical_scratch_bytes"] <= binding["settings"]["scratch_limit"],"D-measured-cache-and-logical-bytes-within-settings")
                      phase = row["phase"]
                      phases[phase] = {"samples":phases.get(phase,{}).get("samples",0) + 1,"last_elapsed_seconds":elapsed}
                      last,count = row,count + 1
              require(count > 0 and last["phase"] == expected_phase,"D-success-resource-finish-sample")
              return {"file":pin(scratch / "samples.jsonl","samples.jsonl"),"sample_count":count,"last_sample":last,
                  "phase_observations":phases,"last_sample_is_failure_peak":False}

          def check_D_resource_selftest(value):
              exact_fields(value,"schema sha256 status tests fixture_scope production_interfaces_used source_files raw_inputs work_roots settings counters measurement old_success_suites actual_parent_artifact_replayed actual_word_D_complete candidate cross_checked verified","D-resource-selftest")
              require(type(value["old_success_suites"]) is int and value["old_success_suites"] == 0 and
                  value["actual_parent_artifact_replayed"] is False and value["actual_word_D_complete"] is False,"D-small-anchor-only")
              require(value["production_interfaces_used"] == ["ScratchContext","ScratchFile","NodeCatalog","DiskRemaining",
                  "normalized_pair","evaluate_slot","same_word_eleven","expect_pattern","new_scratch_path"],"D-actual-resource-interfaces")
              roots = exact_fields(value["work_roots"],"scratch fixtures envelope","D-work-roots")
              scratch,fixtures,envelope = (real_path(Path(roots[key])) for key in ("scratch","fixtures","envelope"))
              require(scratch == RESOURCE_PATHS["D_SELFTEST"] and envelope == scratch.parent and
                  fixtures.parent == envelope and fixtures.name.startswith("fixtures-") and separate(scratch,fixtures) and
                  fixtures.is_dir(),"D-fixtures-preserved-as-separate-sibling")
              binding = D_binding(scratch,True)
              D_settings(value["settings"],True)
              public_file_rows(value["source_files"],"D-selftest-loaded-sources")
              public_file_rows(value["raw_inputs"],"D-selftest-raw-inputs")
              require(value["source_files"] == binding["binding"]["loaded_source_files"] and
                  value["raw_inputs"] == binding["binding"]["raw_pins"] and
                  canonical(value["settings"]) == canonical(binding["settings"]),"D-test-source-raw-settings-to-disk")
              saved_paths = sealed(scratch / "selftest-paths.json",D_SCHEMA + ".resource-selftest-paths")
              require({key:saved_paths[key] for key in roots} == roots and saved_paths["temporary_only"] is True and
                  saved_paths["automatic_deletion"] is False,"D-real-path-receipt")
              require((scratch / "selftest-result.json").read_bytes() == canonical(value),"D-saved-result-equals-stdout")
              first,second,third = value["tests"]
              exact_fields(first,"name status rejected_cases same_input actual_cache_evictions","D-first-group")
              require(exact_fields(first["same_input"],"bytes sha256 nodes","D-same-input") ==
                  {**pin(fixtures / "same-bytes/ordered-word.jsonl"),"nodes":157} and
                  type(first["same_input"]["bytes"]) is int and type(first["same_input"]["nodes"]) is int and
                  type(first["actual_cache_evictions"]) is int and first["actual_cache_evictions"] > 0,"D-actual-bounded-fixture-evictions")
              exact_fields(second,"name status rejected_cases typed_slots full_filtered_coordinates_compared nonunit_intermediate_and_Ref_alias same_root_empty_Fox_rows_are_values all_payloads no_source_or_arithmetic_fields_excluded","D-second-group")
              require(type(second["typed_slots"]) is int and second["typed_slots"] == 11 and
                  type(second["full_filtered_coordinates_compared"]) is int and second["full_filtered_coordinates_compared"] == 80644 and
                  all(second[key] is True for key in ("nonunit_intermediate_and_Ref_alias","same_root_empty_Fox_rows_are_values",
                      "no_source_or_arithmetic_fields_excluded")),"D-eleven-slot-resource-anchor")
              new,old = scan(fixtures / "D4-eleven"),scan(fixtures / "D3-eleven")
              public_file_rows(second["all_payloads"],"D-selftest-all-payloads")
              require(new == old and new["files"] == second["all_payloads"],"D-complete-small-anchor-all-output-bytes")
              exact_fields(third,"name status rejected_cases resource_stop_cases lowered_fixture_limits_are_not_actual_universe_results","D-third-group")
              string_list(third["rejected_cases"],"D-real-negative-cases",True)
              string_list(third["resource_stop_cases"],"D-resource-stop-cases",True)
              require(third["lowered_fixture_limits_are_not_actual_universe_results"] is True,"D-fixture-is-not-current-universe")
              nonnegative_counts(value["counters"],"D-selftest")
              D_measurement(value["measurement"])
              samples = D_samples(scratch,binding,"resource_finish:PASS_RESOURCE_SELFTEST")
              return {"paths":roots,"binding":pin(scratch / "binding.json","binding.json"),
                  "saved_result":pin(scratch / "selftest-result.json","selftest-result.json"),"samples":samples,
                  "fixture_inventory":scan(fixtures),"source_files":value["source_files"],"raw_inputs":value["raw_inputs"]}

          def actual_FD(value,actual,wanted_name,label):
              exact_fields(value,"file bytes sha256",label)
              require(ordinary_int_fields(value,"bytes") and value == pin(actual,wanted_name),"exact-public-FD:" + label)

          def P_cache(value,fixture,initial=False):
              fields = "page_rows page_bytes cache_pages_limit io_buffer_reserve_bytes configured_cache_and_io_bytes resident_pages resident_payload_bytes max_resident_pages hits misses evictions flushes"
              exact_fields(value,fields,"P-cache")
              require(ordinary_int_fields(value,fields),"P-cache-ordinary-integers")
              expected = {"page_rows":2 if fixture else 4096,"page_bytes":84 if fixture else 172032,
                  "cache_pages_limit":2 if fixture else 388,"io_buffer_reserve_bytes":168 if fixture else 344064,
                  "configured_cache_and_io_bytes":336 if fixture else 67092480}
              require(all(value[key] == wanted for key,wanted in expected.items()) and
                  value["configured_cache_and_io_bytes"] <= RESOURCE_LIMITS["page_cache_bytes"] and
                  value["resident_pages"] <= value["max_resident_pages"] <= value["cache_pages_limit"] and
                  value["resident_payload_bytes"] <= value["resident_pages"] * value["page_bytes"],"P-public-page-cache-settings-and-observations")
              if initial:
                  require(all(value[key] == 0 for key in fields.split() if key not in expected),"P-start-empty-cache-is-not-final-measurement")

          def P_memory(value):
              fields = "ru_maxrss ru_maxrss_unit peak_rss_bytes VmRSS_bytes VmHWM_bytes VmSize_bytes rlimit_as_soft rlimit_as_hard"
              exact_fields(value,fields,"P-memory")
              finite_metadata(value)
              require(ordinary_int_fields(value,"ru_maxrss peak_rss_bytes") and value["ru_maxrss_unit"] == "KiB" and
                  value["peak_rss_bytes"] == value["ru_maxrss"] * 1024,"P-Linux-peak-RSS-KiB-to-bytes")
              for key in ("VmRSS_bytes","VmHWM_bytes","VmSize_bytes"):
                  require(value[key] is None or (type(value[key]) is int and value[key] >= 0),"P-measured-memory-or-null")
              require(type(value["rlimit_as_soft"]) is int and value["rlimit_as_soft"] == LIMITS["memory_mib"] * (1 << 20) and
                  type(value["rlimit_as_hard"]) is int,"P-actual-RLIMIT-AS")

          def P_index_states(value):
              require(isinstance(value,list),"P-index-states-list")
              numbers = []
              for state in value:
                  exact_fields(state,"number purpose rows durable_rows logical_bytes actual_bytes closed finished","P-index-state")
                  require(ordinary_int_fields(state,"number rows durable_rows logical_bytes actual_bytes") and
                      state["purpose"] in ("build","reread","fixture") and type(state["closed"]) is bool and
                      type(state["finished"]) is bool,"P-ordinary-index-state-fields")
                  numbers.append(state["number"])
              require(numbers == sorted(set(numbers)),"P-unique-ordered-index-states")

          def P_samples(root,fixture):
              prefix = WORD_SCHEMA + ".resource-v4"
              count,last,previous,phases = 0,None,-1.0,{}
              with (root / "telemetry.jsonl").open("rb") as stream:
                  while True:
                      raw = stream.readline(67108865)
                      if not raw:
                          break
                      require(len(raw) <= 67108864 and raw.endswith(b"\n"),"P-complete-resource-sample-line")
                      row = json.loads(raw)
                      finite_metadata(row)
                      exact_fields(row,"schema sha256 sample phase elapsed_seconds memory cache indices words io_bytes io_calls fsyncs session_scratch_reserved_bytes process_scratch_reserved_bytes max_fan_in max_line_bytes frames max_frames symbols active_symbols semantic_live_nodes parent_object_overhead_bytes snapshot last_sample_is_failure_peak","P-resource-sample")
                      require(isinstance(row,dict) and row["schema"] == prefix + ".sample" and canonical(row) == raw and
                          row["sha256"] == hashlib.sha256(canonical({key:value for key,value in row.items() if key != "sha256"})).hexdigest(),
                          "P-full-resource-sample-seal-and-canonical-bytes")
                      elapsed = row["elapsed_seconds"]
                      require(type(elapsed) is float and elapsed >= 0 and elapsed >= previous and
                          ordinary_int_fields(row,"sample") and row["sample"] == count and
                          isinstance(row["phase"],str) and row["phase"] and row["last_sample_is_failure_peak"] is False,
                          "P-monotonic-measured-samples-not-failure-peaks")
                      P_cache(row["cache"],fixture)
                      P_memory(row["memory"])
                      P_index_states(row["indices"])
                      require(isinstance(row["words"],dict) and all(isinstance(key,str) and key for key in row["words"]),
                          "P-public-word-counter-purposes")
                      for counts in row["words"].values():
                          exact_fields(counts,"nodes edges zero_power_edges refs","P-word-counters")
                          require(ordinary_int_fields(counts,"nodes edges zero_power_edges refs"),"P-ordinary-word-counters")
                      nonnegative_counts(row["io_bytes"],"P-IO-bytes")
                      nonnegative_counts(row["io_calls"],"P-IO-calls")
                      require(ordinary_int_fields(row,"fsyncs session_scratch_reserved_bytes process_scratch_reserved_bytes"),
                          "P-ordinary-IO-and-reservation-counts")
                      for key in ("max_fan_in","max_line_bytes","frames","max_frames","symbols","active_symbols"):
                          require(row[key] is None or (type(row[key]) is int and row[key] >= 0),"P-observed-counter-or-null")
                      require(row["semantic_live_nodes"] is None and row["parent_object_overhead_bytes"] is None and
                          isinstance(row["snapshot"],dict),"P-unmeasured-overhead-remains-null-and-full-snapshot-retained")
                      phase = row["phase"]
                      phases[phase] = {"samples":phases.get(phase,{}).get("samples",0) + 1,"last_elapsed_seconds":elapsed}
                      previous,last,count = elapsed,row,count + 1
              require(count > 0 and last["sample"] == count - 1 and last["phase"] == "resource-session-PASS",
                  "P-complete-resource-sample-sequence-and-successful-last-phase")
              return {"file":pin(root / "telemetry.jsonl","telemetry.jsonl"),"sample_count":count,
                  "last_sample":last,"phase_observations":phases,"last_sample_is_failure_peak":False}

          def P_session(root,fixture):
              prefix = WORD_SCHEMA + ".resource-v4"
              start = sealed(root / "start.json",prefix + ".start")
              result = sealed(root / "result.json",prefix + ".result")
              exact_fields(start,"schema sha256 invocation binding format cache limits fixture_only resume","P-start")
              require(start["format"] == "private-P4-node42-v1" and isinstance(start["invocation"],str) and
                  re.fullmatch("[0-9a-f]{32}",start["invocation"]) and start["fixture_only"] is fixture and
                  start["resume"] is False,"P-private-session-format-and-fresh-mode")
              P_cache(start["cache"],fixture,initial=True)
              limits = exact_fields(start["limits"],"line_bytes scratch_bytes free_floor_bytes process_memory_bytes process_max_seconds","P-limits")
              require(ordinary_int_fields(limits,"line_bytes scratch_bytes free_floor_bytes process_memory_bytes") and
                  limits == {"line_bytes":67108864,"scratch_bytes":17179869184,"free_floor_bytes":1073741824,
                      "process_memory_bytes":LIMITS["memory_mib"] * (1 << 20),"process_max_seconds":300.0 if fixture else 5400.0} and
                  type(limits["process_max_seconds"]) is float,"P-fixture-and-production-CLI-resource-limits")
              binding = start["binding"]
              if fixture:
                  exact_fields(binding,"mode producer","P-fixture-binding")
                  require(binding["mode"] == "resource-selftest","P-fixture-binding-mode")
                  actual_FD(binding["producer"],REPO / P_SOURCE,Path(P_SOURCE).name,"P-fixture-source-basename")
              else:
                  accepted = sealed(REPORT / "acceptance.json",WORD_SCHEMA + ".acceptance")
                  expected = {"producer":pin(REPO / P_SOURCE,P_SOURCE),
                      "acceptance":pin(REPORT / "acceptance.json",str(REPORT / "acceptance.json")),
                      "parents":accepted["parents"],"consumer_sources":accepted["consumer_sources"],
                      "raw_sources":raw_rows(["scratchpad/a0_paper_words_v1.json","scratchpad/a0_v2_words.json","scratchpad/fuda1_a0_rmax_data.g"]),
                      "runtime":runtime(),"accepted_owner":accepted["selected"]["owner"],"accepted_head":accepted["selected"]["head"],
                      "scratch_path":str(RESOURCE_PATHS["P"]),"output_path":str(REPORT / "word"),
                      "ordered_word_identity_unchanged_by_private_storage":True}
                  require(canonical(binding) == canonical(expected),"P-normal-binding-entire-original-acceptance-all-sixteen-parents")
              exact_fields(result,"schema sha256 status session_sha256 word_result_sha256 root_id root_sha256 word_manifest_sha256 indices index_states cache samples eof successful_word_bundle fixture_only candidate cross_checked verified","P-resource-result")
              finite_metadata(start)
              finite_metadata(result)
              require(result["status"] == "PASS" and result["session_sha256"] == digest(root / "start.json") and
                  result["fixture_only"] is fixture and result["successful_word_bundle"] is (not fixture) and
                  result["eof"] is True and all(result[key] is False for key in FALSE_ASSURANCE),"P-resource-result-scope-and-start-file")
              if fixture:
                  require(all(result[key] is None for key in ("word_result_sha256","root_id","root_sha256","word_manifest_sha256")),
                      "P-fixture-completion-is-not-a-complete-actual-word")
              else:
                  word = sealed(REPORT / "word/word-manifest.json",WORD_SCHEMA + ".word-manifest")
                  require(result["word_result_sha256"] == digest(REPORT / "word/result.json") and
                      result["word_manifest_sha256"] == digest(REPORT / "word/word-manifest.json") and
                      ordinary_int_fields(result,"root_id") and result["root_id"] == word["root_id"] and
                      result["root_sha256"] == word["root_sha256"],"P-resource-result-actual-word-full-file-pins")
              P_cache(result["cache"],fixture)
              require(isinstance(result["indices"],list) and isinstance(result["index_states"],list),"P-complete-and-partial-index-lists")
              P_index_states(result["index_states"])
              states = {}
              for state in result["index_states"]:
                  exact_fields(state,"number purpose rows durable_rows logical_bytes actual_bytes closed finished","P-index-state")
                  require(ordinary_int_fields(state,"number rows durable_rows logical_bytes actual_bytes") and
                      state["purpose"] in ("build","reread","fixture") and type(state["closed"]) is bool and
                      type(state["finished"]) is bool and state["number"] not in states,"P-exact-unique-index-state-type")
                  states[state["number"]] = state
                  path = root / "indices" / (f"{state['number']:06d}-" + state["purpose"] + ".bin")
                  if path.exists():
                      require(path.is_file() and not path.is_symlink() and path.stat().st_size == state["actual_bytes"],"P-state-actual-index-file-bytes")
                  else:
                      require(not state["finished"] and state["actual_bytes"] == 0,"P-missing-index-is-not-complete")
              require(list(states) == sorted(states),"P-index-state-number-order")
              completed = []
              for item in result["indices"]:
                  exact_fields(item,"schema sha256 number purpose binding_sha256 file bytes sha256_payload header_bytes stride encoding count root_id root_sha256 all_nodes_reachable eof","P-index-receipt")
                  require(ordinary_int_fields(item,"number bytes header_bytes stride root_id") and
                      ordinary_int_fields(item,"count",1) and item["number"] in states and
                      item["purpose"] == states[item["number"]]["purpose"] and item["header_bytes"] == 48 and item["stride"] == 42 and
                      item["encoding"] == "sha256-raw32,residue54-u8,residue54-u8,incoming-u64LE" and
                      type(item["all_nodes_reachable"]) is bool and item["eof"] is True,"P-complete-index-public-type")
                  name = f"{item['number']:06d}"
                  receipt = sealed(root / "index-receipts" / (name + ".json"),prefix + ".index")
                  require(canonical(receipt) == canonical(item),"P-result-index-object-to-complete-receipt-file")
                  require(item["file"] == "indices/" + name + "-" + item["purpose"] + ".bin" and
                      pin(root / item["file"]) == {"bytes":item["bytes"],"sha256":item["sha256_payload"]} and
                      item["bytes"] == 48 + 42 * item["count"],"P-complete-index-all-binary-bytes-header-and-EOF")
                  expected_binding = {"session_sha256":digest(root / "start.json"),"number":item["number"],
                      "purpose":item["purpose"],"stride":42}
                  require(item["binding_sha256"] == hashlib.sha256(canonical(expected_binding)).hexdigest() and
                      item["root_id"] == item["count"] - 1 and isinstance(item["root_sha256"],str) and
                      re.fullmatch("[0-9a-f]{64}",item["root_sha256"]),"P-index-metadata-binding-and-root-node-identity")
                  state = states[item["number"]]
                  require(state["finished"] is True and state["closed"] is True and
                      state["rows"] == state["durable_rows"] == item["count"] and
                      state["logical_bytes"] == state["actual_bytes"] == item["bytes"],"P-complete-index-state-equalities")
                  completed.append(item["number"])
                  if not fixture:
                      require(item["all_nodes_reachable"] is True and item["count"] == word["nodes_file"]["nodes"] and
                          item["root_id"] == word["root_id"] and item["root_sha256"] == word["root_sha256"],"P-both-complete-indices-same-actual-word")
              require(completed == sorted(set(completed)) and
                  completed == [number for number,state in states.items() if state["finished"]],"P-all-complete-index-receipts-exactly-once")
              observed = scan(root)
              receipt_names = [entry["file"] for entry in observed["files"] if entry["file"].startswith("index-receipts/")]
              require(receipt_names == [f"index-receipts/{number:06d}.json" for number in completed],"P-index-receipt-full-file-roster")
              binary_names = [entry["file"] for entry in observed["files"] if entry["file"].startswith("indices/")]
              require(set(binary_names) <= {f"indices/{number:06d}-" + state["purpose"] + ".bin" for number,state in states.items()},
                  "P-no-unregistered-private-binary-file")
              if not fixture:
                  require([(number,state["purpose"]) for number,state in states.items()] == [(0,"build"),(1,"reread")] and
                      completed == [0,1],"P-normal-exactly-two-closed-complete-indices")
              samples = P_samples(root,fixture)
              require(ordinary_int_fields(result,"samples") and result["samples"] == samples["sample_count"] and
                  canonical(samples["last_sample"]["cache"]) == canonical(result["cache"]) and
                  canonical(samples["last_sample"]["indices"]) == canonical(result["index_states"]),
                  "P-actual-sample-count-EOF-and-final-cache-index-state")
              return {"root":str(root),"start":pin(root / "start.json","start.json"),"result":pin(root / "result.json","result.json"),
                  "settings":start["limits"],"last_cache":result["cache"],"indices":result["indices"],"index_states":result["index_states"],
                  "samples":samples,"inventory":observed,"fixture_only":fixture,"successful_word_bundle":not fixture}

          def check_P_resource_selftest(value):
              exact_fields(value,"schema sha256 status tests fixture_scope production_interfaces_used paths paths_receipt reference_source old_full_suites_run candidate cross_checked verified","P-resource-selftest")
              require(ordinary_int_fields(value,"old_full_suites_run") and value["old_full_suites_run"] == 0 and
                  value["production_interfaces_used"] == ["NodeStore","PagePool","WordDAG","read_normalized_pair","limited_lines",
                      "resource_path_gate","ResourceSession.before_write","canonical"],"P-small-old-anchor-and-new-interfaces-only")
              actual_FD(value["reference_source"],REPO / ANCHOR_P,ANCHOR_P,"P-small-reference-source")
              prefix = WORD_SCHEMA + ".resource-v4"
              paths = exact_fields(value["paths"],"schema sha256 scratch fixtures temporary_roots_only delete_on_exit explicit_scratch producer","P-selftest-paths")
              scratch,fixtures = (real_path(Path(paths[key])) for key in ("scratch","fixtures"))
              require(scratch == RESOURCE_PATHS["P_SELFTEST"] and fixtures == scratch.parent / "fixtures" and
                  paths["temporary_roots_only"] is True and paths["delete_on_exit"] is False and paths["explicit_scratch"] is True,
                  "P-explicit-scratch-and-fixture-sibling-layout")
              actual_FD(paths["producer"],REPO / P_SOURCE,Path(P_SOURCE).name,"P-path-source-basename")
              path_receipt = scratch.parent / "resource-selftest-paths.json"
              actual_FD(value["paths_receipt"],path_receipt,str(path_receipt),"P-absolute-path-receipt")
              require(canonical(paths) == canonical(sealed(path_receipt,prefix + ".selftest-paths")),"P-paths-exact-sealed-file")
              first,second,third = value["tests"]
              for row in (first,second,third):
                  string_list(row["rejected_cases"],"P-resource-rejected-cases",True)
              exact_fields(first,"name status rejected_cases rows cache","P-first-test")
              require(ordinary_int_fields(first,"rows") and first["rows"] == 13,"P-thirteen-synthetic-store-rows")
              P_cache(first["cache"],True)
              require(first["cache"]["max_resident_pages"] == 2 and first["cache"]["evictions"] > 0 and
                  first["cache"]["resident_pages"] == first["cache"]["resident_payload_bytes"] == 0,"P-real-small-cache-evictions-and-close")
              exact_fields(second,"name status rejected_cases reference_source word root_id root_sha256 normalized_pair ops old_full_suites_run","P-second-test")
              actual_FD(second["reference_source"],REPO / ANCHOR_P,ANCHOR_P,"P-second-reference-source")
              word = exact_fields(second["word"],"file bytes sha256 nodes","P-small-word")
              require(ordinary_int_fields(word,"bytes nodes",1) and word["file"] == "ordered-word.jsonl" and
                  pin(fixtures / "word/new-word/ordered-word.jsonl") == pin(fixtures / "word/old-word/ordered-word.jsonl") ==
                  {"bytes":word["bytes"],"sha256":word["sha256"]} and ordinary_int_fields(second,"root_id old_full_suites_run") and
                  second["root_id"] == word["nodes"] - 1 and second["old_full_suites_run"] == 0 and
                  isinstance(second["root_sha256"],str) and re.fullmatch("[0-9a-f]{64}",second["root_sha256"]),"P-old-and-new-identical-small-word-file-and-root")
              pair = second["normalized_pair"]
              require(pair is None or (isinstance(pair,list) and len(pair) == 2 and all(type(x) is int and 0 <= x < 3 for x in pair)),
                  "P-small-normalized-pair-null-is-not-zero")
              require(second["ops"] == ["Act","Identity","IntegerPower","Inverse","Letter","OrderedProduct","Ref","Rel"],"P-all-eight-ops-order")
              exact_fields(third,"name status rejected_cases fixture_resource_limits_only","P-third-test")
              require(third["fixture_resource_limits_only"] is True and third["rejected_cases"] ==
                  ["scratch-is-output","scratch-contains-output","scratch-below-parent","output-below-parent",
                   "scratch-contains-protected-source","scratch-symlink-parent","existing-scratch-reuse",
                   "oversized-line-is-resource","scratch-byte-limit-is-resource","disk-free-floor-is-resource",
                   "positive-ordinary-exponent-decimal-capacity-is-resource","negative-ordinary-exponent-decimal-capacity-is-resource",
                   "bool-exponent-remains-type-failure","unrelated-circular-ValueError-remains-failure"],"P-exact-resource-versus-authentication-negatives")
              sessions = [P_session(scratch / name,True) for name in ("store","word","paths")]
              require({path.name for path in scratch.iterdir()} == {"store","word","paths"},"P-all-three-distinct-fixture-sessions")
              require(not (fixtures / "paths/parent-link").exists() and not (fixtures / "paths/parent-link").is_symlink(),
                  "P-only-canary-symlink-removed-without-weakening-REPORT-roster")
              return {"paths":paths,"paths_receipt":value["paths_receipt"],"reference_source":value["reference_source"],
                  "sessions":sessions,"fixture_inventory":scan(fixtures),"top_has_no_synthetic_D_style_fields":True}

          def resource_public_type_canary():
              source = RESOURCE_PATHS["D_SELFTEST"]
              original = D_binding(source,True)
              fixtures = REPORT / "resource-public-type-fixtures"
              require(not fixtures.exists(),"fresh-public-type-fixtures")
              fixtures.mkdir()
              rejected = []
              for key in ("page_cache_limit","page_bytes","line_limit","scratch_limit","free_floor","max_rss_bytes"):
                  root = fixtures / key
                  root.mkdir()
                  changed = json.loads(canonical(original))
                  changed["settings"][key] = float(changed["settings"][key])
                  changed = seal(D_SCHEMA,"resource-scratch-binding",{
                      name:value for name,value in changed.items() if name not in ("schema","sha256")})
                  (root / "binding.json").write_bytes(canonical(changed))
                  # Authentication succeeds; the normal public settings type gate must still refuse.
                  sealed(root / "binding.json",D_SCHEMA + ".resource-scratch-binding")
                  try:
                      D_binding(root,True)
                  except ValueError as error:
                      require(str(error) == "positive_word_workflow:D-fixture-and-production-resource-settings-separated",
                          "public-type-negative-reaches-int-setting-gate")
                      rejected.append("D-binding-equal-float-" + key)
                  else:
                      raise AssertionError("D-binding-float-was-accepted:" + key)
              changed = sealed(REPORT / "D_SELFTEST-stdout.json",D_SCHEMA + ".resource-selftest")
              changed["settings"]["page_cache_limit"] = float(changed["settings"]["page_cache_limit"])
              changed = seal(D_SCHEMA,"resource-selftest",{
                  key:value for key,value in changed.items() if key not in ("schema","sha256")})
              path = fixtures / "top-settings-float.json"
              path.write_bytes(canonical(changed))
              try:
                  check_D_resource_selftest(sealed(path,D_SCHEMA + ".resource-selftest"))
              except ValueError as error:
                  require(str(error) == "positive_word_workflow:D-fixture-and-production-resource-settings-separated",
                      "top-public-type-negative-reaches-settings-gate")
                  rejected.append("D-selftest-top-equal-float-page-cache-limit")
              else:
                  raise AssertionError("D-selftest-top-setting-float-was-accepted")
              samples = D_samples(source,original,"resource_finish:PASS_RESOURCE_SELFTEST")
              root = fixtures / "sample-page-cache-limit"
              root.mkdir()
              (root / "binding.json").write_bytes((source / "binding.json").read_bytes())
              row = samples["last_sample"]
              row["page_cache_limit"] = float(row["page_cache_limit"])
              (root / "samples.jsonl").write_bytes(canonical(row))
              try:
                  D_samples(root,original,"resource_finish:PASS_RESOURCE_SELFTEST")
              except ValueError as error:
                  require(str(error) == "positive_word_workflow:D-measured-cache-and-logical-bytes-within-settings",
                      "public-sample-negative-reaches-int-cache-gate")
                  rejected.append("D-sample-equal-float-page-cache-limit")
              else:
                  raise AssertionError("D-sample-float-was-accepted")
              save("resource-public-type-canary.json",seal(SCHEMA,"resource-public-type-canary",{
                  "status":"PASS","production_interfaces":["D_binding","check_D_resource_selftest","D_samples"],"rejected_cases":rejected,
                  "binding_mutations_fully_resealed":True,"source_binding":pin(source / "binding.json","binding.json"),
                  "fixtures":str(fixtures),"inventory":scan(fixtures),"old_success_suites_rerun":0,
                  "actual_word_arithmetic_replayed":False,**FALSE_ASSURANCE}))

          def check_canaries():
              rows = []
              for label in ("P_SELFTEST","D_SELFTEST"):
                  execution,command = output_execution(label)
                  expected_schema = WORD_SCHEMA if label.startswith("P") else D_SCHEMA
                  value = sealed(REPORT / (label + "-stdout.json"),expected_schema + ".resource-selftest")
                  finite_metadata(value)
                  require(value["status"] == "PASS" and isinstance(value["tests"],list) and
                      [x["name"] for x in value["tests"]] == SELFTEST_NAMES[label] and
                      all(x["status"] == "PASS" for x in value["tests"]),"exact-new-resource-three-group-roster")
                  for test in value["tests"]:
                      string_list(test["rejected_cases"],label + "-rejected-cases")
                  require(all(value[key] is False for key in FALSE_ASSURANCE) and
                      isinstance(value["fixture_scope"],str) and value["fixture_scope"],"resource-selftest-is-not-actual-word-candidate")
                  detail = check_P_resource_selftest(value) if label.startswith("P") else check_D_resource_selftest(value)
                  save("resource-selftests/" + label[0] + "/workflow-receipt.json",seal(SCHEMA,"resource-selftest-admission",{
                      "status":"PASS","label":label,"result":pin(REPORT / (label + "-stdout.json"),label + "-stdout.json"),
                      "details":detail,"result_scope":"bounded-new-resource-fixture-only",**FALSE_ASSURANCE}))
                  rows.append({"label":label,"result":pin(REPORT / (label + "-stdout.json"),label + "-stdout.json"),
                      "execution":pin(REPORT / "executions" / (label + "-receipt.json"),"executions/" + label + "-receipt.json"),
                      "tests":SELFTEST_NAMES[label],"resource_admission":pin(REPORT / "resource-selftests" / label[0] / "workflow-receipt.json",
                          "resource-selftests/" + label[0] + "/workflow-receipt.json")})
              resource_public_type_canary()
              source_checkpoint("after-resource-selftests")
              before = sealed(REPORT / "report-before-resources.json")["inventory"]
              observed = scan(REPORT)
              retained_report(before,observed)
              save("report-after-selftests.json",seal(SCHEMA,"report-inventory",{
                  "boundary":"after-resource-selftests-before-actual-P","inventory":observed,
                  "earlier_report_files_unchanged":True,**FALSE_ASSURANCE}))
              save("new-canary-result.json",seal(SCHEMA,"new-canary-result",{
                  "status":"PASS","groups":rows,"resource_test_groups":6,"old_success_suites_rerun":0,
                  "inventory_test":pin(REPORT / "inventory-canary.json","inventory-canary.json"),
                  "resource_layout_test":pin(REPORT / "resource-layout-canary.json","resource-layout-canary.json"),
                  "resource_public_type_test":pin(REPORT / "resource-public-type-canary.json","resource-public-type-canary.json"),
                  "limits":LIMITS,"resource_limits":RESOURCE_LIMITS,**FALSE_ASSURANCE}))

          def compare_manifest(root,manifest_name,extra,known=None):
              manifest = sealed(root / manifest_name)
              observed = known if known is not None else scan(root)
              records = manifest["files"]
              require(isinstance(records,list) and [x["file"] for x in records] == sorted(set(x["file"] for x in records)),
                  "unique-ordered-manifest-files")
              index = {row["file"]:row for row in observed["files"]}
              require(set(index) == {x["file"] for x in records} | set(extra) and
                  not ({x["file"] for x in records} & set(extra)),"exact-manifest-output-roster")
              for entry in records:
                  safe_name(entry["file"])
                  require(type(entry["bytes"]) is int and entry["bytes"] >= 0 and
                      index[entry["file"]] == {key:entry[key] for key in ("file","bytes","sha256")},"manifest-full-file-bytes")
              if "directories" in manifest:
                  require(manifest["directories"] == observed["directories"],"manifest-complete-directories")
              return manifest,observed

          def resource_D():
              output_execution("D")
              scratch = RESOURCE_PATHS["D"]
              binding = D_binding(scratch,False)
              word = sealed(REPORT / "word/word-manifest.json",WORD_SCHEMA + ".word-manifest")
              d_result = sealed(REPORT / "D/checker-result.json",D_SCHEMA + ".checker-result")
              require(d_result["status"] == "PASS" and d_result["complete_receipt"] is True and
                  d_result["eof"] is True,"D-resource-receipt-only-after-actual-complete-D")
              admitted = sealed(scratch / "admitted-inputs.json",D_SCHEMA + ".resource-admitted-inputs")
              accepted = sealed(REPORT / "acceptance.json",WORD_SCHEMA + ".acceptance")
              public_file_rows(admitted["word_files"],"D-admitted-word-files")
              require(isinstance(admitted["parents"],list),"D-admitted-parent-list")
              for parent in admitted["parents"]:
                  public_file_rows([parent["manifest"]],"D-admitted-parent-manifest")
              require(admitted["scratch_binding_sha256"] == digest(scratch / "binding.json") and
                  admitted["acceptance_sha256"] == digest(REPORT / "acceptance.json") and
                  admitted["word_files"] == sealed(REPORT / "word-before-D.json")["files"] and
                  admitted["word_manifest_sha256"] == digest(REPORT / "word/word-manifest.json") and
                  admitted["parents"] == [{"role":row["role"],"manifest":row["manifest"],
                      "roster_sha256":hashlib.sha256(canonical(row)).hexdigest()} for row in accepted["parents"]] and
                  admitted["eof"] is True,"D-resource-admission-all-word-and-sixteen-parent-pins")
              catalogs = sorted(path for path in scratch.iterdir() if path.is_dir() and path.name.startswith("catalog-"))
              require([path.name for path in catalogs] == ["catalog-000000"],"one-normal-D-catalog")
              catalog_root = catalogs[0]
              start = sealed(catalog_root / "start.json",D_SCHEMA + ".resource-catalog-start")
              complete = sealed(catalog_root / "complete.json",D_SCHEMA + ".resource-catalog-complete")
              expected_start = {"format":"independent-D4-node112-edge8-v1","node_stride":112,"edge_stride":8,
                  "scratch_binding_sha256":digest(scratch / "binding.json"),"word_file":word["nodes_file"],
                  "word_path":str(REPORT / "word/ordered-word.jsonl"),"root_id":word["root_id"],
                  "root_sha256":word["root_sha256"],"dictionary_sha256":digest(REPORT / "word/literal-dictionary.json"),
                  "ancestor_entries":len(sealed(REPORT / "word/ancestor-index.json")["entries"])}
              require({key:value for key,value in start.items() if key not in ("schema","sha256")} == expected_start and
                  all(complete[key] == value for key,value in expected_start.items()) and complete["eof"] is True and
                  ordinary_int_fields(start,"node_stride edge_stride root_id ancestor_entries") and
                  ordinary_int_fields(complete,"node_stride edge_stride root_id ancestor_entries nodes edges") and
                  ordinary_int_fields(start["word_file"],"bytes nodes",1) and
                  ordinary_int_fields(complete["word_file"],"bytes nodes",1) and
                  complete["nodes"] == word["nodes_file"]["nodes"],"D-catalog-complete-to-actual-word-root")
              for name,field,width,count in (("nodes.index","index",112,complete["nodes"]),
                      ("ordered-edges.u64","ordered_edges",8,complete["edges"])):
                  expected = pin(catalog_root / name,"catalog-000000/" + name)
                  public_file_rows([complete[field]],"D-complete-index-descriptor")
                  require(complete[field] == expected and expected["bytes"] == width * count,"D-private-index-full-file-size-hash")
              passes = ["00-mod54",*[f"{number:02d}-slot-{number:02d}" for number in range(1,12)]]
              observed_pass_files = sorted(path.name for path in catalog_root.glob("*-complete.json"))
              require(observed_pass_files == sorted(name + "-complete.json" for name in passes),"D-all-twelve-independent-remaining-passes")
              pass_rows = []
              for name in passes:
                  item = sealed(catalog_root / (name + "-complete.json"),D_SCHEMA + ".resource-pass")
                  require(item["pass"] == name and item["eof"] is True and
                      item["catalog_complete_sha256"] == digest(catalog_root / "complete.json") and
                      type(item["consumed_edges"]) is int and item["consumed_edges"] == complete["edges"],"D-pass-published-EOF-and-all-edges")
                  remaining = item["remaining"]
                  public_file_rows([remaining],"D-complete-remaining-descriptor")
                  require(remaining["file"] == "catalog-000000/" + name + "-remaining.u64" and
                      remaining == pin(scratch / remaining["file"],remaining["file"]) and
                      remaining["bytes"] == 8 * complete["nodes"],"D-pass-remaining-full-bytes-and-EOF")
                  pass_rows.append(pin(catalog_root / (name + "-complete.json"),"catalog-000000/" + name + "-complete.json"))
              samples = D_samples(scratch,binding,"resource_finish:PASS")
              save("D-resource-receipt.json",seal(SCHEMA,"D-resource-receipt",{"status":"PASS",
                  "scratch":str(scratch),"binding":pin(scratch / "binding.json","binding.json"),
                  "admitted":pin(scratch / "admitted-inputs.json","admitted-inputs.json"),
                  "catalog_start":pin(catalog_root / "start.json","catalog-000000/start.json"),
                  "catalog_complete":pin(catalog_root / "complete.json","catalog-000000/complete.json"),
                  "passes":pass_rows,"word_root_id":word["root_id"],"word_root_sha256":word["root_sha256"],
                  "samples":samples,"actual_scratch_inventory":scan(scratch),
                  "resources_are_not_an_independent_mathematical_result":True,**FALSE_ASSURANCE}))
              source_checkpoint("after-D")

          def resource_P():
              output_execution("P")
              detail = P_session(RESOURCE_PATHS["P"],False)
              save("P-resource-receipt.json",seal(SCHEMA,"P-resource-receipt",{
                  "status":"PASS","detail":detail,"resources_are_not_an_independent_mathematical_result":True,
                  **FALSE_ASSURANCE}))

          def check_word():
              output_execution("P")
              root = REPORT / "word"
              require((REPORT / "P-stdout.json").read_bytes() == (root / "result.json").read_bytes(),"P-stdout-result-bytes")
              result = sealed(root / "result.json",WORD_SCHEMA + ".result")
              manifest,observed = compare_manifest(root,"manifest.json",["manifest.json","result.json"])
              require([x["file"] for x in observed["files"]] == WORD_FILES and observed["directories"] == [] and
                  manifest["file_roster"] == WORD_FILES and len(manifest["files"]) == 11,"complete-thirteen-word-files")
              word = sealed(root / "word-manifest.json",WORD_SCHEMA + ".word-manifest")
              target = sealed(root / "target-history.json",WORD_SCHEMA + ".target-history")
              pair = sealed(root / "normalized-pair.json",WORD_SCHEMA + ".normalized-pair")
              accepted = sealed(REPORT / "acceptance.json",WORD_SCHEMA + ".acceptance")
              require(result["status"] == "PASS" and result["terminal"] in ("NOT_APPLICABLE","POSITIVE_WORD_CANDIDATE") and
                  result["same_word_B_C"] is True and result["same_word_D"] is False and result["eleven_slot_replay"] is False,
                  "P-scope-without-premature-D")
              require(manifest["schema"] == WORD_SCHEMA + ".manifest" and manifest["all_inputs_unchanged"] is True and
                  result["manifest_sha256"] == digest(root / "manifest.json"),"P-top-manifest")
              for field,name in (("word_manifest_sha256","word-manifest.json"),("target_history_sha256","target-history.json"),
                      ("ancestor_index_sha256","ancestor-index.json"),("normalized_pair_sha256","normalized-pair.json"),
                      ("owner_sha256","owner.json"),("source_sha256","source.json"),("parent_roster_sha256","parent-roster.json"),
                      ("context_manifest_sha256","context.json")):
                  require(result[field] == digest(root / name),"P-output-receipt:" + field)
              require(result["accepted_head_sha256"] == accepted["selected"]["head"]["sha256"] and
                  result["accepted_checker_sha256"] == accepted["selected"]["checker"]["sha256"],"P-selected-HEAD")
              for key in ("completed_steps","rank","generation","state_head","target_remainder_sha256"):
                  require(result[key] == accepted["selected"][key],"P-current-snapshot:" + key)
              require(result["root_id"] == word["root_id"] == pair["same_root_id"] == manifest["root_id"] and
                  result["root_sha256"] == word["root_sha256"] == pair["same_root_sha256"] == manifest["root_sha256"],
                  "P-one-root-B-C-and-top")
              require(word["nodes_file"]["nodes"] == result["nodes"] and pair["word_manifest_sha256"] == digest(root / "word-manifest.json") and
                  pair["normalized_pair"] == result["normalized_pair"],"P-node-EOF-and-normalized-pair")
              require(result["resource_limits"] == {"max_seconds":5400,"max_memory_mib":7168} and
                  result["parent_inputs_unchanged"] is True and result["old_numerical_replays"] == 0 and result["eof"] is True,
                  "P-declared-ceilings-and-readonly-scope")
              for value in (result,word,target,manifest):
                  require(value["candidate"] is True and value["cross_checked"] is False and value["verified"] is False,"P-assurance")
              require(result["grade2_member"] == result["grade2_nonmember"] == "NOT_DECIDED" and result["full_A0"] is False and
                  result["side_conditions"] == "PENDING","P-no-grade2-verdict")
              resource_P()
              source_checkpoint("after-P-before-D")
              save("word-before-D.json",seal(SCHEMA,"word-before-D",{
                  "status":"PASS",**observed,"result":pin(root / "result.json","result.json"),
                  "word_manifest_sha256":digest(root / "word-manifest.json"),"root_id":word["root_id"],
                  "root_sha256":word["root_sha256"],**FALSE_ASSURANCE}))
              observed_report = scan(REPORT)
              retained_report(sealed(REPORT / "report-after-selftests.json")["inventory"],observed_report)
              save("report-before-D.json",seal(SCHEMA,"report-inventory",{
                  "boundary":"complete-P-before-independent-D","inventory":observed_report,
                  "earlier_report_files_unchanged":True,**FALSE_ASSURANCE}))

          def process_observation(label):
              files = {"stdout":REPORT / (label + "-stdout.json"),"stderr":REPORT / (label + ".log"),
                  "exit":REPORT / (label + "-exit-code.txt"),
                  "command":REPORT / "executions" / (label + "-command.json"),
                  "receipt":REPORT / "executions" / (label + "-receipt.json")}
              observed = {key:pin(path,path.relative_to(REPORT).as_posix()) for key,path in files.items() if path.is_file()}
              code,status,reason = None,None,None
              if files["exit"].is_file():
                  text = files["exit"].read_text(encoding="ascii")
                  require(re.fullmatch(r"-?[0-9]+\n",text),"complete-recorded-process-exit")
                  code = int(text)
              if files["stdout"].is_file():
                  try:
                      value = read(files["stdout"],True)
                      status = value.get("status") if isinstance(value,dict) else None
                  except Exception as error:
                      reason = "stdout-is-not-complete-canonical-result:" + type(error).__name__
              if code is None:
                  classification = "NOT_RUN_OR_OUTER_INTERRUPTED_BEFORE_EXIT_RECEIPT"
              elif code in (124,137,143):
                  classification = "OUTER_TIMEOUT_OR_SIGNAL"
              elif code == 3 and status == "UNKNOWN_RESOURCE":
                  classification = "UNKNOWN_RESOURCE"
              elif code == 0 and status == "PASS":
                  classification = "PROCESS_PASS_PENDING_ALL_WORKFLOW_GATES"
              else:
                  classification = "FAIL"
              return {"label":label,"files":observed,"exit_code":code,"stdout_status":status,
                  "classification":classification,"parse_diagnostic":reason,"is_complete_candidate":False}

          def always_preserve():
              errors, parent_rows, acquired_rows, code_rows = [], [], [], []
              def attempt(name,action):
                  try:
                      return action()
                  except Exception as error:
                      errors.append({"check":name,"reason":type(error).__name__ + ":" + str(error)})
                      return None

              # Gather each existing extraction before reading a possibly missing before receipt.
              # These extraction inventories remain diagnostics; they cannot replace accepted roots.
              for role in ROLES:
                  base = PARENT_BASE / role
                  observed = attempt("acquired-after:" + role,lambda base=base: scan(base))
                  if observed is None:
                      continue
                  row = {"role":role,"artifact":ARTIFACTS[role],"extraction_root":str(base),**observed}
                  acquired_rows.append(row)
                  before = attempt("acquired-before:" + role,lambda role=role:
                      sealed(REPORT / "acquired-parents" / (role + ".json"),SCHEMA + ".acquired-parent-before"))
                  def acquired_match(role=role,base=base,observed=observed,before=before):
                      require(before is not None and before["role"] == role and before["artifact"] == ARTIFACTS[role] and
                          before["extraction_root"] == str(base) and
                          before["live_intake"] == pin(REPORT / "live-parents" / (role + "-intake.json"),
                              "live-parents/" + role + "-intake.json") and
                          before["files"] == observed["files"] and before["directories"] == observed["directories"],
                          "acquired-extraction-unchanged:" + role)
                      return True
                  row["unchanged_from_acquisition"] = attempt("acquired-compare:" + role,acquired_match) is True
              save("acquired-parent-files-after.json",seal(SCHEMA,"acquired-parent-after",{
                  "parents":acquired_rows,"count":len(acquired_rows),"expected_count":16,**FALSE_ASSURANCE}))

              paths = attempt("parent-paths",lambda: read(REPORT / "parent-paths.json"))
              if not isinstance(paths,dict):
                  paths = {}
              for role in ROLES:
                  def parent_scan(role=role):
                      path = Path(paths[role])
                      base = PARENT_BASE / role
                      require(not path.is_symlink() and
                          (path.resolve() == base.resolve() or base.resolve() in path.resolve().parents),
                          "recorded-parent-contained:" + role)
                      parent_rows.append({"role":role,**scan(path)})
                  attempt("parent-after:" + role,parent_scan)
              before = attempt("parent-before",lambda:
                  sealed(REPORT / "all-parent-files-before.json",SCHEMA + ".all-parent-files"))
              def parents_match():
                  require(set(paths) == set(ROLES) and before is not None and
                      before["count"] == len(parent_rows) == 16 and before["parents"] == parent_rows,
                      "sixteen-parents-unchanged")
                  return True
              parents_ok = attempt("parents",parents_match) is True
              save("all-parent-files-after.json",seal(SCHEMA,"all-parent-files",{
                  "parents":parent_rows,"count":len(parent_rows),**FALSE_ASSURANCE}))

              # Actual after pins survive absence of the final acceptance/before baseline.
              for name in [*SOURCES,*RAW,WORKFLOW]:
                  row = attempt("source-after:" + name,lambda name=name: pin(REPO / name,name))
                  if row is not None:
                      code_rows.append(row)
              driver_after = attempt("driver-after",lambda: pin(REPORT / "driver.py","driver.py"))
              acceptance_after = attempt("acceptance-after",lambda: pin(REPORT / "acceptance.json","acceptance.json"))
              early = attempt("source-before-admission",lambda:
                  sealed(REPORT / "source-files-before-admission.json",SCHEMA + ".source-files-before-admission"))
              def early_sources_match():
                  require(early is not None and code_rows == early["files"] and driver_after == early["driver"] and
                      early["source_receipt"] == pin(REPORT / "source-receipt.json","source-receipt.json"),
                      "acquired-source-raw-workflow-driver-unchanged")
                  return True
              acquired_sources_ok = attempt("acquired-sources",early_sources_match) is True
              before_source = attempt("source-before",lambda:
                  sealed(REPORT / "all-source-files-before.json",SCHEMA + ".source-files"))
              def sources_match():
                  require(before_source is not None and code_rows == before_source["files"] and
                      acceptance_after == before_source["acceptance"] and driver_after == before_source["driver"],
                      "all-source-raw-acceptance-driver-bytes-unchanged")
                  return True
              sources_ok = attempt("source-raw-acceptance-driver",sources_match) is True
              save("all-source-files-after.json",seal(SCHEMA,"source-files",{
                  "files":code_rows,"acceptance":acceptance_after,"driver":driver_after,
                  "acquired_sources_unchanged":acquired_sources_ok,**FALSE_ASSURANCE}))

              outputs, output_status = {}, {}
              word_ok = False
              for label in ("word","D"):
                  observed = attempt("output-" + label,lambda label=label: scan(REPORT / label))
                  output_status[label] = "OBSERVED" if observed is not None else "INCOMPLETE_OR_NOT_CREATED"
                  if observed is not None:
                      outputs[label] = observed
                  if label == "word" and observed is not None:
                      before_word = attempt("word-before-D",lambda: sealed(REPORT / "word-before-D.json"))
                      def word_match():
                          require(before_word is not None and observed["files"] == before_word["files"] and
                              observed["directories"] == before_word["directories"],"word-byte-roster-unchanged-by-D")
                          return True
                      word_ok = attempt("word-unchanged-by-D",word_match) is True
              save("output-inventories.json",seal(SCHEMA,"output-inventories",{
                  "outputs":outputs,"status_by_output":output_status,**FALSE_ASSURANCE}))
              resource_rows = []
              for label,path in RESOURCE_PATHS.items():
                  if path.is_dir() and not path.is_symlink():
                      observed = attempt("resource-output:" + label,lambda path=path: scan(path))
                      resource_rows.append({"label":label,"path":str(path),"status":"OBSERVED" if observed is not None else "FAIL",
                          "inventory":observed,"completed_arithmetic_inferred":False})
                  elif path.exists() or path.is_symlink():
                      errors.append({"check":"resource-output:" + label,"reason":"invalid-existing-resource-root"})
                      resource_rows.append({"label":label,"path":str(path),"status":"FAIL","inventory":None})
                  else:
                      resource_rows.append({"label":label,"path":str(path),"status":"NOT_CREATED","inventory":None})
              process_rows = [attempt("process-observation:" + label,lambda label=label: process_observation(label))
                  for label in ("P_SELFTEST","D_SELFTEST","P","D")]
              save("resource-output-inventories.json",seal(SCHEMA,"resource-output-inventories",{
                  "resource_roots":resource_rows,"processes":process_rows,"registered_limits":RESOURCE_LIMITS,
                  "all_partial_files_preserved_without_cleanup":True,"missing_is_not_zero":True,**FALSE_ASSURANCE}))
              report_inventory = attempt("whole-REPORT-after",lambda: scan(REPORT))
              report_checks = {}
              for name in ("report-before-resources.json","report-after-selftests.json","report-before-D.json"):
                  baseline_path = REPORT / name
                  if not baseline_path.is_file():
                      report_checks[name] = "INCOMPLETE_BASELINE_NOT_CREATED"
                      errors.append({"check":name,"reason":"missing-before-boundary-receipt; no equality inferred"})
                      continue
                  def report_match(name=name):
                      baseline = sealed(REPORT / name,SCHEMA + ".report-inventory")
                      require(report_inventory is not None,"complete-current-report-inventory")
                      return retained_report(baseline["inventory"],report_inventory)
                  report_checks[name] = "PASS" if attempt("REPORT-before-after:" + name,report_match) is True else "FAIL"
