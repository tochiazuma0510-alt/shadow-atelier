              bad = retained_mutated()
              bad["directories"].append(bad["directories"][0])
              reject_retained("retained-duplicate-directory",bad)
              bad = retained_mutated()
              bad["files"][0]["bytes"] += 1
              reject_retained("retained-wrong-size",bad)
              bad = retained_mutated()
              bad["files"][0]["sha256"] = "0" * 64
              reject_retained("retained-wrong-hash",bad)
              bad = retained_mutated()
              bad["files"].pop()
              reject_retained("retained-missing-file",bad)
              bad = retained_mutated()
              bad["directories"].pop()
              reject_retained("retained-missing-directory",bad)
              bad = retained_mutated()
              bad["extra"] = 0
