name: torsweep-k13-t4t5

# Task 114 redesign.  The cancelled run 31575182611 rebuilt a 630-tree
# restricted matrix monolithically and had no mathematical checkpoint.  This
# version reuses the already completed T2/T3 aggregate for the identical pivot
# matrix, shards exact-column evaluation into 45-tree resumable jobs, and uses
# FLINT for the large exact product and determinants.  The same dispatch also
# runs the four independent wall-window crown shards and their abstract-model
# checker.  workflow_dispatch only.

on:
  workflow_dispatch:
    inputs:
      aggregate_run_id:
        description: 'Completed T2/T3 aggregate run containing the 2147483647 pivot result'
        required: true
        type: string
        default: '31550443891'
      k12_source_run_id:
        description: 'Completed K12 T4/T5 run used as the FLINT regression anchor'
        required: true
        type: string
        default: '31565199573'
      shard_size:
        description: 'Generator trees per exact-column shard'
        required: true
        type: number
        default: 45
      step2_hard_timeout_minutes:
        description: 'Hard child timeout; every completed tree is checkpointed'
        required: true
        type: number
        default: 110
      step2_job_timeout_minutes:
        description: 'Outer job timeout (must exceed hard timeout)'
        required: true
        type: number
        default: 125
      finalize_hard_timeout_minutes:
        description: 'FLINT finalize hard timeout'
        required: true
        type: number
        default: 100
      finalize_job_timeout_minutes:
        description: 'FLINT finalize outer timeout'
        required: true
        type: number
        default: 120
      wall_hard_timeout_minutes:
        description: 'Per-wall hard timeout; each wall is a separate artifact'
        required: true
        type: number
        default: 120
      wall_job_timeout_minutes:
        description: 'Per-wall outer timeout'
        required: true
        type: number
        default: 135
      resume_run_id:
        description: 'Optional earlier v2 run whose exact-column/finalize checkpoints are reused'
        required: false
        type: string
        default: ''
      release_tag:
        description: 'Release containing the exact K13 H_basis gzip'
        required: true
        type: string
        default: 'k13-basis-v1'
      exact_b_gzip_sha256:
        description: 'Expected release-asset gzip sha256'
        required: true
        type: string
        default: '753f77ab416c94bc2455caa3793c40b809a486ab47c931710699f1da35c05845'

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        shell: bash
        env:
          SHARD_SIZE: ${{ inputs.shard_size }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          size=int(os.environ['SHARD_SIZE'])
          if not 1 <= size <= 90:
              raise SystemExit('shard_size must be in [1,90]')
          rows=[]
          for label in ('A','B'):
              for start in range(0,630,size):
                  rows.append({'label':label,'start':start,'end':min(630,start+size)})
          print('matrix='+json.dumps({'include':rows},separators=(',',':')))
          PY

  pivot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download the completed identical-prime pivot aggregate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/in ci/out
          gh run download '${{ inputs.aggregate_run_id }}' \
            --repo '${{ github.repository }}' \
            --name torsweep-k13-aggregate-prime-2147483647-result \
            --dir ci/in
      - name: Validate provenance and adapt to the T4 step1 schema
        shell: bash
        run: |
          set -euo pipefail
          python search/torsweep_t4_step1_from_t23_k13.py \
            --aggregate-prime ci/in/aggregate_prime_2147483647.json \
            --aggregate-workflow-run '${{ inputs.aggregate_run_id }}' \
            --out ci/out/step1.json \
            --checkpoint ci/out/step1_checkpoint.json \
            2>&1 | tee ci/out/step1.log
          grep -q TORSWEEP_T4_STEP1_REUSED_DONE ci/out/step1.log
      - uses: actions/upload-artifact@v4
        with:
          name: torsweep-k13-t4t5-v2-step1
          path: ci/out/
          if-no-files-found: error
          retention-days: 30

  k12_flint_canary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "numpy==2.5.1" "sympy==1.14.0" "python-flint==0.8.0"
      - name: Download completed K12 reference artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/in ci/out
          for name in \
            torsweep-k12-t4t5-step1-artifact \
            torsweep-k12-t4t5-step2-a-artifact \
            torsweep-k12-t4t5-step2-b-artifact \
            torsweep-k12-t4t5-final-cert
          do
            gh run download '${{ inputs.k12_source_run_id }}' \
              --repo '${{ github.repository }}' --name "$name" --dir ci/in
          done
      - name: Reproduce K12 N_source, five minors, and gcd with FLINT
        shell: bash
        run: |
          set -euo pipefail
          python search/check_torsweep_t4_flint_k12.py \
            --step1 ci/in/step1.json \
            --step2-a ci/in/step2_a.json \
            --step2-b ci/in/step2_b.json \
            --reference-final ci/in/torsweep_k12_t4t5_finalize.json \
            --out ci/out/torsweep_t4_flint_k12_check.json \
            2>&1 | tee ci/out/k12_flint_check.log
          grep -q 'all_checks_true=True' ci/out/k12_flint_check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torsweep-k13-t4t5-v2-k12-flint-canary
          path: ci/out/
          if-no-files-found: error
          retention-days: 30

  step2:
    needs: [plan, pivot, k12_flint_canary]
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.step2_job_timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "numpy==2.5.1" "sympy==1.14.0"
      - uses: actions/download-artifact@v4
        with:
          name: torsweep-k13-t4t5-v2-step1
          path: ci/step1
      - name: Retrieve a matching earlier mathematical checkpoint when requested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          mkdir -p ci/resume ci/out
          if [ -n "$RESUME_RUN" ]; then
            gh run download "$RESUME_RUN" --repo '${{ github.repository }}' \
              --name 'torsweep-k13-t4t5-v2-step2-${{ matrix.label }}-${{ matrix.start }}-${{ matrix.end }}' \
              --dir ci/resume || true
          fi
      - name: Run exact-column tree shard under a hard process timeout
        id: producer
        shell: bash
        run: |
          set +e
          resume_args=()
          old=$(find ci/resume -name math_checkpoint.json -print -quit)
          if [ -n "$old" ]; then resume_args=(--resume-checkpoint "$old"); fi
          python ci/hard_timeout.py \
            --timeout-seconds "$(( ${{ inputs.step2_hard_timeout_minutes }} * 60 ))" \
            --heartbeat-seconds 15 --kill-grace-seconds 5 \
            --checkpoint ci/out/hard_timeout.json \
            --log ci/out/step2.log -- \
            python search/torsweep_t4_step2_shard_k13_gha.py \
              --step1-artifact ci/step1/step1.json \
              --modulus-label '${{ matrix.label }}' \
              --tree-start '${{ matrix.start }}' --tree-end '${{ matrix.end }}' \
              --checkpoint ci/out/math_checkpoint.json \
              "${resume_args[@]}" \
              --out ci/out/step2_shard.json
          echo "wrapper_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torsweep-k13-t4t5-v2-step2-${{ matrix.label }}-${{ matrix.start }}-${{ matrix.end }}
          path: ci/out/
          if-no-files-found: error
          retention-days: 30
      - name: Gate completed shard
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.producer.outputs.wrapper_exit }}' = '0'
          test -s ci/out/step2_shard.json
          grep -q TORSWEEP_T4_STEP2_SHARD_DONE ci/out/step2.log

  step2_aggregate:
    needs: step2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: torsweep-k13-t4t5-v2-step2-*
          path: ci/in
      - name: Assemble both exact moduli and compare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/out
          python search/torsweep_t4_step2_aggregate_k13.py \
            --shard-glob 'ci/in/**/step2_shard.json' --modulus-label A \
            --out ci/out/step2_a.json
          python search/torsweep_t4_step2_aggregate_k13.py \
            --shard-glob 'ci/in/**/step2_shard.json' --modulus-label B \
            --out ci/out/step2_b.json
          python - <<'PY'
          import json
          a=json.load(open('ci/out/step2_a.json'))
          b=json.load(open('ci/out/step2_b.json'))
          assert a['cols']==b['cols'], 'exact modulus A/B disagreement'
          print('exact_moduli_agree', True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: torsweep-k13-t4t5-v2-step2-aggregate
          path: ci/out/
          if-no-files-found: error
          retention-days: 30

  wall_producer:
    strategy:
      fail-fast: false
      matrix:
        wall: [wall24, wall28, wall36, wall37]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.wall_job_timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'
      - name: Run one wall-window producer under hard timeout
        id: producer
        shell: bash
        run: |
          set +e
          mkdir -p ci/out search/certs
          printf 'WALL_ONLY:="%s";;\nRead("search/probe/wall_crown_census_v1/wall_crown_census_v1.g");\n' \
            '${{ matrix.wall }}' > ci/out/wall_driver.g
          python ci/hard_timeout.py \
            --timeout-seconds "$(( ${{ inputs.wall_hard_timeout_minutes }} * 60 ))" \
            --heartbeat-seconds 15 --kill-grace-seconds 5 \
            --checkpoint ci/out/hard_timeout.json --log ci/out/wall.log -- \
            gap -q --quitonbreak -o 4g -K 5g ci/out/wall_driver.g
          echo "wrapper_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Copy mathematical artifact into the checkpoint bundle
        if: always()
        shell: bash
        run: |
          cp 'search/certs/wall_crown_census_v1_${{ matrix.wall }}_20260812.json' ci/out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-crown-v1-${{ matrix.wall }}
          path: ci/out/
          if-no-files-found: error
          retention-days: 30
      - name: Gate completed wall shard
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.producer.outputs.wrapper_exit }}' = '0'
          test -s 'ci/out/wall_crown_census_v1_${{ matrix.wall }}_20260812.json'
          grep -q WALL_CROWN_CENSUS_V1_DONE ci/out/wall.log
          python -m json.tool \
            'ci/out/wall_crown_census_v1_${{ matrix.wall }}_20260812.json' \
            >/dev/null

  wall_model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'
      - name: Run independent abstract AGL x S model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/out search/certs
          gap -q --quitonbreak -o 4g \
            search/probe/wall_crown_census_v1/wall_crown_model_checker_v1.g \
            2>&1 | tee ci/out/model.log
          cp search/certs/wall_crown_model_checker_v1_20260812.json ci/out/
          grep -q WALL_CROWN_MODEL_CHECKER_V1_DONE ci/out/model.log
          python3 -m json.tool \
            search/certs/wall_crown_model_checker_v1_20260812.json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wall-crown-v1-model
          path: ci/out/
          if-no-files-found: error
          retention-days: 30

  wall_combine:
    needs: [wall_producer, wall_model]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: wall-crown-v1-*
          path: ci/in
          merge-multiple: true
      - name: Merge producers and compare independent model signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/out
          python search/combine_wall_crown_census_v1.py \
            --input ci/in/wall_crown_census_v1_wall24_20260812.json \
            --input ci/in/wall_crown_census_v1_wall28_20260812.json \
            --input ci/in/wall_crown_census_v1_wall36_20260812.json \
            --input ci/in/wall_crown_census_v1_wall37_20260812.json \
            --out ci/out/wall_crown_census_v1_20260812.json
          python search/check_wall_crown_census_v1.py \
            --producer ci/out/wall_crown_census_v1_20260812.json \
            --model ci/in/wall_crown_model_checker_v1_20260812.json \
            --out ci/out/wall_crown_census_v1_check_20260812.json
          python - <<'PY'
          import json
          p=json.load(open('ci/out/wall_crown_census_v1_20260812.json'))
          c=json.load(open('ci/out/wall_crown_census_v1_check_20260812.json'))
          counts={x['label']:x['census']['maximal_class_count'] for x in p['positive_controls']}
          assert counts=={'K9':5,'roof972':8}, counts
          assert c['all_signatures_equal'] is True
          assert c['all_independent_theory_fields_equal'] is True
          assert all(w['all_charming_layers_represented'] for w in p['walls'])
          assert all(w['xi_image_equals_normalizer'] for w in p['walls'])
          print('positive_control_counts',counts)
          print('wall_distributions',[(w['label'],w['census']['abelian_crown_count'],w['census']['nonabelian_crown_count']) for w in p['walls']])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wall-crown-v1-final
          path: ci/out/
          if-no-files-found: error
          retention-days: 30

  finalize:
    needs: [step2_aggregate, pivot, k12_flint_canary]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJson(inputs.finalize_job_timeout_minutes) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install "numpy==2.5.1" "sympy==1.14.0" "python-flint==0.8.0"
      - uses: actions/download-artifact@v4
        with:
          name: torsweep-k13-t4t5-v2-step1
          path: ci/step1
      - uses: actions/download-artifact@v4
        with:
          name: torsweep-k13-t4t5-v2-step2-aggregate
          path: ci/step2
      - name: Download and authenticate exact K13 basis release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci/basis ci/out ci/resume
          gh release download '${{ inputs.release_tag }}' \
            --repo '${{ github.repository }}' --pattern '*.gz' --dir ci/basis
          got=$(sha256sum ci/basis/*.gz | awk '{print $1}')
          test "$got" = '${{ inputs.exact_b_gzip_sha256 }}'
          gunzip -k ci/basis/*.gz
      - name: Retrieve earlier finalize checkpoint when requested
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$RESUME_RUN" ]; then
            gh run download "$RESUME_RUN" --repo '${{ github.repository }}' \
              --name torsweep-k13-t4t5-v2-finalize --dir ci/resume || true
            # The aggregate embeds shard receipt SHA values, so a resumed
            # run's mathematically identical aggregate need not have the same
            # file SHA.  Reuse the aggregate that the checkpoint identity was
            # computed from; the current run has independently rebuilt and
            # compared both exact moduli in step2_aggregate above.
            mkdir -p ci/resume-step2
            gh run download "$RESUME_RUN" --repo '${{ github.repository }}' \
              --name torsweep-k13-t4t5-v2-step2-aggregate \
              --dir ci/resume-step2 || true
          fi
      - name: Run FLINT finalize under hard process timeout
        id: producer
        shell: bash
        run: |
          set +e
          resume_args=()
          old=$(find ci/resume -name finalize_checkpoint.json -print -quit)
          step2_a=ci/step2/step2_a.json
          step2_b=ci/step2/step2_b.json
          if [ -n "$old" ]; then
            old_a=$(find ci/resume-step2 -name step2_a.json -print -quit)
            old_b=$(find ci/resume-step2 -name step2_b.json -print -quit)
            if [ -n "$old_a" ] && [ -n "$old_b" ]; then
              step2_a="$old_a"
              step2_b="$old_b"
            fi
            resume_args=(--resume-checkpoint "$old")
          fi
          exact_b=$(find ci/basis -name '*.json' -print -quit)
          python ci/hard_timeout.py \
            --timeout-seconds "$(( ${{ inputs.finalize_hard_timeout_minutes }} * 60 ))" \
            --heartbeat-seconds 15 --kill-grace-seconds 5 \
            --checkpoint ci/out/finalize_hard_timeout.json \
            --log ci/out/finalize.log -- \
            python search/torsweep_t4_finalize_k13_v2_gha.py \
              --step1-artifact ci/step1/step1.json \
              --step2-a-artifact "$step2_a" \
              --step2-b-artifact "$step2_b" \
              --exact-b-cert "$exact_b" \
              --checkpoint ci/out/finalize_checkpoint.json \
              "${resume_args[@]}" \
              --out ci/out/torsweep_k13_t4t5_finalize_v2.json
          echo "wrapper_exit=$?" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: torsweep-k13-t4t5-v2-finalize
          path: ci/out/
          if-no-files-found: error
          retention-days: 30
      - name: Gate completed finalize
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.producer.outputs.wrapper_exit }}' = '0'
          test -s ci/out/torsweep_k13_t4t5_finalize_v2.json
          grep -q TORSWEEP_T4_FINALIZE_K13_V2_DONE ci/out/finalize.log
