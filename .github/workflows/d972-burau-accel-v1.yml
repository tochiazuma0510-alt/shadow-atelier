name: d972-burau-accel-v1

on:
  workflow_dispatch: {}
  push:
    branches:
      - sol/d972-dmtcp-provision-v420
    paths:
      - .github/workflows/d972-burau-accel-v1.yml
      - search/d972_b4_burau_accel_v1.py
      - search/check_d972_b4_burau_accel_v1.py
      - search/certs/d972_b4_word_key_artifact_v1_20260816.json

permissions:
  actions: read
  contents: read

env:
  CAL_RUN_ID: "32051744038"
  CAL_Q3_ID: "9296644565"
  CAL_Q4_ID: "9297445824"
  CAL_Q3_NAME: d972-burau-tuple-v4-calibration-q3-attempt1
  CAL_Q4_NAME: d972-burau-tuple-v4-calibration-q4-attempt1
  CAL_Q3_SHA256: 0813a151cd47a56f29aab629ebfc35a0293a8ce84d98c24f3a3ac3e0601ad8e2
  CAL_Q4_SHA256: 414c13fe680c2eeb6f3f75c7f6a7206a707c18a426da619543232e1a98855de2
  CAL_PRODUCER_SHA256: aa8726570c58840a000b4b247b34eccd39a958f97087e6745216e2055b578cec
  CAL_CHECKER_SHA256: e0b4cb923c1bd73b9afdc7f47de739f91c8aa3c0d7764c239e1df76d74fbce14
  PRODUCER_SHA256: fe9ee097c50a54ffc69ce9bcb820e7ac09847581eb82a3dd2d83962aab69e2dc
  CHECKER_SHA256: e36405fafb75ea3eaf096e507920b9d2ebe683e867a49a35c8f1bdcb708a0c7a

jobs:
  q5:
    name: q5-a${{ matrix.a }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        a: ["2", "4"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'

      - name: Verify pinned calibration artifact identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          repo = os.environ["GITHUB_REPOSITORY"]
          run_id = int(os.environ["CAL_RUN_ID"])
          expected = {
              int(os.environ["CAL_Q3_ID"]): {"name": os.environ["CAL_Q3_NAME"], "size": 95607},
              int(os.environ["CAL_Q4_ID"]): {"name": os.environ["CAL_Q4_NAME"], "size": 95523},
          }
          url = (f"https://api.github.com/repos/{repo}/actions/runs/"
                 f"{run_id}/artifacts?per_page=100")
          req = Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urlopen(req, timeout=30) as response:
              payload = json.load(response)
          artifacts = {int(x["id"]): x for x in payload.get("artifacts", [])}
          if set(expected) - set(artifacts):
              raise SystemExit("pinned calibration artifact id missing")
          for artifact_id, want in expected.items():
              item = artifacts[artifact_id]
              if item.get("name") != want["name"]:
                  raise SystemExit(f"artifact {artifact_id} name drift")
              if item.get("expired") is not False:
                  raise SystemExit(f"artifact {artifact_id} expired or malformed")
              if int(item.get("size_in_bytes", -1)) != want["size"]:
                  raise SystemExit(f"artifact {artifact_id} size drift")
              if int((item.get("workflow_run") or {}).get("id", -1)) != run_id:
                  raise SystemExit(f"artifact {artifact_id} run binding drift")
          print("D972_BURAU_ACCEL_PINNED_ARTIFACT_IDENTITY_PASS")
          PY

      - name: Download pinned q3 calibration
        uses: actions/download-artifact@v4
        with:
          name: d972-burau-tuple-v4-calibration-q3-attempt1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32051744038
          path: ci/in/q3

      - name: Download pinned q4 calibration
        uses: actions/download-artifact@v4
        with:
          name: d972-burau-tuple-v4-calibration-q4-attempt1
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 32051744038
          path: ci/in/q4

      - name: Install pinned Python dependencies and verify sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/wheels ci/out
          cat > ci/requirements-hashed.txt <<'EOF'
          sympy==1.14.0 --hash=sha256:e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5
          mpmath==1.3.0 --hash=sha256:a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
          EOF
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --no-deps --require-hashes --dest ci/wheels -r ci/requirements-hashed.txt
          python -m pip install --disable-pip-version-check --no-input --no-index --no-deps --require-hashes --find-links ci/wheels -r ci/requirements-hashed.txt
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(p):
              return hashlib.sha256(Path(p).read_bytes()).hexdigest()

          sources = {
              Path("search/d972_b4_burau_accel_v1.py"): os.environ["PRODUCER_SHA256"],
              Path("search/check_d972_b4_burau_accel_v1.py"): os.environ["CHECKER_SHA256"],
              Path("search/d972_b4_burau_fiber_v4.py"): os.environ["CAL_PRODUCER_SHA256"],
              Path("search/check_d972_b4_burau_fiber_v4.py"): os.environ["CAL_CHECKER_SHA256"],
          }
          for path, expected in sources.items():
              if sha(path) != expected:
                  raise SystemExit(f"source hash drift: {path}")
          receipts = {
              "q3": (Path("ci/in/q3/d972_b4_burau_fiber_v4_q3.json"), os.environ["CAL_Q3_SHA256"], 3, -1),
              "q4": (Path("ci/in/q4/d972_b4_burau_fiber_v4_q4.json"), os.environ["CAL_Q4_SHA256"], 4, 2),
          }
          for label, (path, expected, q, a) in receipts.items():
              if not path.is_file() or sha(path) != expected:
                  raise SystemExit(f"{label} calibration receipt hash/missing drift")
              obj = json.loads(path.read_bytes())
              if (obj.get("schema") != "d972-b4-burau-fiber/v4-lowmem" or
                  obj.get("final_marker") != "D972_B4_BURAU_FIBER_V4_FINAL" or
                  obj.get("producer_source_sha256") != os.environ["CAL_PRODUCER_SHA256"] or
                  obj.get("q") != q or obj.get("a") != a or
                  obj.get("row_count") != 972 or
                  not isinstance(obj.get("rows"), list) or len(obj["rows"]) != 972):
                  raise SystemExit(f"{label} calibration metadata drift")
          print("D972_BURAU_ACCEL_SOURCE_AND_CALIBRATION_HASH_PASS")
          PY

      - name: Run lightweight producer and checker selftests
        shell: bash
        run: |
          set -euo pipefail
          python search/d972_b4_burau_accel_v1.py --self-test | tee ci/out/accel-producer-selftest.log
          grep -Fq D972_B4_BURAU_ACCEL_V1_SELFTEST_PASS ci/out/accel-producer-selftest.log
          python search/check_d972_b4_burau_accel_v1.py --self-test | tee ci/out/accel-checker-selftest.log
          grep -Fq D972_B4_BURAU_ACCEL_CHECKER_FINAL_MARKER ci/out/accel-checker-selftest.log
          grep -Fq D972_B4_BURAU_ACCEL_PARTIAL_ALLPASS_NEGATIVE_PASS ci/out/accel-checker-selftest.log
          echo D972_BURAU_ACCEL_SELFTESTS_PASS

      - name: Independently recheck pinned legacy calibrations
        shell: bash
        run: |
          set -euo pipefail
          python search/check_d972_b4_burau_fiber_v4.py ci/in/q3/d972_b4_burau_fiber_v4_q3.json 2>&1 | tee ci/out/check-q3.log
          grep -Fq D972_B4_BURAU_FIBER_V4_CHECK_PASS ci/out/check-q3.log
          python search/check_d972_b4_burau_fiber_v4.py ci/in/q4/d972_b4_burau_fiber_v4_q4.json 2>&1 | tee ci/out/check-q4.log
          grep -Fq D972_B4_BURAU_FIBER_V4_CHECK_PASS ci/out/check-q4.log
          echo D972_BURAU_ACCEL_CALIBRATIONS_INDEPENDENT_CHECK_PASS

      - name: Run exact q5 acceleration producer
        shell: bash
        env:
          BURAU_A: ${{ matrix.a }}
        run: |
          set -euo pipefail
          ulimit -v 12000000
          q3=ci/in/q3/d972_b4_burau_fiber_v4_q3.json
          q4=ci/in/q4/d972_b4_burau_fiber_v4_q4.json
          receipt=ci/out/d972_b4_burau_accel_v1_a${BURAU_A}.json
          set +e
          python search/d972_b4_burau_accel_v1.py --q 5 --a "$BURAU_A" --calibration-q3 "$q3" --calibration-q4 "$q4" --output "$receipt" 2>&1 | tee ci/out/accel-a${BURAU_A}.log
          producer_status=${PIPESTATUS[0]}
          set -e
          test "$producer_status" -eq 0
          ! grep -Eq '(^|[[:space:]])(Traceback|Error|Exception)' ci/out/accel-a${BURAU_A}.log
          expected_candidate="D972_B4_BURAU_ACCEL_V1_FINAL status=CANDIDATE_B4_A_BURAU_FINITE_ZERO_FIBER output=$receipt"
          expected_allpass="D972_B4_BURAU_ACCEL_V1_FINAL status=UNKNOWN_BURAU_SPECIALIZATION_ALLPASS output=$receipt"
          candidate_count=$(grep -Fxc -- "$expected_candidate" ci/out/accel-a${BURAU_A}.log || true)
          allpass_count=$(grep -Fxc -- "$expected_allpass" ci/out/accel-a${BURAU_A}.log || true)
          test $((candidate_count + allpass_count)) -eq 1
          python - "$receipt" "$BURAU_A" <<'PY'
          import json
          import os
          import sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          allowed = {"CANDIDATE_B4_A_BURAU_FINITE_ZERO_FIBER", "UNKNOWN_BURAU_SPECIALIZATION_ALLPASS"}
          if r.get("status") not in allowed or r.get("schema") != "d972-b4-burau-accel/v1-witness":
              raise SystemExit("q5 status/schema gate failed")
          if (r.get("final_marker") != "D972_B4_BURAU_ACCEL_V1_FINAL" or
              r.get("q") != 5 or r.get("a") != int(sys.argv[2]) or
              r.get("producer_source_sha256") != os.environ["PRODUCER_SHA256"] or
              r.get("row_count") != 972 or
              r.get("kernel_generator_method") != "single exact BFS discovery witnesses"):
              raise SystemExit("q5 source/parameter/method gate failed")
          rows = r.get("rows")
          if not isinstance(rows, list) or not 1 <= len(rows) <= 972:
              raise SystemExit("q5 row ledger malformed")
          if [x.get("row_index") for x in rows] != list(range(1, len(rows) + 1)):
              raise SystemExit("q5 row index drift")
          if len({json.dumps(x.get("target_key"), sort_keys=True) for x in rows}) != len(rows):
              raise SystemExit("q5 duplicate key")
          zeros = [x for x in rows if x.get("identity_image_defect_count") == 0]
          if r["status"].startswith("CANDIDATE") and not zeros:
              raise SystemExit("candidate without zero fiber")
          if r["status"].startswith("CANDIDATE"):
              if (r.get("row_scan_complete") is not False or
                  r.get("row_scan_rows") != len(rows) or
                  r.get("terminal_zero_row_index") != len(rows) or
                  len(zeros) != 1 or rows[-1].get("identity_image_defect_count") != 0):
                  raise SystemExit("candidate partial-scan metadata drift")
          if r["status"].startswith("UNKNOWN") and zeros:
              raise SystemExit("all-pass with zero fiber")
          if r["status"].startswith("UNKNOWN") and (len(rows) != 972 or
              r.get("row_scan_complete") is not True or
              r.get("row_scan_rows") != 972 or
              r.get("terminal_zero_row_index") is not None):
              raise SystemExit("all-pass partial-scan metadata drift")
          gate = r.get("calibration_gate") or {}
          if gate.get("required_for_q5") is not True or gate.get("frozen_q3_q4_match") is not True:
              raise SystemExit("q5 calibration gate missing")
          print("D972_BURAU_ACCEL_RECEIPT_GATE_PASS", r["status"], len(zeros))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## D972 exact Burau acceleration q5 result\n")
              out.write(f"- a={r['a']} status=`{r['status']}` zero_rows=`{len(zeros)}`\n")
          PY

      - name: Independently check exact q5 receipt
        shell: bash
        env:
          BURAU_A: ${{ matrix.a }}
        run: |
          set -euo pipefail
          python search/check_d972_b4_burau_accel_v1.py ci/out/d972_b4_burau_accel_v1_a${BURAU_A}.json --calibration-q3 ci/in/q3/d972_b4_burau_fiber_v4_q3.json --calibration-q4 ci/in/q4/d972_b4_burau_fiber_v4_q4.json 2>&1 | tee ci/out/accel-check-a${BURAU_A}.log
          grep -Fq D972_B4_BURAU_ACCEL_CHECK_PASS ci/out/accel-check-a${BURAU_A}.log
          echo D972_BURAU_ACCEL_INDEPENDENT_CHECK_PASS

      - name: Upload complete exact evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d972-burau-accel-v1-q5-a${{ matrix.a }}-attempt${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ci/out/
            ci/in/
