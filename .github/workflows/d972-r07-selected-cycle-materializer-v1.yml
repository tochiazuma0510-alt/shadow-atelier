      - name: Resolve exact parent roots without copying parent files
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          def find(base_name, required):
              base = work / base_name
              matches = []
              for root in [base, *sorted(p for p in base.rglob("*") if p.is_dir())]:
                  if root.is_symlink() or (base != root and base not in root.resolve().parents):
                      raise SystemExit("unsafe parent root")
                  if all((root / name).is_file() for name in required):
                      for name in required:
                          cursor = root
                          for part in Path(name).parts:
                              cursor = cursor / part
                              assert not cursor.is_symlink()
                      matches.append(root.resolve())
              assert len(matches) == 1, (base_name, matches)
              return str(matches[0])
          paths = {
              "ORACLE_ROOT": find("current-oracle", ["output/manifest.json", "output/tree/witness.json", "checker-result.json", "source-receipt.json", "repair-source-receipt.json", "completion-run-receipt.json"]),
              "REFINEMENT_ROOT": find("current-refinement", ["output/HEAD", "output/start.json", "output/canonical-index.json", "checker-result.json", "source-receipt.json"]),
              "PACKET_ROOT": find("rank1359-packet", ["output/HEAD", "output/start.json", "checker-result.json", "source-receipt.json"]),
              "SEED34_ROOT": find("rank1356-seed34", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "DELTA_ROOT": find("rank1355-delta", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "PREPARE_ROOT": find("task554-prepare", ["prepare.HEAD"]),
              "P1_ROOT": find("p1", ["manifest.json", "instructions.jsonl", "degree2.cache.bin"]),
              "TASK712_ROOT": find("task712", ["r07-grade2-maps-v4-receipt.json", "r07-grade2-maps-v4-checker.json"]),
              "STATE_ROOT": find("separator", ["state/manifest.json", "state/physical.bin"])}
          for index in range(4):
              paths["BLOCK_" + str(index) + "_ROOT"] = find("task554-block-" + str(index), ["block-" + str(index) + ".HEAD"])
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in paths.items():
                  assert "\n" not in value and "\r" not in value
                  stream.write(key + "=" + value + "\n")
          (work / "parent-paths.json").write_text(json.dumps(paths, sort_keys=True) + "\n", encoding="ascii")
          oracle = Path(paths["ORACLE_ROOT"])
          pins = {
              "source-receipt.json": (2673, "cd9a45a389cafd0cfb3813181c1365b0a66cdd682cc737a1a68f27b438d92934"),
              "checker-result.json": (15387, "92739f2db1007ec9ee040716c9dcb26859c10e5a5917a377514bb8e4eb4cd41a"),
              "completion-run-receipt.json": (2089, "3c2eb678db147c7538adf7520f19d91610b255488464704d32a224f9cda4102b"),
              "repair-source-receipt.json": (3204, "2b2efda3b1922e30246621a8b8cf87a277587767ca77662a03b7a35ef821bd37"),
              "preserved-input.json": (10504, "332f6b62aca1042868e65117d4cc9de952ef8d4817d5169ae8a1ee1a9298e625"),
              "output/manifest.json": (1430, "7df077372a51d12cbf95be5f26c94a5e29ef0f6b118f1ed7efb452ba01942639"),
              "output/start.json": (48377, "7ff970e54dec57512593f5445fed387075d6602bff31f41b7db9f34bab045a2a"),
              "output/owner.json": (8419, "6c71fbc405105bd0722924a308594ba41aea6745725ae85d046ff7409998b322"),
              "output/source.json": (1246, "af1e178d19e4ee427439d102de74a559ed6202ca0a2839212a60748ccfe482ac"),
              "output/result.json": (13727, "c7f65255443a8901fa1b6fbab69e81bbc811014e1eb527e7f671e2f6343ba312"),
          }
          for name, (size, digest) in pins.items():
              raw = (oracle / name).read_bytes()
              assert len(raw) == size and hashlib.sha256(raw).hexdigest() == digest, name
          old = json.loads((oracle / "source-receipt.json").read_bytes())
          repair = json.loads((oracle / "repair-source-receipt.json").read_bytes())
          current = json.loads((work / "source-receipt.json").read_bytes())
          assert len(current["files"]) == 16 and current["files"][2:] == old["files"] == repair["files"][:14]
          assert repair["files"][-1]["sha256"] == "a44ce4baaa5c73a30b5b28a76a84589f0a661f11e029b7869868d4a88706880d"
          output = oracle / "output"
          files, directories = [], []
          for item in sorted(output.rglob("*")):
              assert not item.is_symlink()
              if item.is_dir():
                  directories.append(item.relative_to(output).as_posix())
              else:
                  raw = item.read_bytes()
                  files.append({"file": item.relative_to(output).as_posix(), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
          assert len(files) == 44 and directories == ["cochain", "geometry", "section", "tree"] and sum(item["bytes"] for item in files) == 5361492
          receipt = {"schema": "d972.r07.selected-cycle-materializer.v1.oracle-intake", "status": "PASS",
