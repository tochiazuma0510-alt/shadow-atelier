      - name: Confirm immutable oracle and source bytes and record the bounded run
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          import numpy as np
          work = Path(os.environ["RUNNER_TEMP"])
          source = json.loads((work / "source-receipt.json").read_bytes())
          for entry in source["files"]:
              item = Path(entry["file"])
              assert not item.is_symlink()
              raw = item.read_bytes()
              assert len(raw) == entry["bytes"] and hashlib.sha256(raw).hexdigest() == entry["sha256"]
          for name, pin in source["data"].items():
              item = Path(name)
              assert not item.is_symlink()
              raw = item.read_bytes()
              assert len(raw) == pin["bytes"] and hashlib.sha256(raw).hexdigest() == pin["sha256"]
          intake = json.loads((work / "oracle-intake-receipt.json").read_bytes())
          oracle = Path(os.environ["ORACLE_ROOT"])
          for entry in intake["entry_files"]:
              item = oracle / entry["file"]
              assert not item.is_symlink()
              raw = item.read_bytes()
              assert len(raw) == entry["bytes"] and hashlib.sha256(raw).hexdigest() == entry["sha256"]
          output = oracle / "output"
          files, directories = [], []
          for item in sorted(output.rglob("*")):
              assert not item.is_symlink()
              if item.is_dir():
                  directories.append(item.relative_to(output).as_posix())
              else:
                  raw = item.read_bytes()
                  files.append({"file": item.relative_to(output).as_posix(), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()})
          assert files == intake["output_files"] and directories == intake["output_directories"]
          producer = json.loads((work / "producer-result.json").read_bytes())
          checked = json.loads((work / "checker-result.json").read_bytes())
          assert producer["terminal"] == checked["terminal"] and producer["status"] == checked["status"]
          if checked["status"] == "PASS":
              assert producer["rank_after"] == checked["rank"] == 1386 and producer["generation_after"] == checked["generation"] == 8091
              assert producer["state_head"] == checked["state_head"] and producer["selected_scalar"] == checked["selected_scalar"]
              assert producer["target"]["scalar"] == checked["target_scalar"]
              assert checked["positive_readout"] in ("TASK958_PENDING", "NOT_APPLICABLE")
              assert checked["grade2_member"] == checked["grade2_nonmember"] == "NOT_DECIDED"
              assert checked["full_normalized_word_replay"] is False and checked["eleven_slot_replay"] is False
          workflow = Path(".github/workflows/d972-r07-selected-cycle-materializer-v1.yml")
          raw_workflow = workflow.read_bytes()
          receipt = {"schema": "d972.r07.selected-cycle-materializer.v1.run-receipt", "status": checked["status"],
              "terminal": checked["terminal"], "launch": {"run": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "head": os.environ["GITHUB_SHA"]},
              "workflow": {"file": workflow.as_posix(), "bytes": len(raw_workflow), "sha256": hashlib.sha256(raw_workflow).hexdigest()},
              "producer_invocations": 1, "checker_invocations": 1, "old_success_suites": 0, "old_oracle_arithmetic_replayed": False,
              "retained_v1_geometry_fixture_only_in_new_canary": True, "v2_checker_imported_or_executed": False,
              "new_interface_canary_groups": {"producer": 3, "checker": 3}, "metadata_refusal_cases_each": 20,
              "producer_internal_seconds": 1800, "checker_internal_seconds": 1800, "producer_outer_minutes": 40, "checker_outer_minutes": 40,
              "job_minutes": 100, "python": sys.version, "numpy": np.__version__, "source_unchanged": True, "oracle_unchanged": True,
              "oracle_artifact": intake["artifact"], "oracle_intake_sha256": hashlib.sha256((work / "oracle-intake-receipt.json").read_bytes()).hexdigest(),
              "source_receipt_sha256": hashlib.sha256((work / "source-receipt.json").read_bytes()).hexdigest(),
              "producer_result_sha256": hashlib.sha256((work / "producer-result.json").read_bytes()).hexdigest(),
              "checker_result_sha256": hashlib.sha256((work / "checker-result.json").read_bytes()).hexdigest(),
              "physical_appends": checked["physical_appends"], "cross_checked": False, "verified": False}
          (work / "run-receipt.json").write_text(json.dumps(receipt, sort_keys=True, separators=(",", ":")) + "\n", encoding="ascii")
