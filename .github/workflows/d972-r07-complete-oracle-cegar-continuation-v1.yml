      - name: Resolve fourteen parent roots and preserve both immediate parents
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def find(base_name, required):
              base = work / base_name
              matches = []
              for root in [base, *sorted(p for p in base.rglob("*") if p.is_dir())]:
                  assert not root.is_symlink() and (root == base or base in root.resolve().parents)
                  if all((root / name).is_file() for name in required):
                      for name in required:
                          cursor = root
                          for part in Path(name).parts:
                              cursor = cursor / part
                              assert not cursor.is_symlink()
                      matches.append(root.resolve())
              assert len(matches) == 1, (base_name, matches)
              return str(matches[0])
          paths = {
              "E_ROOT": find("current-e", ["output/HEAD", "output/manifest.json", "checker-result.json", "source-receipt.json", "run-receipt.json"]),
              "ORACLE_ROOT": find("current-oracle", ["output/manifest.json", "output/tree/witness.json", "checker-result.json", "source-receipt.json", "repair-source-receipt.json", "completion-run-receipt.json"]),
              "REFINEMENT_ROOT": find("current-refinement", ["output/HEAD", "output/start.json", "output/canonical-index.json", "checker-result.json", "source-receipt.json"]),
              "PACKET_ROOT": find("rank1359-packet", ["output/HEAD", "output/start.json", "checker-result.json", "source-receipt.json"]),
              "SEED34_ROOT": find("rank1356-seed34", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "DELTA_ROOT": find("rank1355-delta", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "PREPARE_ROOT": find("task554-prepare", ["prepare.HEAD"]),
              "P1_ROOT": find("p1", ["manifest.json", "instructions.jsonl", "degree2.cache.bin"]),
              "TASK712_ROOT": find("task712", ["r07-grade2-maps-v4-receipt.json", "r07-grade2-maps-v4-checker.json"]),
              "STATE_ROOT": find("separator", ["state/manifest.json", "state/physical.bin"])}
          for index in range(4):
              paths["BLOCK_" + str(index) + "_ROOT"] = find("task554-block-" + str(index), ["block-" + str(index) + ".HEAD"])
          assert len(paths) == 14
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in paths.items():
                  assert "\n" not in value and "\r" not in value
                  stream.write(key + "=" + value + "\n")
          (work / "parent-paths.json").write_bytes(canonical(paths))
          def literal_pin_table(source, name):
              tree = ast.parse(Path(source).read_bytes())
              matches = [node.value for node in tree.body if isinstance(node, ast.AnnAssign) and
                         isinstance(node.target, ast.Name) and node.target.id == name]
              if not matches:
                  matches = [node.value for node in tree.body if isinstance(node, ast.Assign) and
                             any(isinstance(target, ast.Name) and target.id == name for target in node.targets)]
              assert len(matches) == 1
              return ast.literal_eval(matches[0])
          oracle_pins = literal_pin_table("search/check_d972_r07_selected_cycle_materializer_v1.py", "ORACLE_FILES")
          e_pins = literal_pin_table("search/check_d972_r07_complete_oracle_cegar_continuation_v1.py", "E_FILES")
          assert len(oracle_pins) == len(e_pins) == 10
          parents = []
          for label, pins, count, byte_count, expected_dirs in (
              ("ORACLE", oracle_pins, 44, 5361492, ["cochain", "geometry", "section", "tree"]),
              ("E", e_pins, 29, 8731365, [])):
              root = Path(paths[label + "_ROOT"])
              for name, (size, digest) in pins.items():
                  data = (root / name).read_bytes()
                  assert len(data) == size and hashlib.sha256(data).hexdigest() == digest, name
              output = root / "output"
              files, directories = [], []
              for item in sorted(output.rglob("*")):
                  assert not item.is_symlink()
                  if item.is_dir():
                      directories.append(item.relative_to(output).as_posix())
                  else:
                      data = item.read_bytes()
                      files.append({"file": item.relative_to(output).as_posix(), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              assert len(files) == count and directories == expected_dirs and sum(item["bytes"] for item in files) == byte_count
              artifact = {"run": int(os.environ[label + "_RUN"]), "attempt": int(os.environ[label + "_ATTEMPT"]),
                  "head": os.environ[label + "_HEAD"], "id": int(os.environ[label + "_ARTIFACT_ID"]),
                  "name": os.environ[label + "_ARTIFACT_NAME"], "bytes": int(os.environ[label + "_ARCHIVE_BYTES"]),
                  "sha256": os.environ[label + "_ARCHIVE_DIGEST"]}
              parents.append({"role": label.lower(), "artifact": artifact,
                  "entry_files": [{"file": name, "bytes": pin[0], "sha256": pin[1]} for name, pin in sorted(pins.items())],
                  "output_files": files, "output_directories": directories})
          oracle = Path(paths["ORACLE_ROOT"])
          external = Path(paths["E_ROOT"])
          old = json.loads((oracle / "source-receipt.json").read_bytes())
          repair = json.loads((oracle / "repair-source-receipt.json").read_bytes())
          e_source = json.loads((external / "source-receipt.json").read_bytes())
          current = json.loads((work / "source-receipt.json").read_bytes())
          assert len(current["files"]) == 19 and current["files"][3:] == e_source["files"]
          assert current["files"][5:] == old["files"] == repair["files"][:14]
          assert current["files"][2] == repair["files"][-1]
          assert current["data"] == e_source["data"] and all(current["data"][key] == value for key, value in old["data"].items())
          receipt = {"schema": "d972.r07.complete-oracle-cegar-continuation.v1.parent-intake", "status": "PASS",
              "parents": parents, "executable_count": 19, "new_executables": 2,
              "new_v2_checker_import": True, "old_success_suites": 0, "verified": False, "cross_checked": False}
          (work / "parent-intake-receipt.json").write_bytes(canonical(receipt))
          PY

