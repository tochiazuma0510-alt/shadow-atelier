            --packet-root "$PACKET_ROOT" --refinement-root "$REFINEMENT_ROOT" --oracle-root "$ORACLE_ROOT" --e-root "$E_ROOT"
            --prepare-root "$PREPARE_ROOT" --block-root "$BLOCK_0_ROOT" --block-root "$BLOCK_1_ROOT"
            --block-root "$BLOCK_2_ROOT" --block-root "$BLOCK_3_ROOT" --p1-root "$P1_ROOT" --task712-root "$TASK712_ROOT")
          terminal=$(jq -r '.terminal' "$RUNNER_TEMP/producer-first-result.json")
          kind=$(jq -r '.kind' "$RUNNER_TEMP/producer-first-result.json")
          if [ "$kind" = "Separator" ] && [ "$terminal" != "COMPLETE_ZERO_CANDIDATE" ]; then
            set +e
            timeout --kill-after=60s "${RESUME_CAP_MINUTES}m" python -B search/d972_r07_complete_oracle_cegar_continuation_v1.py \
              "${parents[@]}" --output "$RUNNER_TEMP/output" --resume --max-appends 32 --max-seconds 5400 \
              > "$RUNNER_TEMP/producer-resume-result.json" 2> "$RUNNER_TEMP/producer-resume.log"
            code=$?
            set -e
            printf '%s\n' "$code" > "$RUNNER_TEMP/producer-resume-exit-code.txt"
            test "$code" = 0
            cp "$RUNNER_TEMP/producer-resume-result.json" "$RUNNER_TEMP/producer-result.json"
          else
            printf '%s\n' 'terminal-after-first-invocation' > "$RUNNER_TEMP/resume-skipped.txt"
            cp "$RUNNER_TEMP/producer-first-result.json" "$RUNNER_TEMP/producer-result.json"
          fi
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"])
          output = work / "output"
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          first = json.loads((work / "first-prefix-preservation.json").read_bytes())
          for record in first["files"]:
              data = (output / record["file"]).read_bytes()
              assert len(data) == record["bytes"] and hashlib.sha256(data).hexdigest() == record["sha256"], record["file"]
          assert all((output / name).is_dir() for name in first["directories"])
          raw = (output / "result.json").read_bytes()
          assert raw == (work / "producer-result.json").read_bytes()
          result = json.loads(raw)
          head_raw = (output / "HEAD").read_bytes()
          head = json.loads(head_raw)
          assert first["head"]["completed_steps"] <= result["completed_steps"] == head["completed_steps"] <= 32
          assert result["head_sha256"] == hashlib.sha256(head_raw).hexdigest()
          for name in ("owner_sha256", "source_sha256", "start_sha256", "fixed_manifest_sha256"):
              assert head[name] == first["head"][name], name
          assert result["terminal"] in ("UNKNOWN_CAP", "UNKNOWN_RESOURCE", "COMPLETE_ZERO_CANDIDATE", "LINEAR_MEMBERSHIP_CANDIDATE")
          assert result["external_e_attached"] == 1 and result["external_e_numerically_replayed"] is False
          assert result["new_physical_appends"] == result["completed_steps"]
          start = json.loads((output / "start.json").read_bytes())
          assert start["rank"] == 1386 and start["generation"] == 8091 and start["completed_steps"] == 0
          assert result["rank"] == start["rank"] + result["completed_steps"]
          assert result["generation"] == start["generation"] + result["completed_steps"]
          invocations = [json.loads(item.read_bytes()) for item in (output / "invocations").glob("*.json") if not item.name.startswith(".")]
          selected = [item for item in invocations if hashlib.sha256(canonical(item)).hexdigest() == result["invocation_sha256"]]
          assert len(selected) == 1
          resumed = (work / "producer-resume-result.json").exists()
          assert selected[0]["resume"] is resumed
          if resumed:
              assert selected[0]["head_before_sha256"] == hashlib.sha256((work / "producer-first-HEAD.json").read_bytes()).hexdigest()
              assert selected[0]["completed_steps_before"] == first["head"]["completed_steps"]
              assert selected[0]["max_appends"] == result["max_appends_this_invocation"] == 32
              assert selected[0]["max_seconds"] == result["max_seconds_this_invocation"] == 5400
          files, directories = [], []
          for item in sorted(output.rglob("*")):
              assert not item.is_symlink()
              if item.is_dir():
                  directories.append(item.relative_to(output).as_posix())
              else:
                  data = item.read_bytes()
                  files.append({"file": item.relative_to(output).as_posix(), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          receipt = {"schema": "d972.r07.complete-oracle-cegar-continuation.v1.producer-output-before-checker",
              "files": files, "directories": directories, "resumed": resumed, "first_completed_steps": first["head"]["completed_steps"],
              "completed_steps": head["completed_steps"], "head_sha256": hashlib.sha256(head_raw).hexdigest(),
              "first_prefix_unchanged": True, "candidate": True, "cross_checked": False, "verified": False}
          (work / "producer-output-before-checker.json").write_bytes(canonical(receipt))
          PY

      - name: Independently replay every new snapshot step and current checkpoint
        shell: bash
        run: |
          set -euo pipefail
          parents=(--state-root "$STATE_ROOT" --delta-root "$DELTA_ROOT" --seed34-root "$SEED34_ROOT"
            --packet-root "$PACKET_ROOT" --refinement-root "$REFINEMENT_ROOT" --oracle-root "$ORACLE_ROOT" --e-root "$E_ROOT"
            --prepare-root "$PREPARE_ROOT" --block-root "$BLOCK_0_ROOT" --block-root "$BLOCK_1_ROOT"
            --block-root "$BLOCK_2_ROOT" --block-root "$BLOCK_3_ROOT" --p1-root "$P1_ROOT" --task712-root "$TASK712_ROOT")
          set +e
          timeout --kill-after=60s "${CHECKER_CAP_MINUTES}m" python -B search/check_d972_r07_complete_oracle_cegar_continuation_v1.py \
            "${parents[@]}" --candidate-root "$RUNNER_TEMP/output" --output "$RUNNER_TEMP/checker-result.json" --max-seconds 10800 \
            > "$RUNNER_TEMP/checker-stdout.json" 2> "$RUNNER_TEMP/checker.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/checker-exit-code.txt"
          test "$code" = 0
          cmp "$RUNNER_TEMP/checker-stdout.json" "$RUNNER_TEMP/checker-result.json"
          jq -e '(.schema == "d972.r07.complete-oracle-cegar-continuation.v1.checker-result" and .status == "PASS" and
            .all_new_committed_arrays_and_json_compared == true and .current_checkpoint_fully_compared == true and
            .prefix_steps_replayed == .completed_steps and .physical_appends == .completed_steps and
            .full_four_character_scope == true and .section_equalities_each == 8059 and .chords_each == 54433 and
            .auxiliary_tests_each == 2 and .ordinary27_actual_source == true and .source_lower_trits_each_E == 96776 and
            .literal_modulus == 54 and .all_four_B_summed_each_E == true and .external_e_attached == 1 and
            .external_e_numerically_replayed == false and .old_scans_numerically_replayed == 0 and
            .old_inserts_numerically_replayed == 0 and .old_success_suites == 0 and
            .grade2_member == "NOT_DECIDED" and .grade2_nonmember == "NOT_DECIDED" and
            .full_A0 == false and .whole_normalized_word_replay == false and .eleven_slot_replay == false and
            .verified == false and .cross_checked == false)' "$RUNNER_TEMP/checker-result.json" > /dev/null

      - name: Preserve producer output and confirm source and immediate parent immutability
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"])
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def scan(root):
              files, directories = [], []
              if root.exists():
                  for item in sorted(root.rglob("*")):
                      assert not item.is_symlink()
                      if item.is_dir():
                          directories.append(item.relative_to(root).as_posix())
                      else:
                          data = item.read_bytes()
                          files.append({"file": item.relative_to(root).as_posix(), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
              return files, directories
          source_checked = parent_checked = output_checked = False
          if (work / "source-receipt.json").exists():
              source = json.loads((work / "source-receipt.json").read_bytes())
              assert len(source["files"]) == 19
              for record in source["files"]:
                  item = Path(record["file"])
                  data = item.read_bytes()
                  assert not item.is_symlink() and len(data) == record["bytes"] and hashlib.sha256(data).hexdigest() == record["sha256"], record["file"]
              for name, record in source["data"].items():
                  data = Path(name).read_bytes()
                  assert not Path(name).is_symlink() and len(data) == record["bytes"] and hashlib.sha256(data).hexdigest() == record["sha256"], name
              source_checked = True
          if (work / "parent-intake-receipt.json").exists():
              paths = json.loads((work / "parent-paths.json").read_bytes())
              intake = json.loads((work / "parent-intake-receipt.json").read_bytes())
              for parent in intake["parents"]:
                  root = Path(paths[parent["role"].upper() + "_ROOT"])
                  for record in parent["entry_files"]:
                      data = (root / record["file"]).read_bytes()
                      assert len(data) == record["bytes"] and hashlib.sha256(data).hexdigest() == record["sha256"], record["file"]
                  files, directories = scan(root / "output")
                  assert files == parent["output_files"] and directories == parent["output_directories"], parent["role"]
              parent_checked = True
          files, directories = scan(work / "output")
          if (work / "producer-output-before-checker.json").exists():
              before = json.loads((work / "producer-output-before-checker.json").read_bytes())
              assert files == before["files"] and directories == before["directories"]
              output_checked = True
          receipt = {"schema": "d972.r07.complete-oracle-cegar-continuation.v1.preservation", "status": "PASS",
              "source_checked_unchanged": source_checked, "immediate_parents_checked_unchanged": parent_checked,
              "producer_output_checked_unchanged": output_checked, "files": files, "directories": directories,
              "output_bytes": sum(item["bytes"] for item in files), "checker_status_is_separate": True,
              "candidate": False, "cross_checked": False, "verified": False}
          (work / "preservation-result.json").write_bytes(canonical(receipt))
          PY

      - name: Record the actual bounded continuation and its independent prefix receipt
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          import numpy as np
          work = Path(os.environ["RUNNER_TEMP"])
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def read(name):
              return json.loads((work / name).read_bytes())
          def digest(name):
              return hashlib.sha256((work / name).read_bytes()).hexdigest()
          checked, produced = read("checker-result.json"), read("producer-result.json")
          head, start = read("output/HEAD"), read("output/start.json")
          source, preservation = read("source-receipt.json"), read("preservation-result.json")
          before, first = read("producer-output-before-checker.json"), read("producer-first-result.json")
          assert checked["status"] == "PASS" and checked["prefix_steps_replayed"] == checked["completed_steps"]
          for field in ("completed_steps", "rank", "generation", "kind", "state_head", "target_remainder_sha256", "lambda_sha256"):
              assert checked[field] == produced[field] == head[field], field
          assert checked["terminal"] == produced["terminal"]
          assert checked["head_sha256"] == produced["head_sha256"] == digest("output/HEAD")
          assert checked["result_sha256"] == digest("output/result.json") == digest("producer-result.json")
          assert checked["checker_sha256"] == os.environ["CHECKER_SHA256"]
          assert checked["oracle_checker_v2_sha256"] == "a44ce4baaa5c73a30b5b28a76a84589f0a661f11e029b7869868d4a88706880d"
          assert checked["retained_E_checker_sha256"] == "a6d52e0d12d97201f0a19f25c54e0924e3fbea89fefa3554727a7178881218b4"
          assert checked["rank"] == start["rank"] + checked["completed_steps"] and start["rank"] == 1386
          assert checked["generation"] == start["generation"] + checked["completed_steps"] and start["generation"] == 8091
          for field in ("source_checked_unchanged", "immediate_parents_checked_unchanged", "producer_output_checked_unchanged"):
              assert preservation[field] is True, field
          v2 = read("oracle-v2-full-selftest.json")
          assert v2["status"] == "PASS" and len(v2["tests"]) == 4 and all(item["status"] == "PASS" for item in v2["tests"])
          assert len(read("producer-selftest.json")["groups"]) == len(read("checker-selftest.json")["tests"]) == 3
          assert len(read("producer-parent-layout.json")["rejected_cases"]) == len(read("checker-parent-layout.json")["rejected_cases"]) == 5
          if produced["terminal"] == "LINEAR_MEMBERSHIP_CANDIDATE":
              assert produced["positive_readout"] == "TASK958_PENDING" and produced["lambda_sha256"] is None
          if produced["terminal"] == "COMPLETE_ZERO_CANDIDATE":
              assert checked["current_oracle_terminal"] == "COMPLETE_ZERO_CANDIDATE"
          workflow = Path(".github/workflows/d972-r07-complete-oracle-cegar-continuation-v1.yml")
          raw = workflow.read_bytes()
          receipt = {"schema": "d972.r07.complete-oracle-cegar-continuation.v1.run-receipt", "status": "PASS",
              "launch": {"run": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]), "head": os.environ["GITHUB_SHA"]},
              "workflow": {"file": str(workflow), "bytes": len(raw), "sha256": hashlib.sha256(raw).hexdigest()},
              "source_receipt_sha256": digest("source-receipt.json"), "parent_intake_sha256": digest("parent-intake-receipt.json"),
              "preservation_sha256": digest("preservation-result.json"), "checker_result_sha256": digest("checker-result.json"),
              "producer_result_sha256": digest("output/result.json"), "head_sha256": digest("output/HEAD"),
              "terminal": produced["terminal"], "completed_steps": produced["completed_steps"], "rank": produced["rank"],
              "generation": produced["generation"], "state_head": produced["state_head"], "actual_parent_artifacts": 14,
              "first_max_appends": 1, "resume_max_appends": 32, "first_internal_seconds": 1800, "first_outer_minutes": 40,
              "resume_internal_seconds": 5400, "resume_outer_minutes": 100, "checker_internal_seconds": 10800, "checker_outer_minutes": 190,
              "job_minutes": 350, "producer_invocations": 2 if before["resumed"] else 1, "actual_resume": before["resumed"],
              "first_completed_steps": first["completed_steps"], "first_prefix_unchanged": before["first_prefix_unchanged"],
              "checker_invocations": 1, "oracle_v2_full_selftest_invocations": 1, "oracle_v2_full_selftest_groups": 4,
              "oracle_v2_full_selftest_sha256": digest("oracle-v2-full-selftest.json"), "new_interface_groups_each": 3,
              "new_metadata_refusal_cases_each": 5, "old_success_suites": 0, "old_complete_oracle_production_invocations": 0,
              "external_e_numerically_replayed": False, "source_executables": len(source["files"]), "raw_data_files": len(source["data"]),
              "python": sys.version, "numpy": np.__version__, "candidate": True, "cross_checked": False, "verified": False}
          (work / "run-receipt.json").write_bytes(canonical(receipt))
          PY

