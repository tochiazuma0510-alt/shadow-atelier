          set +e
          timeout --kill-after=60s "${FIRST_CAP_MINUTES}m" python -B search/d972_r07_complete_oracle_cegar_continuation_v1.py \
            "${parents[@]}" --output "$RUNNER_TEMP/output" --max-appends 1 --max-seconds 1800 \
            > "$RUNNER_TEMP/producer-first-result.json" 2> "$RUNNER_TEMP/producer-first.log"
          code=$?
          set -e
          printf '%s\n' "$code" > "$RUNNER_TEMP/producer-first-exit-code.txt"
          test "$code" = 0
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"])
          output = work / "output"
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          raw = (output / "result.json").read_bytes()
          assert raw == (work / "producer-first-result.json").read_bytes()
          result = json.loads(raw)
          head = json.loads((output / "HEAD").read_bytes())
          assert result["schema"] == "d972.r07.complete-oracle-cegar-continuation.v1.result"
          assert result["terminal"] in ("UNKNOWN_CAP", "UNKNOWN_RESOURCE", "COMPLETE_ZERO_CANDIDATE", "LINEAR_MEMBERSHIP_CANDIDATE")
          assert 0 <= result["completed_steps"] == head["completed_steps"] <= 1
          assert result["max_appends_this_invocation"] == 1 and result["max_seconds_this_invocation"] == 1800
          assert result["head_sha256"] == hashlib.sha256((output / "HEAD").read_bytes()).hexdigest()
          assert result["cross_checked"] is False and result["verified"] is False
          files, directories = [], []
          volatile = {"HEAD", "result.json", "resource-stop.json", "rejected.json"}
          for item in sorted(output.rglob("*")):
              assert not item.is_symlink()
              relative = item.relative_to(output)
              if any(part.startswith(".pending-") or ".pending-" in part for part in relative.parts):
                  continue
              if item.is_dir():
                  directories.append(relative.as_posix())
              elif relative.as_posix() not in volatile:
                  data = item.read_bytes()
                  files.append({"file": relative.as_posix(), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest()})
          (work / "producer-first-HEAD.json").write_bytes((output / "HEAD").read_bytes())
          (work / "first-prefix-preservation.json").write_bytes(canonical({"schema": "d972.r07.complete-oracle-cegar-continuation.v1.first-prefix-preservation",
              "files": files, "directories": directories, "head": head, "result_sha256": hashlib.sha256(raw).hexdigest(),
              "verified": False, "cross_checked": False}))
