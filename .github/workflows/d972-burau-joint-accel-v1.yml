name: d972-burau-joint-accel-v1

on:
  workflow_dispatch: {}
  push:
    branches:
      - sol/d972-dmtcp-provision-v420
    paths:
      - .github/workflows/d972-burau-joint-accel-v1.yml
      - search/d972_b4_burau_joint_accel_v1.py
      - search/check_d972_b4_burau_joint_accel_v1.py
      - search/certs/d972_b4_word_key_artifact_v1_20260816.json

permissions:
  contents: read

env:
  PRODUCER_SHA256: e3e77de7c328df792a3a77c1de3b6badbe479dc364c120faa28fef8d2d8a7404
  CHECKER_SHA256: 60599a0092bff16bf324775ad3a08d647cfa95f6b38516ab02165bb2c566e670
  WORDS_SHA256: 564a921be8114bdeb963f679c121e8d9aa90e148c65e95e393874fcba843e9f9

jobs:
  joint-accel:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        config:
          - q3a2_full
          - q4a2_full
          - q3a2_q4a2
          - q3a2_q4a2_q5a2
          - q3a2_q4a2_q5a4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.5'
      - name: Exact synchronized candidate accelerator
        shell: bash
        env:
          JOINT_CONFIG: ${{ matrix.config }}
        run: |
          set -euo pipefail
          mkdir -p ci/out ci/wheels
          cat > ci/requirements-hashed.txt <<'EOF'
          sympy==1.14.0 --hash=sha256:e091cc3e99d2141a0ba2847328f5479b05d94a6635cb96148ccb3f34671bd8f5
          mpmath==1.3.0 --hash=sha256:a0b2b9fe80bbcd81a6647ff13108738cfb482d481d826cc0e02f5b35e5c88d2c
          EOF
          python -m pip download --disable-pip-version-check --no-input --only-binary=:all: --no-deps --require-hashes --dest ci/wheels -r ci/requirements-hashed.txt
          python -m pip install --disable-pip-version-check --no-input --no-index --no-deps --require-hashes --find-links ci/wheels -r ci/requirements-hashed.txt
          python -c 'import sys, sympy; assert sys.version_info[:2] == (3,13); assert sympy.__version__ == "1.14.0"; print("PYTHON_SYMPY_VERSION_PASS", sys.version, sympy.__version__)'
          ulimit -v 12000000
          python -c 'import resource; soft, hard = resource.getrlimit(resource.RLIMIT_AS); expected = 12000000 * 1024; assert soft == expected; print("JOINT_ACCEL_VMEM_GUARD_PASS", "bytes", soft, "expected", expected, "hard", hard)'
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          expected = {
              Path("search/d972_b4_burau_joint_accel_v1.py"): os.environ["PRODUCER_SHA256"],
              Path("search/check_d972_b4_burau_joint_accel_v1.py"): os.environ["CHECKER_SHA256"],
              Path("search/certs/d972_b4_word_key_artifact_v1_20260816.json"): os.environ["WORDS_SHA256"],
          }
          for path, wanted in expected.items():
              if hashlib.sha256(path.read_bytes()).hexdigest() != wanted:
                  raise SystemExit(f"source/artifact hash drift: {path}")
          print("D972_B4_BURAU_JOINT_ACCEL_SOURCE_ARTIFACT_HASH_PASS")
          PY
          set +e
          python search/d972_b4_burau_joint_accel_v1.py --self-test 2>&1 | tee ci/out/selftest-$JOINT_CONFIG.log
          producer_self_status=${PIPESTATUS[0]}
          set -e
          test "$producer_self_status" -eq 0
          ! grep -Eq '(^|[[:space:]])(Traceback|Error|Exception)' ci/out/selftest-$JOINT_CONFIG.log
          grep -Fxc 'D972_B4_BURAU_JOINT_ACCEL_SELFTEST_PASS' ci/out/selftest-$JOINT_CONFIG.log | grep -Fx 1
          set +e
          python search/check_d972_b4_burau_joint_accel_v1.py --self-test 2>&1 | tee ci/out/check-selftest-$JOINT_CONFIG.log
          checker_self_status=${PIPESTATUS[0]}
          set -e
          test "$checker_self_status" -eq 0
          ! grep -Eq '(^|[[:space:]])(Traceback|Error|Exception)' ci/out/check-selftest-$JOINT_CONFIG.log
          grep -Fxc 'D972_B4_BURAU_JOINT_ACCEL_CHECKER_FINAL_MARKER status=PASS' ci/out/check-selftest-$JOINT_CONFIG.log | grep -Fx 1
          receipt="ci/out/d972_b4_burau_joint_accel_v1_${JOINT_CONFIG}.json"
          set +e
          python search/d972_b4_burau_joint_accel_v1.py --config "$JOINT_CONFIG" --output "$receipt" 2>&1 | tee ci/out/full-$JOINT_CONFIG.log
          full_status=${PIPESTATUS[0]}
          set -e
          test "$full_status" -eq 0
          ! grep -Eq '(^|[[:space:]])(Traceback|Error|Exception|UNKNOWN_RESOURCE)' ci/out/full-$JOINT_CONFIG.log
          test -s "$receipt"
          grep -Fxc 'D972_B4_BURAU_JOINT_ACCEL_V1_FINAL' ci/out/full-$JOINT_CONFIG.log | grep -Fx 1
          python - "$receipt" "$JOINT_CONFIG" <<'PY'
          import json
          import sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          allowed = {"CANDIDATE_B4_A_BURAU_JOINT_ZERO_FIBER", "UNKNOWN_BURAU_JOINT_ALLPASS"}
          if (r.get("schema") != "d972-b4-burau-joint-accel/v1-synchronized-witness" or
              r.get("final_marker") != "D972_B4_BURAU_JOINT_ACCEL_V1_FINAL" or
              r.get("config") != sys.argv[2] or r.get("status") not in allowed or
              r.get("row_count") != 972):
              raise SystemExit("joint accelerator scalar gate failed")
          rows = r.get("rows")
          if not isinstance(rows, list) or not (1 <= len(rows) <= 972):
              raise SystemExit("joint accelerator row gate failed")
          if r["status"] == "UNKNOWN_BURAU_JOINT_ALLPASS":
              if len(rows) != 972 or r.get("row_scan_complete") is not True or r.get("terminal_zero_row_index") is not None:
                  raise SystemExit("partial all-pass receipt")
          else:
              if r.get("row_scan_complete") is not False or r.get("terminal_zero_row_index") != len(rows) or rows[-1].get("full_GT_identity_count") != 0:
                  raise SystemExit("candidate terminal-fiber gate failed")
          keys = [json.dumps(x.get("target_key"), sort_keys=True, separators=(",", ":")) for x in rows]
          if len(set(keys)) != len(rows) or [x.get("row_index") for x in rows] != list(range(1, len(rows) + 1)):
              raise SystemExit("joint key/index gate failed")
          for row in rows:
              if row.get("fiber_size", 0) <= 0 or row.get("full_GT_identity_count") is None:
                  raise SystemExit("joint lossless fiber gate failed")
          print("D972_B4_BURAU_JOINT_ACCEL_RECEIPT_GATE_PASS")
          PY
          set +e
          python search/check_d972_b4_burau_joint_accel_v1.py "$receipt" 2>&1 | tee ci/out/check-$JOINT_CONFIG.log
          check_status=${PIPESTATUS[0]}
          set -e
          test "$check_status" -eq 0
          grep -Fq 'D972_B4_BURAU_JOINT_ACCEL_CHECK_PASS' ci/out/check-$JOINT_CONFIG.log
          echo D972_B4_BURAU_JOINT_ACCEL_INDEPENDENT_CHECK_PASS
      - name: Upload synchronized accelerator evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: d972-burau-joint-accel-v1-${{ matrix.config }}-attempt${{ github.run_attempt }}
          if-no-files-found: warn
          path: ci/out/
