          def safe_extract(archive, destination):
              destination.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  seen = set()
                  for entry in bundle.infolist():
                      name = entry.filename[:-1] if entry.is_dir() else entry.filename
                      safe_name(name)
                      need(name not in seen, "duplicate_ZIP_name")
                      seen.add(name)
                      mode = (entry.external_attr >> 16) & 0xffff
                      kind = stat.S_IFMT(mode)
                      need(kind in (0, stat.S_IFDIR, stat.S_IFREG) and not stat.S_ISLNK(mode) and not entry.flag_bits & 1, "ZIP_type_encryption")
                      need((not entry.is_dir() or kind in (0, stat.S_IFDIR)) and not (kind == stat.S_IFDIR and not entry.is_dir()), "ZIP_file_directory_type")
                      target = file_at(destination, name)
                      if entry.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          with bundle.open(entry) as source, target.open("xb") as output:
                              shutil.copyfileobj(source, output, 1024 * 1024)
                          need(target.stat().st_size == entry.file_size, "ZIP_EOF_size")

