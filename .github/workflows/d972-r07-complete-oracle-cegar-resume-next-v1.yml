          def terminal_type(output, head, result, n, cap):
              count, terminal = head["completed_steps"], result["terminal"]
              need(terminal in ("UNKNOWN_CAP", "UNKNOWN_RESOURCE", "COMPLETE_ZERO_CANDIDATE", "LINEAR_MEMBERSHIP_CANDIDATE"), "terminal_type")
              need(result["status"] == ("PASS" if terminal.endswith("CANDIDATE") else terminal), "terminal_status")
              if terminal == "UNKNOWN_CAP":
                  need(count == cap, "absolute_cap_reached")
              if terminal == "LINEAR_MEMBERSHIP_CANDIDATE":
                  need(head["kind"] == "LinearMembershipCandidate" and head["lambda_sha256"] is None and result["lambda_rho2"] is None and count > n, "linear_target_type")
                  need(result["positive_readout"] == "TASK958_PENDING", "positive_consumer_pending")
                  target = output / "snapshots" / f"{count-1:06d}" / "e/physical/target-remainder.bin"
                  need(target.stat().st_size == 12096 and digest(target) == head["target_remainder_sha256"] and not any(target.read_bytes()), "actual_linear_target_zero")
              else:
                  need(head["kind"] == "Separator" and head["lambda_sha256"] is not None, "separator_terminal")
              if head["current_snapshot_sha256"] is not None:
                  current = output / "snapshots" / f"{count:06d}"
                  need(digest(current / "start.json") == head["current_snapshot_sha256"], "actual_current_snapshot")
                  checkpoint = current / "checkpoints" / (head["current_checkpoint_sha256"] + ".json")
                  need(digest(checkpoint) == head["current_checkpoint_sha256"], "actual_current_checkpoint")
              else:
                  need(head["current_checkpoint_sha256"] is None, "no_dangling_checkpoint")
              if terminal == "COMPLETE_ZERO_CANDIDATE":
                  need(head["current_snapshot_sha256"] is not None, "complete_zero_needs_current_snapshot")
                  oracle = read(current / "oracle-result.json")
                  need(oracle["terminal"] == terminal and oracle["state_head"] == head["state_head"] and oracle["lambda_sha256"] == head["lambda_sha256"], "same_current_complete_oracle")
                  need(result["complete_zero_oracle_result_sha256"] == digest(current / "oracle-result.json"), "complete_zero_oracle_file_hash")

          def producer_mode():
