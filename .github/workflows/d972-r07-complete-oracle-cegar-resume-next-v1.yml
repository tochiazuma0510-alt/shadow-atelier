                  saved_output_source = read(root / "output/source.json")
                  need(saved_output_source["producer_sha256"] == os.environ["PRODUCER_SHA256"] and saved_output_source["data"] == current_source["data"], "same_P_source_and_data")
                  need(saved_output_source["python"] == saved_source["python"] and saved_output_source["numpy"] == saved_source["numpy"], "same_P_full_runtime")
                  chain.append({"artifact": artifact, "root_relative_to_parent": root.relative_to(ROOT / "accepted-parent").as_posix(),
                      "completed_steps": head["completed_steps"], "head_sha256": digest(root / "output/HEAD"),
                      "checker_result_sha256": digest(root / "checker-result.json"), "source_receipt": pin(root / source_name),
                      "preservation_result_sha256": digest(root / "preservation-result.json"), "entire_saved_output_compared": True})
                  if prefix == COMPLETION:
                      expected = {"run": int(os.environ["COMPLETION_RUN"]), "attempt": int(os.environ["COMPLETION_ATTEMPT"]),
                          "head": os.environ["COMPLETION_HEAD"], "workflow": os.environ["COMPLETION_WORKFLOW"], "id": int(os.environ["COMPLETION_ARTIFACT_ID"]),
                          "name": os.environ["COMPLETION_ARTIFACT_NAME"], "bytes": int(os.environ["COMPLETION_ARCHIVE_BYTES"]), "sha256": os.environ["COMPLETION_ARCHIVE_DIGEST"]}
                      tuple_equal(artifact, expected)
                      entry_check(root, [{"file": name, **row} for name, row in decode(os.environ["COMPLETION_ENTRY_PINS"]).items()])
                      run = read(root / "completion-run-receipt.json")
                      need(run["schema"] == COMPLETION + ".completion-run" and run["status"] == "PASS" and run["completion_launch"] == launch_for(artifact), "original_completion_launch")
                      need(head["completed_steps"] == 32 and len(checked["invocations"]) == 2, "original_completion32")
                      need(run["checker_result_sha256"] == digest(root / "checker-result.json") and run["repair_source_receipt_sha256"] == digest(root / source_name), "completion_receipt_hashes")
                      need(run["original_launch"] == {"run": int(os.environ["ORIGINAL_RUN"]), "attempt": int(os.environ["ORIGINAL_ATTEMPT"]), "head": os.environ["ORIGINAL_HEAD"], "workflow": os.environ["ORIGINAL_WORKFLOW"]}, "failed_original_launch_preserved")
                      need(run["original_artifact"]["id"] == int(os.environ["ORIGINAL_ARTIFACT_ID"]) and run["original_artifact"]["sha256"] == os.environ["ORIGINAL_ARCHIVE_DIGEST"], "failure_is_historical_not_live_success")
                      prior = read(root / "previous-checker-result.json")
                      need(prior["status"] == "FAIL" and prior["candidate"] is False and prior["reason"] == "ValueError:cegar_checker:HEAD_entire_replayed_prefix_and_cursor", "old_failed_checker_distinct")
                      need((root / "previous-checker-exit-code.txt").read_bytes() == b"1\n", "old_failed_exit")
                      need(len(output["files"]) == 2584 and len(output["directories"]) == 420 and sum(r["bytes"] for r in output["files"]) == 346710509, "original_saved32_roster")
                      preserved = read(root / "preserved-input.json")
                      original = scan(root / "original")
                      reconstructed_files = sorted(original["files"] + [{**row, "file": "output/" + row["file"]} for row in output["files"]], key=lambda row: row["file"])
                      reconstructed_dirs = ["output"] + ["output/" + name for name in output["directories"]]
                      need(original["directories"] == [] and len(original["files"]) == 52 and reconstructed_files == preserved["files"] and reconstructed_dirs == preserved["directories"], "all2636_original_bytes_and_directories")
                      prior_tests = []
                      for name, field, count in (("oracle-v2-full-selftest.json", "tests", 4), ("producer-selftest.json", "groups", 3),
                              ("checker-selftest.json", "tests", 3), ("snapshot-isolation-selftest.json", "tests", 3)):
                          test = read(root / name)
                          need(test["status"] == "PASS" and len(test[field]) == count and all(row["status"] == "PASS" for row in test[field]), "saved_successful_test:" + name)
                          prior_tests.append({"file": name, "sha256": digest(root / name), "groups": count, "rerun": False})
                      for name in ("producer-parent-layout.json", "checker-parent-layout.json"):
                          test = read(root / name)
                          need(test["status"] == "PASS" and test["metadata_only"] is True and len(test["rejected_cases"]) == 5, "saved_metadata_test")
                          prior_tests.append({"file": name, "sha256": digest(root / name), "rejected_cases": 5, "rerun": False})
                      need(read(root / "producer-parent-layout.json") == read(root / "checker-parent-layout.json"), "saved_parent_layout_equality")
                      need(parent_before["count"] == 14, "completion_parent_count")
                      return chain, prior_tests, run["original_launch"], run["original_artifact"]
                  run = read(root / "run-receipt.json")
                  need(run["schema"] == prefix + ".run-receipt" and run["status"] == "PASS" and run["current_launch"] == launch_for(artifact), "historical_resume_launch")
                  need(saved_source["schema"] == prefix + ".source-receipt" and saved_source["launch"] == launch_for(artifact), "historical_source_launch")
                  for key, name in (("checker_result_sha256", "checker-result.json"), ("producer_result_sha256", "output/result.json"),
                          ("resume_source_receipt_sha256", source_name), ("copy_before_resume_sha256", "copy-before-resume.json"),
                          ("producer_output_before_checker_sha256", "producer-output-before-checker.json"), ("preservation_result_sha256", "preservation-result.json"),
                          ("all_parent_files_before_sha256", "all-parent-files-before.json"), ("all_parent_files_after_sha256", "all-parent-files-after.json")):
                      need(run[key] == digest(root / name), "historical_run_hash:" + key)
                  for key in ("producer_sha256", "checker_sha256"):
                      need(run[key] == current_source[key], "historical_executable")
                  for key in STATE:
                      if key in run:
                          need(run[key] == head[key], "historical_state:" + key)
                  need(run["head_sha256"] == digest(root / "output/HEAD") and run["terminal"] == produced["terminal"], "historical_HEAD_terminal")
                  need(run["producer_invocations_this_run"] == run["checker_invocations_this_run"] == 1 and run["old_success_suites_rerun"] == 0, "one_historical_resume")
                  old = read(root / "copy-before-resume.json")
                  check_saved_subset(root / "output", old)
                  before_dir = root / ("before32" if prefix == RESUME64 else "before")
                  need(digest(before_dir / "HEAD") == old["head_sha256"] and digest(before_dir / "result.json") == old["result_sha256"], "historical_before_bytes")
                  nested_name, role = ("accepted-completion", "COMPLETION_ROOT") if prefix == RESUME64 else ("accepted-parent", "PARENT_ROOT")
                  nested = root / nested_name
                  needed = [row for row in parent_before["parents"] if row["role"] == role]
                  need(len(needed) == 1 and parent_before["count"] == 15 and scan(nested) == {key: needed[0][key] for key in ("files", "directories")}, "entire_nested_candidate_lineage")
                  next_artifact = run["accepted_completion_artifact"] if prefix == RESUME64 else read(root / "observed-parent.json")["artifact"]
                  next_artifact = {key: next_artifact[key] for key in ("run", "attempt", "head", "workflow", "id", "name", "bytes", "sha256")}
                  need(scan(nested / "output") == {key: old[key] for key in ("files", "directories")}, "copy_from_exact_nested_output")
                  need(digest(nested / "output/HEAD") == old["head_sha256"] and digest(nested / "output/result.json") == old["result_sha256"], "same_old_HEAD_and_result")
                  need(run["before_completed_steps"] == old["completed_steps"] and run["new_appends_this_run"] == head["completed_steps"] - old["completed_steps"], "actual_historical_append_delta")
                  need(run["new_invocation_sha256"] == produced["invocation_sha256"], "historical_explicit_invocation")
                  chosen = [row for row in checked["invocations"] if row["sha256"] == produced["invocation_sha256"]]
                  need(len(chosen) == 1 and chosen[0]["resume"] is True and chosen[0]["completed_steps_before"] == old["completed_steps"] and chosen[0]["head_before_sha256"] == old["head_sha256"], "historical_invocation_before")
                  need(chosen[0]["max_appends"] == run["limits"]["absolute_max_appends"] and chosen[0]["max_seconds"] == 5400, "historical_absolute_cap")
                  need(len(checked["invocations"]) == len(read(nested / "checker-result.json")["invocations"]) + 1, "one_new_historical_invocation")
                  if prefix == SCHEMA:
                      previous_input = read(root / "observed-parent.json")
                      validate_input(previous_input, str(run["limits"]["absolute_max_appends"]))
                      entry_check(nested, previous_input["entries"])
                      need(run["observed_parent_sha256"] == digest(root / "observed-parent.json") and run["dispatch_input_sha256"] == digest(root / "dispatch-input.json"), "historical_observed_input_hashes")
                  root, artifact, newer = nested, next_artifact, checked

          def intake_mode():
              observed = read(ROOT / "observed-parent.json")
              live = read(ROOT / "live-parent-intake.json")
              markers = {"E_ROOT": ["output/HEAD", "output/manifest.json", "checker-result.json", "source-receipt.json", "run-receipt.json"],
                  "ORACLE_ROOT": ["output/manifest.json", "output/tree/witness.json", "checker-result.json", "source-receipt.json", "repair-source-receipt.json", "completion-run-receipt.json"],
                  "REFINEMENT_ROOT": ["output/HEAD", "output/start.json", "output/canonical-index.json", "checker-result.json", "source-receipt.json"],
                  "PACKET_ROOT": ["output/HEAD", "output/start.json", "checker-result.json", "source-receipt.json"],
                  "SEED34_ROOT": ["output/manifest.json", "checker-result.json", "source-receipt.json"],
                  "DELTA_ROOT": ["output/manifest.json", "checker-result.json", "source-receipt.json"],
                  "PREPARE_ROOT": ["prepare.HEAD"], "P1_ROOT": ["manifest.json", "instructions.jsonl", "degree2.cache.bin"],
                  "TASK712_ROOT": ["r07-grade2-maps-v4-receipt.json", "r07-grade2-maps-v4-checker.json"],
                  "STATE_ROOT": ["state/manifest.json", "state/physical.bin"]}
              for index in range(4):
                  markers["BLOCK_" + str(index) + "_ROOT"] = ["block-" + str(index) + ".HEAD"]
              paths = {}
              for spec in live["parents"]:
                  base = Path(spec["extraction_root"]).resolve()
                  if spec["role"] == "PARENT_ROOT":
                      # The immediate artifact root is exact. Nested historical candidates are not alternative roots.
                      need(base == ROOT / "accepted-parent" and (base / "output/HEAD").is_file(), "exact_candidate_root")
                      selected = base
                  else:
                      names = markers[spec["role"]]
                      matches = [p for p in (base, *sorted(item for item in base.rglob("*") if item.is_dir())) if all((p / name).is_file() for name in names)]
                      need(len(matches) == 1, "unique_payload_root:" + spec["role"])
                      selected = matches[0].resolve()
                  need(not selected.is_symlink() and (selected == base or base in selected.parents), "payload_containment")
                  paths[spec["role"]] = str(selected)
              roots = [Path(value) for value in paths.values()]
              need(len(paths) == len(set(paths.values())) == 15, "fifteen_root_paths")
              for index, a in enumerate(roots):
                  for b in roots[index + 1:]:
                      need(a != b and a not in b.parents and b not in a.parents, "disjoint_readonly_roots")
              parent = Path(paths["PARENT_ROOT"])
              entry_check(parent, observed["entries"])
              checked, head, produced = full_checker(parent)
              need(head == observed["full_head"], "actual_full_HEAD_matches_input")
              need(produced["terminal"] == observed["snapshot"]["terminal"] and produced["status"] == produced["terminal"], "actual_resumable_status")
              for key in (*STATE, "last_step_manifest_sha256"):
                  need(head[key] == observed["snapshot"][key], "observed_snapshot_field:" + key)
              invocations = [{**pin(file, file.relative_to(parent / "output").as_posix()), "value": read(file)} for file in committed_invocations(parent / "output")]
              need(invocations == observed["invocations"], "observed_all_sealed_invocations")
              output = scan(parent / "output")
              need(observed["output"] == {"files": len(output["files"]), "directories": len(output["directories"]), "bytes": sum(row["bytes"] for row in output["files"])}, "observed_output_counts")
              old_parents = [{"role": role, **scan(Path(paths[role]))} for role in sorted(key for key in paths if key != "PARENT_ROOT")]
              chain, tests, original_launch, original_artifact = authenticate_history(parent, observed["artifact"], old_parents)
              parents = old_parents + [{"role": "PARENT_ROOT", **scan(parent)}]
              save("all-parent-files-before.json", {"schema": SCHEMA + ".all-parent-files", "count": 15, "parents": parents, **FALSE})
              save("parent-paths.json", paths)
              save("parent-intake-receipt.json", {"schema": SCHEMA + ".parent-intake", "status": "PASS", "accepted_parent_artifact": observed["artifact"],
                  "observed_parent_sha256": digest(ROOT / "observed-parent.json"), "dispatch_input_sha256": digest(ROOT / "dispatch-input.json"),
                  "entry_files": observed["entries"], "snapshot": observed["snapshot"], "history": chain,
                  "original_launch": original_launch, "original_artifact": original_artifact, "prior_tests_authenticated_without_rerun": tests,
                  "old_success_suites_rerun": 0, "resume_source_receipt_sha256": digest(ROOT / "resume-source-receipt.json"),
                  "all_parent_files_before_sha256": digest(ROOT / "all-parent-files-before.json"), "all_saved_candidate_lineage_compared": True, **FALSE})
              with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
                  for key, value in paths.items():
                      need("\n" not in value and "\r" not in value, "environment_path")
