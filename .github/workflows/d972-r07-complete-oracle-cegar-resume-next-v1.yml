                  need(step["step"] == number and step["manifest_sha256"] == digest(output / "steps" / f"{number:06d}" / "manifest.json"), "step_manifest_hash")
                  physical = read(output / "snapshots" / f"{number-1:06d}" / "e/physical/result.json")
                  need(step["target_scalar"] == physical["target"]["scalar"] and step["selected_scalar"] == physical["selected_scalar"], "separate_target_selected_scalars")
                  ordinary(step["target_scalar"], 0, 2)
              need(head["last_step_manifest_sha256"] == digest(output / "steps" / f"{n:06d}" / "manifest.json"), "last_step_hash")
              invocation_files = committed_invocations(output)
              need(len(invocation_files) == len(checked["invocations"]), "invocation_complete_count")
              actual = []
              for file in invocation_files:
                  need(re.fullmatch(r"[0-9a-f]{32}\.json", file.name), "saved_invocation_filename")
                  value = sealed(file, LOOP + ".invocation")
                  need(value["invocation"] + ".json" == file.name and all(value[key] == head[key] for key in IDS), "same_owner_invocation")
                  actual.append({**{key: item for key, item in value.items() if key != "sha256"}, "sha256": digest(file)})
              need(actual == checked["invocations"], "all_invocation_unsigned_and_file_hashes")
              need(sum(item["sha256"] == result["invocation_sha256"] for item in actual) == 1, "explicit_current_invocation")
              return checked, head, result

          def committed_invocations(output):
              files = []
              for item in sorted((output / "invocations").iterdir()):
                  need(item.is_file() and not item.is_symlink(), "invocation_node_type")
                  if re.fullmatch(r"\.[0-9a-f]{32}\.json\.pending-[0-9a-f]{32}", item.name):
                      continue  # Still present in the complete immutable file roster.
                  need(re.fullmatch(r"[0-9a-f]{32}\.json", item.name), "invocation_node_name")
                  files.append(item)
              return files

          def launch_for(artifact):
              return {key: artifact[key] for key in ("run", "attempt", "head", "workflow")}

          def tuple_equal(actual, expected):
              need(all(actual[key] == expected[key] for key in ("run", "attempt", "head", "workflow", "id", "name", "bytes", "sha256")), "historical_artifact_tuple")

          def check_saved_subset(output, before):
              for row in before["immutable_files"]:
                  need(pin(file_at(output, row["file"]), row["file"]) == row, "old_file_changed:" + row["file"])
              for name in before["immutable_directories"]:
                  need(file_at(output, name).is_dir(), "old_directory_missing:" + name)
              need(before["immutable_files"] == [row for row in before["files"] if row["file"] not in ("HEAD", "result.json")], "only_two_old_mutable_files")
              need(before["immutable_directories"] == before["directories"] and before["mutable_root_files"] == ["HEAD", "result.json"], "old_directory_and_mutable_roster")

          def compare_old_prefix(old, new):
              n = old["completed_steps"]
              need(new["completed_steps"] >= n and new["steps"][:n] == old["steps"], "entire_old_step_dicts")
              need(new["snapshots"][:n] == old["snapshots"][:n], "entire_old_committed_snapshot_dicts")
              if len(old["snapshots"]) == n + 1:
                  a, b = old["snapshots"][n], new["snapshots"][n]
                  need(a["snapshot_sha256"] == b["snapshot_sha256"], "old_current_snapshot_identity")
                  for key, value in a["phase_manifests"].items():
                      need(b["phase_manifests"][key] == value, "old_current_completed_phase")
                  if a["oracle_manifest_sha256"] is not None:
                      need(a["oracle_manifest_sha256"] == b["oracle_manifest_sha256"], "old_current_oracle")
              need(all(row in new["invocations"] for row in old["invocations"]), "all_old_invocation_dicts")

          def authenticate_history(root, artifact, old_parents):
              chain, newer = [], None
              current_source = read(ROOT / "resume-source-receipt.json")
              while True:
                  artifact_type(artifact)
                  prefix = PREFIXES[artifact["workflow"]]
                  checked, head, produced = full_checker(root)
                  need(produced["terminal"] in ("UNKNOWN_CAP", "UNKNOWN_RESOURCE") and head["kind"] == "Separator", "historical_resumable_terminal")
                  if newer is not None:
                      compare_old_prefix(checked, newer)
                  output = scan(root / "output")
