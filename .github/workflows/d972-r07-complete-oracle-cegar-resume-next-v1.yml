                      residuals = payload("tree", "chord-residuals.u8", "u8", [54433], 54433)
                      tau = payload("tree", "chord-tau.u8", "u8", [54433, 5], 272165)
                      selected = payload("tree", "selected-chords.u32", "u32le", [5], 20)
                      selected_edges = [int.from_bytes(selected[i:i+4], "little") for i in range(0, 20, 4)]
                      fit = payload("tree", "fit.u8", "u8", [5], 5)
