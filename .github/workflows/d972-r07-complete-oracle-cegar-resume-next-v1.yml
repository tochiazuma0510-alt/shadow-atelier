                          "d1_nonzero_trits": sum(value != 0 for character in range(4) for value in kappa[24192+(character*6+tag)*3024:24192+(character*6+tag+1)*3024])}
                          for tag in range(6)]
                      row["kappa_shared_aux"] = kappa[-8:]
