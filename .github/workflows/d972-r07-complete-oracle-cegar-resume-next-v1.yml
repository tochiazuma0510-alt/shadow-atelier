jobs:
  register-only:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/sol/r07-explicit-lift-20260825' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Register the workflow without running the numerical job
        shell: bash
        run: 'true'
  saved-cegar-resume-next:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/sol/r07-explicit-lift-20260825' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      OBSERVED_PARENT: ${{ inputs.observed_parent }}
      MAX_APPENDS_INPUT: ${{ inputs.max_appends }}
    steps:
      - name: Checkout the unchanged numerical sources
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up the exact saved producer runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"
      - name: Install the exact saved NumPy release
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.1"
      - name: Save the reviewed metadata driver
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume-next"
          printf '%s' "$OBSERVED_PARENT" > "$RUNNER_TEMP/resume-next/observed-parent-input.txt"
          printf '%s' "$MAX_APPENDS_INPUT" > "$RUNNER_TEMP/resume-next/max-appends-input.txt"
          cat > "$RUNNER_TEMP/resume-next/driver.py" <<'PY'
          import copy, datetime, hashlib, json, math, os, re, shutil, stat, subprocess, sys, zipfile
          from pathlib import Path, PurePosixPath

          SCHEMA = "d972.r07.complete-oracle-cegar-resume-next.v1"
          LOOP = "d972.r07.complete-oracle-cegar-continuation.v1"
          COMPLETION = "d972.r07.complete-oracle-cegar-checker-completion.v1"
          RESUME64 = "d972.r07.complete-oracle-cegar-resume64.v1"
          WORKFLOW = ".github/workflows/d972-r07-complete-oracle-cegar-resume-next-v1.yml"
          BRANCH = "sol/r07-explicit-lift-20260825"
          PREFIXES = {os.environ["COMPLETION_WORKFLOW"]: COMPLETION,
              ".github/workflows/d972-r07-complete-oracle-cegar-resume64-v1.yml": RESUME64, WORKFLOW: SCHEMA}
          ROOT = Path(os.environ["RUNNER_TEMP"]).resolve() / "resume-next"
          PARENTS = ROOT.parent / "resume-next-parents"
          FALSE = {"candidate": False, "cross_checked": False, "verified": False}
          PHASES = ("section", "cochain", "tree", "raw", "source", "primal", "p1", "B", "physical")
          IDS = ("owner_sha256", "source_sha256", "start_sha256", "fixed_manifest_sha256")
          STATE = ("completed_steps", "rank", "generation", "kind", "state_head", "target_remainder_sha256", "lambda_sha256",
              *IDS, "current_snapshot_sha256", "current_checkpoint_sha256")
          FIXED = {"owner.json": (8612, "e356f7d614828b9c466c70e4e446ec561de73a758b4c6a2292fdd97be39ff77b"),
              "source.json": (2423, "c787d53c65c6392845e6f26c545e213b6b17d9b08dc07d694a1c4e33282f2651"),
              "start.json": (54707, "87bd9b89c593d68fba65b765bfe9f17bcc47d52cc9afce6f53f8c131a24f816b"),
              "fixed/manifest.json": (3159, "3ec178df5c2af9de7c55bb96075bb9e741111a241f7e02222ef5604587c87c41")}
          COMMON_ENTRIES = {"output/HEAD", "output/result.json", *("output/" + name for name in FIXED),
              "checker-result.json", "checker-stdout.json", "checker-exit-code.txt", "producer-result.json", "source-receipt.json",
              "producer-output-before-checker.json", "preservation-result.json", "all-parent-files-before.json", "all-parent-files-after.json"}
          EXTRA_ENTRIES = {COMPLETION: {"repair-source-receipt.json", "completion-run-receipt.json", "completion-intake-receipt.json",
                  "preserved-input.json", "snapshot-isolation-selftest.json", "coverage-receipt.json"},
              RESUME64: {"resume-source-receipt.json", "run-receipt.json", "completion-intake-receipt.json", "copy-before-resume.json", "live-parent-intake.json"},
              SCHEMA: {"resume-source-receipt.json", "run-receipt.json", "parent-intake-receipt.json", "copy-before-resume.json",
                  "live-parent-intake.json", "observed-parent.json", "dispatch-input.json", "coverage-receipt.json"}}

          def need(condition, reason):
              if not condition:
                  raise ValueError("resume_next:" + reason)

          def canonical(value):
              return (json.dumps(value, ensure_ascii=True, allow_nan=False, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")

          def duplicate_free(pairs):
              result = {}
              for key, value in pairs:
                  need(key not in result, "duplicate_JSON_key:" + key)
                  result[key] = value
              return result

          def decode(raw):
              return json.loads(raw, object_pairs_hook=duplicate_free,
                  parse_constant=lambda value: need(False, "nonfinite_JSON:" + value))

          def read(path):
              return decode(path.read_bytes())

          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()

          def save(name, value):
              (ROOT / name).write_bytes(canonical(value))

          def pin(path, name=None):
              need(path.is_file() and not path.is_symlink() and stat.S_ISREG(path.stat().st_mode), "file_type:" + str(path))
              return {"file": name if name is not None else path.name, "bytes": path.stat().st_size, "sha256": digest(path)}

          def safe_name(name):
              need(type(name) is str and name and "\\" not in name and ":" not in name and "\x00" not in name, "relative_name")
              p = PurePosixPath(name)
              need(not p.is_absolute() and str(p) == name and all(part not in ("", ".", "..") for part in p.parts), "relative_components")
              return name

          def file_at(root, name):
              safe_name(name)
              result = root / name
              need(root.resolve() in result.resolve().parents and not result.is_symlink(), "file_containment")
              return result

          def scan(root):
              need(root.is_dir() and not root.is_symlink(), "directory_root:" + str(root))
              files, dirs = [], []
              for item in sorted(root.rglob("*")):
                  need(not item.is_symlink(), "symlink:" + str(item))
                  name = safe_name(item.relative_to(root).as_posix())
                  if item.is_dir():
                      dirs.append(name)
                  else:
                      files.append(pin(item, name))
              return {"files": files, "directories": dirs}

          def sealed(path, schema):
              raw = path.read_bytes()
              value = decode(raw)
              need(raw == canonical(value) and value["schema"] == schema, "canonical_schema:" + str(path))
              need(value["sha256"] == hashlib.sha256(canonical({k: v for k, v in value.items() if k != "sha256"})).hexdigest(), "seal:" + str(path))
              return value

          def ordinary(value, minimum=0, maximum=None):
              need(type(value) is int and value >= minimum and (maximum is None or value <= maximum), "ordinary_integer")
              return value

          def sha(value, width=64):
              need(type(value) is str and re.fullmatch("[0-9a-f]{" + str(width) + "}", value), "sha_type")
              return value

          def artifact_type(value):
              need(type(value) is dict and set(value) == {"run", "attempt", "head", "workflow", "id", "name", "bytes", "sha256"}, "artifact_fields")
              for key in ("run", "attempt", "id", "bytes"):
                  ordinary(value[key], 1)
              sha(value["head"], 40)
              need(value["workflow"] in PREFIXES, "parent_workflow")
              need(value["name"] == Path(value["workflow"]).stem + "-candidate-" + str(value["run"]) + "-" + str(value["attempt"]), "candidate_name")
              need(type(value["sha256"]) is str and value["sha256"].startswith("sha256:"), "artifact_digest")
              sha(value["sha256"][7:])

          def pin_type(value):
              need(type(value) is dict and set(value) == {"file", "bytes", "sha256"}, "pin_fields")
              safe_name(value["file"])
              ordinary(value["bytes"])
              sha(value["sha256"])

          def validate_input(value, cap_text):
              need(type(value) is dict and set(value) == {"schema", "repository_id", "branch", "artifact", "entries", "snapshot", "full_head", "invocations", "output"}, "observed_parent_fields")
              need(value["schema"] == SCHEMA + ".observed-parent" and type(value["repository_id"]) is int and value["repository_id"] == 1312092366 and value["branch"] == BRANCH, "repository_branch")
              artifact_type(value["artifact"])
              need(type(cap_text) is str and re.fullmatch(r"[1-9][0-9]*", cap_text), "cap_string")
              cap = ordinary(int(cap_text), 1, 48384 - 1386)
              expected = set(STATE) | {"terminal", "head_sha256", "result_sha256", "checker_result_sha256", "last_step_manifest_sha256"}
              snapshot = value["snapshot"]
              need(type(snapshot) is dict and set(snapshot) == expected, "snapshot_fields")
              n = ordinary(snapshot["completed_steps"], 32, 48384 - 1386)
              ordinary(snapshot["rank"], 1386 + n, 1386 + n)
              ordinary(snapshot["generation"], 8091 + n, 8091 + n)
              need(n < cap and snapshot["kind"] == "Separator" and snapshot["terminal"] in ("UNKNOWN_CAP", "UNKNOWN_RESOURCE"), "resumable_actual_count_and_terminal")
              for key in expected - {"completed_steps", "rank", "generation", "kind", "terminal"}:
                  if key in ("current_snapshot_sha256", "current_checkpoint_sha256") and snapshot[key] is None:
                      continue
                  sha(snapshot[key])
              need((snapshot["current_snapshot_sha256"] is None) == (snapshot["current_checkpoint_sha256"] is None), "checkpoint_pair")
              head = value["full_head"]
              need(type(head) is dict and head["schema"] == LOOP + ".head", "full_HEAD")
              need(hashlib.sha256(canonical(head)).hexdigest() == snapshot["head_sha256"], "full_HEAD_file_hash")
              need(head["sha256"] == hashlib.sha256(canonical({k: v for k, v in head.items() if k != "sha256"})).hexdigest(), "full_HEAD_seal")
              need(all(head[key] == snapshot[key] for key in (*STATE, "last_step_manifest_sha256")), "snapshot_HEAD_join")
              need(type(value["entries"]) is list and len(value["entries"]) <= 256, "entry_roster")
              for row in value["entries"]:
                  pin_type(row)
              names = [row["file"] for row in value["entries"]]
              need(names == sorted(set(names)), "entry_order_duplicates")
              need(COMMON_ENTRIES | EXTRA_ENTRIES[PREFIXES[value["artifact"]["workflow"]]] <= set(names), "required_actual_entries")
              by_name = {row["file"]: row for row in value["entries"]}
              for file, key in (("output/HEAD", "head_sha256"), ("output/result.json", "result_sha256"), ("checker-result.json", "checker_result_sha256")):
