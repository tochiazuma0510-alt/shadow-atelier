name: w9-p1-k3-crt-C2

# Sol task 113 / ruling 1024: the two exact k=3 main lines.
# This registered workflow path is overridden only on sol/k3-mainlines.
# workflow_dispatch only; UNKNOWN is an accepted bounded outcome.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  t3-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact algebra dependency
        run: pip install "sympy==1.14.0"

      - name: Run exact t3 m=4 producer under hard timeout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci/out
          python ci/hard_timeout.py \
            --timeout-seconds 300 \
            --heartbeat-seconds 15 \
            --checkpoint ci/out/t3_m4_hard_timeout.json \
            --log ci/out/t3_m4.log \
            -- python search/w9_k3_t3_m4_gha.py \
              --output ci/out/w9_k3_t3_m4_result.json \
              --checkpoint ci/out/w9_k3_t3_m4_checkpoint.json

      - name: Run import-free t3 checker
        shell: bash
        run: |
          set -euo pipefail
          python search/check_w9_k3_t3_m4.py \
            --cert ci/out/w9_k3_t3_m4_result.json \
            --output ci/out/w9_k3_t3_m4_check.json
          python - <<'PY'
          import json
          result = json.load(open('ci/out/w9_k3_t3_m4_result.json', encoding='utf8'))
          check = json.load(open('ci/out/w9_k3_t3_m4_check.json', encoding='utf8'))
          assert result['status'] == 'COMPLETE_EMPTY_F9_RATIONAL_M4_FIXED_PI0'
          assert result['m4_solution_exists_over_F9'] is False
          assert check['all_checks_true'] is True
          print(result['status'], check['all_checks_true'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-k3-t3-m4-${{ github.run_id }}
          path: ci/out/
          if-no-files-found: error
          retention-days: 30

  crt-c2-main:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install exact algebra engines
        shell: bash
        run: |
          set -euo pipefail
          pip install "sympy==1.14.0"
          sudo apt-get update
          sudo apt-get install -y singular
          Singular --version

      - name: Run bounded CRT-C2 producer
        id: producer
        shell: bash
        run: |
          set +e
          mkdir -p ci/out
          python ci/hard_timeout.py \
            --timeout-seconds 1500 \
            --heartbeat-seconds 20 \
            --kill-grace-seconds 5 \
            --checkpoint ci/out/crt_c2_hard_timeout.json \
            --log ci/out/crt_c2.log \
            -- python search/w9_k3_crt_c2_main_gha.py \
              --budget-seconds 1400 \
              --per-system-seconds 80 \
              --prime 7 \
              --omega 2 \
              --output ci/out/w9_k3_crt_c2_main_result.json \
              --checkpoint ci/out/w9_k3_crt_c2_main_checkpoint.json \
              --work-dir ci/out/w9_k3_crt_c2_work
          rc=$?
          echo "wrapper_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Require finalized bounded receipt
        shell: bash
        run: |
          set -euo pipefail
          test -s ci/out/w9_k3_crt_c2_main_result.json
          python - <<'PY'
          import json
          p = json.load(open('ci/out/w9_k3_crt_c2_main_result.json', encoding='utf8'))
          assert p['status'] in {
              'UNKNOWN_BOUNDED_C2_2',
              'COMPLETE_F5_LAYER_EMPTY_BY_GOOD_REDUCTION',
          }, p['status']
          assert p['positive_control']['pass'] is True
          print('producer wrapper exit:', '${{ steps.producer.outputs.wrapper_exit }}')
          print('bounded status:', p['status'])
          PY

      - name: Run import-free receipt checker
        shell: bash
        run: |
          set -euo pipefail
          python search/check_w9_k3_crt_c2_main.py \
            --cert ci/out/w9_k3_crt_c2_main_result.json \
            --output ci/out/w9_k3_crt_c2_main_check.json
          python - <<'PY'
          import json
          p = json.load(open('ci/out/w9_k3_crt_c2_main_check.json', encoding='utf8'))
          assert p['all_checks_true'] is True
          print(p['classification'])
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w9-k3-crt-c2-main-${{ github.run_id }}
          path: ci/out/
          if-no-files-found: error
          retention-days: 30
