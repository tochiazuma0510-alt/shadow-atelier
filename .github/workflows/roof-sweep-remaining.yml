name: roof-sweep-remaining

# 異族屋根一括掃討(裁定1059)の欠損4本再走(裁定1070)。run 31615934135でK(81)x1152[a]が
# Elements(DerivedSubgroup)でOOMクラッシュし、K(81)x1152[b]・S4x1152[a]・S4x1152[b]が
# 未実行のまま終わった。修理(Size(D)ガード・shadow_total上限)後、この4本のみ再走する。
#
# DISPATCH GATE: workflow_dispatch ONLY.

on:
  workflow_dispatch:
    inputs:
      hard_timeout_minutes:
        description: 'outer hard timeout for the whole GAP process (4 roofs)'
        required: true
        type: number
        default: 60

permissions:
  contents: read

jobs:
  roof-sweep-remaining:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Setup GAP 4.16.0
        uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'

      - name: Run remaining roofs under process hard timeout
        id: producer
        shell: bash
        run: |
          set +e
          mkdir -p ci/out
          python3 ci/hard_timeout.py \
            --timeout-seconds "$(( ${{ inputs.hard_timeout_minutes }} * 60 ))" \
            --heartbeat-seconds 30 \
            --kill-grace-seconds 10 \
            --checkpoint ci/out/roof_sweep_remaining_hard_timeout.json \
            --log ci/out/roof_sweep_remaining.log \
            -- \
            gap -q -o 8g search/roof_sweep_remaining_v1.g
          rc=$?
          echo "wrapper_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Gate result (informational -- partial checkpoint is a valid outcome)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -s search/certs/roof_sweep_remaining_v1_20260813.json ]; then
            cp search/certs/roof_sweep_remaining_v1_20260813.json ci/out/
            python3 ci/roof_sweep_gate_report.py search/certs/roof_sweep_remaining_v1_20260813.json
          else
            echo "::warning::no cert written yet (timed out before first roof checkpoint?)"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: roof-sweep-remaining-${{ github.run_id }}
          path: |
            ci/out/
            search/certs/roof_sweep_remaining_v1_20260813.json
          if-no-files-found: warn
          retention-days: 30
