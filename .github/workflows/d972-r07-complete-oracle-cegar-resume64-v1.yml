      - name: Bind the one new invocation and preserve every prior byte after production
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, re, stat
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "resume64"
          output = report / "output"
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def read(path):
              return json.loads(path.read_bytes())
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          def sealed(path, suffix):
              raw = path.read_bytes()
              value = json.loads(raw)
              assert raw == canonical(value) and value["schema"] == "d972.r07.complete-oracle-cegar-continuation.v1." + suffix
              content = {key: item for key, item in value.items() if key != "sha256"}
              assert value["sha256"] == hashlib.sha256(canonical(content)).hexdigest(), suffix
              return value
          before = read(report / "copy-before-resume.json")
          assert before["status"] == "PASS" and before["completed_steps"] == 32
          for row in before["immutable_files"]:
              item = output / row["file"]
              assert item.is_file() and not item.is_symlink() and item.stat().st_size == row["bytes"] and digest(item) == row["sha256"], row["file"]
          for name in before["immutable_directories"]:
              assert (output / name).is_dir() and not (output / name).is_symlink(), name
