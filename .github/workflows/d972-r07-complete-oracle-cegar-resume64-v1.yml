      - name: Always compare all parent source and saved output bytes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, stat
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "resume64"
          report.mkdir(exist_ok=True)
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          def read(path):
              return json.loads(path.read_bytes())
          def scan(root):
              files, directories = [], []
              if root.exists():
                  assert root.is_dir() and not root.is_symlink()
                  for item in sorted(root.rglob("*")):
                      assert not item.is_symlink(), str(item)
                      if item.is_dir():
                          directories.append(item.relative_to(root).as_posix())
                      else:
                          assert item.is_file() and stat.S_ISREG(item.stat().st_mode), str(item)
                          files.append({"file": item.relative_to(root).as_posix(), "bytes": item.stat().st_size, "sha256": digest(item)})
              return files, directories
          errors = []
          flags = {"source_checked_unchanged": False, "all_parent_roots_checked_unchanged": False,
              "original_prefix_checked_unchanged": False, "producer_output_checked_unchanged": False}
          try:
              source_path = report / "resume-source-receipt.json"
              if source_path.exists():
                  source = read(source_path)
                  assert len(source["files"]) == 20 and len(source["data"]) == 3
                  for row in source["files"]:
                      item = Path(row["file"])
                      assert item.is_file() and not item.is_symlink() and item.stat().st_size == row["bytes"] and digest(item) == row["sha256"], row["file"]
                      copy = report / "executed-sources" / item.name
                      assert copy.stat().st_size == row["bytes"] and digest(copy) == row["sha256"], item.name
                  for name, row in source["data"].items():
                      item = Path(name)
                      assert item.is_file() and not item.is_symlink() and item.stat().st_size == row["bytes"] and digest(item) == row["sha256"], name
                  workflow = source["workflow"]
                  assert Path(workflow["file"]).stat().st_size == workflow["bytes"] and digest(Path(workflow["file"])) == workflow["sha256"]
                  assert digest(report / "executed-sources" / Path(workflow["file"]).name) == workflow["sha256"]
                  intake_path = report / "completion-intake-receipt.json"
                  if intake_path.exists():
                      assert read(intake_path)["resume_source_receipt_sha256"] == digest(source_path)
                  flags["source_checked_unchanged"] = True
          except Exception as exc:
              errors.append("source:" + type(exc).__name__ + ":" + str(exc))
          try:
              before_path = report / "all-parent-files-before.json"
              if before_path.exists():
                  before = read(before_path)
                  paths = read(report / "parent-paths.json")
                  assert before["count"] == len(before["parents"]) == len(paths) == 15
                  parents = []
                  for parent in before["parents"]:
                      files, directories = scan(Path(paths[parent["role"]]))
                      parents.append({"role": parent["role"], "files": files, "directories": directories})
                  after = {**before, "parents": parents}
                  (report / "all-parent-files-after.json").write_bytes(canonical(after))
                  assert after == before, "all fifteen read-only parent roots"
                  flags["all_parent_roots_checked_unchanged"] = True
          except Exception as exc:
              errors.append("parents:" + type(exc).__name__ + ":" + str(exc))
          try:
              before_path = report / "copy-before-resume.json"
              if before_path.exists():
                  before = read(before_path)
                  for row in before["immutable_files"]:
                      item = report / "output" / row["file"]
                      assert item.is_file() and not item.is_symlink() and item.stat().st_size == row["bytes"] and digest(item) == row["sha256"], row["file"]
                  assert all((report / "output" / name).is_dir() and not (report / "output" / name).is_symlink() for name in before["immutable_directories"])
                  assert digest(report / "before32/HEAD") == before["head_sha256"] and digest(report / "before32/result.json") == before["result_sha256"]
                  flags["original_prefix_checked_unchanged"] = True
          except Exception as exc:
              errors.append("prefix:" + type(exc).__name__ + ":" + str(exc))
          files, directories = [], []
          try:
              files, directories = scan(report / "output")
              before_path = report / "producer-output-before-checker.json"
              if before_path.exists():
                  before = read(before_path)
                  assert files == before["files"] and directories == before["directories"], "entire output before/after checker"
                  flags["producer_output_checked_unchanged"] = True
          except Exception as exc:
              errors.append("output:" + type(exc).__name__ + ":" + str(exc))
          receipt = {"schema": "d972.r07.complete-oracle-cegar-resume64.v1.preservation",
              "status": "FAIL" if errors else ("PASS" if all(flags.values()) else "INCOMPLETE"),
              **flags, "files": files, "directories": directories, "output_bytes": sum(row["bytes"] for row in files),
              "errors": errors, "checker_status_is_separate": True, "candidate": False, "cross_checked": False, "verified": False}
          (report / "preservation-result.json").write_bytes(canonical(receipt))
          if errors:
              raise SystemExit("preservation failed: " + "; ".join(errors))
          PY

