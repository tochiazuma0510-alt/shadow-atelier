      - name: Copy the complete saved output and record the immutable before32 prefix
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, shutil, stat, sys
          from pathlib import Path
          import numpy as np
          report = Path(os.environ["RUNNER_TEMP"]).resolve() / "resume64"
          paths = json.loads((report / "parent-paths.json").read_bytes())
          parent = Path(paths["COMPLETION_ROOT"]) / "output"
          output = report / "output"
          assert not output.exists() and not output.is_symlink()
          for value in paths.values():
              root = Path(value).resolve()
              assert root != output.resolve() and root not in output.resolve().parents and output.resolve() not in root.parents
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def digest(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          def scan(root):
              files, directories = [], []
              for item in sorted(root.rglob("*")):
                  assert not item.is_symlink()
                  if item.is_dir():
                      directories.append(item.relative_to(root).as_posix())
                  else:
                      assert item.is_file() and stat.S_ISREG(item.stat().st_mode)
                      files.append({"file": item.relative_to(root).as_posix(), "bytes": item.stat().st_size, "sha256": digest(item)})
              return files, directories
          before_files, before_dirs = scan(parent)
          assert len(before_files) == 2584 and len(before_dirs) == 420 and sum(row["bytes"] for row in before_files) == 346710509
          shutil.copytree(parent, output, symlinks=False)
          # The parent is read-only. The disjoint copy needs writable directory metadata for atomic publication.
          for item in output.rglob("*"):
              item.chmod(0o755 if item.is_dir() else 0o644)
          output.chmod(0o755)
          copied_files, copied_dirs = scan(output)
          assert copied_files == before_files and copied_dirs == before_dirs, "all copied bytes and hidden paths required"
          head = json.loads((output / "HEAD").read_bytes())
          start = json.loads((output / "start.json").read_bytes())
          result = json.loads((output / "result.json").read_bytes())
          source = json.loads((output / "source.json").read_bytes())
          assert digest(output / "HEAD") == "d489c06d40f1b06a8924558e8f751d08cd2b40259790de398b93c79f3657760b"
          assert head["completed_steps"] == result["completed_steps"] == 32 and head["rank"] == 1418 and head["generation"] == 8123
          assert head["kind"] == "Separator" and head["current_snapshot_sha256"] is None and head["current_checkpoint_sha256"] is None
          assert result["status"] == result["terminal"] == "UNKNOWN_CAP"
          assert start["rank"] == 1386 and start["generation"] == 8091 and start["completed_steps"] == 0
          assert source["python"] == sys.version == os.environ["EXPECTED_PYTHON"] and source["numpy"] == np.__version__ == os.environ["EXPECTED_NUMPY"]
          assert source["producer_sha256"] == os.environ["PRODUCER_SHA256"]
          assert sorted(p.name for p in (output / "snapshots").iterdir()) == [f"{number:06d}" for number in range(32)]
          assert sorted(p.name for p in (output / "steps").iterdir()) == [f"{number:06d}" for number in range(1, 33)]
          invocations = [row for row in copied_files if row["file"].startswith("invocations/")]
          assert len(invocations) == 2 and all(row["file"].endswith(".json") for row in invocations)
          saved = report / "before32"
          saved.mkdir()
          for name in ("HEAD", "result.json"):
              shutil.copyfile(output / name, saved / name)
          unchanged_files = [row for row in copied_files if row["file"] not in ("HEAD", "result.json")]
          assert len(unchanged_files) == 2582
          receipt = {"schema": "d972.r07.complete-oracle-cegar-resume64.v1.before-resume", "status": "PASS",
              "files": copied_files, "directories": copied_dirs, "file_count": 2584, "directory_count": 420, "bytes": 346710509,
              "immutable_files": unchanged_files, "immutable_directories": copied_dirs, "mutable_root_files": ["HEAD", "result.json"],
              "existing_invocations": invocations, "head": head, "head_sha256": digest(output / "HEAD"),
              "result_sha256": digest(output / "result.json"), "completed_steps": 32,
              "original_start_preserved": True, "all_bytes_and_hidden_paths_copied": True, "disjoint_mutable_output": True,
              "runtime_matches_saved_source": True, "candidate": False, "cross_checked": False, "verified": False}
          (report / "copy-before-resume.json").write_bytes(canonical(receipt))
          PY

