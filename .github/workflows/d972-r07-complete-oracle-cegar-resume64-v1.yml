              "old_prefix_unchanged": True, "old_invocations_unchanged": True, "actual_resume": True,
              "new_invocation_file": added[0].relative_to(output).as_posix(), "new_invocation_sha256": digest(added[0]),
              "producer_invocations_this_run": 1, "terminal": terminal, "kind": result["kind"],
