          assert result["head_sha256"] == digest(output / "HEAD")
          for field in ("owner_sha256", "source_sha256", "start_sha256", "fixed_manifest_sha256"):
              assert head[field] == before["head"][field], field
          assert start["rank"] == 1386 and start["generation"] == 8091 and start["completed_steps"] == 0
