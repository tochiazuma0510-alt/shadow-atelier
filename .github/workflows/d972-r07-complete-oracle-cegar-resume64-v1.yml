jobs:
  saved-cegar-resume64:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[r07-complete-oracle-cegar-resume64-v1-run]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Reject missing observed completion pins before admission
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/resume64"
          required=(COMPLETION_RUN COMPLETION_ATTEMPT COMPLETION_HEAD COMPLETION_ARTIFACT_ID
            COMPLETION_ARTIFACT_NAME COMPLETION_ARCHIVE_BYTES COMPLETION_ARCHIVE_DIGEST
            CHECKER_BYTES CHECKER_SHA256)
          missing=0
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              printf 'MISSING_OBSERVED_PIN:%s\n' "$key" >> "$RUNNER_TEMP/resume64/admission.log"
              missing=1
            fi
          done
          if [ "$COMPLETION_ENTRY_PINS" = "{}" ] || [ -z "$COMPLETION_ENTRY_PINS" ]; then
            printf '%s\n' 'MISSING_OBSERVED_PIN:COMPLETION_ENTRY_PINS' >> "$RUNNER_TEMP/resume64/admission.log"
            missing=1
          fi
          test "$missing" = 0
          test "$COMPLETION_RUN" != "$ORIGINAL_RUN"
          test "$COMPLETION_ARTIFACT_ID" != "$ORIGINAL_ARTIFACT_ID"

      - name: Checkout the frozen producer and repaired checker
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up the exact producer Python release
        uses: actions/setup-python@v5
        with:
          python-version: "3.13.15"

      - name: Install the exact NumPy release
        shell: bash
        run: python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.1"

      - name: Authenticate and safely extract fifteen exact live parents
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import datetime, hashlib, json, os, re, shutil, stat, subprocess, zipfile
          from pathlib import Path, PurePosixPath
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          report = work / "resume64"
          metadata = report / "live-parents"
          metadata.mkdir()
          parent_base = work / "resume64-parents"
          parent_base.mkdir()
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def sha(path):
              with path.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          def env(key):
              value = os.environ[key]
              assert value and "\n" not in value and "\r" not in value, key
              return value
          repository = env("GITHUB_REPOSITORY")
          assert repository == "tochiazuma0510-alt/shadow-atelier"
          repository_id = int(env("REPOSITORY_ID"))
          now = datetime.datetime.now(datetime.timezone.utc)
          def api(path, destination):
              with destination.open("wb") as stream:
                  subprocess.run(["gh", "api", "repos/" + repository + "/" + path], stdout=stream, check=True)
              return json.loads(destination.read_bytes())
          specs = []
          def add(role, run_prefix, artifact_prefix=None):
              artifact_prefix = artifact_prefix or run_prefix
              task554 = run_prefix == "TASK554"
              suffix = "" if task554 else "_ARTIFACT"
              specs.append({
                  "role": role, "run": int(env(run_prefix + "_RUN")), "attempt": int(env(run_prefix + "_ATTEMPT")),
                  "head": env(run_prefix + "_HEAD"), "workflow": env(run_prefix + "_WORKFLOW"),
                  "id": int(env(artifact_prefix + suffix + "_ID")), "name": env(artifact_prefix + suffix + "_NAME"),
                  "bytes": int(env(artifact_prefix + ("_BYTES" if task554 else "_ARCHIVE_BYTES"))),
                  "sha256": env(artifact_prefix + ("_DIGEST" if task554 else "_ARCHIVE_DIGEST")),
                  "repository_id": repository_id, "conclusion": "failure" if task554 else "success"})
          for role, prefix in (("P1_ROOT", "P1"), ("TASK712_ROOT", "TASK712"), ("STATE_ROOT", "SEPARATOR"),
                  ("DELTA_ROOT", "DELTA"), ("SEED34_ROOT", "SEED34"), ("PACKET_ROOT", "PACKET"),
                  ("REFINEMENT_ROOT", "REFINEMENT"), ("ORACLE_ROOT", "ORACLE"), ("E_ROOT", "E")):
              add(role, prefix)
          add("PREPARE_ROOT", "TASK554", "TASK554_PREP")
          for index in range(4):
              add("BLOCK_" + str(index) + "_ROOT", "TASK554", "TASK554_B" + str(index))
          add("COMPLETION_ROOT", "COMPLETION")
          assert len(specs) == len({item["id"] for item in specs}) == 15
          assert specs[-1]["run"] != int(env("ORIGINAL_RUN")) and specs[-1]["id"] != int(env("ORIGINAL_ARTIFACT_ID"))
          wanted_entries = json.loads(env("COMPLETION_ENTRY_PINS"))
          required_entries = {
              "checker-result.json", "repair-source-receipt.json", "completion-run-receipt.json",
              "completion-intake-receipt.json", "preserved-input.json", "preservation-result.json",
              "all-parent-files-before.json", "all-parent-files-after.json", "snapshot-isolation-selftest.json", "coverage-receipt.json"}
          assert set(wanted_entries) == required_entries, "exact observed completion entry roster required"
          for name, identity in wanted_entries.items():
              assert set(identity) == {"bytes", "sha256"} and type(identity["bytes"]) is int and identity["bytes"] > 0
              assert re.fullmatch(r"[0-9a-f]{64}", identity["sha256"]), name
          assert re.fullmatch(r"[0-9a-f]{64}", env("CHECKER_SHA256")) and int(env("CHECKER_BYTES")) > 0
          def safe_extract(archive, destination):
              destination.mkdir()
              with zipfile.ZipFile(archive) as bundle:
                  seen = set()
                  for entry in bundle.infolist():
                      raw_name = entry.filename
                      path = PurePosixPath(raw_name)
                      assert raw_name and "\\" not in raw_name and ":" not in raw_name and "\x00" not in raw_name
                      assert not path.is_absolute() and ".." not in path.parts and "." not in path.parts
                      name = path.as_posix()
                      assert name not in seen and name not in ("", "."), raw_name
                      assert raw_name == name + ("/" if entry.is_dir() else ""), raw_name
                      seen.add(name)
                      mode = (entry.external_attr >> 16) & 0xffff
                      kind = stat.S_IFMT(mode)
                      assert not stat.S_ISLNK(mode) and kind in (0, stat.S_IFDIR, stat.S_IFREG)
                      assert (not entry.is_dir() or kind in (0, stat.S_IFDIR)) and not (kind == stat.S_IFDIR and not entry.is_dir())
                      assert not entry.flag_bits & 1, "encrypted ZIP entry"
                      target = destination.joinpath(*path.parts)
                      assert destination.resolve() in target.resolve().parents
                      if entry.is_dir():
                          target.mkdir(parents=True, exist_ok=True)
                      else:
                          target.parent.mkdir(parents=True, exist_ok=True)
                          assert not target.exists()
                          with bundle.open(entry) as source, target.open("xb") as output:
                              shutil.copyfileobj(source, output, 1024 * 1024)
                          assert target.stat().st_size == entry.file_size, raw_name
          runs, archives = {}, []
          for spec in specs:
              assert spec["bytes"] > 0 and spec["run"] > 0 and spec["attempt"] > 0 and spec["id"] > 0
              assert re.fullmatch(r"[0-9a-f]{40}", spec["head"])
              assert re.fullmatch(r"sha256:[0-9a-f]{64}", spec["sha256"])
              if spec["run"] not in runs:
                  run = api("actions/runs/" + str(spec["run"]), metadata / ("run-" + str(spec["run"]) + ".json"))
                  runs[spec["run"]] = run
              run = runs[spec["run"]]
              assert run["id"] == spec["run"] and run["run_attempt"] == spec["attempt"] and run["head_sha"] == spec["head"]
              assert run["status"] == "completed" and run["conclusion"] == spec["conclusion"] and run["path"] == spec["workflow"]
              assert run["repository"]["id"] == run["head_repository"]["id"] == repository_id
              artifact = api("actions/artifacts/" + str(spec["id"]), metadata / ("artifact-" + str(spec["id"]) + ".json"))
              assert artifact["id"] == spec["id"] and artifact["name"] == spec["name"]
              assert artifact["size_in_bytes"] == spec["bytes"] and artifact["digest"] == spec["sha256"] and artifact["expired"] is False
              expiry = datetime.datetime.fromisoformat(artifact["expires_at"].replace("Z", "+00:00"))
              assert expiry > now
              link = artifact["workflow_run"]
              assert link["id"] == spec["run"] and link["head_sha"] == spec["head"]
              assert link["repository_id"] == link["head_repository_id"] == repository_id
              archive = parent_base / (str(spec["id"]) + ".zip")
              with archive.open("xb") as stream:
                  subprocess.run(["gh", "api", "repos/" + repository + "/actions/artifacts/" + str(spec["id"]) + "/zip"],
                      stdout=stream, check=True)
              assert archive.stat().st_size == spec["bytes"] and "sha256:" + sha(archive) == spec["sha256"]
              destination = report / "accepted-completion" if spec["role"] == "COMPLETION_ROOT" else parent_base / spec["role"]
              safe_extract(archive, destination)
              spec["expires_at"] = artifact["expires_at"]
              spec["extraction_root"] = str(destination)
              spec["archive_size_and_hash_checked"] = True
              archives.append(spec)
          (report / "live-parent-intake.json").write_bytes(canonical({
              "schema": "d972.r07.complete-oracle-cegar-resume64.v1.live-parent-intake", "status": "PASS",
              "parents": archives, "count": 15, "task554_accepted_failure": True,
              "candidate": False, "cross_checked": False, "verified": False}))
          PY

      - name: Authenticate twenty sources and the exact saved producer runtime
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          expected = {
              "search/d972_r07_complete_oracle_cegar_continuation_v1.py": (int(os.environ["PRODUCER_BYTES"]), os.environ["PRODUCER_SHA256"]),
              "search/check_d972_r07_complete_oracle_cegar_continuation_v1.py": (int(os.environ["ORIGINAL_CHECKER_BYTES"]), os.environ["ORIGINAL_CHECKER_SHA256"]),
              "search/check_d972_r07_section_cochain_oracle_v2.py": (84402, "a44ce4baaa5c73a30b5b28a76a84589f0a661f11e029b7869868d4a88706880d"),
              "search/d972_r07_selected_cycle_materializer_v1.py": (88929, "4f600aae93bf5749d15229cfdfe3e4546267f8b0a642ac46b65125a3c3164ac3"),
              "search/check_d972_r07_selected_cycle_materializer_v1.py": (103757, "a6d52e0d12d97201f0a19f25c54e0924e3fbea89fefa3554727a7178881218b4"),
