name: D972 relative-extension dovetail

on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Run only the immutable anchor/base/calibration preflight
        required: false
        default: false
        type: boolean
      slice_seconds:
        description: Producer budget within the fixed 300-minute pipeline watchdog (60..16800)
        required: false
        default: "16800"
        type: string
      resume_run_id:
        description: Optional prior run id whose exact state artifact must be resumed
        required: false
        default: ""
        type: string
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: d972-relative-extension-dovetail-v1
  cancel-in-progress: false

jobs:
  finite-slice:
    name: Restore, run one finite slice, and checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      STATE_SCHEMA: search/d972_dovetail_state_schema_v1.json
      SEED_MANIFEST: search/d972_dovetail_manifest_v1.json
      PRODUCER: search/d972_dovetail_producer_v1.py
      CHECKER: search/check_d972_dovetail_v1.py
      GAP_WORKER: search/d972_dovetail_worker_v1.g
      RUN_ROOT: ${{ runner.temp }}/d972-dovetail
      PIPELINE_WATCHDOG_SECONDS: "18000"
      PREFLIGHT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.preflight_only || false }}
      REQUESTED_SLICE_SECONDS: ${{ github.event_name == 'workflow_dispatch' && inputs.slice_seconds || '16800' }}

    steps:
      - name: Check out the exact run commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GAP runtime
        id: gap
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gap
          gap -q -b <<'GAP'
          Print("GAP_VERSION=", GAPInfo.Version, "\n");
          QUIT_GAP(0);
          GAP

      - name: Select the only permissible predecessor artifact
        id: select
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          EXPLICIT_RESUME_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.resume_run_id || '' }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = "d972-dovetail.yml";
            const explicit = (process.env.EXPLICIT_RESUME_RUN_ID || "").trim();
            const current = String(context.runId);

            function stop(reason) {
              core.setOutput("mode", "STATE_STOP");
              core.setOutput("reason", reason);
              core.setOutput("source_run_id", "");
              core.setOutput("artifact_name", "");
            }

            try {
              let run = null;
              if (explicit !== "") {
                if (!/^[1-9][0-9]*$/.test(explicit) || explicit === current) {
                  stop("explicit resume_run_id is malformed or names the current run");
                  return;
                }
                const response = await github.rest.actions.getWorkflowRun({
                  owner, repo, run_id: Number(explicit)
                });
                run = response.data;
                if (!String(run.path || "").endsWith(".github/workflows/d972-dovetail.yml")) {
                  stop("explicit resume_run_id belongs to a different workflow");
                  return;
                }
              } else {
                const repository = await github.rest.repos.get({owner, repo});
                const runs = await github.paginate(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id,
                    branch: repository.data.default_branch,
                    status: "completed",
                    per_page: 100
                  }
                );
                const prior = runs
                  .filter(item => String(item.id) !== current)
                  .sort((a, b) => Number(b.id) - Number(a.id));
                if (prior.length === 0) {
                  core.setOutput("mode", "INITIALIZE");
                  core.setOutput("reason", "no completed predecessor run exists");
                  core.setOutput("source_run_id", "");
                  core.setOutput("artifact_name", "");
                  return;
                }
                run = prior[0];
              }

              if (run.status !== "completed") {
                stop("selected predecessor is not completed");
                return;
              }
              const artifacts = await github.paginate(
                github.rest.actions.listWorkflowRunArtifacts,
                {owner, repo, run_id: run.id, per_page: 100}
              );
              const expected = `d972-dovetail-state-${run.id}`;
              const exact = artifacts.filter(item => item.name === expected && !item.expired);
              if (exact.length !== 1) {
                stop(`selected predecessor has ${exact.length} live exact state artifacts`);
                return;
              }
              core.setOutput("mode", "RESUME");
              core.setOutput("reason", "exact predecessor state artifact selected");
              core.setOutput("source_run_id", String(run.id));
              core.setOutput("artifact_name", expected);
            } catch (error) {
              stop(`artifact selection API failure: ${error.name || "Error"}`);
            }

      - name: Download selected predecessor
        id: download
        if: steps.select.outcome == 'success' && steps.select.outputs.mode == 'RESUME'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.select.outputs.artifact_name }}
          path: ${{ runner.temp }}/d972-dovetail/resume
          repository: ${{ github.repository }}
          run-id: ${{ steps.select.outputs.source_run_id }}
          github-token: ${{ github.token }}

      - name: Validate predecessor or create a fail-closed seed
        id: prepare
        if: always()
        shell: bash
        env:
          SELECT_OUTCOME: ${{ steps.select.outcome }}
          SELECT_MODE: ${{ steps.select.outputs.mode }}
          SELECT_REASON: ${{ steps.select.outputs.reason }}
          SOURCE_RUN_ID: ${{ steps.select.outputs.source_run_id }}
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          GAP_OUTCOME: ${{ steps.gap.outcome }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf -- "${RUN_ROOT:?}/work" "${RUN_ROOT:?}/bundle"
          mkdir -p "$RUN_ROOT/work" "$RUN_ROOT/bundle"
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path.cwd()
          run_root = Path(os.environ["RUN_ROOT"])
          seed_path = root / os.environ["SEED_MANIFEST"]
          schema_path = root / os.environ["STATE_SCHEMA"]
          state_out = run_root / "work" / "state-in.json"
          chain_out = run_root / "work" / "chain-in.jsonl"
          producer_work = run_root / "work" / "producer"
          checker_work = run_root / "work" / "checker"
          zero = "0" * 64
          allowed = {
              "INITIALIZED", "CALIBRATION_PENDING", "CALIBRATION_STOP", "CONTINUE",
              "CHECKER_PENDING",
              "UNKNOWN/RESUME", "A_WITNESS_CROSSCHECKED", "DISAGREE_STOP",
              "INCONSISTENT_STOP", "STATE_STOP", "BLOCKED_RELATIVE_EXTENSION_ENUMERATOR",
          }

          def load_json(path):
              return json.loads(path.read_text(encoding="utf-8"))

          def sha_file(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          def checkpoint_hash(doc):
              value = copy.deepcopy(doc)
              value["hash_chain"]["checkpoint_sha256"] = zero
              raw = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def jsonl_count(path):
              count = 0
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  value = json.loads(line)
                  if not isinstance(value, dict):
                      raise ValueError(f"non-object JSONL row {number}: {path.name}")
                  count += 1
              return count

          def verify_bound_ledger(binding, path, stable_name, *, optional_empty=False):
              if not path.is_file():
                  raise ValueError(f"predecessor lacks {stable_name}")
              if not isinstance(binding, dict):
                  if optional_empty and path.stat().st_size == 0:
                      return
                  raise ValueError(f"state lacks binding for {stable_name}")
              claimed_path = binding.get("path")
              claimed_sha = binding.get("sha256")
              claimed_count = binding.get("record_count")
              if claimed_path not in (stable_name, None):
                  raise ValueError(f"non-stable ledger path binding: {stable_name}")
              observed_count = jsonl_count(path)
              if claimed_count != observed_count:
                  raise ValueError(f"ledger record-count mismatch: {stable_name}")
              if claimed_sha is None:
                  if observed_count != 0 or path.stat().st_size != 0:
                      raise ValueError(f"null digest binds nonempty ledger: {stable_name}")
              elif claimed_path != stable_name or sha_file(path) != claimed_sha:
                  raise ValueError(f"ledger SHA-256 mismatch: {stable_name}")

          def seal(doc):
              doc["hash_chain"]["checkpoint_sha256"] = zero
              doc["hash_chain"]["checkpoint_sha256"] = checkpoint_hash(doc)
              return doc

          def cursor_tuple(cursor):
              stage_order = {
                  "H": 0, "outer_action": 1, "extension_class": 2,
                  "marked_orbit": 3, "candidate_evaluation": 4, "k_closure": 5,
              }
              return (
                  cursor["k"], cursor["H"]["index"], cursor["outer_action"]["index"],
                  cursor["extension_class"]["index"], cursor["marked_orbit"]["index"],
                  stage_order[cursor["stage"]],
              )

          def validate_core(doc, bind_current=True):
              template = load_json(seed_path)
              expected_top = {
                  "schema_version", "state_kind", "universe", "cursor_order", "integrity",
                  "hash_chain", "run", "status", "calibration_gate", "cursors",
                  "enumeration", "ledgers", "terminal_witness", "receipts",
              }
              if set(doc) != expected_top:
                  raise ValueError("unexpected or missing top-level state fields")
              if doc.get("schema_version") != "d972-dovetail-state/v1":
                  raise ValueError("schema_version mismatch")
              if doc.get("cursor_order") != [
                  "k", "H", "outer_action", "extension_class", "marked_orbit"
              ]:
                  raise ValueError("cursor order mismatch")
              if doc["universe"] != template["universe"]:
                  raise ValueError("enumeration universe drift")
              if doc["integrity"]["schema"]["path"] != template["integrity"]["schema"]["path"]:
                  raise ValueError("schema path drift")
              if doc["integrity"]["inputs"] != template["integrity"]["inputs"]:
                  raise ValueError("immutable input binding drift")
              for name, binding in template["integrity"]["code"].items():
                  current = doc["integrity"]["code"].get(name, {})
                  if (current.get("path"), current.get("required")) != (
                      binding["path"], binding["required"]
                  ):
                      raise ValueError(f"code binding drift: {name}")
              if doc["receipts"].get("cli_contract") != template["receipts"]["cli_contract"]:
                  raise ValueError("CLI contract drift")
              frozen_cases = [
                  (row["case_id"], row["calibration_only"], row["expected"])
                  for row in template["calibration_gate"]["cases"]
              ]
              observed_cases = [
                  (row["case_id"], row["calibration_only"], row["expected"])
                  for row in doc["calibration_gate"]["cases"]
              ]
              if observed_cases != frozen_cases:
                  raise ValueError("calibration preregistration drift")
              gate = doc["calibration_gate"]
              if gate["status"] == "PASSED":
                  if not gate["search_unlocked"] or not gate["producer_checker_agree"]:
                      raise ValueError("false calibration-pass flags")
                  for row in gate["cases"]:
                      expected = row["expected"]
                      if not row["agreed"] or not isinstance(row["producer"], dict) or not isinstance(row["checker"], dict):
                          raise ValueError(f"missing calibration receipt: {row['case_id']}")
                      for lane in ("producer", "checker"):
                          observed = {key: row[lane][key] for key in expected}
                          if observed != expected:
                              raise ValueError(f"calibration mismatch: {row['case_id']}:{lane}")
                          receipt = row[lane].get("receipt_sha256")
                          computed = hashlib.sha256(json.dumps(
                              observed, ensure_ascii=False, sort_keys=True, separators=(",", ":")
                          ).encode("utf-8")).hexdigest()
                          if receipt != computed:
                              raise ValueError(f"calibration receipt digest mismatch: {row['case_id']}:{lane}")
              elif gate["search_unlocked"]:
                  raise ValueError("search unlocked before calibration passed")
              if doc["enumeration"]["closure_policy"] != template["enumeration"]["closure_policy"]:
                  raise ValueError("k-closure policy drift")
              for key in ("count", "source_map_a_sha256", "source_map_b_sha256", "canonical_tuple_digest"):
                  if doc["receipts"]["target_keys"].get(key) != template["receipts"]["target_keys"].get(key):
                      raise ValueError(f"target-key binding drift: {key}")
              if checkpoint_hash(doc) != doc["hash_chain"].get("checkpoint_sha256"):
                  raise ValueError("checkpoint SHA-256 mismatch")
              sequence = doc["hash_chain"].get("sequence")
              parent = doc["hash_chain"].get("parent_checkpoint_sha256")
              if not isinstance(sequence, int) or sequence < 0:
                  raise ValueError("invalid hash-chain sequence")
              if sequence == 0 and parent is not None:
                  raise ValueError("seed has a parent")
              if sequence > 0 and not isinstance(parent, str):
                  raise ValueError("non-seed lacks parent")
              status = doc.get("status", {})
              if status.get("code") not in allowed:
                  raise ValueError("unknown or forbidden status")
              halt_codes = {
                  "CALIBRATION_STOP", "DISAGREE_STOP", "INCONSISTENT_STOP", "STATE_STOP",
                  "BLOCKED_RELATIVE_EXTENSION_ENUMERATOR", "A_WITNESS_CROSSCHECKED",
              }
              if status["code"] in halt_codes:
                  if not status["terminal"] or status["resumable"] or doc["state_kind"] != "TERMINAL":
                      raise ValueError("halt/terminal flags disagree")
              elif status["terminal"] or not status["resumable"] or doc["state_kind"] == "TERMINAL":
                  raise ValueError("nonterminal status has terminal flags")
              if status["code"] in {"CHECKER_PENDING", "CONTINUE", "A_WITNESS_CROSSCHECKED"}:
                  enum = doc["enumeration"]
                  if not (
                      enum["engine_status"] == "COMPLETE"
                      and enum["complete_relative_extensions"]
                      and enum["includes_nonabelian"]
                      and isinstance(enum["engine_completeness_receipt_sha256"], str)
                  ):
                      raise ValueError("search advanced without complete relative-extension receipt")
              cursors = doc.get("cursors", {})
              for name in ("producer", "checker", "agreed"):
                  cursor_tuple(cursors[name])
              if cursors.get("exact_equal"):
                  if not (cursors["producer"] == cursors["checker"] == cursors["agreed"]):
                      raise ValueError("claimed agreed cursor is unequal")
              if status["code"] in {"CONTINUE", "A_WITNESS_CROSSCHECKED"} and not (
                  cursors.get("exact_equal")
                  and isinstance(cursors.get("agreement_receipt_sha256"), str)
                  and len(cursors["agreement_receipt_sha256"]) == 64
              ):
                  raise ValueError("final search state lacks cursor agreement receipt")
              seen_open = False
              prior_k = 2
              for row in doc["enumeration"]["k_ledger"]:
                  if row["k"] <= prior_k:
                      raise ValueError("k ledger is not strictly increasing")
                  prior_k = row["k"]
                  if row["k_closed"]:
                      if seen_open or not (
                          row["status"] == "CLOSED"
                          and row["enumerator_complete"]
                          and row["producer_checker_agree"]
                          and row["remaining_items"] == 0
                          and isinstance(row["completeness_receipt_sha256"], str)
                      ):
                          raise ValueError("false or out-of-order k_closed")
                  else:
                      seen_open = True
              enum = doc["enumeration"]
              if enum["complete_relative_extensions"]:
                  raise ValueError(
                      "blocked-only v1 contract forbids COMPLETE: exact extension/shadow "
                      "cells have no checkpointable inner cursor"
                  )
              if bind_current:
                  if sha_file(schema_path) != doc["integrity"]["schema"]["sha256"]:
                      raise ValueError("schema digest drift")
                  input_lines = []
                  for binding in doc["integrity"]["inputs"]:
                      path = root / binding["path"]
                      if not path.is_file() or sha_file(path) != binding["sha256"]:
                          raise ValueError(f"input digest drift: {binding['path']}")
                      input_lines.append(f"{binding['path']}={binding['sha256']}\n")
                  expected_input_set = hashlib.sha256(
                      "".join(sorted(input_lines)).encode("utf-8")
                  ).hexdigest()
                  if expected_input_set != doc["integrity"]["input_set_sha256"]:
                      raise ValueError("input-set digest mismatch")
                  code_lines = []
                  for binding in doc["integrity"]["code"].values():
                      path = root / binding["path"]
                      if binding["required"]:
                          if not path.is_file() or sha_file(path) != binding["sha256"]:
                              raise ValueError(f"code digest drift: {binding['path']}")
                      if binding["sha256"] is not None:
                          code_lines.append(f"{binding['path']}={binding['sha256']}\n")
                  expected_code_set = hashlib.sha256(
                      "".join(sorted(code_lines)).encode("utf-8")
                  ).hexdigest()
                  if (
                      not doc["integrity"]["ready"]
                      or expected_code_set != doc["integrity"]["code_set_sha256"]
                  ):
                      raise ValueError("code-set digest mismatch or not ready")

          def bind_integrity(doc):
              doc["integrity"]["schema"]["sha256"] = sha_file(schema_path)
              code_lines = []
              ready = True
              for binding in doc["integrity"]["code"].values():
                  path = root / binding["path"]
                  binding["sha256"] = sha_file(path) if path.is_file() else None
                  if binding["required"] and binding["sha256"] is None:
                      ready = False
                  if binding["sha256"] is not None:
                      code_lines.append(f"{binding['path']}={binding['sha256']}\n")
              doc["integrity"]["ready"] = ready
              doc["integrity"]["code_set_sha256"] = (
                  hashlib.sha256("".join(sorted(code_lines)).encode("utf-8")).hexdigest()
                  if ready else None
              )
              doc["receipts"]["runtime_integrity"] = {
                  "manifest_path": os.environ["SEED_MANIFEST"],
                  "manifest_sha256": sha_file(seed_path),
              }

          def bind_run(doc, resume_run_id):
              doc["run"] = {
                  "run_id": os.environ["CURRENT_RUN_ID"],
                  "run_attempt": int(os.environ["CURRENT_RUN_ATTEMPT"]),
                  "event": os.environ["CURRENT_EVENT"],
                  "commit_sha": os.environ["CURRENT_COMMIT"],
                  "created_at_utc": __import__("datetime").datetime.now(
                      __import__("datetime").timezone.utc
                  ).isoformat().replace("+00:00", "Z"),
                  "resume_run_id": resume_run_id,
              }

          def state_stop(reason):
              doc = load_json(seed_path)
              bind_integrity(doc)
              bind_run(doc, os.environ.get("SOURCE_RUN_ID") or None)
              doc["state_kind"] = "TERMINAL"
              doc["status"] = {
                  "code": "STATE_STOP", "terminal": True, "resumable": False,
                  "reason": reason,
              }
              doc["terminal_witness"] = None
              seal(doc)
              return doc

          requested = os.environ.get("SELECT_MODE", "")
          reason = os.environ.get("SELECT_REASON", "")
          mode = "STATE_STOP"
          chain = []
          state = None
          try:
              if os.environ.get("SELECT_OUTCOME") != "success":
                  raise ValueError("artifact selection step failed")
              if os.environ.get("GAP_OUTCOME") != "success":
                  raise ValueError("required GAP installation/preflight failed")
              if requested == "INITIALIZE":
                  state = load_json(seed_path)
                  bind_integrity(state)
                  if not state["integrity"]["ready"]:
                      raise ValueError("required producer/checker/worker/workflow code is absent")
                  bind_run(state, None)
                  state["state_kind"] = "CHECKPOINT"
                  state["status"] = {
                      "code": "CALIBRATION_PENDING", "terminal": False,
                      "resumable": True, "reason": "immutable seed initialized",
                  }
                  seal(state)
                  validate_core(state)
                  chain = [{
                      "sequence": 0,
                      "parent_checkpoint_sha256": None,
                      "checkpoint_sha256": state["hash_chain"]["checkpoint_sha256"],
                      "agreed_cursor": state["cursors"]["agreed"],
                  }]
                  mode = "RUN"
              elif requested == "RESUME":
                  if os.environ.get("DOWNLOAD_OUTCOME") != "success":
                      raise ValueError("selected state artifact download failed")
                  state_files = list((run_root / "resume").rglob("state.json"))
                  chain_files = list((run_root / "resume").rglob("chain.jsonl"))
                  producer_ledger_files = list(
                      (run_root / "resume").rglob("producer-ledger.jsonl")
                  )
                  checker_ledger_files = list(
                      (run_root / "resume").rglob("checker-ledger.jsonl")
                  )
                  classification_ledger_files = list(
                      (run_root / "resume").rglob("producer-classification-ledger.jsonl")
                  )
                  if not all(len(files) == 1 for files in (
                      state_files, chain_files, producer_ledger_files,
                      checker_ledger_files, classification_ledger_files,
                  )):
                      raise ValueError(
                          "predecessor artifact lacks exactly one state, chain, producer, "
                          "checker, or classification ledger"
                      )
                  state = load_json(state_files[0])
                  validate_core(state)
                  verify_bound_ledger(
                      state["ledgers"]["producer"], producer_ledger_files[0],
                      "producer-ledger.jsonl",
                  )
                  verify_bound_ledger(
                      state["ledgers"]["checker"], checker_ledger_files[0],
                      "checker-ledger.jsonl",
                  )
                  verify_bound_ledger(
                      state["receipts"].get("classification_ledger"),
                      classification_ledger_files[0],
                      "producer-classification-ledger.jsonl",
                      optional_empty=state["status"]["terminal"],
                  )
                  if state["status"]["code"] == "CHECKER_PENDING":
                      raise ValueError("predecessor artifact ended before checker agreement")
                  chain = [json.loads(line) for line in chain_files[0].read_text(
                      encoding="utf-8"
                  ).splitlines() if line.strip()]
                  if not chain:
                      raise ValueError("empty predecessor hash chain")
                  for index, row in enumerate(chain):
                      if row["sequence"] != index:
                          raise ValueError("non-contiguous predecessor hash chain")
                      if index == 0:
                          if row["parent_checkpoint_sha256"] is not None:
                              raise ValueError("predecessor chain seed has parent")
                      elif row["parent_checkpoint_sha256"] != chain[index - 1]["checkpoint_sha256"]:
                          raise ValueError("predecessor hash-chain fork")
                  last = chain[-1]
                  if (
                      last["sequence"] != state["hash_chain"]["sequence"]
                      or last["checkpoint_sha256"] != state["hash_chain"]["checkpoint_sha256"]
                      or last["agreed_cursor"] != state["cursors"]["agreed"]
                  ):
                      raise ValueError("predecessor chain tail/state disagreement")
                  producer_work.mkdir(parents=True, exist_ok=True)
                  checker_work.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(
                      producer_ledger_files[0], producer_work / "producer-ledger.jsonl"
                  )
                  shutil.copyfile(
                      classification_ledger_files[0],
                      producer_work / "producer-classification-ledger.jsonl",
                  )
                  shutil.copyfile(
                      checker_ledger_files[0], checker_work / "checker-ledger.jsonl"
                  )
                  mode = "TERMINAL_NOOP" if state["status"]["terminal"] else "RUN"
              else:
                  raise ValueError(reason or "artifact selection returned no valid mode")
          except Exception as exc:
              state = state_stop(f"STATE_STOP: {exc}")
              chain = [{
                  "sequence": state["hash_chain"]["sequence"],
                  "parent_checkpoint_sha256": state["hash_chain"]["parent_checkpoint_sha256"],
                  "checkpoint_sha256": state["hash_chain"]["checkpoint_sha256"],
                  "agreed_cursor": state["cursors"]["agreed"],
              }]
              mode = "STATE_STOP"

          state_out.write_text(json.dumps(state, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          chain_out.write_text(
              "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in chain),
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"mode={mode}\n")
              output.write(f"input_digest={state['hash_chain']['checkpoint_sha256']}\n")
          print(f"PREPARE_MODE={mode}")
          print(f"STATE_DIGEST={state['hash_chain']['checkpoint_sha256']}")
          PY

      - name: Run producer and independent checker under a 300-minute watchdog
        id: slice
        if: always() && steps.prepare.outcome == 'success' && steps.prepare.outputs.mode == 'RUN'
        continue-on-error: true
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ steps.select.outputs.source_run_id }}
        run: |
          set -uo pipefail
          case "$REQUESTED_SLICE_SECONDS" in
            ''|*[!0-9]*) echo "invalid slice_seconds" >&2; exit 64 ;;
          esac
          if (( REQUESTED_SLICE_SECONDS < 60 || REQUESTED_SLICE_SECONDS > 16800 )); then
            echo "slice_seconds must be in 60..16800" >&2
            exit 64
          fi
          mkdir -p "$RUN_ROOT/work/producer" "$RUN_ROOT/work/checker"
          cp "$RUN_ROOT/work/state-in.json" "$RUN_ROOT/work/producer/state.json"
          start_epoch=$(date +%s)
          producer_args=(
            python "$PRODUCER"
            --state "$RUN_ROOT/work/producer/state.json"
            --out-dir "$RUN_ROOT/work/producer"
            --slice-seconds "$REQUESTED_SLICE_SECONDS"
          )
          if [[ "$PREFLIGHT_ONLY" == "true" ]]; then
            producer_args+=(--preflight-only)
          fi
          set +e
          timeout --signal=TERM --kill-after=60s "${PIPELINE_WATCHDOG_SECONDS}s" \
            /usr/bin/time -v -o "$RUN_ROOT/work/producer/time.txt" \
            "${producer_args[@]}" \
            >"$RUN_ROOT/work/producer/stdout.log" \
            2>"$RUN_ROOT/work/producer/stderr.log"
          producer_exit=$?
          set -e
          checker_exit=125
          if (( producer_exit == 0 )); then
            producer_terminal=$(python - <<'PY'
          import json, os
          from pathlib import Path
          state=json.loads((Path(os.environ["RUN_ROOT"])/"work/producer/state.json").read_text(encoding="utf-8"))
          print("true" if state.get("status", {}).get("terminal") else "false")
          PY
            )
            if [[ "$producer_terminal" == "true" ]]; then
              cp "$RUN_ROOT/work/producer/state.json" "$RUN_ROOT/work/final-state-candidate.json"
              checker_exit=0
              # Preserve a restored checker ledger byte-for-byte.  A first
              # terminal preflight has no checker rows, so create only the
              # empty artifact required by the resume contract.
              if [[ ! -f "$RUN_ROOT/work/checker/checker-ledger.jsonl" ]]; then
                : > "$RUN_ROOT/work/checker/checker-ledger.jsonl"
              fi
            else
              cp "$RUN_ROOT/work/producer/state.json" "$RUN_ROOT/work/checker/state.json"
              elapsed=$(( $(date +%s) - start_epoch ))
              remaining=$(( PIPELINE_WATCHDOG_SECONDS - elapsed ))
              if (( remaining > 0 )); then
                set +e
                timeout --signal=TERM --kill-after=60s "${remaining}s" \
                  /usr/bin/time -v -o "$RUN_ROOT/work/checker/time.txt" \
                  python "$CHECKER" \
                    --state "$RUN_ROOT/work/checker/state.json" \
                    --producer-ledger "$RUN_ROOT/work/producer/producer-ledger.jsonl" \
                    --out-dir "$RUN_ROOT/work/checker" \
                    >"$RUN_ROOT/work/checker/stdout.log" \
                    2>"$RUN_ROOT/work/checker/stderr.log"
                checker_exit=$?
                set -e
                if (( checker_exit == 0 )); then
                  cp "$RUN_ROOT/work/checker/state.json" "$RUN_ROOT/work/final-state-candidate.json"
                fi
              else
                checker_exit=124
              fi
            fi
          fi
          wall_seconds=$(( $(date +%s) - start_epoch ))
          {
            echo "producer_exit=$producer_exit"
            echo "checker_exit=$checker_exit"
            echo "wall_seconds=$wall_seconds"
          } >> "$GITHUB_OUTPUT"
          if (( producer_exit == 124 || checker_exit == 124 )); then
            exit 124
          fi
          if (( producer_exit != 0 || checker_exit != 0 )); then
            exit 2
          fi

      - name: Validate transition and assemble the immutable artifact
        id: collect
        if: always() && steps.prepare.outcome == 'success'
        shell: bash
        env:
          PREPARE_MODE: ${{ steps.prepare.outputs.mode }}
          SLICE_OUTCOME: ${{ steps.slice.outcome }}
          PRODUCER_EXIT: ${{ steps.slice.outputs.producer_exit }}
          CHECKER_EXIT: ${{ steps.slice.outputs.checker_exit }}
          WALL_SECONDS: ${{ steps.slice.outputs.wall_seconds }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_COMMIT: ${{ github.sha }}
          SOURCE_RUN_ID: ${{ steps.select.outputs.source_run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import shutil
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          run_root = Path(os.environ["RUN_ROOT"])
          work = run_root / "work"
          bundle = run_root / "bundle"
          bundle.mkdir(parents=True, exist_ok=True)
          zero = "0" * 64
          old = json.loads((work / "state-in.json").read_text(encoding="utf-8"))
          chain = [json.loads(line) for line in (work / "chain-in.jsonl").read_text(
              encoding="utf-8"
          ).splitlines() if line.strip()]

          def sha_file(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          def jsonl_count(path):
              count = 0
              for number, line in enumerate(path.read_text(encoding="utf-8").splitlines(), 1):
                  if not line.strip():
                      continue
                  if not isinstance(json.loads(line), dict):
                      raise ValueError(f"non-object JSONL row {number}: {path.name}")
                  count += 1
              return count

          def validate_bound_ledger(binding, path, stable_name, *, optional_empty=False):
              if not path.is_file():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text("", encoding="utf-8")
              if not isinstance(binding, dict):
                  if optional_empty and path.stat().st_size == 0:
                      return
                  raise ValueError(f"final state lacks binding for {stable_name}")
              if binding.get("path") not in (stable_name, None):
                  raise ValueError(f"final state has unstable path for {stable_name}")
              count = jsonl_count(path)
              if binding.get("record_count") != count:
                  raise ValueError(f"final ledger count mismatch: {stable_name}")
              digest = binding.get("sha256")
              if digest is None:
                  if count != 0 or path.stat().st_size != 0:
                      raise ValueError(f"null final digest binds data: {stable_name}")
              elif binding.get("path") != stable_name or sha_file(path) != digest:
                  raise ValueError(f"final ledger digest mismatch: {stable_name}")

          def checkpoint_hash(doc):
              value = copy.deepcopy(doc)
              value["hash_chain"]["checkpoint_sha256"] = zero
              raw = json.dumps(
                  value, ensure_ascii=False, sort_keys=True, separators=(",", ":")
              ).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()

          def seal(doc):
              doc["hash_chain"]["checkpoint_sha256"] = zero
              doc["hash_chain"]["checkpoint_sha256"] = checkpoint_hash(doc)
              return doc

          def cursor_tuple(cursor):
              stages = {
                  "H": 0, "outer_action": 1, "extension_class": 2,
                  "marked_orbit": 3, "candidate_evaluation": 4, "k_closure": 5,
              }
              return (
                  cursor["k"], cursor["H"]["index"], cursor["outer_action"]["index"],
                  cursor["extension_class"]["index"], cursor["marked_orbit"]["index"],
                  stages[cursor["stage"]],
              )

          def validate(doc):
              expected_top = {
                  "schema_version", "state_kind", "universe", "cursor_order", "integrity",
                  "hash_chain", "run", "status", "calibration_gate", "cursors",
                  "enumeration", "ledgers", "terminal_witness", "receipts",
              }
              if set(doc) != expected_top:
                  raise ValueError("unexpected or missing top-level state fields")
              if doc.get("schema_version") != "d972-dovetail-state/v1":
                  raise ValueError("schema mismatch")
              if doc["universe"] != old["universe"] or doc["cursor_order"] != old["cursor_order"]:
                  raise ValueError("enumeration universe drift")
              if doc["integrity"] != old["integrity"]:
                  raise ValueError("schema/code/input digest binding drift")
              if doc["receipts"].get("cli_contract") != old["receipts"].get("cli_contract"):
                  raise ValueError("CLI contract drift")
              for key in ("count", "source_map_a_sha256", "source_map_b_sha256", "canonical_tuple_digest"):
                  if doc["receipts"]["target_keys"].get(key) != old["receipts"]["target_keys"].get(key):
                      raise ValueError(f"target-key binding drift: {key}")
              if doc["enumeration"]["closure_policy"] != old["enumeration"]["closure_policy"]:
                  raise ValueError("k-closure policy drift")
              if checkpoint_hash(doc) != doc["hash_chain"].get("checkpoint_sha256"):
                  raise ValueError("state digest mismatch")
              status = doc["status"]
              allowed_codes = {
                  "INITIALIZED", "CALIBRATION_PENDING", "CHECKER_PENDING", "CALIBRATION_STOP",
                  "CONTINUE", "UNKNOWN/RESUME", "A_WITNESS_CROSSCHECKED", "DISAGREE_STOP",
                  "INCONSISTENT_STOP", "STATE_STOP", "BLOCKED_RELATIVE_EXTENSION_ENUMERATOR",
              }
              if status["code"] not in allowed_codes:
                  raise ValueError("unknown status")
              if status["code"] in {"B", "GENUINE", "ALL_REFINEMENTS_SURVIVE"}:
                  raise ValueError("forbidden finite all-pass conclusion")
              halt_codes = {
                  "CALIBRATION_STOP", "DISAGREE_STOP", "INCONSISTENT_STOP", "STATE_STOP",
                  "BLOCKED_RELATIVE_EXTENSION_ENUMERATOR", "A_WITNESS_CROSSCHECKED",
              }
              if status["code"] in halt_codes:
                  if not status["terminal"] or status["resumable"] or doc["state_kind"] != "TERMINAL":
                      raise ValueError("halt/terminal flags disagree")
              elif status["terminal"] or not status["resumable"] or doc["state_kind"] == "TERMINAL":
                  raise ValueError("nonterminal status has terminal flags")
              if status["code"] in {"CHECKER_PENDING", "CONTINUE", "A_WITNESS_CROSSCHECKED"}:
                  gate = doc["calibration_gate"]
                  if not (
                      gate["status"] == "PASSED" and gate["search_unlocked"]
                      and gate["producer_checker_agree"]
                  ):
                      raise ValueError("search advanced before calibration agreement")
                  enum = doc["enumeration"]
                  if not (
                      enum["engine_status"] == "COMPLETE"
                      and enum["complete_relative_extensions"]
                      and enum["includes_nonabelian"]
                      and isinstance(enum["engine_completeness_receipt_sha256"], str)
                  ):
                      raise ValueError("search advanced without complete relative-extension receipt")
              old_cases = [(x["case_id"], x["calibration_only"], x["expected"])
                           for x in old["calibration_gate"]["cases"]]
              new_cases = [(x["case_id"], x["calibration_only"], x["expected"])
                           for x in doc["calibration_gate"]["cases"]]
              if new_cases != old_cases:
                  raise ValueError("calibration preregistration drift")
              gate = doc["calibration_gate"]
              if gate["status"] == "PASSED":
                  if not gate["search_unlocked"] or not gate["producer_checker_agree"]:
                      raise ValueError("false calibration-pass flags")
                  for row in gate["cases"]:
                      expected = row["expected"]
                      if not row["agreed"] or not isinstance(row["producer"], dict) or not isinstance(row["checker"], dict):
                          raise ValueError(f"missing calibration receipt: {row['case_id']}")
                      for lane in ("producer", "checker"):
                          if {key: row[lane][key] for key in expected} != expected:
                              raise ValueError(f"calibration mismatch: {row['case_id']}:{lane}")
                          receipt = row[lane].get("receipt_sha256")
                          metrics = {key: row[lane][key] for key in expected}
                          computed = hashlib.sha256(json.dumps(
                              metrics, ensure_ascii=False, sort_keys=True, separators=(",", ":")
                          ).encode("utf-8")).hexdigest()
                          if receipt != computed:
                              raise ValueError(f"calibration digest mismatch: {row['case_id']}:{lane}")
              elif gate["search_unlocked"]:
                  raise ValueError("search unlocked before calibration passed")
              cursors = doc["cursors"]
              if cursors["exact_equal"] and not (
                  cursors["producer"] == cursors["checker"] == cursors["agreed"]
              ):
                  raise ValueError("false producer/checker cursor agreement")
              if status["code"] in {"CONTINUE", "A_WITNESS_CROSSCHECKED"} and not (
                  cursors["exact_equal"]
                  and isinstance(cursors["agreement_receipt_sha256"], str)
                  and len(cursors["agreement_receipt_sha256"]) == 64
              ):
                  raise ValueError("final search state lacks exact cursor agreement receipt")
              seen_open = False
              last_k = 2
              for row in doc["enumeration"]["k_ledger"]:
                  if row["k"] <= last_k:
                      raise ValueError("unordered k ledger")
                  last_k = row["k"]
                  if row["k_closed"]:
                      if seen_open or not (
                          row["status"] == "CLOSED"
                          and row["enumerator_complete"]
                          and row["producer_checker_agree"]
                          and row["remaining_items"] == 0
                          and isinstance(row["completeness_receipt_sha256"], str)
                      ):
                          raise ValueError("false k_closed")
                  else:
                      seen_open = True
              enum = doc["enumeration"]
              if enum["complete_relative_extensions"]:
                  raise ValueError(
                      "blocked-only v1 contract forbids COMPLETE: exact extension/shadow "
                      "cells have no checkpointable inner cursor"
                  )
              if status["code"] == "BLOCKED_RELATIVE_EXTENSION_ENUMERATOR" and not (
                  doc["enumeration"]["engine_status"] == "BLOCKED"
                  and not doc["enumeration"]["complete_relative_extensions"]
              ):
                  raise ValueError("blocked enumerator status lacks exact blocked receipt")
              if status["code"] == "A_WITNESS_CROSSCHECKED":
                  witness = doc["terminal_witness"]
                  if not (
                      isinstance(witness, dict) and witness.get("isolated") is True
                      and witness.get("target_key_count") == 972
                      and witness.get("image_size") == 324
                      and witness.get("zero_keys")
                  ):
                      raise ValueError("invalid A terminal witness")
              elif doc["terminal_witness"] is not None:
                  raise ValueError("non-A state carries a terminal witness")
              return doc

          def transition_stop(code, reason, resumable):
              doc = copy.deepcopy(old)
              doc["state_kind"] = "CHECKPOINT" if resumable else "TERMINAL"
              doc["hash_chain"]["sequence"] = old["hash_chain"]["sequence"] + 1
              doc["hash_chain"]["parent_checkpoint_sha256"] = old["hash_chain"]["checkpoint_sha256"]
              doc["run"] = {
                  "run_id": os.environ["CURRENT_RUN_ID"],
                  "run_attempt": int(os.environ["CURRENT_RUN_ATTEMPT"]),
                  "event": os.environ["CURRENT_EVENT"],
                  "commit_sha": os.environ["CURRENT_COMMIT"],
                  "created_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
                  "resume_run_id": os.environ.get("SOURCE_RUN_ID") or None,
              }
              doc["status"] = {
                  "code": code, "terminal": not resumable,
                  "resumable": resumable, "reason": reason,
              }
              doc["terminal_witness"] = None
              return seal(doc)

          mode = os.environ.get("PREPARE_MODE", "STATE_STOP")
          final = old
          states_to_append = []
          verdict = mode
          if mode in {"STATE_STOP", "TERMINAL_NOOP"}:
              verdict = mode
          else:
              try:
                  if os.environ.get("SLICE_OUTCOME") != "success":
                      exits = (os.environ.get("PRODUCER_EXIT"), os.environ.get("CHECKER_EXIT"))
                      if "124" in exits:
                          final = transition_stop(
                              "UNKNOWN/RESUME", "300-minute internal watchdog checkpoint", True
                          )
                          verdict = "UNKNOWN/RESUME"
                      else:
                          final = transition_stop(
                              "STATE_STOP", f"producer/checker process failure: {exits}", False
                          )
                          verdict = "STATE_STOP"
                      states_to_append = [final]
                  else:
                      candidate_path = work / "final-state-candidate.json"
                      if not candidate_path.is_file():
                          raise ValueError("successful slice emitted no final state")
                      candidate = validate(json.loads(candidate_path.read_text(encoding="utf-8")))
                      if candidate["status"]["code"] == "CHECKER_PENDING":
                          raise ValueError("checker left a producer-pending state unresolved")
                      if candidate["hash_chain"]["sequence"] <= old["hash_chain"]["sequence"]:
                          raise ValueError("state sequence did not advance")
                      for lane in ("producer", "checker", "agreed"):
                          if cursor_tuple(candidate["cursors"][lane]) < cursor_tuple(old["cursors"][lane]):
                              raise ValueError(f"{lane} cursor regressed")
                      producer_state_path = work / "producer" / "state.json"
                      producer_state = validate(json.loads(producer_state_path.read_text(encoding="utf-8")))
                      if (
                          producer_state["hash_chain"]["sequence"] != old["hash_chain"]["sequence"] + 1
                          or producer_state["hash_chain"]["parent_checkpoint_sha256"]
                             != old["hash_chain"]["checkpoint_sha256"]
                      ):
                          raise ValueError("producer parent link mismatch")
                      if candidate["hash_chain"]["checkpoint_sha256"] != producer_state["hash_chain"]["checkpoint_sha256"]:
                          if (
                              candidate["hash_chain"]["sequence"] != producer_state["hash_chain"]["sequence"] + 1
                              or candidate["hash_chain"]["parent_checkpoint_sha256"]
                                 != producer_state["hash_chain"]["checkpoint_sha256"]
                          ):
                              raise ValueError("checker parent link mismatch")
                      final = candidate
                      verdict = candidate["status"]["code"]
                      states_to_append = [producer_state]
                      if (
                          candidate["hash_chain"]["checkpoint_sha256"]
                          != producer_state["hash_chain"]["checkpoint_sha256"]
                      ):
                          states_to_append.append(candidate)
              except Exception as exc:
                  final = transition_stop("STATE_STOP", f"transition validation failed: {exc}", False)
                  verdict = "STATE_STOP"
                  states_to_append = [final]

          validate(final)
          validate_bound_ledger(
              final["ledgers"]["producer"], work / "producer" / "producer-ledger.jsonl",
              "producer-ledger.jsonl",
          )
          validate_bound_ledger(
              final["ledgers"]["checker"], work / "checker" / "checker-ledger.jsonl",
              "checker-ledger.jsonl",
          )
          validate_bound_ledger(
              final["receipts"].get("classification_ledger"),
              work / "producer" / "producer-classification-ledger.jsonl",
              "producer-classification-ledger.jsonl", optional_empty=final["status"]["terminal"],
          )
          for checkpoint in states_to_append:
              chain.append({
                  "sequence": checkpoint["hash_chain"]["sequence"],
                  "parent_checkpoint_sha256": checkpoint["hash_chain"]["parent_checkpoint_sha256"],
                  "checkpoint_sha256": checkpoint["hash_chain"]["checkpoint_sha256"],
                  "agreed_cursor": checkpoint["cursors"]["agreed"],
              })
          (bundle / "state.json").write_text(
              json.dumps(final, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          (bundle / "chain.jsonl").write_text(
              "".join(json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n" for row in chain),
              encoding="utf-8",
          )

          copies = {
              work / "producer" / "producer-ledger.jsonl": bundle / "producer-ledger.jsonl",
              work / "producer" / "producer-classification-ledger.jsonl":
                  bundle / "producer-classification-ledger.jsonl",
              work / "checker" / "checker-ledger.jsonl": bundle / "checker-ledger.jsonl",
              work / "producer" / "stderr.log": bundle / "producer-stderr.log",
              work / "checker" / "stderr.log": bundle / "checker-stderr.log",
              work / "producer" / "resource_receipt.json": bundle / "producer-resource-receipt.json",
              work / "checker" / "resource_receipt.json": bundle / "checker-resource-receipt.json",
              work / "producer" / "time.txt": bundle / "producer-time.txt",
              work / "checker" / "time.txt": bundle / "checker-time.txt",
          }
          for source, destination in copies.items():
              if source.is_file():
                  shutil.copyfile(source, destination)
              else:
                  destination.write_text("" if destination.suffix != ".json" else "{}\n", encoding="utf-8")
          resource = {
              "run_id": os.environ["CURRENT_RUN_ID"],
              "run_attempt": int(os.environ["CURRENT_RUN_ATTEMPT"]),
              "source_run_id": os.environ.get("SOURCE_RUN_ID") or None,
              "prepare_mode": mode,
              "verdict": verdict,
              "producer_exit": os.environ.get("PRODUCER_EXIT") or None,
              "checker_exit": os.environ.get("CHECKER_EXIT") or None,
              "wall_seconds": int(os.environ.get("WALL_SECONDS") or 0),
              "pipeline_watchdog_seconds": int(os.environ["PIPELINE_WATCHDOG_SECONDS"]),
              "job_timeout_minutes": 330,
              "bundle_bytes_before_workflow_receipt": sum(
                  path.stat().st_size for path in bundle.iterdir() if path.is_file()
              ),
              "terminal_digest": final["hash_chain"]["checkpoint_sha256"] if final["status"]["terminal"] else None,
          }
          (bundle / "workflow-resource-receipt.json").write_text(
              json.dumps(resource, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"verdict={verdict}\n")
              output.write(f"state_digest={final['hash_chain']['checkpoint_sha256']}\n")
          print(f"VERDICT={verdict}")
          print(f"STATE_DIGEST={final['hash_chain']['checkpoint_sha256']}")
          PY

      - name: Assemble an emergency STATE_STOP artifact if normal collection failed
        if: always() && steps.collect.outcome != 'success'
        shell: bash
        env:
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_ATTEMPT: ${{ github.run_attempt }}
          CURRENT_EVENT: ${{ github.event_name }}
          CURRENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf -- "${RUN_ROOT:?}/bundle"
          mkdir -p "$RUN_ROOT/bundle"
          python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          bundle = Path(os.environ["RUN_ROOT"]) / "bundle"
          seed = json.loads((root / os.environ["SEED_MANIFEST"]).read_text(encoding="utf-8"))
          zero = "0" * 64

          def sha_file(path):
              h = hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""):
                      h.update(block)
              return h.hexdigest()

          seed["state_kind"] = "TERMINAL"
          seed["run"] = {
              "run_id": os.environ["CURRENT_RUN_ID"],
              "run_attempt": int(os.environ["CURRENT_RUN_ATTEMPT"]),
              "event": os.environ["CURRENT_EVENT"],
              "commit_sha": os.environ["CURRENT_COMMIT"],
              "created_at_utc": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "resume_run_id": None,
          }
          seed["status"] = {
              "code": "STATE_STOP", "terminal": True, "resumable": False,
              "reason": "normal state preparation/collection failed; emergency fail-closed artifact",
          }
          seed["terminal_witness"] = None
          code_lines = []
          ready = True
          for binding in seed["integrity"]["code"].values():
              path = root / binding["path"]
              binding["sha256"] = sha_file(path) if path.is_file() else None
              ready = ready and (not binding["required"] or binding["sha256"] is not None)
              if binding["sha256"]:
                  code_lines.append(f"{binding['path']}={binding['sha256']}\n")
          schema_path = root / os.environ["STATE_SCHEMA"]
          seed["integrity"]["schema"]["sha256"] = sha_file(schema_path)
          seed["integrity"]["ready"] = ready
          seed["integrity"]["code_set_sha256"] = (
              hashlib.sha256("".join(sorted(code_lines)).encode("utf-8")).hexdigest()
              if ready else None
          )
          seed["receipts"]["runtime_integrity"] = {
              "manifest_path": os.environ["SEED_MANIFEST"],
              "manifest_sha256": sha_file(root / os.environ["SEED_MANIFEST"]),
          }
          seed["hash_chain"]["sequence"] = 0
          seed["hash_chain"]["parent_checkpoint_sha256"] = None
          seed["hash_chain"]["checkpoint_sha256"] = zero
          raw = json.dumps(
              seed, ensure_ascii=False, sort_keys=True, separators=(",", ":")
          ).encode("utf-8")
          seed["hash_chain"]["checkpoint_sha256"] = hashlib.sha256(raw).hexdigest()
          (bundle / "state.json").write_text(
              json.dumps(seed, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          row = {
              "sequence": 0,
              "parent_checkpoint_sha256": None,
              "checkpoint_sha256": seed["hash_chain"]["checkpoint_sha256"],
              "agreed_cursor": seed["cursors"]["agreed"],
          }
          (bundle / "chain.jsonl").write_text(
              json.dumps(row, ensure_ascii=False, sort_keys=True) + "\n", encoding="utf-8"
          )
          for name in (
              "producer-ledger.jsonl", "producer-classification-ledger.jsonl",
              "checker-ledger.jsonl",
          ):
              (bundle / name).write_text("", encoding="utf-8")
          (bundle / "workflow-stderr.log").write_text(seed["status"]["reason"] + "\n", encoding="utf-8")
          (bundle / "workflow-resource-receipt.json").write_text(json.dumps({
              "run_id": os.environ["CURRENT_RUN_ID"],
              "verdict": "STATE_STOP",
              "pipeline_watchdog_seconds": int(os.environ["PIPELINE_WATCHDOG_SECONDS"]),
              "job_timeout_minutes": 330,
              "terminal_digest": seed["hash_chain"]["checkpoint_sha256"],
          }, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          print(f"EMERGENCY_STATE_DIGEST={seed['hash_chain']['checkpoint_sha256']}")
          PY

      - name: Upload state and independent ledgers on every run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d972-dovetail-state-${{ github.run_id }}
          path: ${{ runner.temp }}/d972-dovetail/bundle/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
          overwrite: false


      - name: Fail closed if the artifact could not be assembled
        if: always() && steps.collect.outcome != 'success'
        shell: bash
        run: |
          echo "STATE_STOP: no valid artifact bundle was assembled" >&2
          exit 1
