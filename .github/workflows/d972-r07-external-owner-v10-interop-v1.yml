name: d972-r07-external-owner-v10-interop-v1

on:
  workflow_dispatch:
  push:
    branches: [sol/r07-explicit-lift-20260825]
    paths:
      - search/d972_external_owner_gf3_worker_v10.c
      - search/d972_external_owner_gf3_worker_v10.py
      - search/check_d972_external_owner_gf3_worker_v10.py
      - sol/luna_reply_612_r07_external_owner_v10_gha_compile_interop_v1.md
      - .github/workflows/d972-r07-external-owner-v10-interop-v1.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  WORKER_C_SHA256: 8938bcdad693553266aeb08cfe023548fcb8d5965683157e60df564ea16681bd
  OWNER_PY_SHA256: 3b6441063348987d101a9dc8ac019b2dcc85dee983f77342b821db710c00a16c
  CHECKER_SHA256: 34016ce93096cfdc1e28735468a624016c6e53be6b39a1002adc1f07b9d44f63

jobs:
  strict-compile-interop:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[fire-external-owner-v10-interop]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python 3.13
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.13"

      - name: Initialize always-uploaded receipt paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task612-interop"
          printf '%s\n' 'checker not started' > "$RUNNER_TEMP/task612-interop/checker.log"
          printf '%s\n' '{"parse_status":"NOT_RUN"}' > "$RUNNER_TEMP/task612-interop/report.json"
          printf '%s\n' 'NOT_RUN' > "$RUNNER_TEMP/task612-interop/checker-exit.txt"

      - name: Authenticate audited v10 sources
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum search/d972_external_owner_gf3_worker_v10.c | awk '{print $1}')" = "$WORKER_C_SHA256"
          test "$(sha256sum search/d972_external_owner_gf3_worker_v10.py | awk '{print $1}')" = "$OWNER_PY_SHA256"
          test "$(sha256sum search/check_d972_external_owner_gf3_worker_v10.py | awk '{print $1}')" = "$CHECKER_SHA256"

      - name: Run the bounded v10 checker and capture its complete log
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/task612-interop"
          : > "$RUNNER_TEMP/task612-interop/checker.log"
          set +e
          python -B search/check_d972_external_owner_gf3_worker_v10.py 2>&1 \
            | tee "$RUNNER_TEMP/task612-interop/checker.log"
          checker_status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$checker_status" > "$RUNNER_TEMP/task612-interop/checker-exit.txt"

      - name: Parse the final JSON and enforce the exact Task610 gate
        shell: bash
        run: |
          python -B - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "task612-interop"
          log_path = root / "checker.log"
          report_path = root / "report.json"

          def require(condition, label):
              if not condition:
                  raise AssertionError(label)

          lines = [line for line in log_path.read_text(encoding="utf-8", errors="replace").splitlines() if line.strip()]
          try:
              require(lines, "missing_checker_output")
              report = json.loads(lines[-1])
              require(type(report) is dict, "report_not_object")
          except BaseException as exc:
              report_path.write_text(
                  json.dumps(
                      {"parse_error": f"{type(exc).__name__}: {exc}"},
                      sort_keys=True,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )
              raise

          report_path.write_text(json.dumps(report, sort_keys=True, indent=2) + "\n", encoding="utf-8")
          require(int((root / "checker-exit.txt").read_text(encoding="ascii").strip()) == 0, "checker_exit_nonzero")

          # Task610 gate 1: a real compiler and the two completed strict compiles.
          compiler = report.get("compiler")
          require(type(compiler) is str and compiler != "NONE" and Path(compiler).exists(), "compiler_missing")
          strict = report.get("strict_compile")
          require(type(strict) is dict and set(strict) == {"production", "test_only_allocation", "production_failpoint_define"}, "strict_compile_fields")
          production_command = strict["production"]
          test_command = strict["test_only_allocation"]
          require(type(production_command) is list and production_command, "production_compile_missing")
          require(type(test_command) is list and test_command, "test_compile_missing")
          production_text = "\n".join(map(str, production_command))
          test_text = "\n".join(map(str, test_command))
          require("EOW_TEST_FAIL_ACCEPT_ALLOC" not in production_text, "production_failpoint_present")
          require(test_text.count("EOW_TEST_FAIL_ACCEPT_ALLOC") == 1, "test_failpoint_count")
          require(strict["production_failpoint_define"] == "ABSENT", "production_failpoint_field")
          compiler_name = Path(compiler).name.lower()
          if compiler_name in {"cl", "cl.exe"}:
              required_flags = {"/std:c11", "/W4", "/WX", "/TC"}
          else:
              required_flags = {"-std=c11", "-O2", "-Wall", "-Wextra", "-Werror", "-pedantic"}
          require(required_flags.issubset(set(map(str, production_command))), "production_strict_flags")
          require(required_flags.issubset(set(map(str, test_command))), "test_strict_flags")

          # Task610 gate 2: frozen protocol and scope fields.
          require(report.get("version") == 10, "version")
          require(report.get("wire_header_bytes") == 88, "wire_header_bytes")
          require(report.get("record_header_bytes") == 56, "record_header_bytes")
          require(report.get("rank_contract") == 4095, "rank_contract")
          require(report.get("grade1_rank_8059_adapter") == "OUT_OF_SCOPE", "grade1_adapter_scope")
          require(report.get("production") is False, "production")
          require(report.get("verified") is False, "verified")

          # Task610 gate 3: static and independent dense reference evidence.
          require(report.get("static_source") == "PASS", "static_source")
          require(report.get("dense_reference") == "PASS", "dense_reference")
          require(report.get("offers") == 16, "offers")
          require(report.get("accepted_reference") == 3, "accepted_reference")
          require(report.get("dense_coefficient_one_witness") == "ID5_DEPENDENT_AFTER_C1_C1", "dense_coefficient_one_witness")

          # Task610 gate 4: exact five-stream image hashes.
          expected_hashes = {
              "basis.bin": "29cb9adc78f3170a94efdf7d017a6e171929186d761281b99005473f4790ac12",
              "companion.bin": "351ea4ae333c69e88e860823d5bbc4df2e165020fc47f755d318b3a6ddab9f7a",
              "transcript.bin": "e668ea9177aca442e3adf6be177246d5581fbea0737912ea52172dc473f1c1ab",
              "offsets.bin": "5d9363ec924b847008bdd68a724b3bd7a1980c2439938219d2b898513a5e3d30",
              "leads.bin": "0c63c9bdd21f44653a6c359796aafab772898febbadb5413a0f22738d6c39a30",
          }
          require(report.get("expected_stream_sha256") == expected_hashes, "five_stream_hashes")

          # Task610 gate 5: compiled campaign, cancellation, streams, and close.
          require(report.get("compiled_campaign") == {
              "offers": 16,
              "accepted": 3,
              "stats": "PASS",
              "closed_eof_exit0": "PASS",
          }, "compiled_campaign")
          require(report.get("coefficient_one_cancellation") == {
              "SUB_coefficient_1_identical_byte": "CANCELS_TO_ZERO",
              "witness": [1, 1, 0],
          }, "coefficient_one_cancellation")
          require(report.get("five_stream_image") == "PASS", "five_stream_image")
          require(report.get("literal_stats_closed_eof") == "PASS", "literal_stats_closed_eof")
          require(report.get("cursor_finalize") == "PASS", "cursor_finalize")

          # Task610 gate 6: all resource and raw-wire terminal fixtures.
          cap_result = "UNKNOWN_UNCHANGED_STATS_CLOSED_EOF_EXIT0"
          require(report.get("caps") == {
              "rank": cap_result,
              "offer": cap_result,
              "byte_after_pair": cap_result,
          }, "caps")
          require(report.get("partial_headers_1_87") == {
              "lengths": [1, 87],
              "cases": 87,
              "terminal_exit": 6,
          }, "partial_headers")
          require(report.get("terminal_malformed_noncanonical") == {
              "malformed": "MALFORMED_EOF_EXIT6",
              "noncanonical": "MALFORMED_EOF_EXIT6",
          }, "terminal_malformed_noncanonical")
          require(report.get("allocation_fatal_test_binary") == "TEST_ONLY_FATAL_EOF_EXIT6", "allocation_fatal")
          require(report.get("fragmented_request") == {
              "frame_bytes": 89,
              "fragments": 89,
              "result": "ACCEPTED_CLOSED",
          }, "fragmented_request")

          # Task610 gate 7: owner-side table, fragmentation, poison, and cleanup.
          require(report.get("owner_transport_fixtures") == {
              "packed_first_table_81": "PASS",
              "fragmented_response": "PASS",
              "stalled_response": "DEADLINE_POISON_REAP_CLOSE_JOIN",
              "short_response": "EOF_POISON_REAP_CLOSE_JOIN",
              "poison_reuse": "REJECTED",
          }, "owner_transport_fixtures")

          # Task610 gate 8: provisional suffix and four isolated mutations.
          require(report.get("hard_kill_provisional") == {
              "committed_offers": 4,
              "physical_provisional_ids": [5, 6],
              "physical_offsets": 7,
          }, "hard_kill_provisional")
          require(report.get("suffix_resume") == "PASS", "suffix_resume")
          require(report.get("semantic_mutations") == {
              "clean_resume_controls": 4,
              "isolated_rejections": {
                  "future_pair": "future_pivot",
                  "lead_id_swap": "lead_binding",
                  "offset_interval": "record_offset_binding",
                  "record_basis_lead": "basis_binding",
              },
          }, "semantic_mutations")

          # Task610 gate 9: no compiler-dependent skip and terminal interop PASS.
          def contains_not_run(value):
              if isinstance(value, dict):
                  return any(contains_not_run(item) for item in value.values())
              if isinstance(value, (list, tuple)):
                  return any(contains_not_run(item) for item in value)
              return value == "NOT_RUN_NO_COMPILER"

          require(not contains_not_run(report), "compiler_dependent_field_not_run")
          require(report.get("interoperability") == "PASS", "interoperability")
          require(type(report.get("seconds")) in (int, float) and 0 <= report["seconds"] < 900, "bounded_runtime")
          print("TASK610_EXACT_BOUNDED_GHA_GATE: PASS")
          PY

      - name: Upload raw log and parsed report
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: task612-external-owner-v10-interop-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task612-interop/checker.log
            ${{ runner.temp }}/task612-interop/report.json
            ${{ runner.temp }}/task612-interop/checker-exit.txt
          if-no-files-found: warn
          retention-days: 90
