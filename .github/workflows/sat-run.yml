# 影工房 SAT 線(W6): 証明書つき SAT パイプライン。
# ES7 (atelier_lean/.github/workflows/es7_abstract_sat.yml, es7_sat_matrix.yml) の
# 流儀を踏襲 — kissat で解いて DRAT を出し、UNSAT なら drat-trim で独立検証してから
# core/LRAT を保存する。SAT なら model を保存する。
#
# 2026-07-29 硬化(裁定 210 工程 1-B・Sol 便 84 sec 6.5 点 1-3 に従う):
#   1. kissat / drat-trim / actions を tag でなく commit SHA に pin。
#   2. run_label=theorem のときは cnf_sha256 を必須にする(空なら fail-fast)。
#      calibration run(標定・自己校正目的、n=21 のような既知比較対象がある実行)は
#      引き続き cnf_sha256 省略を許すが、その場合ジョブサマリに明示ラベルを残す。
#   3. solver_args / cnf_path / out_dir の自由 shell 展開をやめ、文字クラス
#      allowlist で検証したうえで配列引数として kissat に渡す(shell injection・
#      パス脱出の防止)。
#
# 未着手(Sol 6.5 点 4-7、このパッチの対象外): drat-trim が生成した LRAT を、
# drat-trim 自身とは別の独立 LRAT checker で読む工程。encoder manifest・
# import しない model checker・completeness 補題の別監査明記は
# search/sat/manifest_tail8_n21.json / search/sat/check_model_n21.mjs 側で対応済み。
#
# 2026-07-31 追加(ideas_013 §2.1・cake_lpr 遡及検証は別 workflow lrat-recheck.yml):
#   solver 選択入力(kissat[既定] | cadical)を追加。kissat 経路(build/solve/
#   drat-trim 検証の各ステップ)は一切変更していない -- 各既存ステップに
#   `if: solver==kissat` を追加しただけで、solver=kissat(既定)実行時の中身・
#   出力は無変更。cadical 選択時は CaDiCaL 2.x を commit SHA pin でビルドし、
#   `--lrat`(LRAT フォーマット出力を有効にするブールオプション。CaDiCaL の
#   CLI は "cadical [option] [input [proof]]" で proof の出力先自体は位置引数
#   -- README/NEWS.md を実読して確認、"--lrat=proof.lrat" という単一フラグは
#   存在しない)で proof.lrat を solver から直接出力させ、drat-trim 変換段を
#   飛ばす。UNSAT 時の core 抽出は cadical 経路では省略(instructions 通り)。
#   incremental(iCNF)対応: TODO -- 次の実弾の encoder 側 fragment 化(ideas_013
#   §4.4)と同時に設計する。CaDiCaL 自体は IPASIR/iCNF に対応済みだが、本
#   workflow は単発 CNF の配線のみで incremental ソルバー状態の再利用はしない。
name: sat-run
on:
  workflow_dispatch:
    inputs:
      cnf_path:
        description: "CNF path (repo-relative, DIMACS .cnf or gzip .cnf.gz). Must match [A-Za-z0-9_./-]+\\.(cnf|cnf.gz), no leading '/', no '..'."
        required: true
        type: string
      cnf_sha256:
        description: "Expected SHA-256 of the (decompressed) CNF. Required when run_label=theorem; optional (but recorded) for run_label=calibration."
        required: false
        type: string
        default: ""
      run_label:
        description: "calibration = self-check / known-comparison run (cnf_sha256 optional). theorem = a run whose verdict may be cited as a result (cnf_sha256 REQUIRED, job fails fast otherwise)."
        required: true
        type: choice
        options:
          - calibration
          - theorem
        default: calibration
      solver_args:
        description: "Extra kissat CLI args, space-separated. Allowlisted charset only: [A-Za-z0-9=_.:-]. Anything else (quotes, $, backticks, ;, |, &, etc.) is rejected before the solver ever runs."
        required: false
        type: string
        default: ""
      out_dir:
        description: "Artifact directory to collect (repo-relative, need not exist). Must match [A-Za-z0-9_./-]+, no leading '/', no '..'."
        required: false
        type: string
        default: "search/sat/out"
      timeout_min:
        description: "Job timeout minutes"
        required: false
        type: string
        default: "60"
      solver:
        description: "SAT solver. kissat = 現行既定(DRAT -> drat-trim で LRAT 変換). cadical = CaDiCaL 2.x(--lrat で LRAT を native 出力、drat-trim 変換段を飛ばす)。"
        required: false
        type: choice
        options:
          - kissat
          - cadical
        default: kissat

jobs:
  sat:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned 2026-07-29)

      - name: Validate inputs (allowlist gate; no free-form shell interpolation past this point)
        id: validate
        run: |
          set -euo pipefail

          CNF_PATH="${{ inputs.cnf_path }}"
          OUT_DIR="${{ inputs.out_dir }}"
          SOLVER_ARGS="${{ inputs.solver_args }}"
          RUN_LABEL="${{ inputs.run_label }}"
          CNF_SHA="${{ inputs.cnf_sha256 }}"

          fail() { echo "VALIDATION FAILED: $1" >&2; exit 1; }

          # --- cnf_path: relative, .cnf or .cnf.gz, safe charset, no traversal ---
          case "$CNF_PATH" in
            /*) fail "cnf_path must be repo-relative (no leading /): $CNF_PATH" ;;
          esac
          case "$CNF_PATH" in
            *..*) fail "cnf_path must not contain '..': $CNF_PATH" ;;
          esac
          if ! [[ "$CNF_PATH" =~ ^[A-Za-z0-9_./-]+\.(cnf|cnf\.gz)$ ]]; then
            fail "cnf_path has disallowed characters or extension: $CNF_PATH"
          fi

          # --- out_dir: relative, safe charset, no traversal ---
          case "$OUT_DIR" in
            /*) fail "out_dir must be repo-relative (no leading /): $OUT_DIR" ;;
          esac
          case "$OUT_DIR" in
            *..*) fail "out_dir must not contain '..': $OUT_DIR" ;;
          esac
          if ! [[ "$OUT_DIR" =~ ^[A-Za-z0-9_./-]+$ ]]; then
            fail "out_dir has disallowed characters: $OUT_DIR"
          fi

          # --- solver_args: allowlisted charset, no shell metacharacters ---
          if [ -n "$SOLVER_ARGS" ]; then
            if ! [[ "$SOLVER_ARGS" =~ ^[A-Za-z0-9=_.:\ -]+$ ]]; then
              fail "solver_args has disallowed characters (only [A-Za-z0-9=_.:-] and spaces permitted): $SOLVER_ARGS"
            fi
          fi

          # --- theorem run must carry an integrity hash ---
          if [ "$RUN_LABEL" = "theorem" ] && [ -z "$CNF_SHA" ]; then
            fail "run_label=theorem requires a non-empty cnf_sha256 (Sol 84 sec 6.5 point 2). Use run_label=calibration for exploratory/self-check runs."
          fi

          echo "cnf_path=$CNF_PATH" >> "$GITHUB_OUTPUT"
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          echo "run_label=$RUN_LABEL" >> "$GITHUB_OUTPUT"
          echo "solver=${{ inputs.solver }}" >> "$GITHUB_OUTPUT"
          echo "validation passed: cnf_path, out_dir, solver_args charset OK; run_label/cnf_sha256 gate OK; solver=${{ inputs.solver }}"

      - name: Build kissat and drat-trim (pinned commits)
        if: steps.validate.outputs.solver == 'kissat'
        run: |
          set -euo pipefail
          # kissat @ arminbiere/kissat, commit resolved 2026-07-29 from `master` HEAD.
          KISSAT_SHA=8af8e56f174b778aef3aa45af9f739b2a5f492c2
          # drat-trim @ marijnheule/drat-trim, commit resolved 2026-07-29 from `master` HEAD.
          DRAT_SHA=2e3b2dc0ecf938addbd779d42877b6ed69d9a985

          git clone https://github.com/arminbiere/kissat.git tools-kissat
          git -C tools-kissat checkout "$KISSAT_SHA"
          ( cd tools-kissat && ./configure && make -j2 )

          git clone https://github.com/marijnheule/drat-trim.git tools-drat
          git -C tools-drat checkout "$DRAT_SHA"
          ( cd tools-drat && make )

          tools-kissat/build/kissat --version

      - name: Build CaDiCaL (pinned commit)
        if: steps.validate.outputs.solver == 'cadical'
        run: |
          set -euo pipefail
          # CaDiCaL @ arminbiere/cadical, tag rel-2.2.1 (2.x per instructions),
          # commit resolved 2026-07-31 via `git ls-remote --tags`.
          CADICAL_SHA=4198d817d0dcde5b1240eefbff70b555b7df2af9

          git clone https://github.com/arminbiere/cadical.git tools-cadical
          git -C tools-cadical checkout "$CADICAL_SHA"
          ( cd tools-cadical && ./configure && make )

          test -x tools-cadical/build/cadical
          tools-cadical/build/cadical --version || true

      - name: Resolve and verify CNF
        run: |
          set -euo pipefail
          mkdir -p ci/out
          SRC="${{ steps.validate.outputs.cnf_path }}"
          if [[ "$SRC" == *.gz ]]; then
            gunzip -c "$SRC" > ci/out/problem.cnf
          else
            cp "$SRC" ci/out/problem.cnf
          fi
          EXPECT="${{ inputs.cnf_sha256 }}"
          if [ -n "$EXPECT" ]; then
            echo "$EXPECT  ci/out/problem.cnf" | sha256sum -c -
          else
            echo "cnf_sha256 not supplied — run_label=${{ steps.validate.outputs.run_label }}, integrity gate skipped (calibration-only path; record the printed hash below manually before citing this as a theorem run)"
          fi
          sha256sum ci/out/problem.cnf
          head -n 1 ci/out/problem.cnf
          echo "run_label=${{ steps.validate.outputs.run_label }}" > ci/out/run_label.txt

      - name: Run kissat with DRAT proof (array-argument invocation, no shell interpolation of user input)
        id: solve
        if: steps.validate.outputs.solver == 'kissat'
        run: |
          set +e
          # Split the allowlisted solver_args string into a bash array (word
          # splitting only, no glob/command substitution risk since the
          # charset was validated to exclude $ ` ; | & ( ) etc.)
          read -ra SOLVER_ARGV <<< "${{ inputs.solver_args }}"
          /usr/bin/time -v tools-kissat/build/kissat ci/out/problem.cnf ci/out/proof.drat --no-binary "${SOLVER_ARGV[@]}" \
            > ci/out/kissat_out.txt 2> ci/out/kissat_time.txt
          code=$?
          set -e
          echo "exit=$code" | tee ci/out/result.txt
          tail -n 30 ci/out/kissat_out.txt
          if [ "$code" = "10" ]; then echo "verdict=SAT" >> ci/out/result.txt;
          elif [ "$code" = "20" ]; then echo "verdict=UNSAT" >> ci/out/result.txt;
          else echo "verdict=UNKNOWN" >> ci/out/result.txt; fi
          cat ci/out/result.txt

      - name: Run CaDiCaL with native LRAT proof (array-argument invocation, no shell interpolation of user input)
        id: solve_cadical
        if: steps.validate.outputs.solver == 'cadical'
        run: |
          set +e
          # Same allowlisted-charset argv-array pattern as the kissat step above.
          # CaDiCaL CLI: "cadical [option]... [input [proof]]" -- the proof PATH is
          # a positional argument (not a --lrat=<path> flag); --lrat is a separate
          # boolean option that switches the proof FORMAT written to that path from
          # DRAT to LRAT (verified against options.hpp/NEWS.md upstream, commit
          # rel-2.2.1 -- there is no single "--lrat=<path>" flag in this solver).
          read -ra SOLVER_ARGV <<< "${{ inputs.solver_args }}"
          tools-cadical/build/cadical ci/out/problem.cnf ci/out/proof.lrat --lrat "${SOLVER_ARGV[@]}" \
            > ci/out/cadical_out.txt 2> ci/out/cadical_time.txt
          code=$?
          set -e
          echo "exit=$code" | tee ci/out/result.txt
          tail -n 30 ci/out/cadical_out.txt
          if [ "$code" = "10" ]; then echo "verdict=SAT" >> ci/out/result.txt;
          elif [ "$code" = "20" ]; then echo "verdict=UNSAT" >> ci/out/result.txt;
          else echo "verdict=UNKNOWN" >> ci/out/result.txt; fi
          cat ci/out/result.txt

      - name: Extract model (if SAT, kissat)
        if: steps.validate.outputs.solver == 'kissat'
        run: |
          set -euo pipefail
          if grep -q "verdict=SAT" ci/out/result.txt; then
            grep "^v " ci/out/kissat_out.txt > ci/out/model_vlines.txt || true
            wc -l ci/out/model_vlines.txt
          else
            echo "not SAT — skip"
          fi

      - name: Extract model (if SAT, cadical)
        if: steps.validate.outputs.solver == 'cadical'
        run: |
          set -euo pipefail
          if grep -q "verdict=SAT" ci/out/result.txt; then
            grep "^v " ci/out/cadical_out.txt > ci/out/model_vlines.txt || true
            wc -l ci/out/model_vlines.txt
          else
            echo "not SAT — skip"
          fi

      - name: Verify DRAT proof, extract core and LRAT (if UNSAT, kissat)
        if: steps.validate.outputs.solver == 'kissat'
        run: |
          set -euo pipefail
          if grep -q "verdict=UNSAT" ci/out/result.txt; then
            tools-drat/drat-trim ci/out/problem.cnf ci/out/proof.drat -c ci/out/core.cnf -L ci/out/proof.lrat \
              | tee ci/out/drat_verify.txt
            grep -q "s VERIFIED" ci/out/drat_verify.txt \
              && echo "PROOF VERIFIED" \
              || (echo "PROOF VERIFICATION FAILED" && exit 1)
            wc -l ci/out/core.cnf || true
            gzip -9 ci/out/proof.drat ci/out/core.cnf ci/out/proof.lrat
          else
            echo "not UNSAT — skip"
          fi

      - name: Package native LRAT proof (if UNSAT, cadical -- no drat-trim conversion step, core extraction omitted per instructions)
        if: steps.validate.outputs.solver == 'cadical'
        run: |
          set -euo pipefail
          if grep -q "verdict=UNSAT" ci/out/result.txt; then
            test -s ci/out/proof.lrat || { echo "CADICAL_LRAT_MISSING: --lrat was requested but proof.lrat is empty/absent" >&2; exit 1; }
            wc -l ci/out/proof.lrat
            gzip -9 ci/out/proof.lrat
            echo "native LRAT proof.lrat.gz staged (checkable downstream by search/sat/lrat_check.py exactly like the kissat/drat-trim path, and by .github/workflows/lrat-recheck.yml's cake_lpr third-stage recheck)"
          else
            echo "not UNSAT — skip"
          fi

      - name: SHA-256 manifest of all artifacts
        run: |
          set -euo pipefail
          cd ci/out
          sha256sum * > SHA256SUMS.txt 2>/dev/null || true
          cat SHA256SUMS.txt

      - name: Stage into out_dir
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.validate.outputs.out_dir }}"
          cp ci/out/* "${{ steps.validate.outputs.out_dir }}/" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (pinned 2026-07-29)
        with:
          name: sat-run-out
          path: |
            ${{ steps.validate.outputs.out_dir }}/
            ci/out/
          if-no-files-found: warn
