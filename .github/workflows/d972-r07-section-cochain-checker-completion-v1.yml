      - name: Resolve exact parent roots without copying parent files
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          def find(base_name, required):
              base = work / base_name
              matches = []
              for root in [base, *sorted(p for p in base.rglob("*") if p.is_dir())]:
                  if root.is_symlink() or (base != root and base not in root.resolve().parents):
                      raise SystemExit("unsafe parent root")
                  if all((root / name).is_file() for name in required):
                      for name in required:
                          cursor = root
                          for part in Path(name).parts:
                              cursor = cursor / part
                              assert not cursor.is_symlink()
                      matches.append(root.resolve())
              assert len(matches) == 1, (base_name, matches)
              return str(matches[0])
          paths = {
              "DIAGNOSTIC_ROOT": find("oracle-diagnostics", ["output/manifest.json", "output/tree/witness.json", "checker-result.json", "source-receipt.json"]),
              "REFINEMENT_ROOT": find("current-refinement", ["output/HEAD", "output/start.json", "output/canonical-index.json", "checker-result.json", "source-receipt.json"]),
              "PACKET_ROOT": find("rank1359-packet", ["output/HEAD", "output/start.json", "checker-result.json", "source-receipt.json"]),
              "SEED34_ROOT": find("rank1356-seed34", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "DELTA_ROOT": find("rank1355-delta", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "PREPARE_ROOT": find("task554-prepare", ["prepare.HEAD"]),
              "P1_ROOT": find("p1", ["manifest.json", "instructions.jsonl", "degree2.cache.bin"]),
              "TASK712_ROOT": find("task712", ["r07-grade2-maps-v4-receipt.json", "r07-grade2-maps-v4-checker.json"]),
              "STATE_ROOT": find("separator", ["state/manifest.json", "state/physical.bin"])}
          for index in range(4):
              paths["BLOCK_" + str(index) + "_ROOT"] = find("task554-block-" + str(index), ["block-" + str(index) + ".HEAD"])
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in paths.items():
                  assert "\n" not in value and "\r" not in value
                  stream.write(key + "=" + value + "\n")
          (work / "parent-paths.json").write_text(json.dumps(paths, sort_keys=True) + "\n", encoding="ascii")
          PY

      - name: Preserve all saved output and separate the failed checker receipt
        id: prepare_completion
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, shutil, sys
          from pathlib import Path
          import numpy
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def digest(item):
              with item.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          origin = Path(os.environ["DIAGNOSTIC_ROOT"]).resolve()
          pins = {
              "checker-result.json": (315, "e500b7fa0a5f4387c36d787999f438cea91189b9ea3fd8ec80e0830cb29173e0"),
              "source-receipt.json": (2673, "cd9a45a389cafd0cfb3813181c1365b0a66cdd682cc737a1a68f27b438d92934"),
              "output/manifest.json": (1430, "7df077372a51d12cbf95be5f26c94a5e29ef0f6b118f1ed7efb452ba01942639"),
              "output/owner.json": (8419, "6c71fbc405105bd0722924a308594ba41aea6745725ae85d046ff7409998b322"),
              "output/start.json": (48377, "7ff970e54dec57512593f5445fed387075d6602bff31f41b7db9f34bab045a2a"),
              "output/source.json": (1246, "af1e178d19e4ee427439d102de74a559ed6202ca0a2839212a60748ccfe482ac"),
              "output/result.json": (13727, "c7f65255443a8901fa1b6fbab69e81bbc811014e1eb527e7f671e2f6343ba312"),
              "output/tree/witness.json": (486, "1c282b82cbf430b3ef492a325c26ac3c7d2bf9146f15aa76c94744f8477620fd"),
          }
          for name, (size, wanted) in pins.items():
              item = origin / name
              assert item.is_file() and not item.is_symlink()
              assert item.stat().st_size == size and digest(item) == wanted, name
          assert (origin / "source-receipt.json").read_bytes() == (work / "expected-original-source-receipt.json").read_bytes()
          source = json.loads((origin / "output/source.json").read_bytes())
          result = json.loads((origin / "output/result.json").read_bytes())
          previous = json.loads((origin / "checker-result.json").read_bytes())
          assert sys.version_info[:3] == (3, 13, 15) and sys.version == source["python"]
          assert numpy.__version__ == source["numpy"] == "2.5.1"
          assert source["producer_sha256"] == os.environ["PRODUCER_SHA256"]
          assert result["status"] == "PASS" and result["terminal"] in ("VIOLATION_CANDIDATE", "COMPLETE_ZERO_CANDIDATE")
          assert result["physical_appends"] == 0 and result["cross_checked"] is result["verified"] is False
          assert previous["status"] == "FAIL" and previous["phase"] == "complete_tree_eof"
          assert previous["reason"] == "OverflowError:Python integer 4294967295 out of bounds for int32"
          assert previous["candidate"] is previous["cross_checked"] is previous["verified"] is False
          for item in origin.rglob("*"):
              assert not item.is_symlink() and item.resolve().is_relative_to(origin)
              assert item.is_file() or item.is_dir()
          destination = work / "completion"
          destination.mkdir()
          preserved = ("source-receipt.json", "producer-parent-layout.json", "checker-parent-layout.json",
                       "producer-selftest.json", "checker-selftest.json", "producer-result.json", "producer.log")
          for name in preserved:
              shutil.copyfile(origin / name, destination / name)
          shutil.copyfile(origin / "checker-result.json", destination / "previous-checker-result.json")
          shutil.copyfile(origin / "checker.log", destination / "previous-checker.log")
          shutil.copytree(origin / "output", destination / "output")
          files = []
          for item in sorted(destination.rglob("*")):
              assert not item.is_symlink() and item.resolve().is_relative_to(destination)
              if item.is_file():
                  relative = item.relative_to(destination).as_posix()
                  original = "checker-result.json" if relative == "previous-checker-result.json" else (
                      "checker.log" if relative == "previous-checker.log" else relative)
                  assert item.stat().st_size == (origin / original).stat().st_size and digest(item) == digest(origin / original)
                  files.append({"file": relative, "origin_file": original, "bytes": item.stat().st_size, "sha256": digest(item)})
              else:
                  assert item.is_dir()
          output_directories = sorted(item.relative_to(destination / "output").as_posix()
              for item in (destination / "output").rglob("*") if item.is_dir())
          output_files = [entry for entry in files if entry["file"].startswith("output/")]
          baseline = {"schema": "d972.r07.section-cochain-checker-completion.v1.preserved-input",
              "origin": {"run": int(os.environ["ORACLE_RUN"]), "attempt": int(os.environ["ORACLE_ATTEMPT"]),
                  "head": os.environ["ORACLE_HEAD"], "workflow": os.environ["ORACLE_WORKFLOW"],
                  "artifact": int(os.environ["ORACLE_ARTIFACT_ID"]), "name": os.environ["ORACLE_ARTIFACT_NAME"],
                  "archive_bytes": int(os.environ["ORACLE_ARCHIVE_BYTES"]), "archive_sha256": os.environ["ORACLE_ARCHIVE_DIGEST"]},
              "entry_pins": [{"file": name, "bytes": size, "sha256": wanted} for name, (size, wanted) in sorted(pins.items())],
              "files": files, "output_directories": output_directories, "output_file_count": len(output_files),
              "output_bytes": sum(entry["bytes"] for entry in output_files), "cross_checked": False, "verified": False}
          (destination / "preserved-input.json").write_bytes(canonical(baseline))
          shutil.copyfile(work / "repair-source-receipt.json", destination / "repair-source-receipt.json")
          repair = destination / "repair-source"
          repair.mkdir()
          shutil.copyfile("search/check_d972_r07_section_cochain_oracle_v2.py", repair / "check_d972_r07_section_cochain_oracle_v2.py")
          shutil.copyfile(".github/workflows/d972-r07-section-cochain-checker-completion-v1.yml", repair / "d972-r07-section-cochain-checker-completion-v1.yml")
          assert not (destination / "checker-result.json").exists()
          PY

      - name: Run only the new root sentinel serialization canary
        id: serialization_canary
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python -B -u search/check_d972_r07_section_cochain_oracle_v2.py --serialization-selftest \
            > "$RUNNER_TEMP/completion/serialization-selftest.json" 2> "$RUNNER_TEMP/completion/serialization-selftest.log"
          jq -e '.status == "PASS" and .production_helper == "rooted_indices_u32" and
            .schema_unchanged == true and .old_selftests_executed == 0 and .producer_invocations == 0 and
            (.cases|length) == 15 and .numpy == "2.5.1" and
            .candidate == false and .cross_checked == false and .verified == false' \
            "$RUNNER_TEMP/completion/serialization-selftest.json" > /dev/null

      - name: Complete the repaired independent A-D checker over unchanged output
        id: complete_checker
        timeout-minutes: ${{ fromJSON(env.CHECKER_CAP_MINUTES) }}
        shell: bash
        run: |
          set -euo pipefail
          printf '1\n' > "$RUNNER_TEMP/completion/checker-invocations.txt"
          set +e
          python -B -u search/check_d972_r07_section_cochain_oracle_v2.py \
            --refinement-root "$REFINEMENT_ROOT" --packet-root "$PACKET_ROOT" \
            --seed34-root "$SEED34_ROOT" --delta-root "$DELTA_ROOT" \
            --prepare-root "$PREPARE_ROOT" \
            --block-root "$BLOCK_0_ROOT" --block-root "$BLOCK_1_ROOT" \
            --block-root "$BLOCK_2_ROOT" --block-root "$BLOCK_3_ROOT" \
            --p1-root "$P1_ROOT" --task712-root "$TASK712_ROOT" \
            --state-root "$STATE_ROOT" --candidate-root "$RUNNER_TEMP/completion/output" --max-seconds 1800 \
            2> >(tee "$RUNNER_TEMP/completion/checker.log" >&2) | tee "$RUNNER_TEMP/completion/checker-result.json"
          codes=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${codes[0]}" > "$RUNNER_TEMP/completion/checker-exit-code.txt"
          test "${codes[1]}" = "0"
          test "${codes[0]}" = "0"
          jq -e '.status == "PASS" and .all_stage_arrays_compared == true and
            .section_equalities == 8059 and .chords_checked == 54433 and .auxiliary_tests == 2 and
            .new_physical_appends == 0 and .old_scans_numerically_replayed == 0 and
            .cross_checked == false and .verified == false and
            (.terminal == "VIOLATION_CANDIDATE" or .terminal == "COMPLETE_ZERO_CANDIDATE")' \
            "$RUNNER_TEMP/completion/checker-result.json" > /dev/null

      - name: Require unchanged output and record the new checker completion separately
        id: finalize_completion
        if: ${{ always() && steps.prepare_completion.outcome == 'success' }}
        shell: bash
        env:
          CHECKER_STEP_OUTCOME: ${{ steps.complete_checker.outcome }}
          SERIALIZATION_STEP_OUTCOME: ${{ steps.serialization_canary.outcome }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path
          import numpy
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def digest(item):
              with item.open("rb") as stream:
                  return hashlib.file_digest(stream, "sha256").hexdigest()
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          root = work / "completion"
          origin = Path(os.environ["DIAGNOSTIC_ROOT"]).resolve()
          baseline = json.loads((root / "preserved-input.json").read_bytes())
          for entry in baseline["files"]:
              for item in (root / entry["file"], origin / entry["origin_file"]):
                  assert item.is_file() and not item.is_symlink()
                  assert item.stat().st_size == entry["bytes"] and digest(item) == entry["sha256"], entry["file"]
          expected_files = {entry["file"] for entry in baseline["files"] if entry["file"].startswith("output/")}
          for base in (root, origin):
              actual_files, actual_directories = set(), []
              output = base / "output"
              assert output.is_dir() and not output.is_symlink()
              for item in sorted(output.rglob("*")):
                  assert not item.is_symlink() and item.resolve().is_relative_to(output)
                  if item.is_file():
                      actual_files.add(item.relative_to(base).as_posix())
                  else:
                      assert item.is_dir()
                      actual_directories.append(item.relative_to(output).as_posix())
              assert actual_files == expected_files and actual_directories == baseline["output_directories"]
          repair = json.loads((root / "repair-source-receipt.json").read_bytes())
          assert (root / "repair-source-receipt.json").read_bytes() == (work / "repair-source-receipt.json").read_bytes()
          assert digest(root / "repair-source/check_d972_r07_section_cochain_oracle_v2.py") == os.environ["REPAIRED_CHECKER_SHA256"]
          assert digest(root / "repair-source/d972-r07-section-cochain-checker-completion-v1.yml") == repair["workflow"]["sha256"]
          assert repair["python"] == sys.version and repair["numpy"] == numpy.__version__ == "2.5.1"
          producer_raw = (root / "output/result.json").read_bytes()
          producer = json.loads(producer_raw)
          start_raw = (root / "output/start.json").read_bytes()
          start = json.loads(start_raw)
          manifest_raw = (root / "output/manifest.json").read_bytes()
          manifest = json.loads(manifest_raw)
          source = json.loads((root / "output/source.json").read_bytes())
          assert source["producer_sha256"] == os.environ["PRODUCER_SHA256"]
          assert source["python"] == sys.version and source["numpy"] == numpy.__version__
          result_path = root / "checker-result.json"
          try:
              checked = json.loads(result_path.read_bytes())
          except (OSError, ValueError):
              checked = None
          counter = root / "checker-invocations.txt"
          invocations = int(counter.read_text().strip()) if counter.exists() else 0
          assert invocations in (0, 1)
          passed = (isinstance(checked, dict) and checked.get("status") == "PASS" and
                    os.environ["CHECKER_STEP_OUTCOME"] == "success" and os.environ["SERIALIZATION_STEP_OUTCOME"] == "success")
          if passed:
              assert invocations == 1 and (root / "checker-exit-code.txt").read_text().strip() == "0"
              assert checked["schema"] == "d972.r07.section-cochain-oracle.v1.checker-result"
              assert checked["checker_sha256"] == os.environ["REPAIRED_CHECKER_SHA256"]
              assert checked["python"] == sys.version and checked["numpy"] == numpy.__version__
              assert checked["all_stage_arrays_compared"] is True
              assert (checked["section_equalities"], checked["chords_checked"], checked["auxiliary_tests"]) == (8059, 54433, 2)
              assert checked["new_physical_appends"] == checked["old_scans_numerically_replayed"] == 0
              assert checked["terminal"] == producer["terminal"] and checked["materialization"] == producer["materialization"]
              assert checked["result_sha256"] == hashlib.sha256(producer_raw).hexdigest()
              assert checked["manifest_sha256"] == hashlib.sha256(manifest_raw).hexdigest()
              assert checked["snapshot_sha256"] == hashlib.sha256(start_raw).hexdigest()
              assert checked["owner_sha256"] == digest(root / "output/owner.json")
              assert checked["stage_manifests"] == producer["stage_manifests"] == manifest["stage_manifests"]
              for stage, expected in checked["stage_manifests"].items():
                  assert digest(root / "output" / stage / "manifest.json") == expected
              for field in ("rank", "generation", "state_head", "lambda_rho2", "direct_pairing"):
                  assert checked[field] == start[field] == producer[field], field
              assert checked["cross_checked"] is checked["verified"] is False
          receipt = {"schema": "d972.r07.section-cochain-checker-completion.v1.completion-run-receipt",
              "status": "PASS" if passed else "INCOMPLETE", "origin": baseline["origin"],
              "completion": {"run": int(os.environ["GITHUB_RUN_ID"]), "attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                  "head": os.environ["GITHUB_SHA"], "workflow": repair["workflow"]},
              "producer_sha256": os.environ["PRODUCER_SHA256"], "original_checker_sha256": os.environ["CHECKER_SHA256"],
              "repaired_checker_sha256": os.environ["REPAIRED_CHECKER_SHA256"],
              "source_receipt_sha256": digest(root / "source-receipt.json"),
              "repair_source_receipt_sha256": digest(root / "repair-source-receipt.json"),
              "preserved_input_sha256": digest(root / "preserved-input.json"),
              "previous_checker_result_sha256": digest(root / "previous-checker-result.json"),
              "new_checker_result_sha256": digest(result_path) if result_path.is_file() else None,
              "producer_result_sha256": hashlib.sha256(producer_raw).hexdigest(),
              "producer_output_unchanged": True, "output_files": len(expected_files),
              "output_directories": len(baseline["output_directories"]), "output_bytes": baseline["output_bytes"],
              "producer_invocations": 0, "checker_invocations": invocations, "old_success_suites": 0,
              "old_parent_canaries_executed": 0, "serialization_canary_outcome": os.environ["SERIALIZATION_STEP_OUTCOME"],
              "complete_A_to_D_replay": passed, "all_stage_and_top_arrays_compared": passed,
              "checker_internal_seconds": 1800, "checker_outer_minutes": 40, "job_minutes": 60,
              "python": sys.version, "numpy": numpy.__version__, "cross_checked": False, "verified": False}
          (root / "completion-run-receipt.json").write_bytes(canonical(receipt))
          assert passed, "completion remains unaccepted"
          PY

      - name: Upload the unchanged oracle only after repaired checker PASS and preservation gate
        if: ${{ success() && steps.complete_checker.outcome == 'success' && steps.finalize_completion.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: d972-r07-section-cochain-checker-completion-v1-candidate-${{ github.run_id }}-${{ github.run_attempt }}
