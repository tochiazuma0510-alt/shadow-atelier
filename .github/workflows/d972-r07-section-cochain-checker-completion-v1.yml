          name: d972-r07-section-cochain-checker-completion-v1-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/completion
            ${{ runner.temp }}/repair-source-receipt.json
            ${{ runner.temp }}/expected-original-source-receipt.json
            ${{ runner.temp }}/parent-paths.json
            ${{ runner.temp }}/*-run.json
            ${{ runner.temp }}/artifact-*.json
