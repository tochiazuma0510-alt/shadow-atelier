name: gap-run
on:
  workflow_dispatch:
    inputs:
      script:
        description: "GAP script path (repo-relative, e.g. search/wall-miner-v1.g)"
        required: true
        type: string
      preamble:
        description: "Optional GAP statements bound before Read (e.g. SHARD:=2;;)"
        required: false
        type: string
        default: ""
      out_dir:
        description: "Artifact directory to collect"
        required: false
        type: string
        default: "search/certs"
      timeout_min:
        description: "Job timeout minutes"
        required: false
        type: string
        default: "60"
      with_pquot_packages:
        description: "Install GAP SmallGrp/AutPGrp and pinned ANUPQ 3.3.3 (opt-in)"
        required: false
        type: boolean
        default: false

jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup GAP 4.16.0 (release tarball, sha256-verified)
        uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'
      - name: Install optional p-quotient GAP packages
        if: ${{ inputs.with_pquot_packages }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            ca-certificates curl build-essential gap-smallgrp gap-autpgrp
          smallgrp_dir="$(find /usr/share/gap /usr/lib/gap -type d -iname 'smallgrp*' -print -quit 2>/dev/null || true)"
          test -n "$smallgrp_dir"
          p2_build_root=/tmp/gaproot
          rm -rf "$p2_build_root"
          mkdir -p "$p2_build_root/pkg"
          p2_url='https://github.com/gap-packages/anupq/releases/download/v3.3.3/anupq-3.3.3.tar.gz'
          p2_sha='6a1b25ddcdb05abd933911f8e0e718b195d24b502e5d098d4b431db5f371ffc2'
          p2_archive="$p2_build_root/anupq-3.3.3.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$p2_archive" "$p2_url"
          printf '%s  %s\n' "$p2_sha" "$p2_archive" | sha256sum --check --status
          tar --extract --gzip --file "$p2_archive" --directory "$p2_build_root/pkg"
          p2_src="$(find "$p2_build_root/pkg" -mindepth 1 -maxdepth 1 \
            -type d -name 'anupq*' -print -quit)"
          test -n "$p2_src"
          if [ "$p2_src" != "$p2_build_root/pkg/anupq" ]; then
            mv "$p2_src" "$p2_build_root/pkg/anupq"
          fi
          json_url='https://github.com/gap-packages/json/releases/download/v2.4.0/json-2.4.0.tar.gz'
          json_sha='ce49399f5f5dc4caf95213f5dd7ec09988f2ae93364817e88ff075a09a22826a'
          json_archive="$p2_build_root/json-2.4.0.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$json_archive" "$json_url"
          printf '%s  %s\n' "$json_sha" "$json_archive" | sha256sum --check --status
          tar --extract --gzip --file "$json_archive" --directory "$p2_build_root/pkg"
          json_src="$(find "$p2_build_root/pkg" -mindepth 1 -maxdepth 1 \
            -type d -name 'json*' -print -quit)"
          test -n "$json_src"
          if [ "$json_src" != "$p2_build_root/pkg/json" ]; then
            mv "$json_src" "$p2_build_root/pkg/json"
          fi
          test -n "${GAPROOT:-}"
          test -d "$GAPROOT"
          cd "$p2_build_root/pkg/anupq"
          ./configure --with-gaproot="$GAPROOT"
          make -j"$(nproc)"
          printf 'GAP_P2_PACKAGE_ROOT=%s\n' "$p2_build_root" >> "$GITHUB_ENV"
          printf 'P2_PACKAGE_BUILD_PASS smallgrp=%s anupq=%s anupq_sha256=%s json=%s json_sha256=%s\n' \
            "$smallgrp_dir" "$p2_build_root/pkg/anupq" "$p2_sha" \
            "$p2_build_root/pkg/json" "$json_sha"
      - name: Run GAP script
        shell: bash
        env:
          GAP_RUN_SCRIPT: ${{ inputs.script }}
          GAP_RUN_PREAMBLE: ${{ inputs.preamble }}
          GAP_RUN_OUT_DIR: ${{ inputs.out_dir }}
          GAP_WITH_PQUOT_PACKAGES: ${{ inputs.with_pquot_packages }}
        run: |
          set -euo pipefail
          case "$GAP_RUN_SCRIPT" in
            ""|.|..|/*|../*|*/../*|*\\*|*[!A-Za-z0-9_./-]*)
              echo "unsafe or empty script path" >&2
              exit 2
              ;;
          esac
          case "$GAP_RUN_OUT_DIR" in
            ""|.|..|/*|../*|*/../*|*\\*|*[!A-Za-z0-9_./-]*)
              echo "unsafe or empty artifact directory" >&2
              exit 2
              ;;
          esac
          test -f "$GAP_RUN_SCRIPT"
          mkdir -p "$GAP_RUN_OUT_DIR" ci/out
          {
            if [ -n "$GAP_RUN_PREAMBLE" ]; then printf '%s\n' "$GAP_RUN_PREAMBLE"; fi
            if [ "$GAP_WITH_PQUOT_PACKAGES" = "true" ]; then
              printf 'if GAPInfo.Version <> "4.16.0" then Error("GAP 4.16.0 required"); fi;; if LoadPackage("smallgrp") <> true then Error("smallgrp LoadPackage failed"); fi;; if LoadPackage("autpgrp") <> true then Error("autpgrp LoadPackage failed"); fi;; if LoadPackage("anupq") <> true then Error("anupq LoadPackage failed"); fi;; if LoadPackage("json") <> true then Error("json LoadPackage failed"); fi;; Print("P2_PACKAGE_LOAD_PASS GAPInfo.Version=",GAPInfo.Version,"\\n");; Print("GAPInfo.RootPaths=",GAPInfo.RootPaths,"\\n");;\n'
            fi
            printf 'Read("%s");\n' "$GAP_RUN_SCRIPT"
          } > ci/out/driver.g
          gap_args=()
          if [ "$GAP_WITH_PQUOT_PACKAGES" = "true" ]; then
            gap_args=(-l ";/usr/share/gap;/usr/lib/gap;${GAP_P2_PACKAGE_ROOT:?}")
          fi
          gap "${gap_args[@]}" --quitonbreak -q -o 12g ci/out/driver.g | tee ci/out/run.log
          # GAP may print a syntax error while returning success after Read()
          # has continued.  The P2 selftest therefore has an explicit final
          # marker and a fail-closed diagnostic gate; ordinary gap-run scripts
          # retain the generic runner contract.
          if [[ "$GAP_RUN_SCRIPT" == "search/d972_b4_pquotient_v1.g" ]]; then
            if grep -Eq '(^|[[:space:]])(Syntax error:|Error,)' ci/out/run.log; then
              echo "P2_RUN_STOP: GAP syntax/error diagnostic found" >&2
              exit 1
            fi
            if [[ "$GAP_RUN_PREAMBLE" == *"D972_P2_SELFTEST:=true"* ||
                  "$GAP_RUN_PREAMBLE" == *"D972_P2_SELFTEST = true"* ]]; then
              if ! grep -q '^P2_SELFTEST_FINAL_MARKER ' ci/out/run.log; then
                echo "P2_SELFTEST_STOP: final marker missing" >&2
                exit 1
              fi
            elif [[ "$GAP_RUN_PREAMBLE" == *"D972_P2_MAGNUS_ONLY:=true"* ||
                    "$GAP_RUN_PREAMBLE" == *"D972_P2_MAGNUS_ONLY = true"* ]]; then
              if ! grep -q '^P2_MAGNUS_INPUT_WRITTEN ' ci/out/run.log ||
                 ! grep -q '^P2_FINAL_MARKER mode=magnus$' ci/out/run.log; then
                echo "P2_MAGNUS_STOP: completion marker missing" >&2
                exit 1
              fi
            else
              if ! grep -q '^P2_ARTIFACT_WRITTEN ' ci/out/run.log ||
                 ! grep -q '^P2_FINAL_MARKER mode=full$' ci/out/run.log; then
                echo "P2_FULL_STOP: artifact/final marker missing" >&2
                exit 1
              fi
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gap-run-out
          path: |
            ${{ inputs.out_dir }}/
            ci/out/
