name: gap-run
on:
  workflow_dispatch:
    inputs:
      script:
        description: "GAP script path (repo-relative, e.g. search/wall-miner-v1.g)"
        required: true
        type: string
      preamble:
        description: "Optional GAP statements bound before Read (e.g. SHARD:=2;;)"
        required: false
        type: string
        default: ""
      out_dir:
        description: "Artifact directory to collect"
        required: false
        type: string
        default: "search/certs"
      timeout_min:
        description: "Job timeout minutes"
        required: false
        type: string
        default: "60"
      with_pquot_packages:
        description: "Build bundled SmallGrp/AutPGrp/ANUPQ/json packages (opt-in)"
        required: false
        type: boolean
        default: false

jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup GAP 4.16.0 from the official full archive
        shell: bash
        run: |
          set -euo pipefail
          for required in bash curl tar sha256sum make gcc g++ nproc; do
            command -v "$required" >/dev/null
          done
          gap_url='https://github.com/gap-system/gap/releases/download/v4.16.0/gap-4.16.0.tar.gz'
          gap_sha='aaa296b32a5d7bf25fd80f241d23ec1f58b74e991ae730fafe40e54eb3af6e7e'
          gap_archive="$RUNNER_TEMP/gap-4.16.0.tar.gz"
          gap_root="$RUNNER_TEMP/gap-4.16.0"
          test -n "$RUNNER_TEMP"
          rm -f "$gap_archive"
          rm -rf "$gap_root"
          curl --fail --location --silent --show-error \
            --connect-timeout 20 --max-time 900 \
            --retry 5 --retry-delay 5 --retry-max-time 1200 \
            --retry-all-errors --output "$gap_archive" "$gap_url"
          printf '%s  %s\n' "$gap_sha" "$gap_archive" | \
            sha256sum --check --status
          tar --extract --gzip --file "$gap_archive" \
            --directory "$RUNNER_TEMP"
          test -d "$gap_root"
          cd "$gap_root"
          ./configure
          make -j"$(nproc)"
          test -x "$gap_root/gap"
          printf 'GAPROOT=%s\n' "$gap_root" >> "$GITHUB_ENV"
          printf '%s\n' "$gap_root" >> "$GITHUB_PATH"
          printf '%s\n' \
            'if GAPInfo.Version <> "4.16.0" then Error("GAP 4.16.0 smoke gate failed"); fi;;' \
            'QUIT_GAP(0);;' | "$gap_root/gap" --quitonbreak -q
          printf 'GAP_SOURCE_SETUP_PASS version=4.16.0 release_sha256=%s gaproot=%s\n' \
            "$gap_sha" "$gap_root"
      - name: Build and load bundled optional p-quotient GAP packages
        if: ${{ inputs.with_pquot_packages }}
        shell: bash
        run: |
          set -euo pipefail
          for required in bash find grep make nproc sha256sum tee; do
            command -v "$required" >/dev/null
          done
          test -n "${GAPROOT:-}"
          test -x "$GAPROOT/gap"
          test -d "$GAPROOT/pkg"

          find_one_package() {
            local pattern="$1"
            local label="$2"
            local -a matches=()
            while IFS= read -r -d '' path; do
              matches+=("$path")
            done < <(find "$GAPROOT/pkg" -mindepth 1 -maxdepth 1 \
              -type d -iname "$pattern" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'expected exactly one bundled %s directory, found %s\n' \
                "$label" "${#matches[@]}" >&2
              exit 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          smallgrp_dir="$(find_one_package 'smallgrp*' smallgrp)"
          autpgrp_dir="$(find_one_package 'autpgrp*' autpgrp)"
          anupq_dir="$(find_one_package 'anupq*' anupq)"
          json_dir="$(find_one_package 'json*' json)"
          smallgrp_info="$smallgrp_dir/PackageInfo.g"
          autpgrp_info="$autpgrp_dir/PackageInfo.g"
          anupq_info="$anupq_dir/PackageInfo.g"
          json_info="$json_dir/PackageInfo.g"
          for package_info in \
            "$smallgrp_info" "$autpgrp_info" "$anupq_info" "$json_info"; do
            test -f "$package_info"
          done

          metadata_log="$RUNNER_TEMP/gap-p2-metadata.log"
          "$GAPROOT/gap" --quitonbreak -q <<'GAP' | tee "$metadata_log"
          RequirePackageVersion := function(name, expected)
            local infos;
            infos := PackageInfo(name);
            if Length(infos) <> 1 then
              Error("expected exactly one PackageInfo entry for ", name);
            fi;
            if infos[1].Version <> expected then
              Error("package version mismatch for ", name, ": ", infos[1].Version);
            fi;
          end;;
          if GAPInfo.Version <> "4.16.0" then Error("GAP 4.16.0 required"); fi;;
          RequirePackageVersion("smallgrp", "1.5.4");;
          RequirePackageVersion("autpgrp", "1.12.0");;
          RequirePackageVersion("anupq", "3.3.3");;
          RequirePackageVersion("json", "2.4.0");;
          Print("P2_PACKAGE_METADATA_PASS\n");;
          QUIT_GAP(0);;
          GAP
          test "$(grep -c '^P2_PACKAGE_METADATA_PASS$' "$metadata_log")" -eq 1

          for build_dir in "$json_dir" "$anupq_dir"; do
            test -x "$build_dir/configure"
            (
              cd "$build_dir"
              ./configure --with-gaproot="$GAPROOT"
              make -j"$(nproc)"
            )
          done

          read -r smallgrp_info_sha _ < <(sha256sum "$smallgrp_info")
          read -r autpgrp_info_sha _ < <(sha256sum "$autpgrp_info")
          read -r anupq_info_sha _ < <(sha256sum "$anupq_info")
          read -r json_info_sha _ < <(sha256sum "$json_info")
          printf 'GAP_P2_PACKAGE_ROOT=%s\n' "$GAPROOT" >> "$GITHUB_ENV"
          printf 'P2_PACKAGE_BUILD_PASS gap_release_sha256=%s smallgrp=%s smallgrp_version=1.5.4 smallgrp_info_sha256=%s autpgrp=%s autpgrp_version=1.12.0 autpgrp_info_sha256=%s anupq=%s anupq_version=3.3.3 anupq_info_sha256=%s json=%s json_version=2.4.0 json_info_sha256=%s\n' \
            'aaa296b32a5d7bf25fd80f241d23ec1f58b74e991ae730fafe40e54eb3af6e7e' \
            "$smallgrp_dir" "$smallgrp_info_sha" \
            "$autpgrp_dir" "$autpgrp_info_sha" \
            "$anupq_dir" "$anupq_info_sha" \
            "$json_dir" "$json_info_sha"

          load_log="$RUNNER_TEMP/gap-p2-load.log"
          "$GAPROOT/gap" --quitonbreak -q <<'GAP' | tee "$load_log"
          RequirePackageVersion := function(name, expected)
            local infos;
            infos := PackageInfo(name);
            if Length(infos) <> 1 then
              Error("expected exactly one PackageInfo entry for ", name);
            fi;
            if infos[1].Version <> expected then
              Error("package version mismatch for ", name, ": ", infos[1].Version);
            fi;
          end;;
          if GAPInfo.Version <> "4.16.0" then Error("GAP 4.16.0 required"); fi;;
          if LoadPackage("smallgrp") <> true then Error("smallgrp LoadPackage failed"); fi;;
          if LoadPackage("autpgrp") <> true then Error("autpgrp LoadPackage failed"); fi;;
          if LoadPackage("anupq") <> true then Error("anupq LoadPackage failed"); fi;;
          if LoadPackage("json") <> true then Error("json LoadPackage failed"); fi;;
          RequirePackageVersion("smallgrp", "1.5.4");;
          RequirePackageVersion("autpgrp", "1.12.0");;
          RequirePackageVersion("anupq", "3.3.3");;
          RequirePackageVersion("json", "2.4.0");;
          Print("P2_PACKAGE_LOAD_PASS GAPInfo.Version=4.16.0 smallgrp=1.5.4 autpgrp=1.12.0 anupq=3.3.3 json=2.4.0\n");;
          QUIT_GAP(0);;
          GAP
          test "$(grep -c '^P2_PACKAGE_LOAD_PASS ' "$load_log")" -eq 1
      - name: Run GAP script
        shell: bash
        env:
          GAP_RUN_SCRIPT: ${{ inputs.script }}
          GAP_RUN_PREAMBLE: ${{ inputs.preamble }}
          GAP_RUN_OUT_DIR: ${{ inputs.out_dir }}
          GAP_WITH_PQUOT_PACKAGES: ${{ inputs.with_pquot_packages }}
        run: |
          set -euo pipefail
          case "$GAP_RUN_SCRIPT" in
            ""|.|..|/*|../*|*/../*|*\\*|*[!A-Za-z0-9_./-]*)
              echo "unsafe or empty script path" >&2
              exit 2
              ;;
          esac
          case "$GAP_RUN_OUT_DIR" in
            ""|.|..|/*|../*|*/../*|*\\*|*[!A-Za-z0-9_./-]*)
              echo "unsafe or empty artifact directory" >&2
              exit 2
              ;;
          esac
          test -f "$GAP_RUN_SCRIPT"
          mkdir -p "$GAP_RUN_OUT_DIR" ci/out
          {
            if [ -n "$GAP_RUN_PREAMBLE" ]; then printf '%s\n' "$GAP_RUN_PREAMBLE"; fi
            if [ "$GAP_WITH_PQUOT_PACKAGES" = "true" ]; then
              printf 'if GAPInfo.Version <> "4.16.0" then Error("GAP 4.16.0 required"); fi;; if LoadPackage("smallgrp") <> true then Error("smallgrp LoadPackage failed"); fi;; if LoadPackage("autpgrp") <> true then Error("autpgrp LoadPackage failed"); fi;; if LoadPackage("anupq") <> true then Error("anupq LoadPackage failed"); fi;; if LoadPackage("json") <> true then Error("json LoadPackage failed"); fi;; Print("P2_PACKAGE_LOAD_PASS GAPInfo.Version=",GAPInfo.Version,"\\n");; Print("GAPInfo.RootPaths=",GAPInfo.RootPaths,"\\n");;\n'
            fi
            printf 'Read("%s");\n' "$GAP_RUN_SCRIPT"
          } > ci/out/driver.g
          gap_args=()
          if [ "$GAP_WITH_PQUOT_PACKAGES" = "true" ]; then
            gap_args=(-l "${GAP_P2_PACKAGE_ROOT:?}")
          fi
          gap "${gap_args[@]}" --quitonbreak -q -o 12g ci/out/driver.g | tee ci/out/run.log
          # GAP may print a syntax error while returning success after Read()
          # has continued.  The P2 selftest therefore has an explicit final
          # marker and a fail-closed diagnostic gate; ordinary gap-run scripts
          # retain the generic runner contract.
          if [[ "$GAP_RUN_SCRIPT" == "search/d972_b4_pquotient_v1.g" ]]; then
            if grep -Eq '(^|[[:space:]])(Syntax error:|Error,)' ci/out/run.log; then
              echo "P2_RUN_STOP: GAP syntax/error diagnostic found" >&2
              exit 1
            fi
            if [[ "$GAP_RUN_PREAMBLE" == *"D972_P2_SELFTEST:=true"* ||
                  "$GAP_RUN_PREAMBLE" == *"D972_P2_SELFTEST = true"* ]]; then
              if ! grep -q '^P2_SELFTEST_FINAL_MARKER ' ci/out/run.log; then
                echo "P2_SELFTEST_STOP: final marker missing" >&2
                exit 1
              fi
            elif [[ "$GAP_RUN_PREAMBLE" == *"D972_P2_MAGNUS_ONLY:=true"* ||
                    "$GAP_RUN_PREAMBLE" == *"D972_P2_MAGNUS_ONLY = true"* ]]; then
              if ! grep -q '^P2_MAGNUS_INPUT_WRITTEN ' ci/out/run.log ||
                 ! grep -q '^P2_FINAL_MARKER mode=magnus$' ci/out/run.log; then
                echo "P2_MAGNUS_STOP: completion marker missing" >&2
                exit 1
              fi
            else
              if ! grep -q '^P2_ARTIFACT_WRITTEN ' ci/out/run.log ||
                 ! grep -q '^P2_FINAL_MARKER mode=full$' ci/out/run.log; then
                echo "P2_FULL_STOP: artifact/final marker missing" >&2
                exit 1
              fi
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: gap-run-out
          path: |
            ${{ inputs.out_dir }}/
            ci/out/
