name: gap-run
on:
  workflow_dispatch:
    inputs:
      script:
        description: "GAP script path (repo-relative, e.g. search/wall-miner-v1.g)"
        required: true
        type: string
      preamble:
        description: "Optional GAP statements bound before Read (e.g. SHARD:=2;;)"
        required: false
        type: string
        default: ""
      out_dir:
        description: "Artifact directory to collect"
        required: false
        type: string
        default: "search/certs"
      timeout_min:
        description: "Job timeout minutes"
        required: false
        type: string
        default: "60"

jobs:
  gap:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_min) }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup GAP 4.16.0 (release tarball, sha256-verified)
        uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'
      - name: Run GAP script
        run: |
          mkdir -p "${{ inputs.out_dir }}" ci/out
          {
            if [ -n "${{ inputs.preamble }}" ]; then printf '%s\n' '${{ inputs.preamble }}'; fi
            printf 'Read("%s");\n' '${{ inputs.script }}'
          } > ci/out/driver.g
          gap -q -o 12g ci/out/driver.g | tee ci/out/run.log
      - uses: actions/upload-artifact@v4
        with:
          name: gap-run-out
          path: |
            ${{ inputs.out_dir }}/
            ci/out/run.log
