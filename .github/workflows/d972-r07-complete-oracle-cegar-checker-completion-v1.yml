      - name: Record scalar and zero root coverage from fully compared saved bytes
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "completion"
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def digest(raw):
              return hashlib.sha256(raw).hexdigest()
          checked_raw = (root / "checker-result.json").read_bytes()
          checked = json.loads(checked_raw)
          assert checked["status"] == "PASS" and checked["all_new_committed_arrays_and_json_compared"] is True
          assert checked["completed_steps"] == len(checked["snapshots"]) == len(checked["steps"]) == 32
          rows = []
          for number, snapshot in enumerate(checked["snapshots"]):
              base = root / "output/snapshots" / f"{number:06d}"
              start_raw = (base / "start.json").read_bytes()
              start = json.loads(start_raw)
              assert snapshot["snapshot_sha256"] == digest(start_raw) and snapshot["step"] == number
              manifests, payload_refs = {}, []
              for phase in ("section", "cochain"):
                  raw = (base / phase / "manifest.json").read_bytes()
                  assert digest(raw) == snapshot["phase_manifests"][phase]
                  manifests[phase] = json.loads(raw)
              def payload(phase, name, dtype, shape, size):
                  matches = [row for row in manifests[phase]["files"] if row["file"] == name]
                  assert len(matches) == 1
                  record = matches[0]
                  raw = (base / phase / name).read_bytes()
                  assert record["dtype"] == dtype and record["shape"] == shape and record["bytes"] == len(raw) == size
                  assert record["sha256"] == digest(raw)
                  payload_refs.append({"phase": phase, **record})
                  return raw
              q = payload("section", "q.bin", "packed3", [4, 36288], 36288)
              kappa = payload("section", "kappa.bin", "packed3", [96776], 24194)
              score = payload("cochain", "score.u8", "u8", [6, 2, 54432], 653184)
              aux = payload("cochain", "b-aux.u8", "u8", [2], 2)
              # The saved format has four base-3 digits per byte, weights 1,3,9,27.
              assert all(value <= 80 for value in q) and all(value <= 80 for value in kappa)
              assert all(value < 3 for value in score) and all(value < 3 for value in aux)
              kappa_values = [value // weight % 3 for value in kappa for weight in (1, 3, 9, 27)]
              assert len(kappa_values) == 96776
              root_rows, kappa_tags, score_tags = [], [], []
              for character in range(4):
                  raw = q[character * 9072:(character + 1) * 9072]
                  root_rows.append({"character": character, "zero_for_current_lambda": not any(raw),
                      "nonzero_packed_bytes": len(raw) - raw.count(0), "operator_identically_zero_claimed": False})
              for tag in range(6):
                  d0 = [value for character in range(4) for value in kappa_values[(character * 6 + tag) * 1008:(character * 6 + tag + 1) * 1008]]
                  d1 = [value for character in range(4) for value in kappa_values[24192 + (character * 6 + tag) * 3024:24192 + (character * 6 + tag + 1) * 3024]]
                  kappa_tags.append({"tag": tag, "d0_nonzero_trits": sum(value != 0 for value in d0),
                      "d1_nonzero_trits": sum(value != 0 for value in d1)})
                  score_tags.append({"tag": tag, "components": [{"component": component,
                      "nonzero_trits": 54432 - score[(tag * 2 + component) * 54432:(tag * 2 + component + 1) * 54432].count(0)}
                      for component in range(2)]})
              physical_raw = (base / "e/physical/result.json").read_bytes()
              physical = json.loads(physical_raw)
              scalar = checked["steps"][number]["target_scalar"]
              assert type(scalar) is int and scalar in (0, 1, 2) and scalar == physical["target"]["scalar"]
              rows.append({"step": number + 1, "snapshot_step": number, "snapshot_sha256": digest(start_raw),
                  "lambda_sha256": start["lambda_sha256"], "state_head": start["state_head"], "target_scalar": scalar,
                  "physical_result_sha256": digest(physical_raw), "q_roots": root_rows, "kappa_tags": kappa_tags,
                  "kappa_shared_aux": kappa_values[-8:], "score_tags": score_tags, "b_aux": list(aux),
                  "phase_manifests": {phase: snapshot["phase_manifests"][phase] for phase in ("section", "cochain")},
                  "payloads": payload_refs})
          conventions = {"signed_representative": {"0": 0, "1": 1, "2": -1},
              "raw_repair_order": ["w", "(r_x^3)^(-A(w)/6)", "(r_y^3)^(-B(w)/6)", "commutator^signed(omega(w))"],
              "raw_division_by_6": "ordinary_integer_exact_division", "p1_exponent_modulus": 54,
              "p1_residue_type": "ordinary_integer_0_to_53", "divisible_by_18_residues": [0, 18, 36],
              "normalized_pair": "residue/18 in {0,1,2}; no division by 18 in F3",
              "oracle_normalized_aux": "independent eta; b_aux=-kappa_aux[6:8]; no division by 18 in F3",
              "tables": [{"role": "materializer", "references": ["sol/proof_r07_table_free_endpoint_selector_v547.md#4.2", "sol/luna_reply_965_r07_selected_cycle_materializer.md"]},
                  {"role": "oracle", "references": ["sol/proof_r07_section_corrected_homogeneous_dual_v548.md", "sol/luna_reply_957_r07_complete_oracle_after_full_origin.md"]},
                  {"role": "continuation", "references": ["sol/luna_reply_971_r07_complete_oracle_cegar_continuation.md", "ops/express/20260906_fable_astra_cycle_cv9_correction_ack.md"]}],
              "registered_convention_changed": False, "new_adjudication": False, "convention_arithmetic_recomputed": False}
          receipt = {"schema": "d972.r07.complete-oracle-cegar-checker-completion.v1.coverage", "status": "PASS",
              "checker_result_sha256": digest(checked_raw), "rows": rows, "target_scalars": [row["target_scalar"] for row in rows],
