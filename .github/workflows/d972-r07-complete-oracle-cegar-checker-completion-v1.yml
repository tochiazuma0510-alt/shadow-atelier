      - name: Always preserve all original bytes and check every source and parent root
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python -B - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"])
          original, root = work / "original-cegar", work / "completion"
          root.mkdir(exist_ok=True)
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def digest(item):
              with item.open("rb") as stream:
                  value = hashlib.sha256()
                  for part in iter(lambda: stream.read(1 << 20), b""):
                      value.update(part)
              return value.hexdigest()
          def scan(base):
              assert base.is_dir() and not base.is_symlink(), str(base)
              files, directories = [], []
              for item in sorted(base.rglob("*")):
                  assert not item.is_symlink() and base.resolve() in item.resolve().parents, str(item)
                  name = item.relative_to(base).as_posix()
                  if item.is_dir():
                      directories.append(name)
                  else:
                      assert item.is_file(), str(item)
                      files.append({"file": name, "bytes": item.stat().st_size, "sha256": digest(item)})
              return files, directories
          errors = []
          flags = {key: False for key in ("source_checked_unchanged", "all_parent_roots_checked_unchanged",
              "original_input_checked_unchanged", "copied_original_receipts_checked_unchanged", "producer_output_checked_unchanged")}
          files, directories, after_parents, checker_sources = [], [], [], []
          # If admission failed before making the candidate copy, retain the safely
          # extracted producer evidence as diagnostics without asserting admission.
          try:
              if original.is_dir():
                  assert not original.is_symlink() and all(not p.is_symlink() for p in original.rglob("*"))
                  if (original / "output").is_dir() and not (root / "output").exists():
                      shutil.copytree(original / "output", root / "output")
                  (root / "original").mkdir(exist_ok=True)
                  for item in original.iterdir():
                      if item.name != "output":
                          assert item.is_file()
                          target = root / "original" / item.name
                          if not target.exists():
                              shutil.copyfile(item, target)
              for name in ("source-receipt.json", "repair-source-receipt.json", "parent-intake-receipt.json", "parent-paths.json", "original-cegar-run.json"):
                  if (work / name).is_file() and not (root / name).exists():
                      shutil.copyfile(work / name, root / name)
              live = root / "live-parent-metadata"
              live.mkdir(exist_ok=True)
              for item in sorted(work.glob("artifact-*.json")) + sorted(work.glob("*-run.json")):
                  assert item.is_file() and not item.is_symlink()
                  shutil.copyfile(item, live / item.name)
              code_root = root / "checker-sources"
              code_root.mkdir(exist_ok=True)
              for version, size_name, hash_name in (("v1", "CHECKER_BYTES", "CHECKER_SHA256"),
                      ("v2", "REPAIRED_CHECKER_BYTES", "REPAIRED_CHECKER_SHA256")):
                  item = Path("search/check_d972_r07_complete_oracle_cegar_continuation_" + version + ".py")
                  assert item.is_file() and not item.is_symlink() and item.stat().st_size == int(os.environ[size_name])
                  assert digest(item) == os.environ[hash_name]
                  target = code_root / item.name
                  shutil.copyfile(item, target)
                  assert target.stat().st_size == int(os.environ[size_name]) and digest(target) == os.environ[hash_name]
                  checker_sources.append({"file": target.relative_to(root).as_posix(),
                      "bytes": target.stat().st_size, "sha256": digest(target)})
          except Exception as error:
              errors.append("diagnostic-preservation:" + type(error).__name__ + ":" + str(error))
          try:
              if (root / "repair-source-receipt.json").exists():
                  source = json.loads((root / "repair-source-receipt.json").read_bytes())
                  assert len(source["files"]) == 20 and len(source["data"]) == 3
                  for record in source["files"]:
                      item = Path(record["file"])
                      assert item.is_file() and not item.is_symlink() and item.stat().st_size == record["bytes"] and digest(item) == record["sha256"], record["file"]
                  for name, record in source["data"].items():
                      item = Path(name)
                      assert item.is_file() and not item.is_symlink() and item.stat().st_size == record["bytes"] and digest(item) == record["sha256"], name
                  flags["source_checked_unchanged"] = True
          except Exception as error:
              errors.append("source:" + type(error).__name__ + ":" + str(error))
          try:
              if (root / "all-parent-files-before.json").exists():
                  before_parents = json.loads((root / "all-parent-files-before.json").read_bytes())
                  paths = json.loads((root / "parent-paths.json").read_bytes())
                  assert before_parents["count"] == len(paths) == 14
                  for parent in before_parents["parents"]:
                      parent_files, parent_dirs = scan(Path(paths[parent["role"]]))
                      after = {"role": parent["role"], "files": parent_files, "directories": parent_dirs}
                      after_parents.append(after)
                      assert after == parent, parent["role"]
                  assert len(after_parents) == 14
                  flags["all_parent_roots_checked_unchanged"] = True
          except Exception as error:
              errors.append("all-parents:" + type(error).__name__ + ":" + str(error))
          try:
              if (root / "preserved-input.json").exists():
                  before = json.loads((root / "preserved-input.json").read_bytes())
                  original_files, original_dirs = scan(original)
                  assert original_files == before["files"] and original_dirs == before["directories"]
                  flags["original_input_checked_unchanged"] = True
                  copied_files, copied_dirs = scan(root / "original")
                  assert copied_dirs == [] and copied_files == [row for row in before["files"] if not row["file"].startswith("output/")]
                  for record in before["entry_files"]:
                      name = record["file"]
                      if name.startswith("output/"):
                          continue
                      target = root / name
                      if target.is_file() and name not in ("checker-result.json", "checker-stdout.json", "checker.log", "checker-exit-code.txt",
                              "preservation-result.json", "parent-paths.json"):
                          assert target.stat().st_size == record["bytes"] and digest(target) == record["sha256"], name
                  for old, new in (("checker-result.json", "previous-checker-result.json"), ("checker-stdout.json", "previous-checker-stdout.json"),
                          ("checker.log", "previous-checker.log"), ("checker-exit-code.txt", "previous-checker-exit-code.txt")):
                      assert (root / new).is_file() and digest(root / new) == digest(original / old)
                  flags["copied_original_receipts_checked_unchanged"] = True
                  files, directories = scan(root / "output")
                  assert files == before["output_files"] and directories == before["output_directories"]
                  assert len(files) == 2584 and len(directories) == 420 and sum(row["bytes"] for row in files) == 346710509
                  flags["producer_output_checked_unchanged"] = True
          except Exception as error:
              errors.append("original-and-output:" + type(error).__name__ + ":" + str(error))
          (root / "all-parent-files-after.json").write_bytes(canonical({
              "schema": "d972.r07.complete-oracle-cegar-checker-completion.v1.all-parent-files",
              "parents": after_parents, "count": len(after_parents), "candidate": False, "cross_checked": False, "verified": False}))
          status = "FAIL" if errors else "PASS" if all(flags.values()) else "INCOMPLETE"
          receipt = {"schema": "d972.r07.complete-oracle-cegar-checker-completion.v1.preservation", "status": status,
              **flags, "files": files, "directories": directories, "output_bytes": sum(row["bytes"] for row in files),
              "all_parent_files_after_sha256": digest(root / "all-parent-files-after.json"), "errors": errors, "checker_sources": checker_sources,
              "checker_status_is_separate": True, "candidate": False, "cross_checked": False, "verified": False}
          (root / "preservation-result.json").write_bytes(canonical(receipt))
          if errors:
              raise SystemExit("immutable preservation failed: " + "; ".join(errors))
          PY

