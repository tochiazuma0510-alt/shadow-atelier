          set -euo pipefail
          python -B - <<'PY'
          import ast, hashlib, json, os
          from pathlib import Path
          work = Path(os.environ["RUNNER_TEMP"]).resolve()
          def canonical(value):
              return (json.dumps(value, sort_keys=True, separators=(",", ":")) + "\n").encode("ascii")
          def find(base_name, required):
              base = work / base_name
              matches = []
              for root in [base, *sorted(p for p in base.rglob("*") if p.is_dir())]:
                  assert not root.is_symlink() and (root == base or base in root.resolve().parents)
                  if all((root / name).is_file() for name in required):
                      for name in required:
                          cursor = root
                          for part in Path(name).parts:
                              cursor = cursor / part
                              assert not cursor.is_symlink()
                      matches.append(root.resolve())
              assert len(matches) == 1, (base_name, matches)
              return str(matches[0])
          paths = {
              "E_ROOT": find("current-e", ["output/HEAD", "output/manifest.json", "checker-result.json", "source-receipt.json", "run-receipt.json"]),
              "ORACLE_ROOT": find("current-oracle", ["output/manifest.json", "output/tree/witness.json", "checker-result.json", "source-receipt.json", "repair-source-receipt.json", "completion-run-receipt.json"]),
              "REFINEMENT_ROOT": find("current-refinement", ["output/HEAD", "output/start.json", "output/canonical-index.json", "checker-result.json", "source-receipt.json"]),
              "PACKET_ROOT": find("rank1359-packet", ["output/HEAD", "output/start.json", "checker-result.json", "source-receipt.json"]),
              "SEED34_ROOT": find("rank1356-seed34", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "DELTA_ROOT": find("rank1355-delta", ["output/manifest.json", "checker-result.json", "source-receipt.json"]),
              "PREPARE_ROOT": find("task554-prepare", ["prepare.HEAD"]),
              "P1_ROOT": find("p1", ["manifest.json", "instructions.jsonl", "degree2.cache.bin"]),
              "TASK712_ROOT": find("task712", ["r07-grade2-maps-v4-receipt.json", "r07-grade2-maps-v4-checker.json"]),
              "STATE_ROOT": find("separator", ["state/manifest.json", "state/physical.bin"])}
          for index in range(4):
              paths["BLOCK_" + str(index) + "_ROOT"] = find("task554-block-" + str(index), ["block-" + str(index) + ".HEAD"])
          assert len(paths) == 14
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
              for key, value in paths.items():
                  assert "\n" not in value and "\r" not in value
                  stream.write(key + "=" + value + "\n")
          (work / "parent-paths.json").write_bytes(canonical(paths))
          def literal_pin_table(source, name):
              tree = ast.parse(Path(source).read_bytes())
              matches = [node.value for node in tree.body if isinstance(node, ast.AnnAssign) and
                         isinstance(node.target, ast.Name) and node.target.id == name]
              if not matches:
                  matches = [node.value for node in tree.body if isinstance(node, ast.Assign) and
                             any(isinstance(target, ast.Name) and target.id == name for target in node.targets)]
              assert len(matches) == 1
              return ast.literal_eval(matches[0])
