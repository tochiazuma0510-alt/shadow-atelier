name: d972-r07-a0-grade1-selected-slp-v1
on:
  workflow_dispatch:
  push:
    branches: [sol/r07-explicit-lift-20260825]
    paths:
      - search/d972_r07_a0_grade1_selected_slp_v1.py
      - search/check_d972_r07_a0_grade1_selected_slp_v1.py
      - sol/luna_reply_601_r07_grade1_selected_slp_v1.md
      - .github/workflows/d972-r07-a0-grade1-selected-slp-v1.yml
permissions:
  contents: read
  actions: read
env:
  PYTHONHASHSEED: "0"
  PYTHONUNBUFFERED: "1"
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TASK601_SECONDS: "2400"
  TASK601_MAX_RSS: "7516192768"
  SOURCE_RUN_ID: "33677346616"
  SOURCE_RUN_ATTEMPT: "1"
  CANDIDATE_RUN_ID: "33707397894"
  CANDIDATE_RUN_ATTEMPT: "1"
  CANDIDATE_COMMIT: "93f746ad1b649796e1bc28e00ff34993498929ee"
  PRODUCER_SHA256: 4cc5d6ccb1bfdcb441b801a4826af04bbbdc9dc7f21d6f7c860d05929e64bfe9
  CHECKER_SHA256: 8355fda531b9de41b37df811af932352f07546d6d0ec445764fedaced2595595
  REPLY_SHA256: f360beb5a7c70608b48683183d01af3e262e0ce4b687c0cdb5ccb48c9cb31609
  V3_PRODUCER_SHA256: bf872b30149e1351762b243d590d7a1f876e048b92a053d8f9c17bba5c45bcff
jobs:
  selected-slp:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[fire-grade1-selected-slp-v1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Setup Python 3.13
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55
        with:
          python-version: "3.13"
      - name: Authenticate source tools before downloads
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum search/d972_r07_a0_grade1_selected_slp_v1.py | awk '{print $1}')" = "$PRODUCER_SHA256"
          test "$(sha256sum search/check_d972_r07_a0_grade1_selected_slp_v1.py | awk '{print $1}')" = "$CHECKER_SHA256"
          test "$(sha256sum sol/luna_reply_601_r07_grade1_selected_slp_v1.md | awk '{print $1}')" = "$REPLY_SHA256"
          test "$(sha256sum search/d972_r07_a0_first_rung_grade1_v3.py | awk '{print $1}')" = "$V3_PRODUCER_SHA256"
          test "$CANDIDATE_COMMIT" = "93f746ad1b649796e1bc28e00ff34993498929ee"
      - name: Install pinned NumPy and run tiny fixtures
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "numpy==2.5.1"
          python -B -m py_compile search/d972_r07_a0_grade1_selected_slp_v1.py search/check_d972_r07_a0_grade1_selected_slp_v1.py
          python -B search/d972_r07_a0_grade1_selected_slp_v1.py --selftest
          python -B search/check_d972_r07_a0_grade1_selected_slp_v1.py --selftest
      - name: Download exact prepare and blocks
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: task554-grade1-v3-*-${{ env.SOURCE_RUN_ID }}-${{ env.SOURCE_RUN_ATTEMPT }}
          path: ${{ runner.temp }}/task601-state
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.SOURCE_RUN_ID }}
      - name: Download exact Task595 candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: task595-grade1-decision-v2-candidate-${{ env.CANDIDATE_RUN_ID }}-${{ env.CANDIDATE_RUN_ATTEMPT }}
          path: ${{ runner.temp }}/task601-candidate
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CANDIDATE_RUN_ID }}
      - name: Extract selected SLP and independently check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/task601-logs" "$RUNNER_TEMP/task601-payload"
          ulimit -v 8388608
          timeout --signal=TERM --kill-after=60s 45m python -B -u search/d972_r07_a0_grade1_selected_slp_v1.py \
            --state "$RUNNER_TEMP/task601-state" --candidate "$RUNNER_TEMP/task601-candidate" --out "$RUNNER_TEMP/task601-payload" \
            2>&1 | tee "$RUNNER_TEMP/task601-logs/producer.log"
          timeout --signal=TERM --kill-after=60s 45m python -B -u search/check_d972_r07_a0_grade1_selected_slp_v1.py \
            --state "$RUNNER_TEMP/task601-state" --candidate "$RUNNER_TEMP/task601-candidate" --payload "$RUNNER_TEMP/task601-payload" --out "$RUNNER_TEMP/task601-verdict.json" \
            2>&1 | tee "$RUNNER_TEMP/task601-logs/checker.log"
          test -s "$RUNNER_TEMP/task601-verdict.json"
          grep -Fq 'R07_GRADE1_SELECTED_SLP_V1_CHECKER_PASS' "$RUNNER_TEMP/task601-verdict.json"
      - name: Upload selected payload and verdict
        if: ${{ success() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: task601-selected-slp-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/task601-payload/
            ${{ runner.temp }}/task601-verdict.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload logs
        if: ${{ always() }}
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: task601-selected-slp-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task601-logs/
          if-no-files-found: warn
          retention-days: 90
