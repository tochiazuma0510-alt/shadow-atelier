name: mine-dispatch

# 採掘場(mine)の統一配車 -- v0/v1(裁定237)。mb-search.yml の複製改造。
# 探索器の判定ロジックには一切触れない -- job "gate" が
# mine/preflight.py(schema/integrity/予言/registry の4ゲート)をそのまま
# 実行し、1つでも不一致なら発車しない。backend は gap-ci / py-ci を扱う
# (sat-ci は§4.5の設計に予約済みだが本 workflow の実装対象外)。
#
# py-ci 差分(§4.5「py-ci(照合器用 python/node)」の実装): resources.
# py_driver({script, sha256} -- v0_driver の python 版・述語カード化までの
# 橋渡し欄)が指す python スクリプトを起動する。CLI 契約は2種類(後方互換・
# miner の事前検出対応で汎用化):
#   (1) 旧 u_meas 契約(無改変) -- pipeline[0].params.primes(非空整数配列)
#       がある場合。primes を CLI 引数にし、完走判定は「=== p = N ===」
#       見出し出現数と primes 数の一致。最初の消費者は
#       search/probe/wac_v1/u_meas_caseb_locus2.py(CLI: <logpath> <primes...>)。
#   (2) 汎用契約 -- primes が無い場合。py_driver.args(省略可・文字列配列)
#       を CLI 引数にし、完走判定は py_driver.done_marker(省略時
#       "PY_DRIVER_DONE")の run.log 出現。py_driver.result_count_check
#       ({marker, expect}・省略可)があれば marker 出現数と expect の
#       突合も必須にする(省略時はこの突合をスキップ)。
# 両契約とも fail-closed: exit code が非 0 なら即 verdict=failed(gap-ci の
# DRIVER_DONE マーカー検出と同水準の構造チェック -- 数学的な当否の判定は
# しない)。provenance(python バージョン・スクリプト sha256・引数)は
# run.log 先頭と result.txt に機械記録する。
#
# v1 差分(裁定237 v1 範囲): resources.shards が配列 [{name,preamble}, ...]
# のとき matrix でシャード並列する(各シャードの preamble は
# v0_driver.preamble に連結して実行)。out_dir(既定 search/certs)は既存 cert
# を含む共有チェックアウトのままなので、実行後に「今回の実行で新規/更新
# されたファイルだけ」を mtime 比較で mine/out/<job_id>[/<shard>]/ へ回収し、
# artifact はそちら(SHA256SUMS.txt 込み)を収蔵する(分類不能 cert 混入の
# 解消)。driver.g は plan JSON から python で直接生成する(shell 展開を
# 経由しない -- 旧実装は preamble 内の GAP 引用符が bash quote removal に
# 食われる欠陥があった。恒久対策として python heredoc 方式に統一)。

on:
  push:
    paths:
      - 'mine/jobs/queue/*.json'
  workflow_dispatch:
    inputs:
      job_path:
        description: "mine job JSON のパス(repo-relative)。省略時は push で変更された mine/jobs/queue/*.json を自動発見。"
        required: false
        type: string
        default: ""

# concurrency は plan 単位でグループ化する(同一 plan の二重走行のみ防ぐ)。
# 全体で 1 グループにすると「pending は 1 枠だけ・新しい pending が古い pending を
# 追い出して cancel する」GitHub 仕様により、待機中のジョブが後続 push で
# 静かに消される(実害: B 窓 probe run 30548910493 が recal 再走に追い出された)。
concurrency:
  group: mine-dispatch-${{ inputs.job_path != '' && inputs.job_path || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      entries: ${{ steps.discover.outputs.entries }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Discover job plan(s) and expand shard matrix
        id: discover
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.job_path }}" ]; then
            FILES="${{ inputs.job_path }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            FILES=$(git diff --name-only --diff-filter=ACM "${{ github.event.before }}" "${{ github.event.after }}" -- 'mine/jobs/queue/*.json' || true)
          else
            FILES=""
          fi
          if [ -z "$FILES" ]; then
            echo "PLAN_DISCOVERY_STOP: no mine job JSON found (push diff empty and no job_path input given)" >&2
            exit 1
          fi
          printf '%s\n' "$FILES" > ci_discovered_files.txt
          # entries は {job_path, shard_name, shard_preamble} の配列。
          # resources.shards が配列なら shard ごとに 1 entry、そうでなければ
          # 非分割 1 entry(shard_name/shard_preamble は空文字)-- v0 の
          # 非分割動作をそのまま entries の 1 要素として表現するので、
          # gate-and-run 側のロジックは v0/v1 共通のまま扱える。
          python - ci_discovered_files.txt > ci_discovered_entries.json <<'PY'
          import json, sys
          files = [l.strip() for l in open(sys.argv[1], encoding='utf-8') if l.strip()]
          entries = []
          for fp in files:
              job = json.load(open(fp, encoding='utf-8'))
              shards = (job.get('resources') or {}).get('shards')
              if isinstance(shards, list) and shards and all(isinstance(s, dict) for s in shards):
                  for s in shards:
                      entries.append({
                          "job_path": fp,
                          "shard_name": s.get("name", ""),
                          "shard_preamble": s.get("preamble", ""),
                      })
              else:
                  entries.append({"job_path": fp, "shard_name": "", "shard_preamble": ""})
          if len(entries) > 256:
              print(f"SHARD_MATRIX_STOP: {len(entries)} matrix entries exceeds GHA cap of 256", file=sys.stderr)
              sys.exit(1)
          print(json.dumps(entries))
          PY
          ENTRIES=$(cat ci_discovered_entries.json)
          echo "entries=$ENTRIES" >> "$GITHUB_OUTPUT"
          echo "discovered entries: $ENTRIES"

  gate-and-run:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Preflight -- (a) schema (b) integrity (c) prediction (d) registry gate
        run: python mine/preflight.py "${{ matrix.entry.job_path }}"

      - name: Load job fields for downstream steps
        id: job
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ matrix.entry.job_path }}" <<'PY' >> "$GITHUB_OUTPUT"
          import json, sys
          job = json.load(open(sys.argv[1], encoding='utf-8'))
          res = job.get('resources', {})
          backend = res.get('backend')
          if backend not in ('gap-ci', 'py-ci'):
              print(f"ERROR: mine-dispatch supports backend=gap-ci or backend=py-ci only "
                    f"(sat-ci is reserved by ideas_013 §4.5 but not implemented), got {backend!r}", file=sys.stderr)
              sys.exit(1)
          print(f"job_id={job['job_id']}")
          print(f"backend={backend}")
          print(f"out_dir={job['outputs']['out_dir']}")
          print(f"timeout_min={res.get('timeout_min', 60)}")
          if backend == 'gap-ci':
              drv = res.get('v0_driver') or {}
              if not drv.get('script'):
                  print("ERROR: resources.v0_driver.script is required for backend=gap-ci", file=sys.stderr)
                  sys.exit(1)
              print(f"script={drv['script']}")
              print(f"preamble={drv.get('preamble', '')}")
          elif backend == 'py-ci':
              # py-ci: script は resources.py_driver(v0_driver の python 版・
              # 述語カード化までの橋渡し欄)。CLI 契約解決(legacy-primes/
              # generic の2種・後方互換)は mine/py_ci_contract.py の単一実装
              # を呼ぶ(ワークフローと単体テストでロジックを共有 -- ドリフト
              # 防止。テストは mine/test_py_ci_contract.py)。
              sys.path.insert(0, 'mine')
              from py_ci_contract import resolve_py_ci_config, PyCiConfigError
              try:
                  cfg = resolve_py_ci_config(job)
              except PyCiConfigError as e:
                  print(f"ERROR: {e}", file=sys.stderr)
                  sys.exit(1)
              print(f"py_script={cfg['script']}")
              print(f"py_legacy_primes_mode={'1' if cfg['legacy_primes_mode'] else '0'}")
              print(f"py_args={' '.join(cfg['args'])}")
              print(f"py_nprimes={cfg['nprimes'] if cfg['nprimes'] is not None else ''}")
              print(f"py_done_marker={cfg['done_marker'] or ''}")
              print(f"py_rcc_marker={cfg['rcc_marker'] or ''}")
              print(f"py_rcc_expect={cfg['rcc_expect'] if cfg['rcc_expect'] is not None else ''}")
          PY

      - name: Compute shard-qualified stage dir / artifact name
        id: shard
        shell: bash
        run: |
          set -euo pipefail
          SHARD_NAME="${{ matrix.entry.shard_name }}"
          if [ -n "$SHARD_NAME" ]; then
            echo "stage_dir=mine/out/${{ steps.job.outputs.job_id }}/${SHARD_NAME}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=mine-run-${{ steps.job.outputs.job_id }}-${SHARD_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "stage_dir=mine/out/${{ steps.job.outputs.job_id }}" >> "$GITHUB_OUTPUT"
            echo "artifact_name=mine-run-${{ steps.job.outputs.job_id }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup GAP 4.16.0 (release tarball, sha256-verified)
        if: steps.job.outputs.backend == 'gap-ci'
        uses: gap-actions/setup-gap@v3.8.0
        with:
          gap-version: '4.16.0'

      - name: Run GAP driver (search/*.g は不可侵 -- 既存 driver をそのまま Read するのみ)
        if: steps.job.outputs.backend == 'gap-ci'
        id: run
        shell: bash
        run: |
          set +o pipefail
          mkdir -p "${{ steps.job.outputs.out_dir }}" ci/out
          # driver.g は plan JSON から python で直接生成する(shell 展開を経由しない)。
          # 旧実装は GH 式の二重引用符補間で preamble 内の GAP 引用符が quote removal に
          # 食われ(R4ACP_WINDOW:="C";; が :=C;; になる)GAP が無出力で死んだ(run 30548585598)。
          # shard の preamble も同じ罠を踏むため argv では渡さない -- argv は shard の
          # 「名前」だけ(shell-safe 前提・preflight が構造検査)にし、preamble 本文は
          # plan JSON から python 内で引く。
          python - "${{ matrix.entry.job_path }}" "${{ matrix.entry.shard_name }}" > ci/out/driver.g <<'PY'
          import json, sys
          job = json.load(open(sys.argv[1], encoding='utf-8'))
          shard_name = sys.argv[2] if len(sys.argv) > 2 else ''
          drv = job['resources']['v0_driver']
          pre = drv.get('preamble', '')
          if pre:
              print(pre)
          if shard_name:
              shards = (job.get('resources') or {}).get('shards') or []
              match = [s for s in shards if isinstance(s, dict) and s.get('name') == shard_name]
              if not match:
                  print(f"SHARD_LOOKUP_STOP: shard {shard_name!r} not in plan", file=sys.stderr)
                  sys.exit(1)
              sp = match[0].get('preamble', '')
              if sp:
                  print(sp)
          print(f'Read("{drv["script"]}");')
          PY
          echo "--- ci/out/driver.g ---"; cat ci/out/driver.g; echo "-----------------------"
          # out_dir は既存チェックアウト済み cert を含む共有ディレクトリなので、
          # 実行前に基準マーカーを打っておき、後段で mtime 比較により
          # 「今回の実行で新規/更新されたファイルだけ」を判別する。
          touch ci/out/.baseline_marker
          TIMEOUT_SEC=$(( ${{ steps.job.outputs.timeout_min }} * 60 ))
          set +e
          timeout "$TIMEOUT_SEC" gap -q -o 12g ci/out/driver.g | tee ci/out/run.log
          GAP_EXIT="${PIPESTATUS[0]}"
          set -e
          echo "gap_exit=$GAP_EXIT" >> "$GITHUB_OUTPUT"

      - name: Run python checker (py-ci -- search/*.py は不可侵、既存スクリプトをそのまま CLI 起動するのみ)
        if: steps.job.outputs.backend == 'py-ci'
        id: pyrun
        shell: bash
        run: |
          set +o pipefail
          mkdir -p "${{ steps.job.outputs.out_dir }}" ci/out
          # out_dir は既存チェックアウト済み cert を含む共有ディレクトリなので、
          # gap-ci と同じ mtime-diff ステージング(次段)のため基準マーカーを打つ。
          touch ci/out/.baseline_marker
          SCRIPT="${{ steps.job.outputs.py_script }}"
          PY_ARGS="${{ steps.job.outputs.py_args }}"
          SHARD_NAME="${{ matrix.entry.shard_name }}"
          if [ -n "$SHARD_NAME" ]; then
            LOGNAME="${{ steps.job.outputs.job_id }}-${SHARD_NAME}.log"
          else
            LOGNAME="${{ steps.job.outputs.job_id }}.log"
          fi
          LOGPATH="${{ steps.job.outputs.out_dir }}/${LOGNAME}"
          PY_VERSION=$(python --version 2>&1)
          SCRIPT_SHA256=$(sha256sum "$SCRIPT" | awk '{print $1}')
          # provenance(python バージョン・スクリプト SHA-256・引数)を run.log の
          # 先頭に機械的に記録する(preflight が script 本体の sha256 は既に
          # integrity gate で照合済み -- ここは実行時点の記録のための再計算)。
          {
            echo "=== py-ci provenance ==="
            echo "python_version: $PY_VERSION"
            echo "script: $SCRIPT"
            echo "script_sha256: $SCRIPT_SHA256"
            echo "args: $PY_ARGS"
            echo "log_path: $LOGPATH"
            echo "========================="
          } | tee ci/out/run.log
          TIMEOUT_SEC=$(( ${{ steps.job.outputs.timeout_min }} * 60 ))
          set +e
          timeout "$TIMEOUT_SEC" python "$SCRIPT" "$LOGPATH" $PY_ARGS 2>&1 | tee -a ci/out/run.log
          PY_EXIT="${PIPESTATUS[0]}"
          set -e
          # 結果数の記録(旧 u_meas 契約の判定に使う「=== p = N ===」出現数、
          # または汎用契約の result_count_check.marker 出現数)は完走判定
          # 本体(次段 result.txt ステップ)で行う -- ここでは両契約分を
          # まとめて計測しておく(marker が空なら 0 のまま無害)。
          RESULT_COUNT=$(grep -c '^=== p = ' ci/out/run.log || true)
          RCC_MARKER="${{ steps.job.outputs.py_rcc_marker }}"
          if [ -n "$RCC_MARKER" ]; then
            RCC_COUNT=$(grep -c -F -- "$RCC_MARKER" ci/out/run.log || true)
          else
            RCC_COUNT=0
          fi
          echo "py_exit=$PY_EXIT" >> "$GITHUB_OUTPUT"
          echo "py_result_count=$RESULT_COUNT" >> "$GITHUB_OUTPUT"
          echo "py_rcc_count=$RCC_COUNT" >> "$GITHUB_OUTPUT"

      - name: Write result.txt (DRIVER_DONE marker detection for gap-ci / exit-code+count check for py-ci)
        shell: bash
        run: |
          set -euo pipefail
          BACKEND="${{ steps.job.outputs.backend }}"
          if [ "$BACKEND" = "gap-ci" ]; then
            if grep -q "DRIVER_DONE" ci/out/run.log; then
              VERDICT=done
            else
              VERDICT=failed
            fi
            {
              echo "verdict=$VERDICT"
              echo "job_id=${{ steps.job.outputs.job_id }}"
              echo "shard_name=${{ matrix.entry.shard_name }}"
              echo "backend=$BACKEND"
              echo "gap_exit_code=${{ steps.run.outputs.gap_exit }}"
              echo "run_id=${{ github.run_id }}"
              echo "sha=${{ github.sha }}"
            } > ci/out/result.txt
          elif [ "$BACKEND" = "py-ci" ]; then
            PY_EXIT="${{ steps.pyrun.outputs.py_exit }}"
            LEGACY="${{ steps.job.outputs.py_legacy_primes_mode }}"
            RESULT_COUNT="${{ steps.pyrun.outputs.py_result_count }}"
            TARGET_COUNT="${{ steps.job.outputs.py_nprimes }}"
            DONE_MARKER="${{ steps.job.outputs.py_done_marker }}"
            RCC_MARKER="${{ steps.job.outputs.py_rcc_marker }}"
            RCC_EXPECT="${{ steps.job.outputs.py_rcc_expect }}"
            RCC_COUNT="${{ steps.pyrun.outputs.py_rcc_count }}"
            # 完走判定は mine/py_ci_contract.py::determine_py_ci_verdict の
            # 単一実装を呼ぶ(単体テスト mine/test_py_ci_contract.py と同じ
            # コード -- bash 側にロジックを二重実装しない)。
            VERDICT=$(python - "$LEGACY" "$PY_EXIT" "$TARGET_COUNT" "$DONE_MARKER" "$RCC_MARKER" "$RCC_EXPECT" <<'PY'
          import sys
          sys.path.insert(0, 'mine')
          from py_ci_contract import determine_py_ci_verdict
          legacy = sys.argv[1] == '1'
          py_exit = int(sys.argv[2])
          nprimes = int(sys.argv[3]) if sys.argv[3] else None
          done_marker = sys.argv[4] or None
          rcc_marker = sys.argv[5] or None
          rcc_expect = int(sys.argv[6]) if sys.argv[6] else None
          with open('ci/out/run.log', encoding='utf-8', errors='replace') as f:
              run_log_text = f.read()
          print(determine_py_ci_verdict(legacy, py_exit, run_log_text, nprimes, done_marker, rcc_marker, rcc_expect))
          PY
            )
            if [ "$LEGACY" = "1" ]; then
              {
                echo "verdict=$VERDICT"
                echo "job_id=${{ steps.job.outputs.job_id }}"
                echo "shard_name=${{ matrix.entry.shard_name }}"
                echo "backend=$BACKEND"
                echo "py_contract=legacy-primes"
                echo "py_exit_code=$PY_EXIT"
                echo "py_result_count=$RESULT_COUNT"
                echo "py_target_count=$TARGET_COUNT"
                echo "run_id=${{ github.run_id }}"
                echo "sha=${{ github.sha }}"
              } > ci/out/result.txt
            else
              {
                echo "verdict=$VERDICT"
                echo "job_id=${{ steps.job.outputs.job_id }}"
                echo "shard_name=${{ matrix.entry.shard_name }}"
                echo "backend=$BACKEND"
                echo "py_contract=generic"
                echo "py_exit_code=$PY_EXIT"
                echo "py_done_marker=$DONE_MARKER"
                echo "py_result_count_check_marker=$RCC_MARKER"
                echo "py_result_count_check_expect=$RCC_EXPECT"
                echo "py_result_count_check_actual=$RCC_COUNT"
                echo "run_id=${{ github.run_id }}"
                echo "sha=${{ github.sha }}"
              } > ci/out/result.txt
            fi
          fi
          cat ci/out/result.txt

      - name: Stage new/changed out_dir files into job-scoped dir (mtime diff)
        shell: bash
        run: |
          set -euo pipefail
          OUT="${{ steps.job.outputs.out_dir }}"
          STAGE="${{ steps.shard.outputs.stage_dir }}"
          mkdir -p "$STAGE"
          if compgen -G "$OUT"'/*' > /dev/null; then
            find "$OUT" -maxdepth 1 -type f -newer ci/out/.baseline_marker -exec cp -t "$STAGE" {} +
          fi
          if compgen -G "$STAGE"'/*' > /dev/null; then
            ( cd "$STAGE" && sha256sum -- * > SHA256SUMS.txt )
          else
            echo "# (このジョブ/シャードで新規・更新された cert なし)" > "$STAGE/SHA256SUMS.txt"
          fi
          echo "staged files:"; ls -la "$STAGE"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.shard.outputs.artifact_name }}
          path: |
            ${{ steps.shard.outputs.stage_dir }}/
            ci/out/run.log
            ci/out/result.txt
          if-no-files-found: error
