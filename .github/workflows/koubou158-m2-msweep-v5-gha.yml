# koubou158-m2-msweep-v5-gha: GHA lane for the accelerated m1-direction
# sweep (search/koubou158_M2_msweep_v5.py), per commander instruction
# 2026-08-22 ("重い処理なら高速化してGHAで"). v4 (unaccelerated) is left
# running locally as a separate cross-check and is NOT touched by this
# workflow.
#
# Single job, two steps in strict order (commander instruction: "回帰
# ゲート -> j=7 本番の順で 1 job"):
#   1. Regression gate: a FROM-SCRATCH (--fresh) re-run through j=6,
#      inline-asserting v5 reproduces v4's actual logged values exactly
#      (dims 42/192/636/1740/4056, primary canary PASS, closed-form
#      identity diff_term_count=14/exact_match=True, m1 in {3,5,8}
#      settled at j=4 and m1=2 settled at j=5 -- see
#      koubou158_M2_msweep_v5.py's EXPECTED_* constants, sourced from
#      scratchpad/m2_v4_run.log). A mismatch raises core.require() ->
#      nonzero exit -> `set -euo pipefail` stops the job before step 2,
#      per instruction ("一つでも割れたら j=7 に進まず報告").
#   2. Production: SAME script, SAME checkpoint/cache directory (no
#      --fresh), continuing from the warm checkpoint straight through
#      j=7..J_MAX(12) without recomputing j=2..6 -- this is why steps 1
#      and 2 share one job/workspace rather than being split across
#      jobs (splitting would lose the persisted kernel cache, see the
#      module docstring's note on why persistent caching across j levels
#      is the main compounding speedup at higher j).
#
# DISPATCH GATE: workflow_dispatch only. Per the same discipline as
# other koubou158 lanes in this repo (e.g. koubou158-sweep-sharded-v1),
# this is NOT to be dispatched until the falsifier's pre-flight review
# returns PASS. Push and dispatch are the commander's action, not this
# implementation's.
#
# NO cross-run artifact resume (same falsifier-established pattern as
# koubou158-sweep-sharded-v1.yml's p5_shard job): if this single job is
# killed by the 330-minute cap mid-production, the checkpoint/cache at
# whatever j was last completed are still uploaded (if: always()), but a
# fresh dispatch starts a NEW job with an empty workspace and would redo
# the regression gate + all j levels from scratch (cheap relative to the
# whole run given the compounding cache, but not free) unless someone
# manually seeds scratchpad/m2_v5/ from a downloaded artifact first.

name: koubou158-m2-msweep-v5-gha

on:
  workflow_dispatch:
    inputs:
      max_j:
        description: "Stop after this j level (production ceiling). J_MAX in the script is 12."
        required: true
        type: number
        default: 12

permissions:
  contents: read

concurrency:
  group: koubou158-m2-msweep-v5-gha-${{ github.ref }}
  cancel-in-progress: false

jobs:
  msweep_v5:
    name: v5 regression gate (j<=6) then production (j<=max_j)
    runs-on: ubuntu-latest
    # 330, matching this repo's other long single-job koubou158 lanes
    # (e.g. p4_remainder in koubou158-sweep-sharded-v1.yml) -- j=7's
    # dimension (~8500) is roughly double j=6's (4056), and v4's
    # unaccelerated j=6 alone took 2381s; even with the v5 kernel speedup
    # measured locally (see the job summary this workflow prints), a
    # generous cap is kept rather than risk truncating j=7-12 mid-run.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install numpy (fastkernel module's F3NumpyEchelon/F3NumpySpace; not on the default hot path but imported unconditionally)
        shell: bash
        run: pip install "numpy>=1.26,<3"

      - name: Regression gate (from-scratch, j<=6, must match v4's actual log exactly)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile search/koubou158_L3_core_fastkernel_v1.py search/koubou158_M2_msweep_v5.py
          python3 search/koubou158_M2_msweep_v5.py --fresh --max-j 6

      - name: Production (resume from warm checkpoint, j=7..max_j)
        shell: bash
        run: |
          set -euo pipefail
          python3 search/koubou158_M2_msweep_v5.py --max-j "${{ inputs.max_j || 12 }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koubou158-m2-msweep-v5
          path: |
            search/certs/koubou158_M2_msweep_v5_*.json
            scratchpad/m2_v5/checkpoint.json
            scratchpad/m2_v5/kernel_caches.pkl
          if-no-files-found: error
          retention-days: 30
